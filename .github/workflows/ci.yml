name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      # nextest runs no doctests, and the doctests are compile_fail boundaries.
      - run: cargo test --workspace --doc
      # The repository's own specification stays canonical and free of errors and warnings.
      - run: cargo run -q -p loft-cli -- fmt --check
      - run: cargo run -q -p loft-cli -- check --fail-on warning
