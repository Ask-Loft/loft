name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dogfood launcher contract tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3 zsh lsof
      # Installs the toolchain rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      # The repository's own specification stays canonical and free of errors and warnings.
      # These runs of `loft` send nothing: `.cargo/config.toml` starts every process Cargo runs
      # with telemetry off. A runner is new on every run, so its events would count runs as
      # installations.
      - run: cargo run -q -p loft-cli -- fmt --check
      - run: cargo run -q -p loft-cli -- check --fail-on warning
      # Every link in loft.trace.yaml holds: reviewed against its node as it reads now, and its
      # tests found. A node no link names yet is reported, not failed.
      - run: cargo run -q -p loft-cli -- reconcile --fail-on warning
      # The lock pins the published specification. Only main carries published states;
      # develop and feature branches hold candidates that the next publish makes normative.
      - if: github.ref == 'refs/heads/main'
        run: cargo run -q -p loft-cli -- verify
      # A second publish of a published tree changes nothing.
      - if: github.ref == 'refs/heads/main'
        run: |
          cargo run -q -p loft-cli -- publish
          test -z "$(git status --porcelain)"
      # The crates package and verify as crates.io would take them; a version crates.io already
      # holds is only a warning here.
      - if: github.ref == 'refs/heads/main'
        run: cargo publish --workspace --dry-run
  # The Loft mod is tested by Claude Code's own test kit, under a Claude Code pinned no older than
  # the mod needs; the pin is raised on purpose, in a change of its own. The kit loads the mod and
  # fires events through its hooks with no session, no sign-in and no network, and the tests stub
  # every process the mod would run, so no `loft` is built here.
  plugin:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global @anthropic-ai/claude-code@2.1.309
      # An empty home: the tests read no settings, sign-in or plugin of the runner's.
      - run: |
          export HOME="$(mktemp -d)"
          claude plugin validate plugins/claude/loft
          claude plugin test plugins/claude/loft
  # The Yard page's own logic, in a DOM emulator, and its types. The suite that drives the page in
  # a real browser runs on demand only.
  page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/loft-cli/yard-page-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/loft-cli/yard-page-tests/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run types
  # loftspec builds on stable Rust at its declared rust-version, the workspace's, and not only on
  # the newer toolchain rust-toolchain.toml pins: `+<version>` overrides that file. The library
  # alone is built, since its tests may use what a newer toolchain brings.
  rust-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.97 --profile minimal
      - run: cargo +1.97 build -p loftspec --locked
