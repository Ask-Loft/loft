name: Build

# Builds `loft` for each supported platform and uploads each binary as `binary-<platform>`. The
# release calls it after its checks; run it by hand on `develop` before tagging a release, so a
# platform that no longer builds is found before the tag exists.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { platform: darwin-arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { platform: darwin-x64, target: x86_64-apple-darwin, runner: macos-latest }
          # Linked statically by the linker Rust ships, so it runs whatever C library a system has;
          # each built on its own architecture, where musl's compiler and headers are installed.
          - { platform: linux-arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { platform: linux-x64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { platform: win32-arm64, target: aarch64-pc-windows-msvc, runner: windows-latest }
          - { platform: win32-x64, target: x86_64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      # The C code for Linux, the TLS library's and the test locator's grammars, is compiled by
      # musl's compiler against musl's headers, on a runner of the target's architecture.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p loft-cli --target ${{ matrix.target }}
      - shell: bash
        run: |
          executable=loft
          [ "$RUNNER_OS" = Windows ] && executable=loft.exe
          mkdir -p "binaries/${{ matrix.platform }}"
          cp "target/${{ matrix.target }}/release/$executable" "binaries/${{ matrix.platform }}/"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: binaries
