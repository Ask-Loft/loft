name: Release

# A tag `vX.Y.Z` pushed on main releases that version: the checks run, `loft` is built for each
# platform and the npm packages are assembled; then, once the maintainer approves the `release`
# environment, the crates go to crates.io, the npm packages to npm, and the tag gets a GitHub
# release with the binaries. Both registries trust this workflow directly (Trusted Publishing),
# so no registry token is stored in the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Installs the toolchain rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      # The tag names the crates' version, its commit is on main, and the changelog dates it.
      - run: scripts/release-check.sh "$GITHUB_REF_NAME"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      - run: cargo run -q -p loft-cli -- fmt --check
      - run: cargo run -q -p loft-cli -- check --fail-on warning
      - run: cargo run -q -p loft-cli -- verify
      - run: scripts/publish-crates.sh --dry-run

  build:
    needs: check
    strategy:
      matrix:
        include:
          - { platform: darwin-arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { platform: darwin-x64, target: x86_64-apple-darwin, runner: macos-latest }
          # Linked statically by the linker Rust ships, so it runs whatever C library a system has.
          - { platform: linux-arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-latest }
          - { platform: linux-x64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { platform: win32-arm64, target: aarch64-pc-windows-msvc, runner: windows-latest }
          - { platform: win32-x64, target: x86_64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p loft-cli --target ${{ matrix.target }}
      - shell: bash
        run: |
          executable=loft
          [ "$RUNNER_OS" = Windows ] && executable=loft.exe
          mkdir -p "binaries/${{ matrix.platform }}"
          cp "target/${{ matrix.target }}/release/$executable" "binaries/${{ matrix.platform }}/"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: binaries

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      # The npm packages, assembled and packed as npm would publish them.
      - run: scripts/npm-packages.sh binaries release/npm
      - run: scripts/publish-npm.sh release/npm --dry-run
      # An archive of each binary for the GitHub release.
      - run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p release/archives
          for dir in binaries/*/; do
            platform=$(basename "$dir")
            if [ -f "$dir/loft.exe" ]; then
              (cd "$dir" && zip -q "$OLDPWD/release/archives/loft-$version-$platform.zip" loft.exe)
            else
              chmod +x "$dir/loft"
              tar -czf "release/archives/loft-$version-$platform.tar.gz" -C "$dir" loft
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release

  publish:
    needs: package
    runs-on: ubuntu-latest
    # Waits for the maintainer's approval; only `v*` tags may deploy to it.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      # Exchanges this run's identity for a short-lived crates.io token.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Publishes the crates crates.io does not hold yet, so a failed run can run again.
      - run: scripts/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # npm's Trusted Publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global npm@11.6.2
      # npm exchanges this run's identity for a short-lived token itself. Publishes the platform
      # packages, then `@ask-loft/loft`, skipping any version npm already holds.
      - run: scripts/publish-npm.sh release/npm
      # The release notes are the version's entry in the changelog; the binaries are attached.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v head="## $version " 'index($0, head) == 1 {on = 1; next} /^## / {on = 0} on' \
            CHANGELOG.md | sed '/./,$!d' > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Loft $version" \
              --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" release/archives/* --clobber
