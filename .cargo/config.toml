# Every process Cargo runs in this repository, the tests and the `loft` they start above all,
# begins with telemetry and the update check off and both services at a closed loopback port,
# so that no test reaches a real service or the user's own settings. A test that exercises
# either switches it on and points it at a Software Plant simulator. A variable already set in
# the environment, such as a maintainer's `LOFT_TELEMETRY=internal`, is left as it is.
[env]
LOFT_TELEMETRY = "off"
LOFT_UPDATE_CHECK = "off"
LOFT_TELEMETRY_ENDPOINT = "http://127.0.0.1:9"
LOFT_UPDATE_ENDPOINT = "http://127.0.0.1:9"
# A dogfood `LOFT_YARD_HOME` is never inherited: every test keeps the machine's files in its own
# home. An empty value is ignored, so `~/.yard/` of the home each test gives applies.
LOFT_YARD_HOME = { value = "", force = true }
