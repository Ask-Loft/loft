            - "page"
            - "screen"
            - "panel"
            - "pane"
            - "tab"
            - "surface"
        - name: "identifier"
          words:
            - "id"
            - "identifier"
            - "key"
            - "label"
            - "ref"
            - "reference"
            - "handle"
            - "slug"
        - name: "failure"
          words:
            - "error"
            - "failure"
            - "refusal"
            - "rejection"
            - "fault"
        - name: "request"
          words:
            - "request"
            - "call"
            - "invocation"
            - "operation"
            - "command"
            - "action"
        - name: "document"
