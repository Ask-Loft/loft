            - "subsystem"
            - "module"
            - "layer"
            - "system"
            - "backend"
            - "adapter"
            - "worker"
            - "daemon"
  - rule: TD-002
    enabled: true
    severity: hint
  - rule: TD-003
    enabled: true
    severity: hint
    pairs:
      replace:
        - name: "admin"
          words:
            - "administrator"
            - "administration"
        - name: "app"
          words:
