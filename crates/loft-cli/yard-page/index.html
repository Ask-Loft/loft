<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Yard</title>
<link rel="stylesheet" href="yard.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="layout">
  <aside id="side" class="side" aria-label="Yard Logs">
    <div id="side-content" class="side-content"></div>
    <p class="connection" aria-live="polite"><span class="connection-dot"></span><span class="connection-words">Live</span></p>
  </aside>
  <div class="page">
    <header id="head" class="page-head"><div id="chrome" class="chrome"></div></header>
    <main id="log" class="main"><p class="loading">Loading the Yard Logs…</p></main>
  </div>
</div>
<noscript><p class="noscript">The Yard page needs JavaScript to draw Yard Log.</p></noscript>
</body>
</html>
