[package]
name = "software-plant"
version = "2.3.0-alpha.5"
description = "Simulators of the external systems Loft depends on, for tests only"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Test equipment: never published, and never a dependency of a published crate.
publish = false
# The integration tests are one binary, `tests/main.rs`: a binary per file is linked and
# checked by the operating system once each.
autotests = false

[dependencies]
# The remote simulator publishes and verifies states with the Format's own publisher, as a
# remote does.
loftspec.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
tungstenite.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
