[package]
name = "loftspec"
version = "2.3.0-alpha.3"
description = "The Loft Specification Format: document model, identity, canonical bytes, hashing and conversion"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories = ["development-tools", "parser-implementations"]
# The tests read fixtures from the repository and use the Software Plant, neither of which is
# published, so they run from the repository only.
exclude = ["tests"]
# The integration tests are one binary, `tests/main.rs`: a binary per file is linked and
# checked by the operating system once each.
autotests = false

[lints]
workspace = true

[dependencies]
loft-common.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-properties.workspace = true
unicode-segmentation.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest = "1"
saphyr-parser = "0.1.0"

[[test]]
name = "integration"
path = "tests/main.rs"
