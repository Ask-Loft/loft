[package]
name = "loftspec-store"
version = "2.2.1"
description = "Memory and file stores for Loft Specification Format documents"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories = ["development-tools", "filesystem"]
# The tests read fixtures from the repository and use the Software Plant, neither of which is
# published, so they run from the repository only.
exclude = ["tests"]
# The integration tests are one binary, `tests/main.rs`: a binary per file is linked and
# checked by the operating system once each.
autotests = false

[dependencies]
loft-ports.workspace = true
loftspec.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
software-plant = { path = "../software-plant" }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
