# The workspace gate runs `cargo nextest run --workspace`.

[profile.default]
# A gate reports every failure, not the first: one red suite must not hide another.
fail-fast = false
# A hung test fails after ten minutes instead of holding the gate open.
slow-timeout = { period = "60s", terminate-after = 10 }

# The contract suites, the modules named `*_contract*`, run real git and real `loft` processes
# and are the longest tests; started first, they no longer finish alone after every other test.
[[profile.default.overrides]]
filter = 'test(/^[a-z_]*_contract[a-z_]*::/)'
priority = 10
