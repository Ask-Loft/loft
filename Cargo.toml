[workspace]
resolver = "3"
members = [
    "crates/loftspec",
    "crates/loftspec-store",
    "crates/loft-cli",
    "crates/software-plant",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/Ask-Loft/loft"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
# Pinned: the language rules read a body's text as this Markdown parser yields it, so a version
# change can change a finding.
pulldown-cmark = { version = "=0.13.4", default-features = false }
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
thiserror = "2"
# Pinned: the tokenizer the Format publishes splits on these Unicode tables, so a version change
# can change a finding or a parsed statement.
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
unicode-segmentation = "=1.13.3"
uuid = { version = "1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
