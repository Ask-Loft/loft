[workspace]
resolver = "3"
members = [
    "crates/loft-ports",
    "crates/loftspec",
    "crates/loftspec-store",
    "crates/yardlog",
    "crates/loft-cli",
    "crates/software-plant",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/Ask-Loft/loft"
homepage = "https://askloft.ai"
keywords = ["specification", "requirements", "ears", "traceability", "git"]

[workspace.dependencies]
# The published crates depend on one another at the release they ship in.
loft-ports = { path = "crates/loft-ports", version = "2.2.1" }
loftspec = { path = "crates/loftspec", version = "2.2.1" }
loftspec-store = { path = "crates/loftspec-store", version = "2.2.1" }
yardlog = { path = "crates/yardlog", version = "2.2.1" }
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
# Pinned: the language rules read a body's text as this Markdown parser yields it, so a version
# change can change a finding.
pulldown-cmark = { version = "=0.13.4", default-features = false }
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
thiserror = "2"
# Pinned: a test's digest is its tokens as these grammars split them, so a version change can move
# the digest of every test it parses and report each as changed.
tree-sitter = "=0.27.1"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
# Pinned: the tokenizer the Format publishes splits on these Unicode tables, so a version change
# can change a finding or a parsed statement.
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
unicode-segmentation = "=1.13.3"
# HTTPS through rustls with ring and the bundled root certificates, for the command event and the
# update check; no compression, no native TLS.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
