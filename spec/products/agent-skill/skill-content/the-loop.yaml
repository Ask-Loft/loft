key: 01a13654-6e12-74a1-ad7f-e835a1b49fd3
slug: the-loop
name: "The loop"
body: "The cycle in which an agent edits `spec/`: write, format, check, fix and commit."
realizes:
  - 01a13653-3ec0-76e7-bf76-fc7478b3d9fd
requirements:
  - key: 01a13654-6e12-74a1-ad7f-e836b24cfc56
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach the loop in which an agent edits `spec/`."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e8377169082b
        name: "The loop tells the agent to write a new node without a key."
      - key: 01a13654-6e12-74a1-ad7f-e838cd096142
        name: "The loop tells the agent to run `loft fmt` after writing."
      - key: 01a13654-6e12-74a1-ad7f-e8397fef117e
        name: "The loop tells the agent to read the findings of `loft check --format json`."
      - key: 01a13654-6e12-74a1-ad7f-e83ae769dfdc
        name: "The loop tells the agent to fix each error before committing."
      - key: 01a13754-833e-725b-b941-6349f8c53b0a
        name: "The loop tells the agent to read the lint-findings guide only for a finding whose message leaves its fix unclear."
      - key: 01a13654-6e12-74a1-ad7f-e83bb1da4f3e
        name: "The loop tells the agent to commit `spec/` once `loft check --fail-on warning` passes."
  - key: 01a13654-6e12-74a1-ad7f-e83c22b5e2a4
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach how a reference names its target."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e83debec8622
        name: "The loop tells the agent to write a reference by its target's name, which `loft fmt` replaces with the target's key."
      - key: 01a13654-6e12-74a1-ad7f-e83e867452a4
        name: "The loop tells the agent to read an existing node's key with `loft find`."
  - key: 01a13654-6e12-74a1-ad7f-e83ffc67ef87
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach the YAML subset that the reader accepts."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e8408a33fe46
        name: "The loop names comments, anchors, flow collections and single-quoted scalars as refused."
      - key: 01a13654-6e12-74a1-ad7f-e841fc362a2a
        name: "The loop tells the agent to double-quote free text."
  - key: 01a13654-6e12-74a1-ad7f-e84215708eb2
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach the files and fields that `loft` writes and the author does not."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e843b0ec22b0
        name: "The loop tells the agent never to write or change a key."
      - key: 01a13654-6e12-74a1-ad7f-e844a7e67133
        name: "The loop tells the agent never to write a label into a node."
      - key: 01a13654-6e12-74a1-ad7f-e8459fe9eb87
        name: "The loop tells the agent never to edit `spec/labels.yaml`."
      - key: 01a13654-6e12-74a1-ad7f-e8467408c5de
        name: "The loop tells the agent never to edit `loft.lock.json`."
  - key: 01a13754-833e-725b-b941-634c3d7b868a
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach that `loft fmt` reshapes the files it writes."
    criteria:
      - key: 01a13754-833e-725b-b941-634defdb43ee
        name: "The loop tells the agent that `loft fmt` gives each list item a `key` line, drops quotes that are not needed and puts fields in order."
      - key: 01a13754-833e-725b-b941-634e9a3535f6
        name: "The loop tells the agent to read a file again after `loft fmt` before editing it."
  - key: 01a137bc-e40d-749f-8570-9ef6f7c26572
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach what a binding that `loft fmt` drops means."
    criteria:
      - key: 01a137bc-e40d-749f-8570-9ef7849c1f23
        name: "The loop tells the agent that `loft fmt` reports each binding it drops on standard error."
      - key: 01a137bc-e40d-749f-8570-9ef85dd4b6ae
        name: "The loop tells the agent that a dropped binding of a node it did not delete means a key was lost from a file."
      - key: 01a137bc-e40d-749f-8570-9ef91001c2a9
        name: "The loop tells the agent to restore a lost key and `spec/labels.yaml` from git and run `loft fmt` again."
