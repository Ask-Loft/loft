key: 01a13654-6e12-74a1-ad7f-e7f6231d2539
slug: publishing-and-merging
name: "Publishing and merging"
body: "Publishing on the publish branch, checking the lock in CI, merging `spec/` in git, and connecting a document to a Loft server that it publishes through and pulls from."
tags:
  - git
realizes:
  - 01a13653-3ec0-76e7-bf76-fc7478b3d9fd
requirements:
  - key: 01a13654-6e12-74a1-ad7f-e7f7ccb7e0c2
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach that a publish runs on the publish branch at the user's request."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e7f847e10bbf
        name: "The workflow tells the agent to run `loft publish` only when the user asks."
      - key: 01a13654-6e12-74a1-ad7f-e7f977a9c7c3
        name: "The workflow tells the agent that `loft publish` runs on the publish branch over a committed `spec/`."
      - key: 01a13654-6e12-74a1-ad7f-e7fa09ba9b73
        name: "The workflow tells the agent to commit `spec/labels.yaml` and `loft.lock.json` together after a publish."
  - key: 01a13654-6e12-74a1-ad7f-e7fbeab45d02
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach that `loft verify` checks the tree against the lock."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e7fcf0770fb4
        name: "The workflow tells the agent that `loft verify` recomputes the roots and compares them with the lock."
  - key: 01a13654-6e12-74a1-ad7f-e7fdb94346a7
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach the merge driver."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e7fe5089e62a
        name: "The workflow tells the agent to run `loft merge-driver --install` once in each clone."
      - key: 01a13754-833e-725b-b941-633e9f643540
        name: "The workflow tells the agent to commit `.gitattributes` when the install writes it."
      - key: 01a13654-6e12-74a1-ad7f-e7ff89477a44
        name: "The workflow tells the agent to settle a conflict record by editing the node and removing the record."
  - key: 01a13654-6e12-74a1-ad7f-e8008b9e88ed
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach how two publishes that meet are settled."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e8010fe868f0
        name: "The workflow tells the agent to run `loft publish` in the stopped merge or rebase of the publish branch."
      - key: 01a13654-6e12-74a1-ad7f-e80246ce001b
        name: "The workflow tells the agent to run the command that the settling publish prints."
  - key: 01a154c3-02c1-74da-a483-d48a9564ec1c
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach the base a branch starts from and merges into."
    criteria:
      - key: 01a154c3-02c1-74da-a483-d48b4b885bfc
        name: "The workflow tells the agent to name the base of a branch explicitly."
      - key: 01a154c3-02c1-74da-a483-d48ca373f015
        name: "The workflow tells the agent to start a branch from the latest published state of the publish branch."
      - key: 01a154c3-02c1-74da-a483-d48d9b959e08
        name: "The workflow tells the agent to rebase or merge with the merge driver installed and to settle each conflict once."
      - key: 01a154c3-02c1-74da-a483-d48efa6494da
        name: "The workflow tells the agent never to retry a failed git step that discards work without asking the user."
  - key: 01a1a922-762b-74c0-854c-edd1ce4ec8ae
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach how a document is connected to a Loft server, published through it and brought up to its head."
    criteria:
      - key: 01a1a922-762b-74c0-854c-edd28012b7e8
        name: "The workflow tells the agent to run `loft remote set <address>` only when the user asks, with the address the user gives, and never to invent one."
      - key: 01a1a922-762b-74c0-854c-edd340d23301
        name: "The workflow tells the agent to commit `spec/loftspec.yaml` after `loft remote set` or `loft remote remove`."
      - key: 01a1a922-762b-74c0-854c-edd4d5a126cb
        name: "The workflow tells the agent that a connected document's `loft publish` publishes through its remote, over a committed `spec/` on any branch, and takes its labels from the remote."
      - key: 01a1a922-762b-74c0-854c-edd57d45f439
        name: "The workflow tells the agent to run `loft pull` when a connected publish is refused because the remote has moved on, and to settle each conflict record the pull writes before publishing again."
      - key: 01a1a922-762b-74c0-854c-edd6104ec8da
        name: "The workflow tells the agent to ask the user to run `loft remote login` when a sign-in to the remote has lapsed, since the sign-in opens the user's browser."
