key: 01a13654-6e12-74a1-ad7f-e85eaf10c334
slug: the-writing-rules
name: "The writing rules"
body: "The craft that a validator cannot check alone: how a product is broken down, how a Requirement and its criteria are worded, and where text that is not normative belongs."
realizes:
  - 01a13653-3ec0-76e7-bf76-fc7478b3d9fd
requirements:
  - key: 01a13654-6e12-74a1-ad7f-e85fd3643f1b
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach the breakdown of a product into Feature Groups, Features, Requirements and criteria."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e860aa0fe27e
        name: "The rules name the chain from a Product to a criterion."
      - key: 01a13654-6e12-74a1-ad7f-e86152ae5ca1
        name: "The rules tell the agent that a Feature realizes the Components that implement it."
  - key: 01a13654-6e12-74a1-ad7f-e8626f368993
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach the five statement forms and when each applies."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e8634c960648
        name: "Each form is matched to the kind of condition it states."
      - key: 01a13654-6e12-74a1-ad7f-e8644e9cbab5
        name: "The rules tell the agent that a common-noun system takes \"the\" and a proper name stands bare."
      - key: 01a13654-6e12-74a1-ad7f-e8652bf343c9
        name: "The rules tell the agent that one statement states one obligation."
  - key: 01a13654-6e12-74a1-ad7f-e8666f3df2f6
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach that a Requirement's criteria are atomic and together complete."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e867c643a800
        name: "The rules tell the agent that each criterion states one verifiable outcome."
      - key: 01a13654-6e12-74a1-ad7f-e8680b9cc91f
        name: "The rules tell the agent to list a Requirement's conditions and map each to a criterion."
      - key: 01a13654-6e12-74a1-ad7f-e869cb7134a0
        name: "The rules name failures, refusals, empty states and ordering as conditions to cover."
      - key: 01a13654-6e12-74a1-ad7f-e86a2426d348
        name: "The rules tell the agent that a criterion which only repeats its Requirement covers nothing."
      - key: 01a154c3-02c1-74da-a483-d4badaf0dc62
        name: "The rules tell the agent to check the criteria a change keeps for uncovered conditions, as well as the ones it adds."
  - key: 01a13654-6e12-74a1-ad7f-e86b92745177
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach one Requirement for each rule of a catalogue."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e86c305d4cd8
        name: "The rules tell the agent to give each rule, check or command of a catalogue its own Requirement."
  - key: 01a13654-6e12-74a1-ad7f-e86de70da85f
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach that an oversized Requirement is promoted to a Feature."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e86e2f916ee7
        name: "The rules tell the agent to promote a Requirement that holds more than one concern to a Feature."
      - key: 01a13654-6e12-74a1-ad7f-e86fac4d1522
        name: "The rules tell the agent not to split such a Requirement into siblings that repeat one condition."
      - key: 01a154c3-02c1-74da-a483-d4bbe827dc5f
        name: "The rules tell the agent to agree the new outline with the user before writing its criteria."
  - key: 01a13654-6e12-74a1-ad7f-e870a74c4ec6
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach that a body holds no normative text."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e871b21fb752
        name: "The rules tell the agent that a body holds rationale and examples."
      - key: 01a13654-6e12-74a1-ad7f-e87229f89c0d
        name: "The rules tell the agent to state an obligation in a statement, a criterion, a Constraint or a decision."
      - key: 01a13654-6e12-74a1-ad7f-e873e2b02140
        name: "The rules tell the agent to put prose that needs headings in a Section."
      - key: 01a154c3-02c1-74da-a483-d4bc19f2c1fe
        name: "The rules tell the agent to fix a criterion that no statement covers by widening the statement or moving the criterion, never by completing the body."
  - key: 01a13654-6e12-74a1-ad7f-e874276c0e47
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach that a Quality Attribute's target is complete."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e875e4f2a1b7
        name: "The rules tell the agent that a target names a metric, a band, a unit, an aggregation, a scenario and an environment."
      - key: 01a154c3-02c1-74da-a483-d4bde17444f1
        name: "The rules tell the agent that an adjective with no metric and no bounds is not a target."
  - key: 01a13654-6e12-74a1-ad7f-e8767b4cf84b
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach what a decision holds in each state."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e8776b272f33
        name: "The rules tell the agent to create a decision in the state that is true, proposed or accepted."
      - key: 01a13654-6e12-74a1-ad7f-e87804e57def
        name: "The rules name what an accepted decision holds: two options or more, a driver, an assessment for each option and driver, a selected option, an outcome, a consequence and an outcome subject."
      - key: 01a13754-833e-725b-b941-6353610104c5
        name: "The rules tell the agent to write an accepted decision in one pass, naming its options, drivers and subjects by name."
      - key: 01a13754-833e-725b-b941-635487824231
        name: "The rules tell the agent to edit in place a decision that has no label yet."
      - key: 01a13754-833e-725b-b941-6355848f9798
        name: "The rules tell the agent to supersede a decision that has a label only after asking the user."
      - key: 01a154c3-02c1-74da-a483-d4bef53a0272
        name: "The rules tell the agent to link a decision's subjects by name and never to copy their prose into the decision."
  - key: 01a13654-6e12-74a1-ad7f-e879924837c8
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach that a rule more than one Feature shares is stated once and marked by a tag."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e87a0c1ed2d3
        name: "The rules tell the agent to state a shared rule once and list its tag on each Feature it binds."
      - key: 01a13754-833e-725b-b941-6356f7d9e260
        name: "The rules tell the agent to name a tag as the text writes its term."
  - key: 01a14b40-25a7-707a-a0e7-fd3e6f952d22
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach that the document names each concept by one term."
    criteria:
      - key: 01a14b40-25a7-707a-a0e7-fd3fc05e2e8b
        name: "The rules tell the agent to read `spec/terms.yaml` before writing prose."
      - key: 01a14b40-25a7-707a-a0e7-fd4011c3553c
        name: "The rules tell the agent to write a term's name and never one of its aliases."
      - key: 01a14b40-25a7-707a-a0e7-fd41068538c2
        name: "The rules tell the agent to run `loft terms` once a change to the prose is written."
      - key: 01a14b40-25a7-707a-a0e7-fd42edccef76
        name: "The rules tell the agent to put each group that `loft terms` reports to the user."
      - key: 01a14b40-25a7-707a-a0e7-fd439e970167
        name: "The rules tell the agent to record the user's choice as aliases of one term, or as separate terms each with its definition."
      - key: 01a14b40-25a7-707a-a0e7-fd441cfa81db
        name: "The rules tell the agent to add no term or alias that the user has not agreed."
  - key: 01a13654-6e12-74a1-ad7f-e87b983077ea
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach that a label cited in prose needs a `mentions` edge."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e87c34b09979
        name: "The rules tell the agent to add a `mentions` edge for each label its prose cites."
  - key: 01a13754-833e-725b-b941-635739bdb865
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach where a Constraint stands."
    criteria:
      - key: 01a13754-833e-725b-b941-635806d9389b
        name: "The rules tell the agent that a Constraint binds the Component, Feature Group or Product it stands under."
      - key: 01a13754-833e-725b-b941-6359d4f2fdf6
        name: "The rules tell the agent to state a rule for the whole product once, on the Product."
      - key: 01a13816-ded1-7512-a998-e07ff2515ce7
        name: "The rules tell the agent never to state what the product leaves out of scope as a Constraint."
      - key: 01a13816-ded1-7512-a998-e0808ecb7a48
        name: "The rules tell the agent never to write a criterion whose only content is that an excluded capability is absent."
      - key: 01a13816-ded1-7512-a998-e0818eaaf9bb
        name: "The rules tell the agent to record what is out of scope in a decision or in the body of the node it bounds."
  - key: 01a154c3-02c1-74da-a483-d4bf9baab7f9
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach that owning a Component and using it are separate relations."
    criteria:
      - key: 01a154c3-02c1-74da-a483-d4c0769ced2c
        name: "The rules tell the agent that `scopedTo` names whose a Component is."
      - key: 01a154c3-02c1-74da-a483-d4c1a4566b3a
        name: "The rules tell the agent that `realizes` names each Feature that uses a Component."
      - key: 01a154c3-02c1-74da-a483-d4c2bd3d437e
        name: "The rules tell the agent to reuse a Component across Products rather than copy it."
  - key: 01a154c3-02c1-74da-a483-d4c3effaec16
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach that a specification states guarantees and not provisioning."
    criteria:
      - key: 01a154c3-02c1-74da-a483-d4c4a11131f9
        name: "The rules tell the agent to state the behaviour and the targets the product guarantees."
      - key: 01a154c3-02c1-74da-a483-d4c50dfca1bd
        name: "The rules tell the agent never to state a sizing or capacity choice as a node."
  - key: 01a154c3-02c1-74da-a483-d4c6672fa2a8
    statement:
      form: ubiquitous
      system: "The skill"
      shall: "teach that a change follows the conventions of its document."
    criteria:
      - key: 01a154c3-02c1-74da-a483-d4c7ea980d18
        name: "The rules tell the agent to follow the conventions the document already keeps."
      - key: 01a154c3-02c1-74da-a483-d4c81f3a6527
        name: "The rules tell the agent not to reword a published Requirement the user did not ask about."
      - key: 01a154c3-02c1-74da-a483-d4c97ab27ab8
        name: "The rules tell the agent to report once a departure from the rules that runs through the whole document."
