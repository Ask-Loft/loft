key: 01a13654-6e12-74a1-ad7f-e84735aaa63f
slug: the-router
name: "The router"
body: "`SKILL.md`: the skill's frontmatter and a short router that sends the agent to the references a workflow needs, with the guardrails that hold in every workflow."
realizes:
  - 01a13653-3ec0-76e7-bf76-fc7478b3d9fd
requirements:
  - key: 01a13654-6e12-74a1-ad7f-e8484841982f
    statement:
      form: ubiquitous
      system: "The skill's `SKILL.md`"
      shall: "open with a frontmatter of `name` and `description` alone."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e849e37aabe3
        name: "The frontmatter holds `name` and `description` and no other field."
      - key: 01a13654-6e12-74a1-ad7f-e84a804c1640
        name: "`name` is `loft-spec`, the name of the skill's directory."
      - key: 01a13654-6e12-74a1-ad7f-e84bc8fc512a
        name: "`description` holds at most 1024 characters."
      - key: 01a13654-6e12-74a1-ad7f-e84c0361d656
        name: "`description` names writing, changing and reviewing a specification with `loft`."
  - key: 01a13654-6e12-74a1-ad7f-e84d585ac20e
    statement:
      form: ubiquitous
      system: "The router"
      shall: "tell the agent to check that `loft` is available before the first command."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e84e8e9b7685
        name: "The router tells the agent to run `loft --version` and to expect version 2."
      - key: 01a13654-6e12-74a1-ad7f-e84fbde2cc56
        name: "The router tells the agent to stop and say how to install `loft` when it is missing."
      - key: 01a13654-6e12-74a1-ad7f-e850bd329c00
        name: "The router tells the agent never to install `loft` unasked."
      - key: 01a13754-833e-725b-b941-634f8a751b92
        name: "The router tells the agent to try the project's package runner, such as `npx --no-install loft`, where `loft` is not on the search path."
      - key: 01a13767-36e8-72a0-a2ce-a57040deda7e
        name: "The router tells the agent to try `~/.cargo/bin/loft`, where `cargo install` puts it, before the package runners when `loft` is not on the search path."
      - key: 01a13754-833e-725b-b941-635064a96c9a
        name: "The router names installing `loft` from npm and from crates.io."
  - key: 01a13654-6e12-74a1-ad7f-e851f120905f
    statement:
      form: ubiquitous
      system: "The router"
      shall: "route each workflow to the references it needs."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e852c126aa81
        name: "Each reference of the skill is named by one route bullet."
      - key: 01a13654-6e12-74a1-ad7f-e853a691386c
        name: "The first route bullet sends every workflow to the loop before the first edit of `spec/`."
      - key: 01a13654-6e12-74a1-ad7f-e854d335b334
        name: "A new document is routed to `references/new-document.md`."
      - key: 01a13654-6e12-74a1-ad7f-e855af371185
        name: "A change to a product that a specification already describes is routed to `references/changing-a-specified-product.md`."
      - key: 01a1383e-2e64-72e5-b7f4-bc3e9d01cad6
        name: "Reconciling the code with the specification is routed to `references/reconciling.md`."
      - key: 01a14175-e444-717b-a0fb-4c45b83475fd
        name: "Adopting a `spec/` that `loft import openspec` wrote is routed to `references/adopting-an-openspec-project.md`."
      - key: 01a13654-6e12-74a1-ad7f-e85674355b04
        name: "The router tells the agent to read each reference it selects completely before acting."
      - key: 01a13654-6e12-74a1-ad7f-e8574740ac62
        name: "The router tells the agent to select the fewest references the intent needs."
      - key: 01a13754-833e-725b-b941-635109d6a69e
        name: "A `spec/` that holds only what `loft init` wrote is routed as a new document."
      - key: 01a13754-833e-725b-b941-63521f349f0d
        name: "The router tells the agent not to read again a reference it read earlier in the conversation."
      - key: 01a154c3-02c1-74da-a483-d4ae65db940d
        name: "Choosing the next change to build from the published specification is routed to `references/choosing-the-next-change.md`."
  - key: 01a13654-6e12-74a1-ad7f-e8583ffd796c
    statement:
      form: ubiquitous
      system: "The router"
      shall: "state the guardrails that hold in every workflow."
    criteria:
      - key: 01a13654-6e12-74a1-ad7f-e859e0192142
        name: "The router tells the agent to edit `spec/` only on the user's intent."
      - key: 01a13654-6e12-74a1-ad7f-e85ab12ab6d3
        name: "The router tells the agent to run `loft publish` only when the user asks for it."
      - key: 01a13654-6e12-74a1-ad7f-e85bb74fc069
        name: "The router tells the agent that `loft` owns keys, labels, `spec/labels.yaml` and `loft.lock.json`."
      - key: 01a13654-6e12-74a1-ad7f-e85c6f24deaa
        name: "The router tells the agent to finish with `loft fmt --check` and `loft check --fail-on warning` passing."
      - key: 01a13654-6e12-74a1-ad7f-e85dc7da5922
        name: "The router tells the agent to report what it changed."
      - key: 01a154c3-02c1-74da-a483-d4af1b246341
        name: "The router tells the agent to leave other branches, and uncommitted work it did not make, as they are."
      - key: 01a154c3-02c1-74da-a483-d4b01aea0f9b
        name: "The router tells the agent that the last published state is the contract and that work on a branch is a candidate."
      - key: 01a154c3-02c1-74da-a483-d4b1b2043249
        name: "The router tells the agent never to rewrite the history of a published state, and to supersede or revert it instead."
      - key: 01a154c3-02c1-74da-a483-d4b26ac4b932
        name: "The router tells the agent to quote labels, keys and commits exactly."
  - key: 01a154c3-02c1-74da-a483-d4b36e6d537f
    statement:
      form: ubiquitous
      system: "The router"
      shall: "state which steps of a specification task need the user's approval."
    criteria:
      - key: 01a154c3-02c1-74da-a483-d4b48b965e33
        name: "The router tells the agent that editing `spec/`, running `loft fmt`, `loft check`, `loft review` and `loft reconcile`, and committing on the working branch are part of the specification task the user asked for."
      - key: 01a154c3-02c1-74da-a483-d4b5323f9267
        name: "The router tells the agent to ask every question that would change the content once, before the work starts."
      - key: 01a154c3-02c1-74da-a483-d4b6a19dd39d
        name: "The router tells the agent that a plan the user approved covers the commits it lists on the working branch."
      - key: 01a154c3-02c1-74da-a483-d4b77091d61c
        name: "The router tells the agent to ask before each push, each merge into a shared branch, each `loft publish`, each deletion of a branch, each rewrite of history and each supersession of an accepted decision."
      - key: 01a154c3-02c1-74da-a483-d4b834d5008f
        name: "The router tells the agent that one approval covers only the steps it names."
      - key: 01a154c3-02c1-74da-a483-d4b92beca55d
        name: "The router tells the agent to list proposed suppressions and edits to published Requirements the user did not ask about together in its final report."
