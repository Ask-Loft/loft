key: 01a1402e-d25e-7540-9283-1825c9936bb1
slug: openspec-render-findings
name: "OpenSpec render findings"
body: "What the OpenSpec renderer reports about a projection: each place where OpenSpec's validator would reject or warn about the rendered specs, and the content the projection leaves out. Every finding is info, and none prevents the render. The renderer adds no word to the specification to avoid a finding."
realizes:
  - dfa057a6-404f-44a0-a9ab-932900198ca4
requirements:
  - key: 01a1402e-d25e-7540-9283-1826cb8964cf
    statement:
      form: ubiquitous
      system: "The OpenSpec renderer"
      shall: "render a document whatever findings it reports."
    criteria:
      - key: 01a1402e-d25e-7540-9283-18273c5ca9a5
        name: "Each finding has the severity info."
      - key: 01a1402e-d25e-7540-9283-1828cc01dcff
        name: "Each finding about a node names the node's key and the file the node is written to."
  - key: 01a1402e-d25e-7540-9283-18291c9507f8
    statement:
      form: ubiquitous
      system: "The OpenSpec renderer"
      shall: "report a Requirement whose requirement text holds neither `SHALL` nor `MUST` as a word as a finding with the code `OR-001`."
    criteria:
      - key: 01a1402e-d25e-7540-9283-182afa7d9f44
        name: "The requirement text is the Requirement's lines after its heading and before its first level-4 heading, other than blank lines, lines in fenced code and lines that open with a bold label and a colon."
      - key: 01a1402e-d25e-7540-9283-182b8687765c
        name: "A requirement text that holds `SHALL` or `MUST` as a word raises no `OR-001`."
  - key: 01a1402e-d25e-7540-9283-182c02f45295
    statement:
      form: ubiquitous
      system: "The OpenSpec renderer"
      shall: "report a Requirement written with no level-4 heading that has text under it as a finding with the code `OR-002`."
    criteria:
      - key: 01a1402e-d25e-7540-9283-182dd1ef299e
        name: "A Requirement with a Criterion raises no `OR-002`."
      - key: 01a1402e-d25e-7540-9283-182e4b1c4dc9
        name: "A Requirement whose only level-4 headings are Sections without a body raises `OR-002`."
  - key: 01a1402e-d25e-7540-9283-182fe0419f45
    statement:
      form: ubiquitous
      system: "The OpenSpec renderer"
      shall: "report a Feature whose body is absent or shorter than 50 characters once trimmed as a finding with the code `OR-003`."
    criteria:
      - key: 01a1402e-d25e-7540-9283-1830f2f891cc
        name: "A Feature whose trimmed body has 50 characters or more raises no `OR-003`."
      - key: 01a1402e-d25e-7540-9283-1831476a2915
        name: "The finding names the length of the trimmed body."
  - key: 01a1402e-d25e-7540-9283-183229c10a5c
    statement:
      form: ubiquitous
      system: "The OpenSpec renderer"
      shall: "report a Requirement whose requirement text is longer than 500 characters as a finding with the code `OR-004`."
    criteria:
      - key: 01a1402e-d25e-7540-9283-1833e6810981
        name: "The length is that of the requirement text with its lines trimmed and joined by line breaks."
      - key: 01a1402e-d25e-7540-9283-183428fea0f1
        name: "A requirement text of 500 characters or fewer raises no `OR-004`."
  - key: 01a1402e-d25e-7540-9283-18358f42d44e
    statement:
      form: ubiquitous
      system: "The OpenSpec renderer"
      shall: "report each kind of content that the projection leaves out as a finding with the code `OR-005`."
    criteria:
      - key: 01a1402e-d25e-7540-9283-1836bb3313f1
        name: "The kinds left out are Components, Constraints, Quality Attributes, Decisions, edges and tags."
      - key: 01a1402e-d25e-7540-9283-18377a58d7f6
        name: "Each finding names its kind and the number of that kind the document holds."
      - key: 01a1402e-d25e-7540-9283-183811d31502
        name: "A document that holds none of a kind raises no `OR-005` for that kind."
  - key: 01a1402e-d25e-7540-9283-183936f74e06
    statement:
      form: ubiquitous
      system: "The OpenSpec renderer"
      shall: "report a Requirement whose heading gives the name of an earlier Requirement of its Feature as a finding with the code `OR-006`."
    criteria:
      - key: 01a1402e-d25e-7540-9283-183aeb33116c
        name: "Requirements of different Features may share a name without a finding."
