key: 01a1f981-4db1-765f-a897-2248537f6019
slug: references-into-another-document
name: "References into another document"
body: |
  How a node of a connected document names a node of another one: as a record of the other document's handle and the node's key, resolved against the copies under that handle. Only an Interface and what it holds can be named, since a copy holds nothing else, so a reference never reaches the other document's internals.

  A Component `provides` or `requires` a foreign Interface; any element may `mentions` a foreign Interface or a node beneath it; and a decision may name one as an `affected` subject. A foreign node is never a decision's `outcome`, never realized and never scoped to: those say what a document is made of, and each document says that only of itself. A reference renders as the handle and the label, joined by a colon.
