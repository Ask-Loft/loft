key: 01a145e8-28eb-78f4-aed0-150e241ef329
slug: locating-a-test
name: "Locating a test"
body: "How `loft` finds, in the file a link names, the syntax node of the test the link names, and the digest of that test's content that the trace file records. The reconciler asks through a port; `loft` answers it with tree-sitter for Rust, TypeScript, JavaScript, Python, Go and Java. A test that no grammar locates is still looked for as a whole word."
realizes:
  - 01a1383a-4a92-778a-b49d-e3efdabc7f04
  - 01a145e8-28eb-7b67-9fe2-edb5e0af3358
requirements:
  - key: 01a145e9-aa7f-769e-a7f5-f2162bae74d1
    statement:
      form: ubiquitous
      system: "The test locator"
      shall: "choose a test file's grammar by the file's extension."
    criteria:
      - key: 01a145e9-aa7f-769e-a7f5-f217221d01d3
        name: "A file ending in `.rs` is parsed as Rust."
      - key: 01a145e9-aa7f-769e-a7f5-f21898074b83
        name: "A file ending in `.ts`, `.mts` or `.cts` is parsed as TypeScript."
      - key: 01a145e9-aa7f-769e-a7f5-f2191aff4a39
        name: "A file ending in `.tsx` is parsed as TypeScript with JSX."
      - key: 01a145e9-aa7f-769e-a7f5-f21aa0d76d55
        name: "A file ending in `.js`, `.mjs`, `.cjs` or `.jsx` is parsed as JavaScript."
      - key: 01a145e9-aa7f-769e-a7f5-f21bead47cb7
        name: "A file ending in `.py` is parsed as Python."
      - key: 01a145e9-aa7f-769e-a7f5-f21cc9798933
        name: "A file ending in `.go` is parsed as Go."
      - key: 01a15f55-b936-7155-95fa-439b29107106
        name: "A file ending in `.java` is parsed as Java."
      - key: 01a145e9-aa7f-769e-a7f5-f21d918624ea
        name: "A file with any other extension is not parsed, and no test is located in it."
  - key: 01a145e9-aa7f-769e-a7f5-f21eb92a1b6c
    statement:
      form: ubiquitous
      system: "The test locator"
      shall: "locate a Rust test as the function that the test's name names."
    criteria:
      - key: 01a145e9-aa7f-769e-a7f5-f21f06bd5ce3
        name: "A function whose name is the test's name is the test, inside modules and implementations as well as at the top of the file."
      - key: 01a145e9-aa7f-769e-a7f5-f220cdf9f23a
        name: "The attributes written directly before the function are part of the test."
      - key: 01a145e9-aa7f-769e-a7f5-f22168a00758
        name: "Inside a macro invocation, the tokens from `fn` and the test's name through the next group in braces are the test, with the attributes written directly before them."
      - key: 01a14625-1535-7161-b749-3504b5fbd4e1
        name: "Inside a macro invocation, `pub`, `async`, `unsafe`, `const` and `extern` written between the attributes and `fn` are part of the test."
      - key: 01a14625-1535-7161-b749-35056801059f
        name: "Inside a macro invocation, a `fn` followed by `;` before any group in braces is not a test."
      - key: 01a146cb-3d40-749f-b9bb-1cc111bc2bc0
        name: "Inside a macro invocation, a comment among the attributes, the qualifiers and `fn` does not end the attributes of the test."
  - key: 01a145e9-aa7f-769e-a7f5-f2226bff6c72
    statement:
      form: ubiquitous
      system: "The test locator"
      shall: "locate a JavaScript or TypeScript test as the call that registers it."
    criteria:
      - key: 01a145e9-aa7f-769e-a7f5-f223aa545efa
        name: "A call to `it`, `test`, `describe`, `context`, `specify` or `bench` whose first argument is a string equal to the test's name is the test."
      - key: 01a145e9-aa7f-769e-a7f5-f2246d11cc56
        name: "A call through `.only`, `.skip`, `.todo`, `.concurrent`, `.sequential` or `.fails`, or through the call `.each(…)`, `.skipIf(…)` or `.runIf(…)`, registers a test as the plain call does."
      - key: 01a145e9-aa7f-769e-a7f5-f22516ec8c4a
        name: "A template literal without a substitution counts as a string."
      - key: 01a145e9-aa7f-769e-a7f5-f226b1acf5df
        name: "A placeholder such as `%s` in the test's name is compared as written."
      - key: 01a145e9-aa7f-769e-a7f5-f2275f43dd5d
        name: "Of calls nested in one another, the outermost that carries the test's name is the test."
      - key: 01a14625-1535-7161-b749-35067e0393b1
        name: "An escape in a JavaScript or TypeScript string, such as `\\n`, `\\u00e9`, `\\u{1F600}` or `\\x41`, is read as the character it stands for."
      - key: 01a14625-1535-7161-b749-35074160a574
        name: "A comment before a call's first argument is not its first argument."
      - key: 01a146cb-3d40-749f-b9bb-1cc2bacfaf24
        name: "Two `\\u` escapes in a JavaScript or TypeScript string that form a surrogate pair are read as the one character they stand for."
      - key: 01a146cb-3d40-749f-b9bb-1cc3989f464e
        name: "A backslash before a line break in a JavaScript or TypeScript string, whether LF, CR, CR LF, U+2028 or U+2029, continues the string and is not part of the test's name."
      - key: 01a146cb-3d40-749f-b9bb-1cc4f310c794
        name: "A function in parentheses, such as `(test)(…)`, registers a test as the function does."
  - key: 01a145e9-aa7f-769e-a7f5-f228d2bdf5a7
    statement:
      form: ubiquitous
      system: "The test locator"
      shall: "locate a Python test as the definition that the test's name names."
    criteria:
      - key: 01a145e9-aa7f-769e-a7f5-f229fdc044bb
        name: "A function whose name is the test's name is the test, inside classes as well as at the top of the file."
      - key: 01a145e9-aa7f-769e-a7f5-f22aa0cefd08
        name: "A class whose name is the test's name is the test."
      - key: 01a145e9-aa7f-769e-a7f5-f22b1387a194
        name: "The decorators of a definition are part of the test."
  - key: 01a145e9-aa7f-769e-a7f5-f22c6f4c0b2e
    statement:
      form: ubiquitous
      system: "The test locator"
      shall: "locate a Go test as the function, the method or the subtest that the test's name names."
    criteria:
      - key: 01a145e9-aa7f-769e-a7f5-f22d7150ebe0
        name: "A function or a method whose name is the test's name is the test."
      - key: 01a145e9-aa7f-769e-a7f5-f22e4792189e
        name: "A call to a method `Run` whose first argument is a string literal equal to the test's name is the test."
      - key: 01a14625-1535-7161-b749-35087ab1cfc6
        name: "An escape in a Go string, such as `\\n`, `\\u00e9` or `\\U0001F600`, is read as the character it stands for, and `\\x` and octal escapes such as `\\xc3\\xa9` or `\\303\\251` as bytes, read together as UTF-8."
      - key: 01a14625-1535-7161-b749-35098bb8d485
        name: "A comment before the first argument of `Run` is not its first argument."
      - key: 01a146cb-3d40-749f-b9bb-1cc57f8d9c61
        name: "A carriage return in a Go raw string is not part of the test's name."
      - key: 01a146cb-3d40-749f-b9bb-1cc644e4f41a
        name: "A method `Run` in parentheses, such as `(t.Run)(…)`, runs a subtest as the method does."
  - key: 01a15f55-b936-7155-95fa-439cb09f5e2f
    statement:
      form: ubiquitous
      system: "The test locator"
      shall: "locate a Java test as the method or the class that the test's name names."
    criteria:
      - key: 01a15f55-b936-7155-95fa-439d8362af31
        name: "A method whose name is the test's name is the test, inside classes, nested classes, interfaces, enums and records."
      - key: 01a15f55-b936-7155-95fa-439ec328a838
        name: "A class whose name is the test's name is the test, nested or not."
      - key: 01a15f55-b936-7155-95fa-439f297d5696
        name: "The annotations and modifiers written before a method or a class are part of the test."
  - key: 01a145e9-aa7f-769e-a7f5-f22f09f4fb8b
    statement:
      form: ubiquitous
      system: "The test locator"
      shall: "give each location of a test its first and last line and its canonical text."
    criteria:
      - key: 01a145e9-aa7f-769e-a7f5-f230a810aa75
        name: "Lines are counted from 1."
      - key: 01a145e9-aa7f-769e-a7f5-f231666f035d
        name: "A test located more than once in its file has one location for each, in the order of the file."
      - key: 01a145e9-aa7f-769e-a7f5-f2326cee5cf9
        name: "The canonical text is the test's tokens in the order of the file, joined by one space."
      - key: 01a145e9-aa7f-769e-a7f5-f233d2fe0ea4
        name: "A comment is not a token of the canonical text."
      - key: 01a145e9-aa7f-769e-a7f5-f234d503d09c
        name: "A string, character or template literal is one token of the canonical text, written as in the file."
      - key: 01a146cb-3d40-749f-b9bb-1cc70ed1d3b8
        name: "Text between JSX tags is one token of the canonical text, read as JSX reads it: each line trimmed where it meets a line break, a line left empty dropped, and the lines left joined by one space."
      - key: 01a145e9-aa7f-769e-a7f5-f235c46cfb4d
        name: "In Python, a token that starts a line outside any bracket is preceded in the canonical text by a line break and the line's indentation as written."
      - key: 01a145e9-aa7f-769e-a7f5-f236238e83b4
        name: "Whitespace between two tokens, other than the indentation of a Python line that starts outside any bracket, leaves the canonical text unchanged."
      - key: 01a14625-1535-7161-b749-350a75694b01
        name: "In Python, a backslash that continues a line is not a token of the canonical text."
      - key: 01a14625-1535-7161-b749-350bfa809c4c
        name: "A comma directly before `)`, `]` or `}` is not a token of the canonical text, except in Python."
      - key: 01a14625-1535-7161-b749-350cf0014804
        name: "A line break written as CR LF is read as LF, in the canonical text and in a test's name."
  - key: 01a145e9-aa7f-769e-a7f5-f23774dc6c4b
    statement:
      form: ubiquitous
      system: "The reconciler"
      shall: "take a located test's digest as the SHA-256 of the canonical texts of its locations, joined by a line break, in the order of the file."
    criteria:
      - key: 01a145e9-aa7f-769e-a7f5-f238d62398b6
        name: "The digest of a test located once is the SHA-256 of its canonical text."
      - key: 01a145e9-aa7f-769e-a7f5-f23971eee416
        name: "The digest is written in 64 lowercase hexadecimal digits."
  - key: 01a145e9-aa7f-769e-a7f5-f23a206825ed
    statement:
      form: unwanted
      if: "the test locator locates no test of a link"
      system: "the reconciler"
      shall: "look for the test's name in its file as a whole word."
    criteria:
      - key: 01a145e9-aa7f-769e-a7f5-f23b402698cf
        name: "A test in a file that no grammar parses is looked for as a whole word."
      - key: 01a145e9-aa7f-769e-a7f5-f23c19f71762
        name: "A test whose name no test of its parsed file carries is looked for as a whole word."
      - key: 01a145e9-aa7f-769e-a7f5-f23db8b80330
        name: "A test found only as a whole word has no digest."
  - key: 01a146cb-3d40-749f-b9bb-1cc803103901
    statement:
      form: unwanted
      if: "a test file holds a part that its grammar does not parse"
      system: "the reconciler"
      shall: "not take as located a test that holds that part, or that the part follows before the next test of the file starts."
    criteria:
      - key: 01a146cb-3d40-749f-b9bb-1cc9702c589a
        name: "A test that holds a part of its file that the grammar does not parse is not located."
      - key: 01a146cb-3d40-749f-b9bb-1cca5022e939
        name: "A test followed by a part that the grammar does not parse, before the next test of the file starts, is not located."
      - key: 01a146cb-3d40-749f-b9bb-1ccbed7b7859
        name: "A test that neither holds nor is followed by a part that the grammar does not parse is located, though another part of its file does not parse."
      - key: 01a146cb-3d40-749f-b9bb-1ccc349038b9
        name: "Each part that the grammar does not parse is given by its line and its column, counted from 1, and by its text or the token that the grammar found missing."
