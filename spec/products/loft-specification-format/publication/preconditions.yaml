key: 30461367-0853-4600-ac96-02443cdcfe81
slug: preconditions
name: "Preconditions"
body: "The conditions that refuse every publish before it writes anything, wherever the tree is held: a validation error, and a lock that is not a valid lock record. The conditions that read the git repository that holds the tree are the repository preconditions."
realizes:
  - 163cc9da-ec4c-40e3-9926-d16ed9d0d1e4
requirements:
  - key: b62726a9-bbbf-4819-adcc-d7e4a29ec32b
    statement:
      form: unwanted
      if: "the validator reports an error"
      system: "the publisher"
      shall: "refuse to publish."
    criteria:
      - key: a3112602-7b76-4086-a776-310108a924e9
        name: "The refusal lists the errors."
      - key: 42b98306-ab30-440c-80ee-2ed47992e917
        name: "No lock is written."
      - key: e3054f48-d6fb-47b2-a3ed-2f8d957cdf57
        name: "A lint finding does not refuse a publish."
  - key: 01a12ff0-f5e5-7095-8fa8-250042e167c2
    statement:
      form: unwanted
      if: "`loft.lock.json` is not a valid lock record while no merge or rebase is stopped"
      system: "the publisher"
      shall: "refuse to publish."
    criteria:
      - key: 01a12ff0-f5e5-7095-8fa8-250191a02015
        name: "The refusal names `loft.lock.json`."
      - key: 01a12ff0-f5e5-7095-8fa8-2502e40aec14
        name: "Nothing is written."
