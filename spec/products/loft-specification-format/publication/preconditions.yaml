key: 30461367-0853-4600-ac96-02443cdcfe81
slug: preconditions
name: "Preconditions"
body: "The three conditions that refuse a publish before it writes anything: uncommitted changes under `spec/`, a branch other than the publish branch, and a validation error."
realizes:
  - 163cc9da-ec4c-40e3-9926-d16ed9d0d1e4
requirements:
  - key: 5c65bd93-dce3-4231-a105-42c0c1e080f8
    statement:
      form: unwanted
      if: "the working tree has uncommitted changes under `spec/`"
      system: "the publisher"
      shall: "refuse to publish."
    criteria:
      - key: a5f0848b-6b06-40a3-8ea7-a5aab48e8ecb
        name: "The refusal names the modified paths."
      - key: 4c6946ba-9b0e-4ca1-be0d-2ae3f73617ca
        name: "No lock is written."
  - key: 0edce68c-8576-4978-ab4e-d4d2b1a3c1aa
    statement:
      form: unwanted
      if: "the current branch is not the publish branch"
      system: "the publisher"
      shall: "refuse to publish."
    criteria:
      - key: 014a28d1-4cd5-40fb-ae34-796d3886913c
        name: "The publish branch is `main` unless the manifest names another."
      - key: 108f63c4-94af-4efd-9e35-4f5fceea4493
        name: "The refusal names the current branch and the publish branch."
      - key: 83dcf58f-6f76-4b68-9c98-37b2c2aba984
        name: "A detached HEAD is refused as not being on the publish branch."
  - key: b62726a9-bbbf-4819-adcc-d7e4a29ec32b
    statement:
      form: unwanted
      if: "the validator reports an error"
      system: "the publisher"
      shall: "refuse to publish."
    criteria:
      - key: a3112602-7b76-4086-a776-310108a924e9
        name: "The refusal lists the errors."
      - key: 42b98306-ab30-440c-80ee-2ed47992e917
        name: "No lock is written."
      - key: e3054f48-d6fb-47b2-a3ed-2f8d957cdf57
        name: "A lint finding does not refuse a publish."
