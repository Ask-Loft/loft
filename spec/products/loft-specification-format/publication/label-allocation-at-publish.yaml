key: d22ef71f-0e46-414d-9da2-5da8d9347ac2
slug: label-allocation-at-publish
name: "Label allocation at publish"
body: "How a publish gives each unlabelled node the next label of its kind prefix while advancing the counters in `spec/labels.yaml`, gives a key that came back to its document the label it departed with, and marks departed the binding of each key that left."
realizes:
  - 163cc9da-ec4c-40e3-9926-d16ed9d0d1e4
requirements:
  - key: f46f376e-59d6-467d-9e54-94769bb5cb88
    statement:
      form: event_driven
      when: "publishing"
      system: "the publisher"
      shall: "allocate a label to every node without one."
    criteria:
      - key: 48d1d38f-594d-424e-96c1-d8a9704a4f67
        name: "Every node of a kind that takes a label prefix has a binding after a publish."
      - key: ead11d53-c079-425a-92ba-efb9e9eabede
        name: "Each new label is the next value of the counter for the node's kind prefix."
      - key: 5a104fe4-9a84-4aca-8440-620eb2f29918
        name: "Each counter in `spec/labels.yaml` advances to the next unallocated value."
      - key: 716f464c-33a3-4dca-8263-e3043c14339e
        name: "The publisher reports each allocated label with its key."
      - key: a2443e5b-68d3-4b96-b2c6-41c2228a5161
        name: "Every decision has a binding after a publish."
      - key: 4dbbe95a-8d28-458a-8289-ff33b34d3cef
        name: "No label that a decision carries as a former label is allocated."
  - key: 01a156a4-1732-7428-aee4-d39d2f60c95e
    statement:
      form: event_driven
      when: "publishing a tree that holds a key whose binding is departed"
      system: "the publisher"
      shall: "give the key back its departed label."
    criteria:
      - key: 01a156a4-1732-7428-aee4-d39e3e3dc8f1
        name: "The key's binding is no longer departed after the publish."
      - key: 01a156a4-1732-7428-aee4-d39f1cddd4b7
        name: "The key's live label is the label it carried when it left the document."
      - key: 01a156a4-1732-7428-aee4-d3a0bc216d04
        name: "No label counter advances for a key that takes back its label."
      - key: 01a156a4-1732-7428-aee4-d3a1978f5579
        name: "A key that comes back as a node of another kind keeps its departed label as an alias and is allocated the next label of its new kind's prefix."
      - key: 01a156a4-1732-7428-aee4-d3a29f3d72ee
        name: "The publisher reports each label it gives back, with its key."
  - key: 01a156a4-1732-7428-aee4-d3a325d43e4d
    statement:
      form: event_driven
      when: "publishing a tree that no longer holds a key that the bindings file binds"
      system: "the publisher"
      shall: "mark the key's binding departed."
    criteria:
      - key: 01a156a4-1732-7428-aee4-d3a4cf64e208
        name: "The binding is marked departed after the publish."
      - key: 01a156a4-1732-7428-aee4-d3a5ebd6e35f
        name: "No binding is removed by a publish."
      - key: 01a156a4-1732-7428-aee4-d3a6c4746d8b
        name: "A binding that is already departed is left as it is."
