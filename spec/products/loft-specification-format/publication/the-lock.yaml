key: e74d3409-8e24-4790-9285-8568ef81453d
slug: the-lock
name: "The lock"
body: "The lock record a publish writes to `loft.lock.json`, together with the label changes and the rewritten citations that are the only edits a publish makes under `spec/`. A tree that holds `spec/lint.yaml` and was last published under state view 1 has a new state root under state view 2, so the first publish after an upgrade advances its publish sequence once, with no other change. A lock names state view 2 only where the tree holds `spec/lint.yaml`; every other lock has the same roots under both views, carries no `stateView`, and stays readable by an older `loft`."
realizes:
  - 163cc9da-ec4c-40e3-9926-d16ed9d0d1e4
requirements:
  - key: 51107486-84d6-4fb5-b02f-5e28f63d472a
    statement:
      form: event_driven
      when: "publishing a tree that changed since the last publish"
      system: "the publisher"
      shall: "write only the lock, the bindings file and the files in which it rewrites a citation."
    criteria:
      - key: 4aa59cef-750c-47a6-946a-07e1e0be0902
        name: "`loft.lock.json` is written with the fields of the lock record."
      - key: 74f2cdd9-aadc-4eee-815e-cf9711a22462
        name: "No projection is written by a publish."
      - key: 94856ac4-cf5b-4151-8afc-0854d338d7d1
        name: "`spec/labels.yaml` and the files in which a publish rewrites a citation are the only files under `spec/` that a publish changes."
      - key: 489f3b99-0c96-46c7-b0d9-a1da6e6ccf18
        name: "The publish sequence is one more than the previous lock's, or 1 for a first publish."
      - key: 0066b673-cf11-414d-b8ec-f734e0c0b6bf
        name: "`publishedAt` is the publish time in UTC."
      - key: 848eda1a-790b-4dfe-b55b-8ee0acca532c
        name: "If writing the files a publish writes fails before its save's journal is complete, none of them is left changed."
      - key: 01a13acc-470a-75d5-beed-efe24aef8581
        name: "If writing the files a publish writes fails after its save's journal is complete, the next command that opens the tree finishes writing them."
  - key: 01a12ff0-f5e5-7095-8fa8-24fbd830a37c
    statement:
      form: ubiquitous
      system: "The publisher"
      shall: "write the lock as a JSON object with its fields in the Format's order."
    criteria:
      - key: 01a12ff0-f5e5-7095-8fa8-24fc60a2cac0
        name: "The lock's fields are, in order, `format`, `algorithm`, `documentKey`, `stateView`, `stateRoot`, `contentRoot`, `bindingRoot`, `publishSequence`, `publishedAt` and `derivedFrom`."
      - key: 01a12ff0-f5e5-7095-8fa8-24fdc9331a2e
        name: "The lock is indented by two spaces and ends with one newline."
      - key: 01a12ff0-f5e5-7095-8fa8-24fe3923692d
        name: "Each root in the lock is written in lowercase hexadecimal."
      - key: 01a12ff0-f5e5-7095-8fa8-24ffa23bc72a
        name: "`publishedAt` is written in the RFC 3339 form in UTC to the second, ending in `Z`."
      - key: 01a156a1-0a9f-763f-9aaa-d3e5542afe37
        name: "`stateView` is written as a JSON number."
  - key: 01a156a1-0a9f-763f-9aaa-d3e6b002f192
    statement:
      form: ubiquitous
      system: "The publisher"
      shall: "compute the roots of every lock it writes under state view 2."
    criteria:
      - key: 01a156a1-0a9f-763f-9aaa-d3e745d21d97
        name: "The lock of a tree that holds `spec/lint.yaml` carries `stateView` with the value 2."
      - key: 01a156c1-8ce0-753c-a269-20dbd23a4f4d
        name: "The lock of a tree without `spec/lint.yaml` carries no `stateView`."
      - key: 01a156c1-8ce0-753c-a269-20dcea71ef15
        name: "A reader that implements state view 1 alone reads the lock of a tree without `spec/lint.yaml`."
      - key: 01a156a1-0a9f-763f-9aaa-d3e823c32bd8
        name: "The state root a lock records is the hasher's state root of the published tree under state view 2."
  - key: 01a156a1-0a9f-763f-9aaa-d3e927a2671d
    statement:
      form: event_driven
      when: "publishing a tree whose last lock names state view 1"
      system: "the publisher"
      shall: "compare the tree's state root under state view 2 with the lock's state root."
    criteria:
      - key: 01a156a1-0a9f-763f-9aaa-d3ea430ca328
        name: "A tree that holds `spec/lint.yaml` and is otherwise unchanged since that lock is published again, with the publish sequence advanced by one."
      - key: 01a156a1-0a9f-763f-9aaa-d3ebf90a71f1
        name: "A second publish after that one, over the same tree, writes nothing."
      - key: 01a156a1-0a9f-763f-9aaa-d3ecdf587536
        name: "A tree without `spec/lint.yaml` that is unchanged since that lock is not published again."
