key: 61d7c512-16c1-44b2-a625-62d581fffd97
slug: roots
name: "Roots"
body: "The edges root, the content root, the binding root, the registry roots, the decisions root and the state root, and what each of them is sensitive to. A lock names the state view its state root was computed under: state view 1 is the state view as it stood before the lint configuration entered it, and state view 2 adds the digest of `spec/lint.yaml`, so that a lock pins the configuration the linter reads with the tree. A tree without the file has the same roots under both views, and its lock names no view."
tags:
  - portable
realizes:
  - e0fbfc12-d0c6-4e30-b08e-e99dc0b3d5ea
requirements:
  - key: 079bcc6f-b997-4303-a71e-644b2653d46c
    statement:
      form: ubiquitous
      system: "The hasher"
      shall: "compute the edges root over the sorted multiset of edges, each as its source's hash, its type, its target's hash and its role."
    criteria:
      - key: 3f87be4b-4bc3-4dd9-93fc-bc874f32215c
        name: "An edge enters the multiset by the content hashes of its endpoints."
      - key: 352da811-df99-4919-b4d0-6efcd0b7c97b
        name: "Two identical edges between duplicate nodes both count."
      - key: 440669e2-8133-48c2-85ab-a721782ee735
        name: "Adding an edge changes the edges root."
      - key: 75ba89e0-d6ee-4a6e-a81b-b9dccba165ed
        name: "Rekeying a node leaves the edges root unchanged."
      - key: 735135ce-6c8e-40f8-9f10-87ba23a346e9
        name: "Relabelling a node leaves the edges root unchanged."
      - key: a0510545-2865-4b2c-a28b-b8ebb8b94667
        name: "A node endpoint enters by its content hash."
      - key: 16ed798a-86b8-44aa-9bda-dab20590bedf
        name: "A decision endpoint enters by its decision view hash."
      - key: 40c3cca7-0ca2-4114-98f1-4f8e310dbb88
        name: "The edge tuples are sorted by their canonical bytes."
      - key: 4349e2e9-51b8-4684-8a15-079f254cab07
        name: "An edge without a role enters the edges root with `null` as its role."
      - key: 4e5e915a-26be-42e0-b6cf-d17cf9e95327
        name: "A former-label endpoint enters the edges root as the object `{\"formerLabel\": <label>}`."
  - key: 00f0e3f5-7cf6-474f-963b-cda9d7e74cc1
    statement:
      form: ubiquitous
      system: "The hasher"
      shall: "compute the content root from the Product roots in document order, the Component roots sorted, the edges root, the registry roots and the decisions root."
    criteria:
      - key: d56b9623-7212-49bf-9d24-5692ab3a9ac6
        name: "The same document with fresh keys has the same content root."
      - key: 9d540b62-2320-4764-a14a-e2f4dd7da89a
        name: "Relabelling every node leaves the content root unchanged."
      - key: 371ad570-9dd3-4893-ad0a-58859b55c5fc
        name: "Reordering the Products in the manifest's list changes the content root."
      - key: 9ad90ae7-2dd8-4f71-aea2-3ed4b7b8a45c
        name: "Reordering the root Components leaves the content root unchanged."
      - key: 2ad09421-d551-4540-8207-7151fdd71370
        name: "Changing a registry entry changes the content root."
      - key: 98c7bb01-2020-4a6c-a6bf-1671cdff85eb
        name: "Adding an edge changes the content root."
      - key: 3ad1410a-47e3-4a4d-9f92-f4bf6613d56c
        name: "Changing a decision changes the content root."
      - key: dff9c2bc-a436-4ab5-9414-8b001729f563
        name: "The root Component roots are sorted by their content hash."
      - key: 01a14b3f-6fb7-70d5-842f-807c36ac96c5
        name: "The content view of a document with a term entry holds the term list root after the decisions root."
      - key: 01a14b3f-6fb7-70d5-842f-807debc32884
        name: "A document with no term entry has the content root it had before the term list existed."
  - key: 77ccd1ef-a335-48b8-8f70-7fc1d80707d8
    statement:
      form: ubiquitous
      system: "The hasher"
      shall: "compute the binding root over the sorted bindings of key, label, aliases and content hash."
    criteria:
      - key: fb197598-98ce-4ae1-9374-c62c17f0e3b7
        name: "Relabelling a node changes the binding root."
      - key: 245ac12d-523d-4ff2-8a39-f1918b595aff
        name: "The hash in a binding is computed from the document, never read from `spec/labels.yaml`."
      - key: 01a130de-5738-756e-a4f4-f9521ba46949
        name: "A binding's withdrawn labels enter no root."
      - key: 01a156a4-1731-7679-a162-b7650bdb578f
        name: "A departed binding enters no root."
      - key: 01a156a4-1731-7679-a162-b7665a3e45b0
        name: "A binding's `publishedState` and `publishedHistory` enter no root."
      - key: 81c66bbd-5c2f-4bcb-b2b7-3949c04282f0
        name: "A node's binding carries the node's content hash."
      - key: b5d58ba7-c21b-40c8-8792-3cee2d34a793
        name: "A decision's binding carries the decision view hash."
      - key: c3bc74da-f243-47f8-9ecc-0a8c77c0bd58
        name: "The bindings are sorted by key in byte order."
  - key: 03b218c6-4049-4f09-9c44-22638ef1eeaa
    statement:
      form: ubiquitous
      system: "The hasher"
      shall: "compute the state root over the state view alone."
    criteria:
      - key: abf199fb-6538-437e-9fb4-c6e19dcdaa9c
        name: "The state view holds the format, the algorithm, the document key, the content root, the binding root and the derived-from record."
      - key: 01a14039-8315-7390-a27f-c567161fd14a
        name: "The state view of a document in which a node carries `ext` also holds the extensions root."
      - key: 01a14039-8315-7390-a27f-c568639e2a16
        name: "A document in which no node carries `ext` has the state root it had before nodes could carry `ext`."
      - key: 75dc8c6e-6e73-4244-8933-5410888d35c4
        name: "Changing any state view field changes the state root."
      - key: 2675e509-709a-4343-9468-5a1eb88c2326
        name: "Two documents with equal state views have the same state root."
      - key: 5a64f45c-0231-4181-bf6f-b889356a797e
        name: "The derived-from record holds the source `authoredStateId`, `contentAddress` and `publishSequence`."
      - key: c93e84de-4ef3-4992-ac20-ec6724a8b9eb
        name: "A document that is not derived has `null` as its derived-from record."
      - key: 64e542ae-cfb5-4d3b-a9fb-c28672221b7c
        name: "The derived-from record is read from `spec/loftspec.yaml`."
  - key: 01a156a1-0a9f-763f-9aaa-d3dad8a10f11
    statement:
      form: optional
      where: "a state root is computed under state view 2"
      system: "the hasher"
      shall: "cover the bytes of `spec/lint.yaml` in the state view whenever the tree holds that file."
    criteria:
      - key: 01a156a1-0a9f-763f-9aaa-d3db715f9644
        name: "The state view of a tree that holds `spec/lint.yaml` ends with the object `{\"lintConfiguration\": <digest>}`, after the extensions root where there is one."
      - key: 01a156a1-0a9f-763f-9aaa-d3dc5d715464
        name: "The digest of `spec/lint.yaml` is taken under the domain string `loftspec/lint/1` over a view that is the file's whole text, as stored, as one JSON string."
      - key: 01a156a1-0a9f-763f-9aaa-d3dd085ab7e6
        name: "A tree without `spec/lint.yaml` has the same state root under state view 2 as under state view 1."
      - key: 01a156a1-0a9f-763f-9aaa-d3dea81f8d9d
        name: "Changing any byte of `spec/lint.yaml`, its layout included, changes the state root."
      - key: 01a156a1-0a9f-763f-9aaa-d3df274d6fd3
        name: "Adding `spec/lint.yaml` to a tree changes the state root."
      - key: 01a156a1-0a9f-763f-9aaa-d3e0e6f78ebc
        name: "Removing `spec/lint.yaml` from a tree changes the state root."
      - key: 01a156a1-0a9f-763f-9aaa-d3e1488be969
        name: "Changing `spec/lint.yaml` leaves the content root and the binding root unchanged."
  - key: 01a156a1-0a9f-763f-9aaa-d3e24bf2decb
    statement:
      form: optional
      where: "a state root is computed under state view 1"
      system: "the hasher"
      shall: "leave `spec/lint.yaml` out of the state view."
    criteria:
      - key: 01a156a1-0a9f-763f-9aaa-d3e31796a5eb
        name: "Under state view 1, adding, changing or removing `spec/lint.yaml` leaves the state root unchanged."
      - key: 01a156a1-0a9f-763f-9aaa-d3e4117beb9d
        name: "The state view under state view 1 is the state view of the Format before `spec/lint.yaml` entered it."
  - key: 3763d0ec-da5c-4c93-bc86-852891f548bb
    statement:
      form: ubiquitous
      system: "The hasher"
      shall: "compute each registry root over the sorted entries of that registry."
    criteria:
      - key: de051f91-ee1f-4458-8a19-90548afa005f
        name: "The tag registry root is computed over the entries sorted by name in UTF-8 byte order."
      - key: 76416e28-c076-4c69-ac92-33fcd0104941
        name: "The constraint category root is computed over the categories sorted by name in UTF-8 byte order."
      - key: 01a14b3f-6fb7-70d5-842f-807e8e38af7f
        name: "The term list root is computed over the entries sorted by name in UTF-8 byte order, each with its definition and its sorted aliases."
      - key: 01a14b3f-6fb7-70d5-842f-807f9ed43476
        name: "Changing a term's alias changes the term list root."
      - key: 32081899-e591-4f44-b36f-77efe894fbe7
        name: "Changing an entry's definition changes its registry root."
      - key: 421b1a75-b729-476a-b441-158338853733
        name: "Reordering the entries in the file leaves the registry root unchanged."
      - key: df4a2f67-e867-4b1a-b3c2-295cbfdb9533
        name: "A registry root view begins with the registry's name, `tags`, `categories` or `terms`."
      - key: a9809fee-2b6f-4acf-98d3-b1c547854c89
        name: "Two registries with equal entries have different roots."
  - key: 369819ea-896d-4912-9cc5-9a38edd3fe10
    statement:
      form: ubiquitous
      system: "The hasher"
      shall: "compute the decisions root over the sorted decision views."
    criteria:
      - key: 87c46910-b1ad-4178-8323-530cf8c9d277
        name: "Changing a decision's outcome changes the decisions root."
      - key: ab062f25-d52b-456c-a0ef-038cd3435d32
        name: "Reordering the decision files leaves the decisions root unchanged."
      - key: a288743c-f400-43c0-b94f-cf44b200d145
        name: "Each decision view is digested under `loftspec/decision/1`."
      - key: 0b7b632e-d0ba-4b3e-ac3a-614196546029
        name: "The decisions root is computed over the decision view hashes sorted in byte order."
  - key: 5fe8a9e8-a712-4334-a77c-5546af736d77
    statement:
      form: ubiquitous
      system: "The hasher"
      shall: "build each decision view from the decision's content alone."
    criteria:
      - key: 3723d05c-93d1-4443-96d5-6fde3582ff60
        name: "A decision view holds the title, the context, the state, the drivers, the options, the assessments and the consequences, in that order."
      - key: 866656d6-6813-40d4-aa9d-a626baa99c4c
        name: "A decision view excludes the keys of the decision and its elements."
      - key: 953b2ff0-b7cf-4a5f-abc4-080547688f05
        name: "The same decision with fresh element keys has the same decision view hash."
      - key: 6638d8b2-3314-41d3-a6e2-790b49e4a91b
        name: "A decision view names its selected option by the option's position."
      - key: 967fe476-7a21-47a7-a9d0-0e0db26da32b
        name: "An assessment names its option and its driver by their positions."
      - key: 6ba51cae-9973-4c10-ac50-683c2291d040
        name: "The assessments are sorted by option position and then by driver position."
      - key: 27f952b8-2049-4cea-bec7-24463a1b7c39
        name: "A successor decision is named by its decision view hash."
      - key: d8f8ba11-7fab-41cf-9256-125ac0fd14c2
        name: "A driver or consequence that names a node names it by its content hash."
      - key: e87865d3-079e-4ae9-8952-5b1fc0ac71e4
        name: "A driver or consequence that names a former label names it as the object `{\"formerLabel\": <label>}`."
  - key: 01a156be-e2a7-7461-9a70-a039e8af92d6
    statement:
      form: ubiquitous
      system: "The hasher"
      shall: "compute each decision's history hash over its decision view with each node and decision it names given by key."
    criteria:
      - key: 01a156be-e2a7-7461-9a70-a03a6eea7bda
        name: "The decision history view is the decision view in which each node that a driver or a consequence names is named by its key."
      - key: 01a156be-e2a7-7461-9a70-a03bc14b6d88
        name: "In the decision history view, a successor decision is named by its key."
      - key: 01a156be-e2a7-7461-9a70-a03c1df47abc
        name: "A former label is named in the decision history view as it is in the decision view."
      - key: 01a156be-e2a7-7461-9a70-a03daff383c0
        name: "The decision history hash is the digest of the decision history view under `loftspec/decision-history/1`."
      - key: 01a156be-e2a7-7461-9a70-a03e8733ea95
        name: "Editing a node that a driver or a consequence names leaves the decision history hash unchanged."
      - key: 01a156be-e2a7-7461-9a70-a03fbce11e4c
        name: "Naming another node in a driver or a consequence changes the decision history hash."
      - key: 01a156be-e2a7-7461-9a70-a0408d17e2af
        name: "Editing the successor decision leaves the decision history hash unchanged."
      - key: 01a156be-e2a7-7461-9a70-a0429f97f850
        name: "The decision history hash enters no root."
  - key: 01a14039-8315-7390-a27f-c5695f6ac662
    statement:
      form: ubiquitous
      system: "The hasher"
      shall: "compute the extensions root over the nodes that carry `ext`, each as its key and its `ext`."
    criteria:
      - key: 01a14039-8315-7390-a27f-c56acfc13154
        name: "A node's `ext` enters the extensions root as RFC 8785 canonical JSON."
      - key: 01a14039-8315-7390-a27f-c56b4415d752
        name: "The nodes are sorted by key in byte order."
      - key: 01a14039-8315-7390-a27f-c56c9970df3f
        name: "Changing a node's `ext` changes the extensions root and the state root."
      - key: 01a14039-8315-7390-a27f-c56d69fb0e70
        name: "Changing a node's `ext` leaves its content hash and the content root unchanged."
