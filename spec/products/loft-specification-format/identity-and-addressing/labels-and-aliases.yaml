key: c788db27-2701-47f8-a74c-8fe6d13ab8c6
slug: labels-and-aliases
name: "Labels and aliases"
body: "Human-readable labels allocated at publish from per-prefix counters, recorded in the bindings file, preserved as aliases when a node's label changes, and recorded as withdrawn when a key loses a label that two publishes gave apart. A key that leaves the document keeps its binding, marked departed, so that a node restored by a revert, or moved out and back, takes back its label at the next publish. Each decision's binding also records the state the last publish saw it in, with a hash that names the nodes the decision weighs by key, which the lint rules of decision history compare with the tree. None of these records enters a root."
realizes:
  - e1ab75a5-f206-4760-970f-bee0653c4f2a
requirements:
  - key: 8167c7b2-41bb-41b8-a5d9-9565fa3ecbde
    statement:
      form: ubiquitous
      system: "The writer"
      shall: "record labels only in the bindings file."
    criteria:
      - key: 00f903a2-296f-45d0-a465-5a258efac8cd
        name: "No node record under `spec/` carries a label field."
      - key: 901c9c47-7917-436d-ac06-3af365269ed7
        name: "`spec/labels.yaml` maps each labelled key to exactly one label."
      - key: 47b85428-cc82-4571-9326-404141030fc5
        name: "A node authored since the last publish or conversion has no entry in `spec/labels.yaml`."
  - key: d1aae04f-e9e4-4bb0-bd84-2a334bee5542
    statement:
      form: ubiquitous
      system: "The publisher"
      shall: "allocate each label from a per-prefix counter."
    criteria:
      - key: e5b092a7-6cf7-4254-849e-b99a57385c93
        name: "A label is a kind prefix, a hyphen and a positive integer without leading zeros."
      - key: 52a35682-d0d0-4aff-8c8b-7618c1a65d3a
        name: "The next value of each prefix counter is stored in `spec/labels.yaml`."
      - key: 870afd07-a139-4313-a79e-fb9f2528f4f4
        name: "Labels are allocated to unlabelled nodes in document order."
      - key: 51137dfc-0ecc-4678-873f-68bdd9e1ec9e
        name: "The kind prefixes are `P` for a Product, `FG` for a Feature Group, `F` for a Feature, `RQ` for a Requirement, `AC` for a criterion, `CMP` for a Component, `CON` for a Constraint, `QA` for a Quality Attribute and `ADR` for a decision."
      - key: 4cecef66-9447-4199-93eb-08b4b715f439
        name: "Root Components are visited in the order of their file names when labels are allocated."
      - key: 01a12ff0-f5e5-7095-8fa8-24f82dc553e0
        name: "Decisions are allocated labels after every node, in the order of their file names."
  - key: 2501b129-ef05-46ed-977c-cc980299cf27
    statement:
      form: ubiquitous
      system: "The publisher"
      shall: "never rewind a label counter."
    criteria:
      - key: bb182627-366f-44fb-ab7a-0aeef91ce3e4
        name: "A label counter's next value never decreases between two publishes."
      - key: 4badc484-5aa8-4a65-b3da-3834d7ff5dd3
        name: "A label of a deleted node is never allocated again."
  - key: 41a992bc-9eaa-4dfb-85cb-19205abe5a05
    statement:
      form: event_driven
      when: "a node's label changes"
      system: "the publisher"
      shall: "record the previous label as a permanent alias of the same key."
    criteria:
      - key: e94ea406-b5cd-4086-9dd5-e8f46a93b9c3
        name: "The previous label appears in the key's alias list after the change."
      - key: 3be36f66-85b1-4e30-a169-58f954fd2b87
        name: "An alias list only grows."
      - key: c180a500-1ab9-4fe1-9dcd-5ef05891dd39
        name: "An alias resolves to the key it was assigned to."
  - key: 01a130de-5738-756e-a4f4-f948dae91847
    statement:
      form: event_driven
      when: "a publish settles a label that two publishes gave apart"
      system: "the publisher"
      shall: "record the label as withdrawn from the key that loses it."
    criteria:
      - key: 01a130de-5738-756e-a4f4-f9496bd44461
        name: "The binding of the key that loses the label lists the label under `withdrawn`."
      - key: 01a130de-5738-756e-a4f4-f94aa84cb8de
        name: "A withdrawn label resolves to no element through the key it was withdrawn from."
      - key: 01a130de-5738-756e-a4f4-f94b236ebc0c
        name: "A withdrawn label is never allocated again."
      - key: 01a130de-5738-756e-a4f4-f94c253aafeb
        name: "A `withdrawn` list only grows."
  - key: 01a130de-5738-756e-a4f4-f94dd0463a88
    statement:
      form: unwanted
      if: "a withdrawn label of a key is that key's live label or one of its aliases"
      system: "the validator"
      shall: "report an error."
    criteria:
      - key: 01a130de-5738-756e-a4f4-f94e21124f57
        name: "The error names the key."
      - key: 01a130de-5738-756e-a4f4-f94fb2163075
        name: "The error names the label."
      - key: 43058cb9-3c84-4ec7-9ddf-716a1796678d
        name: "A Requirement promoted to a Feature keeps its Requirement label as an alias."
  - key: aedb9bb4-8486-46fa-8c0c-f6546b4e2075
    statement:
      form: unwanted
      if: "an alias equals a live label of another key"
      system: "the validator"
      shall: "report an error."
    criteria:
      - key: a44eac13-8d32-4670-836f-ab8895a0a38c
        name: "The error names both keys."
      - key: a6fa1bd4-aa5f-4f48-a060-1698430b924f
        name: "The error names the colliding label."
  - key: 23de8746-fa1e-4c83-946e-4b2c0f27dbf4
    statement:
      form: event_driven
      when: "a published node's kind changes"
      system: "the publisher"
      shall: "allocate it a label of the new kind's prefix."
    criteria:
      - key: fa6546b2-88b1-40ec-a031-4ed526b482df
        name: "A Requirement promoted to a Feature receives the next `F` label at the next publish."
      - key: 336e8714-6b3f-469e-8b72-ff113618c722
        name: "The node's previous label becomes an alias of its key."
      - key: f2fb3f89-1f71-4f7b-b52c-8c30300c0a76
        name: "A node whose kind is unchanged keeps its label."
      - key: 01a12ff0-f5e5-7095-8fa8-24f913494a56
        name: "A binding whose label's prefix is not its element's kind prefix is read without error and replaced at the next publish."
  - key: bcac53a3-e474-4690-93c7-b426b1ef07d3
    statement:
      form: unwanted
      if: "an alias is listed under two keys"
      system: "the validator"
      shall: "report an error naming both keys."
    criteria:
      - key: 18650e7e-11a3-4dd9-b6a1-2e119bcdb47d
        name: "The error names both keys."
      - key: b19f9eec-94ff-4f35-b5e3-4eb6e3bff01f
        name: "The error names the shared alias."
  - key: 7d0194ef-50d1-4dfc-84cc-92c2780a7ca4
    statement:
      form: unwanted
      if: "two keys carry the same live label"
      system: "the validator"
      shall: "report an error naming both keys."
    criteria:
      - key: dcc62ab5-0939-427b-88f0-52ccc66e1a3e
        name: "The error names both keys."
      - key: 1d54e95d-685b-42a4-8299-8021f29a6f10
        name: "The error names the shared label."
      - key: 3718a873-668c-4d69-9a11-824ae44f36f3
        name: "Distinct live labels raise no such error."
  - key: 158579bf-be89-431a-9e17-a1e0acf7f572
    statement:
      form: optional
      where: "a retired or superseded decision names a node the document no longer holds"
      system: "the writer"
      shall: "write that reference as the node's former label."
    criteria:
      - key: ec5829de-89b2-4f98-aef3-6b49284e70f8
        name: "A former label is the live label the node carried when it left the document."
      - key: ee6a574b-4d71-4993-8b34-6df1f407df30
        name: "A `subject` edge to such a node has the former label as its target."
      - key: 13315bdc-a7ff-4e59-8303-57174902ef3a
        name: "A driver that names such a node names its former label."
      - key: 8d0b309c-6778-4b20-a3df-c4fd6cfed391
        name: "A consequence that names such a node names its former label."
      - key: 194a6572-6bb8-4baf-8a61-b721694f5d20
        name: "In a file, a former label is written as a mapping whose single field `formerLabel` holds the label."
  - key: 01a137a8-ae5b-7395-a025-0da856cebdef
    statement:
      form: event_driven
      when: "formatting finds a binding whose key no node or decision carries"
      system: "the formatter"
      shall: "mark that binding departed in the bindings file."
    criteria:
      - key: 01a137a8-ae5b-7395-a025-0da98138cce8
        name: "After formatting, each binding whose key no node or decision carries is marked departed."
      - key: 01a137a8-ae5b-7395-a025-0daa86467cff
        name: "Formatting leaves the label counters unchanged, so no label of a departed binding is allocated to another key."
      - key: 01a137a8-ae5b-7395-a025-0dab7b5cf623
        name: "A binding whose key a node or decision carries is kept."
      - key: 01a137b5-8a69-7480-9b93-21a71fd2a1cc
        name: "The formatter gives the label and key of each binding it marks departed."
      - key: 01a156a4-1731-7679-a162-b74dc98399e5
        name: "A departed binding keeps its label, its aliases and its withdrawn labels."
      - key: 01a156a4-1731-7679-a162-b74ec679ed74
        name: "A binding already marked departed is left as it is."
      - key: 01a156a4-1731-7679-a162-b74f5eb839a5
        name: "Formatting removes no binding from the bindings file."
  - key: 01a137a8-ae5b-7395-a025-0dac26f000aa
    statement:
      form: event_driven
      when: "formatting marks departed the binding of a node that a retired or superseded decision names"
      system: "the formatter"
      shall: "write that reference as the binding's label under `formerLabel`."
    criteria:
      - key: 01a137a8-ae5b-7395-a025-0dadf1a91a7f
        name: "A `subject` edge of such a decision to the node is written as the node's former label."
      - key: 01a137a8-ae5b-7395-a025-0dae99806097
        name: "A driver of such a decision that names the node names its former label."
      - key: 01a137a8-ae5b-7395-a025-0dafcfc9d8c0
        name: "A consequence of such a decision that names the node names its former label."
      - key: 01a137a8-ae5b-7395-a025-0db0d44d55b4
        name: "A decision that is neither retired nor superseded and names the node keeps the key, which the reader refuses."
  - key: 01a156a4-1731-7679-a162-b75085aa7440
    statement:
      form: event_driven
      when: "formatting finds a node whose key a departed binding names"
      system: "the formatter"
      shall: "write each reference to that binding's label under `formerLabel` as the node's key."
    criteria:
      - key: 01a156a4-1731-7679-a162-b7517d51b8d5
        name: "A `subject` edge to the former label is written as the node's key."
      - key: 01a156a4-1731-7679-a162-b7529e395d9a
        name: "A driver that names the former label names the node's key."
      - key: 01a156a4-1731-7679-a162-b7536e96322b
        name: "A consequence that names the former label names the node's key."
      - key: 01a156a4-1731-7679-a162-b754e32b9774
        name: "The binding stays departed until the next publish."
  - key: 01a156a4-1731-7679-a162-b7554118e7de
    statement:
      form: ubiquitous
      system: "The writer"
      shall: "keep in the bindings file the binding of each key that has left the document, marked departed."
    criteria:
      - key: 01a156a4-1731-7679-a162-b7560b9f04ca
        name: "A departed binding is written with `departed: true`."
      - key: 01a156a4-1731-7679-a162-b7570da9d731
        name: "A departed binding's label is the live label its key carried when it left the document."
      - key: 01a156a4-1731-7679-a162-b7582312736d
        name: "A departed label resolves to no element."
      - key: 01a156a4-1731-7679-a162-b75940af5e98
        name: "A departed label is never allocated to another key."
  - key: 01a156a4-1731-7679-a162-b75a3449880e
    statement:
      form: unwanted
      if: "a departed label is the live label or an alias of another key"
      system: "the validator"
      shall: "report an error."
    criteria:
      - key: 01a156a4-1731-7679-a162-b75b8ddc073b
        name: "The error names both keys."
      - key: 01a156a4-1731-7679-a162-b75cb3a8ace9
        name: "The error names the label."
      - key: 01a156a4-1731-7679-a162-b75d1f6cbfbc
        name: "A departed label that no other key carries raises no such error."
  - key: 01a156a4-1731-7679-a162-b75e7ec263c6
    statement:
      form: event_driven
      when: "publishing"
      system: "the publisher"
      shall: "record in each decision's binding the kind of the decision's state, with its decision history hash for a decision that is accepted, rejected, superseded or retired."
    criteria:
      - key: 01a156a4-1731-7679-a162-b75fbc529428
        name: "After a publish, each decision's binding holds `publishedState`, the kind of the decision's state at that publish."
      - key: 01a156a4-1731-7679-a162-b760bd36f69b
        name: "After a publish, the binding of each accepted, rejected, superseded or retired decision holds `publishedHistory`, the decision's history hash at that publish."
      - key: 01a156a4-1731-7679-a162-b7612ef77e0f
        name: "After a publish, the binding of a proposed decision holds no `publishedHistory`."
      - key: 01a156a4-1731-7679-a162-b7629d767e6f
        name: "`publishedHistory` is written in lowercase hexadecimal."
      - key: 01a156a4-1731-7679-a162-b76372802144
        name: "A binding that the formatter marks departed keeps the `publishedState` and `publishedHistory` it held."
      - key: 01a156be-e2a7-7461-9a70-a0385099c003
        name: "A publish removes `publishedState` and `publishedHistory` from the binding of each departed decision."
      - key: 01a156a4-1731-7679-a162-b764694a5b4a
        name: "The record of a decision is what the last publish that held the decision wrote."
