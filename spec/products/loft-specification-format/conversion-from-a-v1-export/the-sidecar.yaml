      shall: "record in a sidecar every v1 fact the content view excludes."
    criteria:
      - key: 500c14e3-e11c-485e-8815-e0a22bc6dd7a
        name: "The sidecar records each node's v1 ordinal."
      - key: 39205500-567f-4998-a85b-b59f6576a1c5
