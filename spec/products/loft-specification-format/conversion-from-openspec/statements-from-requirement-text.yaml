key: 01a13d02-7211-77f1-a8f1-30d38fd5687a
slug: statements-from-requirement-text
name: "Statements from requirement text"
body: "How the OpenSpec converter splits a requirement's text into the Requirement's statement and body, and when it keeps the statement as EARS slots."
realizes:
  - 01a13d01-545b-761c-83a4-724d8d61cd4b
requirements:
  - key: 01a13d02-7211-77f1-a8f1-30d49714e885
    statement:
      form: ubiquitous
      system: "The OpenSpec converter"
      shall: "take a Requirement's statement from the first paragraph of the requirement's text."
    criteria:
      - key: 01a13d02-7211-77f1-a8f1-30d57264e4e4
        name: "The lines of the first paragraph are trimmed and joined with single spaces."
      - key: 01a13d02-7211-77f1-a8f1-30d6691894cb
        name: "The paragraphs after the first become the Requirement's body verbatim."
      - key: 01a13d02-7211-77f1-a8f1-30d78d9d45db
        name: "A requirement with no text takes its requirement name as the statement."
  - key: 01a13d02-7211-77f1-a8f1-30d88fafefe2
    statement:
      form: ubiquitous
      system: "The OpenSpec converter"
      shall: "keep each metadata line of a requirement's text out of the statement."
    criteria:
      - key: 01a13d02-7211-77f1-a8f1-30d97fc3caa6
        name: "A line that begins with a bold label followed by a colon, such as `**ID**:`, is a metadata line."
      - key: 01a13d02-7211-77f1-a8f1-30da02dbf431
        name: "The metadata lines open the Requirement's body in source order."
  - key: 01a13d02-7211-77f1-a8f1-30dbbfb6c7d0
    statement:
      form: ubiquitous
      system: "The OpenSpec converter"
      shall: "store a statement as slots when its first paragraph renders back from them byte for byte."
    criteria:
      - key: 01a13d02-7211-77f1-a8f1-30dc7a912c52
        name: "A first paragraph that renders back from its slots is stored as slots."
  - key: 01a13d02-7211-77f1-a8f1-30ddb4dc0d13
    statement:
      form: ubiquitous
      system: "The OpenSpec converter"
      shall: "store a statement as slots with the modal word `shall` when the first paragraph, with its first `SHALL` or `MUST` written as `shall`, renders back from them byte for byte."
    criteria:
      - key: 01a13d02-7211-77f1-a8f1-30def9323437
        name: "`The system SHALL keep a log.` is stored as the ubiquitous form with the system `The system` and the modal phrase `keep a log.`"
      - key: 01a13d02-7211-77f1-a8f1-30dfab8d01e6
        name: "`WHEN a user signs in, the system MUST record the time.` is stored as the event-driven form."
      - key: 01a13d02-7211-77f1-a8f1-30e044b95c95
        name: "No word but the first `SHALL` or `MUST` is changed."
      - key: 01a13d02-7211-77f1-a8f1-30e1f6b00d8d
        name: "A lower-case `must` is not changed."
  - key: 01a13d02-7211-77f1-a8f1-30e2d8306641
    statement:
      form: ubiquitous
      system: "The OpenSpec converter"
      shall: "store any other first paragraph as `text`, verbatim."
    criteria:
      - key: 01a13d02-d042-701f-a5b6-c06ce9b48b5c
        name: "A first paragraph that renders back from no slots, before or after its modal word is written as `shall`, is stored as `text` byte for byte."
