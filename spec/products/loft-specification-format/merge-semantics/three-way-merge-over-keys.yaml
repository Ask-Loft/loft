key: b32e384b-ec53-45c5-bc3b-86bf862a97b1
slug: three-way-merge-over-keys
name: "Three-way merge over keys"
body: "How the merge driver matches records across base, ours and theirs by key and combines the field changes of the two sides."
realizes:
  - 540397b6-7607-4ca9-aaa1-529d0fab1811
requirements:
  - key: 610995bc-33b8-4db2-a574-11ca68c3982e
    statement:
      form: ubiquitous
      system: "The merge driver"
      shall: "merge records by key."
    criteria:
      - key: bf099859-d300-4434-92dc-15160662c4b2
        name: "A record is matched across base, ours and theirs by its key."
      - key: 787dc9c5-4ba0-465b-b8c7-278c3d85999c
        name: "A record present on one side only is kept."
      - key: 4ff52d06-26ac-4456-98aa-f01ae6b2de90
        name: "A record deleted on one side and unchanged on the other is deleted."
      - key: 8a65c76a-0ddb-4871-a7ae-e76457d57e28
        name: "A record deleted on one side and changed on the other is kept as the changing side wrote it, with a conflict record whose field is `record` and whose deleting side is `null`."
      - key: 01a13b3a-594a-7413-a3dc-4059514edb86
        name: "A record that one side deleted is kept as the other side wrote it while the merge keeps any record beneath it."
      - key: 01a13b3a-594a-7413-a3dc-405a6f13124d
        name: "A record that one side deleted and that the merge keeps only to hold a record beneath it carries a conflict record whose field is `record`."
      - key: 01a13b3a-594a-7413-a3dc-405bd9b36fd5
        name: "A record that one side deleted and that the other side changed only by deleting records beneath it is deleted."
      - key: 01a13b3a-594a-7413-a3dc-405c54116d51
        name: "A record is not changed by a move within a list whose order the Format sorts."
      - key: a14a7d0f-cfe0-44e1-b758-3613ceb98947
        name: "A mapping entry without a key is matched across base, ours and theirs by its field name."
      - key: 2522c643-64ed-44db-92c2-0d4c97f7a514
        name: "A list element without a key is matched across base, ours and theirs by its value."
      - key: e949ba2e-312d-4e67-803a-fe3957f852ff
        name: "The merged file is in the formatter's canonical layout."
      - key: 01a13070-322f-7493-9495-406b0a698db6
        name: "A record moved to another parent in one file is matched with its base record by its key."
  - key: 01a13acc-1f4f-759a-b78e-5172e7e8ccac
    statement:
      form: event_driven
      when: "a side moves a record to another parent in the same file"
      system: "the merge driver"
      shall: "write the record once."
    criteria:
      - key: 01a13acc-1f4f-759a-b78e-51734b0f791e
        name: "When the other side edits the record, the record is at its new parent and carries the edit."
      - key: 01a13acc-1f4f-759a-b78e-5174e8a76890
        name: "When both sides move the record to one parent, the record is at that parent and no conflict record is written for it."
      - key: 01a13acc-1f4f-759a-b78e-51752b873aa4
        name: "When the sides move the record to different parents, the record stays at its base parent with a conflict record whose field is `parent`."
      - key: 01a13acc-1f4f-759a-b78e-51763e2acef6
        name: "In a `parent` conflict, each side holds the key of the record's parent on that side."
      - key: 01a13b3a-594a-7413-a3dc-405d3eb8a19f
        name: "When the sides move the record to different parents and neither side holds its base parent, the record is where ours put it, with a conflict record whose field is `parent`."
      - key: 01a13b3a-594a-7413-a3dc-405e9f212dcc
        name: "When the sides' moves would place a record beneath itself, each record of the cycle stays at its base parent, or where ours put it when base lacks it, with a conflict record whose field is `parent`."
      - key: 01a13b3a-594a-7413-a3dc-405f25e0eff9
        name: "When both sides add the record at different parents, the record is where ours put it, with a conflict record whose field is `parent` and no `base`."
      - key: 01a13acc-1f4f-759a-b78e-517707b6075a
        name: "When the other side deletes the record, the record is kept where the moving side put it, with a conflict record whose field is `record` and whose deleting side is `null`."
      - key: 01a13acc-1f4f-759a-b78e-5178ef058395
        name: "When the other side deletes the new parent, the new parent is kept with a conflict record whose field is `record`."
      - key: 01a13acc-1f4f-759a-b78e-51796254cd32
        name: "The merged file carries each key once."
  - key: 1be4d9f1-799b-4212-bdc9-e2865df2b0dd
    statement:
      form: event_driven
      when: "one side changes a field and the other leaves it"
      system: "the merge driver"
      shall: "take the change."
    criteria:
      - key: 56cd2388-3187-42ed-9408-1ff4b39585d8
        name: "The changed value is in the result."
      - key: 0e4cb4a6-0667-4b29-9903-9639c21ecc30
        name: "No conflict record is written for the field."
  - key: 3d22f367-9d75-4203-a0d9-5bfae8decf61
    statement:
      form: event_driven
      when: "both sides change a field to the same value"
      system: "the merge driver"
      shall: "take that value once."
    criteria:
      - key: 07b7eee5-2492-4fb7-8083-215bb15d230e
        name: "The value appears once in the result."
      - key: a8f69ee8-877f-4417-b80e-32bd18a552b0
        name: "No conflict record is written for the field."
  - key: 072ca575-5332-42fb-bd72-a07eea18092a
    statement:
      form: unwanted
      if: "both sides change one field to different values"
      system: "the merge driver"
      shall: "write a conflict record for that field."
    criteria:
      - key: 48587c93-7e9e-466e-8f24-1f51383b7af9
        name: "The record that owns the field gains a conflict record for it."
      - key: 99abee55-2c66-4c52-a1cc-266268df29f2
        name: "The other fields of the record are merged."
      - key: 2bcdbce9-4af8-4268-88af-6ac0afb7fa4c
        name: "The field keeps its base value."
  - key: 01a13070-322f-7493-9495-406c3624a9a9
    statement:
      form: unwanted
      if: "the merged fields of a record with variants do not form one of its variants"
      system: "the merge driver"
      shall: "keep the base record and write a conflict record for each field that either side changed."
    criteria:
      - key: 01a13070-322f-7493-9495-406d686c6821
        name: "The record holds its base value in every field that either side changed."
      - key: 01a13070-322f-7493-9495-406eeb869dce
        name: "Each field that either side changed gains a conflict record."
      - key: 01a13070-322f-7493-9495-406f4193a245
        name: "The merged file is read without a read error."
  - key: 01a13070-322f-7493-9495-4070d1827afd
    statement:
      form: event_driven
      when: "base holds no version of the file"
      system: "the merge driver"
      shall: "merge as if base held no version of the file."
    criteria:
      - key: 01a13070-322f-7493-9495-4071687baaed
        name: "An empty base file is read as an absent base."
      - key: 01a13070-322f-7493-9495-4072b60122a2
        name: "A conflicting field of a record that base lacks keeps the value that ours gave it."
  - key: 01a13070-322f-7493-9495-4073432ae6e5
    statement:
      form: ubiquitous
      system: "The merge driver"
      shall: "merge each binding, assessment and decision subject as one value."
    criteria:
      - key: 01a13070-322f-7493-9495-40746cf3ac48
        name: "A binding is matched by its key."
      - key: 01a13070-b1ce-749d-b40a-8afd97a122b6
        name: "An assessment is matched by its option and its driver."
      - key: 01a13070-b1ce-749d-b40a-8afead38048d
        name: "A decision subject is matched by its role and its node."
      - key: 01a13070-322f-7493-9495-407575aee03c
        name: "When both sides change an assessment to different values, the record that holds its list gains a conflict record for the list."
      - key: 01a13070-322f-7493-9495-407671410897
        name: "The assessment keeps its base value."
      - key: 01a13b3a-594a-7413-a3dc-4060ade857b9
        name: "When one side deletes an assessment and the other changes it, the record that holds its list gains a conflict record for the list."
      - key: 01a13b3a-594a-7413-a3dc-4061c28bc4c8
        name: "An assessment that one side deleted and the other changed keeps its base value."
      - key: 01a13a1b-2f3d-70d6-88b6-56e858b4b211
        name: "A decision subject that each side replaces with a different subject is removed, and each side's replacement is kept."
  - key: 01a13070-322f-7493-9495-4077bb5be258
    statement:
      form: event_driven
      when: "an input already holds conflict records"
      system: "the merge driver"
      shall: "merge the conflict records they hold as a set."
    criteria:
      - key: 01a13070-322f-7493-9495-4078bf5d780f
        name: "A conflict record present on both sides is written once."
      - key: 01a13070-322f-7493-9495-4079070331fc
        name: "A conflict record that one side removed and the other left unchanged is removed."
