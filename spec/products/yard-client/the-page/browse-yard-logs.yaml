key: 01a1646f-546d-7042-befd-eb213cfb9073
slug: browse-yard-logs
name: "Browse Yard Logs"
body: |
  The page lists every branch's Yard Log the page server serves, across every repository and worktree on the machine, and draws one branch's Yard Log as a timeline of its stages, from the work done through the stages in hand to the stages still planned: a list of the stages beside a pane that shows the stage chosen, with each block drawn by its kind.

  The page shows each block's current version and offers its earlier versions, since Yard Log keeps them all.
realizes:
  - 01a16469-559e-73c4-85f2-71a8fdbbeaf7
  - 01a16469-559e-73c4-85f2-71a94f0aa021
requirements:
  - key: 01a168d9-f2df-7350-8964-7eca18ed1a07
    statement:
      form: ubiquitous
      system: "The page"
      shall: "fill the window beside its sidebar, from the window's top to its bottom."
    criteria:
      - key: 01a168d9-f2df-7350-8964-7ecb58ac5bcb
        name: "The page begins at the sidebar's edge, whatever the window's width."
      - key: 01a168d9-f2df-7350-8964-7ecc86fbfc7d
        name: "The page reaches the right edge of the window, whatever the window's width."
      - key: 01a168d9-f2df-7350-8964-7ecd425523e1
        name: "The page itself never scrolls: its head stays in place, and what lies beneath the head scrolls within its own pane."
  - key: 01a16984-aada-7286-b3f3-2f74df71220a
    statement:
      form: ubiquitous
      system: "The page"
      shall: "head its sidebar with Loft's wordmark, whose L wears the action blue and the rest of the name ink, and with the word Yard beside it in muted text."
    criteria:
      - key: 01a16984-aadb-7721-9995-4721c3e03b58
        name: "The L of the wordmark is action blue and the rest of the name ink, in the light and in the dark scheme alike."
      - key: 01a16991-1851-764f-877b-c2d5f6abfd47
        name: "The wordmark reads as one word: no space lies between its L and the rest of the name."
      - key: 01a1a7a4-51ce-73b8-bd34-87a84c7109a0
        name: "The word Yard stands after the wordmark on the same baseline, in muted text."
      - key: 01a1a7a4-51ce-73b8-bd34-87a9cc566aa7
        name: "The page names no other mark than the wordmark and the word Yard."
  - key: 01a168ea-af3d-7473-83c8-50bb2e1a4b32
    statement:
      form: ubiquitous
      system: "The page"
      shall: "hold the list of Yard Logs in a sidebar down the left of the window, on a ground of its own apart from the page's, which the person can fold to a rail and open again, and give the room the sidebar leaves to the Yard Log shown."
    criteria:
      - key: 01a16901-3952-7392-b2a8-3b99d4dc57a2
        name: "The sidebar runs down the left of the window from its top to its bottom, and stays in place while the Yard Log scrolls."
      - key: 01a168ea-af3e-70b5-83b9-97fe8c01e07f
        name: "Open, the sidebar is headed by the button that folds it and the wordmark, and lists the Yard Logs beneath them."
      - key: 01a16901-3953-712b-afc6-44269a6cf574
        name: "Folded, the sidebar is a rail that holds the button that opens it."
      - key: 01a168ea-af3e-70b5-83b9-97ff14bf889d
        name: "The sidebar is open unless the person chose to fold it, and the person's choice is kept in the browser."
      - key: 01a168ea-af3e-70b5-83b9-9800f391884d
        name: "With the sidebar folded, the page begins at the rail's edge and widens into the room the sidebar left."
      - key: 01a168ea-af3e-70b5-83b9-9801a289a60f
        name: "With the sidebar folded, the Gantt chart widens into the room the sidebar left, and narrows again once the sidebar is opened."
      - key: 01a168ea-af3e-70b5-83b9-9802c4271166
        name: "With the sidebar folded, the rail gives the count of blocks that wait on the person."
      - key: 01a16901-3953-712b-afc6-44278c6402e4
        name: "In a window narrower than 860 pixels, the open sidebar lies over the Yard Log rather than beside it."
      - key: 01a16920-dde7-743a-aadb-655223112875
        name: "The page draws the sidebar again only when the list of Yard Logs, the Yard Log chosen or the sidebar's fold changes."
      - key: 01a1a7a4-51ce-73b8-bd34-87aa6730ba3d
        name: "The foot of the sidebar says whether the page is following Yard Log live."
  - key: 01a1a7a4-51ce-73b8-bd34-87abe528f508
    statement:
      form: ubiquitous
      system: "The page"
      shall: "show the views of the Yard Log shown as tabs in its head, beneath the line that sums up its stages, each with an icon and its name."
    criteria:
      - key: 01a1a7a4-51ce-73b8-bd34-87ac9b0845b5
        name: "The branch of the Yard Log shown is marked as the current entry of the sidebar."
      - key: 01a1a7a4-51ce-73b8-bd34-87ad97d9e616
        name: "Beneath the line that sums up the stages, the head holds the tabs Timeline, Gantt chart and Tokens, in that order."
      - key: 01a1a7a4-51ce-73b8-bd34-87ae5dc1386d
        name: "The tab of the view shown is marked as current, in ink and underlined in action blue."
      - key: 01a1a7a4-51ce-73b8-bd34-87af31f27e73
        name: "Choosing a view's tab shows that view of the Yard Log and keeps the stage chosen."
      - key: 01a1a7a4-51ce-73b8-bd34-87b0c01d27ce
        name: "The sidebar lists no view of any Yard Log."
  - key: 01a1a7a4-51ce-73b8-bd34-87b10883edd5
    statement:
      form: ubiquitous
      system: "The page"
      shall: "head the Yard Log shown with where it lies, its title and a line that sums up its stages."
    criteria:
      - key: 01a1a7a4-51ce-73b8-bd34-87b2bbf7a76d
        name: "Above the title, the head names the repository, the worktree where it is not the repository's main one, and the branch."
      - key: 01a1a7a4-51ce-73b8-bd34-87b3b38538ff
        name: "The head's title is Yard Log's title."
      - key: 01a1a7a4-51ce-73b8-bd34-87b4e2e9e2e4
        name: "Beneath the title, a line in muted text gives the count of the stages done, active and planned."
      - key: 01a1a7a4-51ce-73b8-bd34-87b7c99107b7
        name: "Hairlines, not borders, divide the head from the panes and the panes from each other."
  - key: 01a1a7a4-d31a-709a-8ee5-1f3a50e13e5f
    statement:
      form: ubiquitous
      system: "The page"
      shall: "set the controls of the view shown at the right of the Yard Log's head."
    criteria:
      - key: 01a1a7a4-51ce-73b8-bd34-87b54aac01b7
        name: "Each control of the head is labelled above it in small text."
      - key: 01a1a7a4-51ce-73b8-bd34-87b600deb823
        name: "The head stays in place, its controls in view, while the panes beneath it scroll."
  - key: 01a1646f-546d-7042-befd-eb22743f9709
    statement:
      form: ubiquitous
      system: "The page"
      shall: "list Yard Log of each branch of every tree the page server serves, grouped by repository, then by worktree and branch."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb2339a1f113
        name: "Each repository is named by the top of its main worktree."
      - key: 01a1660b-dd8a-760c-ade4-a7dfa7044f96
        name: "A repository's main worktree, whose folder is the repository's own, is named once, in the list and among what waits on the person."
      - key: 01a1646f-546d-7042-befd-eb24d506d9d2
        name: "Each listed branch shows its worktree, its name and its Yard Log's title."
      - key: 01a1646f-546d-7042-befd-eb25f7e1f2d7
        name: "Each listed branch gives the count of its Yard Log's blocks that wait on the person."
      - key: 01a1646f-546d-7042-befd-eb26bca8ff00
        name: "A branch whose Yard Log is closed is listed as closed."
      - key: 01a1646f-546d-7042-befd-eb2740b8a1ba
        name: "Choosing a listed branch opens its Yard Log at an address of its own, which names its tree and its branch."
      - key: 01a16827-8a6d-74e8-a5d2-6fa1ea625f7d
        name: "With Yard Logs listed and none chosen, the page asks the person to choose one from the list."
  - key: 01a16827-8a6d-74e8-a5d2-6fa2a20ebe40
    statement:
      form: state_driven
      while: "the page server serves no Yard Log"
      system: "the page"
      shall: "ask the person to start a session in an agent host with a Yard adapter on a branch of a git repository, and say that the agent's first write there opens the branch's Yard Log."
    criteria:
      - key: 01a16827-8a6d-74e8-a5d2-6fa3517630a4
        name: "With no Yard Log served, the page asks for a session rather than a choice from the list."
      - key: 01a16827-8a6d-74e8-a5d2-6fa4147c7a28
        name: "With no Yard Log served, the page links to installation instructions for agent adapters."
  - key: 01a1877b-6de6-72d5-a7d7-a99aeed2ab88
    statement:
      form: unwanted
      if: "the address the page opens names a tree that the page server does not serve"
      system: "the page"
      shall: "say, in place of the Yard Log, that the page server does not serve the tree and how to add it."
    criteria:
      - key: 01a1877b-6de6-72d5-a7d7-a99b2ec84e15
        name: "The page names the tree and says that no session has registered it with the page server."
      - key: 01a1877b-6de6-72d5-a7d7-a99cc522b333
        name: "The page names `loft yard serve --tree <tree>`, run on the machine, as the way to add the tree."
      - key: 01a1877b-6de6-72d5-a7d7-a99d4765ea18
        name: "The page does not say that the Yard Log's files cannot be read."
      - key: 01a1877b-6de6-72d5-a7d7-a99e4cab6125
        name: "Once the tree is added, the page shows its Yard Log without being reloaded."
  - key: 01a1649f-62ef-71e6-98de-e10df45e19aa
    statement:
      form: event_driven
      when: "a tree holds under `.yard/` Yard Log of a branch other than the one the tree is on, as one carried from the branch it was cut from"
      system: "the page"
      shall: "list that Yard Log as inherited under its repository, once whatever number of the repository's trees hold it, and offer it only to read."
    criteria:
      - key: 01a1649f-62ef-71e6-98de-e10e6e6ea6ed
        name: "Each tree lists only its current branch's Yard Log, and its repository lists the inherited ones in a fold of their own, marked as inherited."
      - key: 01a16920-dde7-743a-aadb-6553a3ec2a91
        name: "The fold of a repository's inherited Yard Logs gives their count, is folded unless the person opened it, and the person's choice is kept in the browser."
      - key: 01a16920-dde7-743a-aadb-655415977acf
        name: "The list the page server gives carries the count of each repository's inherited Yard Logs, and not the Yard Logs themselves."
      - key: 01a16920-dde7-743a-aadb-6555b77571c9
        name: "Opened, the fold lists the inherited Yard Logs 50 at a time, the one closed last first, or opened last where none is closed, with a button that lists 50 more."
      - key: 01a16920-dde7-743a-aadb-6556d72fc987
        name: "A filter in the fold lists only the inherited Yard Logs whose branch or title holds its text, whatever its case."
      - key: 01a16920-dde7-743a-aadb-65570f7e95f9
        name: "An inherited Yard Log that more than one of the repository's trees hold is listed once, and opens in the repository's main worktree where that holds it, or in the first tree that does."
      - key: 01a16929-b1e9-7640-a31f-7b683216bb79
        name: "A Yard Log of a branch that one of the repository's trees is on is listed under that tree, and not among the inherited ones."
      - key: 01a1649f-62ef-71e6-98de-e10f33cdae95
        name: "An inherited Yard Log's open questions, approvals and plans are shown and offer no answer or decision."
      - key: 01a1649f-62ef-71e6-98de-e1107c0ffed2
        name: "The page server takes no answer or decision for an inherited Yard Log."
      - key: 01a1649f-62ef-71e6-98de-e111af38463b
        name: "An inherited Yard Log adds nothing to the count of blocks that wait on the person."
  - key: 01a16920-dde7-743a-aadb-65582e39ed26
    statement:
      form: ubiquitous
      system: "The page server"
      shall: "read a Yard Log for the list of Yard Logs again only once its root file has changed."
    criteria:
      - key: 01a16920-dde7-743a-aadb-65591054d8f5
        name: "While a Yard Log's root file keeps its size and its time, its entry in the list is the one the page server last read."
      - key: 01a16920-dde7-743a-aadb-655a66b68f3f
        name: "Once a Yard Log's root file changes, in size or in time, the next list reads the Yard Log again."
      - key: 01a16920-dde7-743a-aadb-655b2c318095
        name: "The page server forgets what it read of a Yard Log that no tree it serves holds any more."
  - key: 01a1646f-546d-7042-befd-eb2848576856
    statement:
      form: ubiquitous
      system: "The page"
      shall: "show the stages of the branch's Yard Log as a list in their order beside a pane of the stage chosen, the list giving each stage's title, its status and the agent that owns it, and the pane the stage's goal and each of its blocks in full."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb2917150250
        name: "In the list, each `active` stage and the stage chosen are open to their blocks and every other stage is folded, unless the person chose otherwise."
      - key: 01a1646f-546d-7042-befd-eb2a277e3a0d
        name: "The person can fold each stage of the list to its row and open it to list its blocks, each by its kind and its title."
      - key: 01a1a7a4-51ce-73b8-bd34-87b8cfafd33f
        name: "When a Yard Log opens, the stage chosen is the one its address names, else the first `active` stage in the order shown, else the first stage."
      - key: 01a1a7a4-51ce-73b8-bd34-87b9f7849faa
        name: "Choosing a stage in the list shows it in the pane beside the list, with its goal, its status, the agent that owns it and each of its blocks."
      - key: 01a1a7a4-51ce-73b8-bd34-87ba54f4d783
        name: "Choosing a block in the list shows its stage in the pane and brings the block into view, marked as the block chosen."
      - key: 01a1a7a4-51ce-73b8-bd34-87bb23449244
        name: "The address names the stage and the block chosen, so that a reload or a link opens them again."
      - key: 01a1a7a4-51ce-73b8-bd34-87bce0e85c7f
        name: "The list and the pane beside it each scroll on their own."
      - key: 01a1a7a4-51ce-73b8-bd34-87bda9d6693e
        name: "A stage's row in the list gives the count of its blocks that wait on the person and the count of its blocks marked since the last visit."
      - key: 01a1a7a4-51ce-73b8-bd34-87be8a0c6fed
        name: "A splitter between the list and the pane sets the list's width, which is kept in the browser."
      - key: 01a1a7a4-51ce-73b8-bd34-87bf8fa0ae5e
        name: "The splitter is reached by the keyboard, and the arrow keys left and right narrow and widen the list."
      - key: 01a1646f-546d-7042-befd-eb2bf26cc683
        name: "A line marks where the `done` and `dropped` stages end and the `planned` ones begin."
      - key: 01a1646f-546d-7042-befd-eb2cf93edd47
        name: "Each status shows as a word as well as a colour."
      - key: 01a1646f-546d-7042-befd-eb2d6203081e
        name: "A stage owned by a subagent names the subagent's type."
      - key: 01a17f75-05dc-7361-a0cd-c0247d869c6b
        name: "The blocks within each stage retain Yard Log's stored order through mode grouping."
      - key: 01a17f75-05dc-7361-a0cd-c025788f6f99
        name: "Changing a block's current version leaves its timeline position unchanged."
  - key: 01a1a7cf-9eae-75c1-bbfd-bbd40af8fbc3
    statement:
      form: state_driven
      while: "the branch's Yard Log holds a single stage"
      system: "the page"
      shall: "list the stage's blocks as the list's rows in place of the stage, each drawn as a stage's row is drawn."
    criteria:
      - key: 01a1a7cf-9eae-75c1-bbfd-bbd5036bc56f
        name: "With one stage, the list holds a row for each of its blocks in their order, and no row for the stage."
      - key: 01a1a7cf-9eae-75c1-bbfd-bbd63a7b9af1
        name: "A block's row shows its title on its first line and, on its second, its kind and, where it has one, its state, as a dot and a word, as a stage's row shows its status."
      - key: 01a1a7cf-9eae-75c1-bbfd-bbd7159598d3
        name: "Choosing a block's row brings the block into view in the pane and marks it as the block chosen."
      - key: 01a1a7cf-9eae-75c1-bbfd-bbd82559a568
        name: "With more than one stage, the list holds a row for each stage, with the rows of its blocks beneath it."
  - key: 01a1690b-2c9b-7594-809f-4a8a666e8f7c
    statement:
      form: ubiquitous
      system: "The page"
      shall: "keep in the browser, for each Yard Log, each fold the person opened or closed and the Feature Group they opened in each spec-change view, and draw them so again after a change and after a reload."
    criteria:
      - key: 01a1690b-2c9b-7594-809f-4a8b682c03f5
        name: "A fold the person opened or closed, of a stage, of a block or of a Loft view, stays so when a change draws the page again."
      - key: 01a1690b-2c9b-7594-809f-4a8c73851ca5
        name: "A fold the person opened or closed stays so after a reload of the page."
      - key: 01a1690b-2c9b-7594-809f-4a8d7ad2d600
        name: "The Feature Group the person opened in a spec-change view is open again after a reload of the page."
      - key: 01a1690b-2c9b-7594-809f-4a8ed8751bc7
        name: "A stage the person folded or opened takes its default again once its status changes: open while active, folded otherwise."
      - key: 01a1690b-2c9b-7594-809f-4a8fd5152b89
        name: "The browser keeps a fold only while it differs from its default, and only while its block is in its Yard Log."
      - key: 01a1690b-2c9b-7594-809f-4a9086940336
        name: "The browser keeps the folds, the Feature Groups and the Gantt chart's scroll of the 30 Yard Logs opened last, and forgets those of the others."
  - key: 01a1646f-546d-7042-befd-eb2eef98b18f
    statement:
      form: ubiquitous
      system: "The page"
      shall: "offer the stages newest first or oldest first, newest first unless the person chose otherwise."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb2f03e5bd8d
        name: "The person's choice of order is kept in the browser."
      - key: 01a16984-aadb-7721-9995-4722a569ce6d
        name: "The switch of order lies among the controls of the page's head, and is shown only with the timeline."
      - key: 01a17f75-05dc-7361-a0cd-c0268b033931
        name: "Choosing newest first reverses stages without reversing the blocks within them."
  - key: 01a1646f-546d-7042-befd-eb3071ddc29b
    statement:
      form: optional
      where: "the session's activity holds stretches of the main agent's plan mode or spec mode"
      system: "the page"
      shall: "draw together, under a band that names the mode, the blocks of a stage that were written during one stretch of that mode."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb3184fc5769
        name: "The band names when the stretch started and how long it lasted, or that it goes on."
      - key: 01a1646f-546d-7042-befd-eb32c1f70c7e
        name: "A block counts as written during a stretch where its current version was written during it."
      - key: 01a1646f-546d-7042-befd-eb35c3a78477
        name: "A task counts as written during a stretch where it was listed during it."
      - key: 01a1646f-546d-7042-befd-eb3400bc25ff
        name: "A band of spec mode is told apart from a band of plan mode by its colour, its hatching and its label."
  - key: 01a17b28-85cd-71b5-8420-67ee22ffafa7
    statement:
      form: ubiquitous
      system: "The page"
      shall: "draw every plan under a Plan mode band, regardless of the agent's host or the native mode activity available."
    criteria:
      - key: 01a17b28-3826-7755-a564-ddfae0c6fd36
        name: "Every plan block is drawn under the same Plan mode band, regardless of its host or whether native mode activity was recorded."
      - key: 01a17b28-3826-7755-a564-ddfb45598062
        name: "A plan outside a recorded plan-mode stretch has a band from its current version's presentation until its decision, or marked as ongoing while undecided."
      - key: 01a17b28-c0f9-7056-82dd-76cfcc7c78cc
        name: "A band derived from a plan contains that plan alone."
      - key: 01a17b28-3826-7755-a564-ddfc714df647
        name: "A plan within a recorded plan-mode stretch uses that band's recorded times and is drawn once."
      - key: 01a17b28-3826-7755-a564-ddfd119e623a
        name: "A plan outside a recorded plan-mode stretch creates no native activity or Gantt duration."
  - key: 01a1646f-546d-7042-befd-eb36770e933e
    statement:
      form: ubiquitous
      system: "The page"
      shall: "draw each block by its kind, from its current version."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb37bdcb84e2
        name: "A note shows its title, its Markdown and its tone as a colour and a word."
      - key: 01a1646f-546d-7042-befd-eb38e626356c
        name: "A note written folded starts folded."
      - key: 01a169b5-e858-7099-9745-8598cc3dc66f
        name: "Every field that a block or a stage holds in Markdown is drawn as Markdown rendered by `loft`: a stage's goal, a question's context and each option's detail, a decision's consequence, a task's detail and a `loft` block's note, as well as the Markdown of a note, an approval and a plan."
      - key: 01a16854-53e3-71b2-8192-66b204b471a0
        name: "A table in a block's Markdown spans the width of its block, breaks no word within a cell, and scrolls sideways where it is wider than the block."
      - key: 01a1646f-546d-7042-befd-eb39ce7ffb3c
        name: "A question shows its prompt, its context and its options, with each recommended option marked."
      - key: 01a1646f-546d-7042-befd-eb3a326031ea
        name: "An answered question folds to its answer, with who gave it, when and on which channel."
      - key: 01a1646f-546d-7042-befd-eb3b26314975
        name: "An `approval` or a `plan` block shows its Markdown."
      - key: 01a16475-7fbd-7213-a7f7-927e63f98c39
        name: "Once decided, an `approval` or a `plan` block shows its outcome, with who decided it, when and on which channel."
  - key: 01a1a7e1-2b66-70b4-981e-7a91b0d53bdc
    statement:
      form: ubiquitous
      system: "The page"
      shall: "draw a question, in the timeline and in the panel of what waits alike, as a card headed by its header and its state, titled by its prompt, with its context beneath and its options as cards side by side."
    criteria:
      - key: 01a1a7e1-2b66-70b4-981e-7a921242b3f3
        name: "The head of a question gives its header in small monospace capitals and, at its right, its state: not chosen yet, the options chosen, or its answer."
      - key: 01a1a7e1-2b66-70b4-981e-7a9328745df3
        name: "A question's prompt is its title, and its context lies beneath it."
      - key: 01a1a823-8647-71dc-a940-bd041c4a1e74
        name: "A question's prompt is set as a block's title is, at 15 pixels and semibold."
      - key: 01a1a823-d964-77b1-8ed3-9bacdda8a798
        name: "A question's header chip, its state, its options' labels and its answer are no larger than 14 pixels."
      - key: 01a1a823-d964-77b1-8ed3-9bad6d86d0bd
        name: "Nothing in a question is bolder than semibold."
      - key: 01a1a7e1-2b66-70b4-981e-7a94b97d8ed1
        name: "Each option is a card of its own, lettered A, B, C and on in a circle before its label, with its detail beneath, and a recommended option is marked as recommended beneath its label."
      - key: 01a1a7e1-2b66-70b4-981e-7a95a684080d
        name: "The cards of the options stand side by side, at most three to a row, and one beneath another in a narrow window."
      - key: 01a1a7e1-2b66-70b4-981e-7a96621ff53a
        name: "The card of a chosen option is outlined in action blue."
      - key: 01a1a7e1-2b66-70b4-981e-7a9758c93481
        name: "In the timeline, a question's cards offer no control that chooses an option."
      - key: 01a1646f-546d-7042-befd-eb3c782601a4
        name: "A decision shows its number, its title and its consequence."
      - key: 01a1646f-546d-7042-befd-eb3dabdc81f0
        name: "A task shows its title and its state."
      - key: 01a16a04-3f8b-71a9-baa3-95e52d75699d
        name: "A task of the type `fix` shows a mark that names it a fix beside its state, and a task of the type `regular` shows none."
      - key: 01a1646f-546d-7042-befd-eb3eba30c3b0
        name: "Each block offers the agent that wrote its current version, its version number and its first version's time marked Created."
      - key: 01a17f75-05dc-7361-a0cd-c027e9f5c5a1
        name: "A block with more than one version shows its current version's time marked Updated, including when it shares the creation time to the second."
      - key: 01a1646f-546d-7042-befd-eb3f215b9440
        name: "A block with more than one version offers each earlier version, with who wrote it and when."
  - key: 01a1646f-546d-7042-befd-eb402c999dbd
    statement:
      form: optional
      where: "a decision names the question it settles"
      system: "the page"
      shall: "draw the decision in the question's card, at the head of it, and give the decision no card of its own."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb412239f4dd
        name: "The question's card is headed by the decision's number, its title and its consequence."
      - key: 01a1646f-546d-7042-befd-eb42abe3e622
        name: "Beneath the decision, the card gives the question's prompt and its answer, with who gave it, when and on which channel."
      - key: 01a1646f-546d-7042-befd-eb4303724eca
        name: "Opened, the card shows the question's context and each of its options, with each chosen option marked."
      - key: 01a1646f-546d-7042-befd-eb44bad677d3
        name: "Nothing of the decision is drawn where it was written."
      - key: 01a1646f-546d-7042-befd-eb4543622219
        name: "A question that more than one decision names is headed by each of them, in the order of their numbers."
  - key: 01a1646f-546d-7042-befd-eb46432a419f
    statement:
      form: ubiquitous
      system: "The page"
      shall: "show as text any HTML that a block's Markdown holds."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb47a12567f2
        name: "No element that a block's text names is created in the page."
  - key: 01a16838-8fdb-7127-a23e-c5588e3201c7
    statement:
      form: optional
      where: "a `loft` view names a node whose name holds Markdown"
      system: "the page"
      shall: "draw the name as Markdown rendered by `loft`, on one line."
    criteria:
      - key: 01a16838-8fdb-7127-a23e-c559b4afac18
        name: "A code span in a node's name is drawn as code."
      - key: 01a16838-8fdb-7127-a23e-c55ab6cc3d79
        name: "Any HTML that a node's name holds is shown as text."
      - key: 01a16838-8fdb-7127-a23e-c55bc6dabc5f
        name: "A name whose Markdown is more than one line of text is shown as its text."
      - key: 01a16844-c9d1-72df-8cfa-5cd7aa95dc74
        name: "Each slot of a Requirement's statement in an EARS form is drawn as Markdown, as a name is."
  - key: 01a16844-c9d1-72df-8cfa-5cd8fc1947f1
    statement:
      form: ubiquitous
      system: "The page"
      shall: "set each label a `loft` view gives in monospace before the name beside it, after a square in the colour of its node's kind."
    criteria:
      - key: 01a16844-c9d1-72df-8cfa-5cd9ccec0949
        name: "A label is drawn in monospace and muted text, apart from the name beside it, which keeps the page's ink."
      - key: 01a16844-c9d1-72df-8cfa-5cda23d83c08
        name: "A Product, a Feature Group, a Feature, a Requirement, a criterion, a Constraint, a Quality Attribute and a Component each have a square of their own colour before their label."
  - key: 01a1686f-4733-773b-b571-50bed5024ccb
    statement:
      form: optional
      where: "a code span of a block's Markdown, or of a name a `loft` view draws, holds only a colour written as `#` and three, four, six or eight hexadecimal digits"
      system: "the page"
      shall: "draw the code span on that colour, with its text in whichever of dark or white ink reads more clearly on it."
    criteria:
      - key: 01a1686f-4733-773b-b571-50bf0ed7f7e5
        name: "A code span holding `#62359c` is drawn on the colour `#62359c`."
      - key: 01a1686f-4733-773b-b571-50c06027a0c0
        name: "The text of an opaque colour's code span holds a contrast of at least 4.5 to 1 against that colour."
      - key: 01a1686f-4733-773b-b571-50c1d42366f8
        name: "A code span that holds more than a colour, and a colour within a fenced code block, keep the page's own code colours."
  - key: 01a1646f-546d-7042-befd-eb48685b6f13
    statement:
      form: optional
      where: "a block's Markdown holds a fenced code block marked `mermaid`"
      system: "the page"
      shall: "draw the code block as a diagram."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb49f9b1a9a6
        name: "A diagram that does not parse shows its source, with a line saying that it could not be drawn."
      - key: 01a1851a-2557-7721-ba02-488bef757a57
        name: "A diagram in a block that waits on the person is drawn in the panel of what waits, as it is in the timeline."
      - key: 01a1a7e1-2b67-777d-ab6f-d4bd4faa80d0
        name: "A diagram other than a flowchart of a block's Markdown is drawn by Mermaid in the page's design: square nodes on the sidebar's ground with hairline borders, its text in the page's face at 13 pixels in ink, and its edges in muted ink."
      - key: 01a1a7e1-2b67-777d-ab6f-d4be0079e32d
        name: "A group of a diagram drawn by Mermaid is framed by a hairline on the page's ground, and an edge's label lies on the page's ground."
  - key: 01a1a7ee-1770-7572-ab19-cf2e9d620206
    statement:
      form: optional
      where: "a block's Markdown holds a Mermaid flowchart"
      system: "the page"
      shall: "draw the flowchart itself, as Mermaid parses it and ELK's layered layout places it, in the page's design."
    criteria:
      - key: 01a1a7ee-1770-7572-ab19-cf2fb03c7189
        name: "Each node is a flat card with a hairline border on the sidebar's ground, square-cornered where it is a rectangle, its label in the page's face at 13 pixels in ink."
      - key: 01a1a7ee-1770-7572-ab19-cf3077c0957b
        name: "A node keeps its shape: a rectangle, a rounded rectangle, a stadium, a diamond or a circle."
      - key: 01a1a7ee-1770-7572-ab19-cf314156af4b
        name: "Each node is wide and tall enough for its label as measured in the page's face, so that no label is cut."
      - key: 01a1a7ee-1770-7572-ab19-cf32ceffe763
        name: "Each edge runs in horizontal and vertical segments that turn with rounded elbows, in muted ink, and ends in a small arrowhead where Mermaid's source gives it one."
      - key: 01a1a7ee-1770-7572-ab19-cf332567ff3f
        name: "A dotted edge is drawn dashed, and a thick edge is drawn thicker than a plain one."
      - key: 01a1a7ee-1770-7572-ab19-cf34ed11577a
        name: "An edge's label lies in a pill on the page's ground beside its edge."
      - key: 01a1a7ee-1770-7572-ab19-cf35dffbf659
        name: "A subgraph is a panel framed by a hairline on the page's ground, titled in small muted monospace capitals, holding its nodes."
      - key: 01a1a7ee-1770-7572-ab19-cf365df5311d
        name: "The flowchart keeps its direction: top to bottom, bottom to top, left to right or right to left."
      - key: 01a1a7ee-1770-7572-ab19-cf371ce2cf24
        name: "A node's own `style` or `classDef` keeps its fill, its stroke and its text colour."
      - key: 01a1a7ee-1770-7572-ab19-cf38e596f988
        name: "A change of the browser's scheme recolours a flowchart already drawn without laying it out again."
      - key: 01a1a814-5ac4-7523-9962-5ad7fadce012
        name: "A flowchart is drawn at its own size and never scaled down to fit its block: one wider than its block scrolls sideways within it, its text staying at 13 pixels."
      - key: 01a1a814-5ac4-7523-9962-5ad8e9672abc
        name: "Pointing at a node brings forward the node, its edges and the nodes they join, and fades the rest of the flowchart until the pointer leaves it."
  - key: 01a1646f-546d-7042-befd-eb4a816d5c07
    statement:
      form: state_driven
      while: "Yard Log is closed"
      system: "the page"
      shall: "show it as closed and offer nothing to answer or decide."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb4b0653b23d
        name: "The page shows when Yard Log was closed, and whether its merge closed it."
  - key: 01a16863-60a7-772b-980e-a0799595ed06
    statement:
      form: ubiquitous
      system: "The page"
      shall: "draw itself, its Gantt chart and its diagrams in the colour scheme the browser asks for, light or dark."
    criteria:
      - key: 01a16863-60a7-772b-980e-a07a7bb898ff
        name: "In a browser that asks for a dark scheme, the page, its Gantt chart and its diagrams are drawn in their dark colours."
      - key: 01a16863-60a7-772b-980e-a07b441c8e43
        name: "In a browser that asks for a light scheme, or for none, the page, its Gantt chart and its diagrams are drawn in their light colours."
      - key: 01a16863-60a7-772b-980e-a07c5f19ca60
        name: "Each colour the page gives text holds a contrast of at least 4.5 to 1 against each ground it is drawn on, in either scheme."
  - key: 01a16863-60a7-772b-980e-a07df2e896da
    statement:
      form: event_driven
      when: "the browser's colour scheme changes while the page is open"
      system: "the page"
      shall: "draw itself again in the new scheme, without a reload."
    criteria:
      - key: 01a16863-60a7-772b-980e-a07e6f0492af
        name: "The page's colours turn to the new scheme without a reload."
      - key: 01a16863-60a7-772b-980e-a07f74dd4ee6
        name: "Each diagram already drawn is drawn again in the new scheme's colours."
  - key: 01a1a7a4-51ce-73b8-bd34-87c021023032
    statement:
      form: ubiquitous
      system: "The page"
      shall: "set its text in Inter, and until Inter has loaded, in a face of the system's sized to Inter's widths and lines."
    criteria:
      - key: 01a1a7a4-51ce-73b8-bd34-87c1356d6448
        name: "A line of text takes the same width and height before Inter loads as after, within 2 percent."
      - key: 01a1a7a4-51ce-73b8-bd34-87c2b61fe307
        name: "The face that stands in for Inter is one the system holds, and the page loads nothing for it."
