key: 01a1646f-546d-7042-befd-eb4c63bd6b46
slug: follow-yard-log-live
name: "Follow Yard Log live"
body: "An open page keeps up with every agent and with answers given in Claude Code, so the person never reloads it. The page server learns of each change from the files, whoever wrote them, and tells open pages through server-sent events."
realizes:
  - 01a16469-559e-73c4-85f2-71a8fdbbeaf7
  - 01a16469-559e-73c4-85f2-71a94f0aa021
requirements:
  - key: 01a1646f-546d-7042-befd-eb4dd110e73c
    statement:
      form: state_driven
      while: "the page is open"
      system: "the page"
      shall: "show each change to the branch's Yard Log it shows, and to its list of branches, without a reload."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb4e1610e29f
        name: "A block that an agent writes shows within 2 seconds of the write."
      - key: 01a1646f-546d-7042-befd-eb4fcaf9fd4b
        name: "An answer given in Claude Code shows within 2 seconds."
      - key: 01a1646f-546d-7042-befd-eb5075712d1c
        name: "Yard Log opened for a branch of another tree the page server serves shows in the list within 2 seconds."
      - key: 01a1646f-546d-7042-befd-eb5140658694
        name: "A choice the person has made and not sent is kept through a change."
      - key: 01a16a56-43e1-75a2-a1aa-f93ebdcd0c78
        name: "Of two reads of Yard Log under way at once, the page shows the one it began last, whichever answers last."
  - key: 01a1646f-546d-7042-befd-eb5268fd5363
    statement:
      form: ubiquitous
      system: "The page server"
      shall: "follow the changes to the files of every branch's Yard Log it serves, whoever makes them."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb538ff1d6c4
        name: "A change written by a `loft yard` command reaches open pages."
      - key: 01a1646f-546d-7042-befd-eb542652e8d9
        name: "A change that git makes, such as a checkout of another branch or a merge, reaches open pages."
      - key: 01a16651-7f23-700e-b716-8dbcc1ebd2be
        name: "A change names each branch whose Yard Log it changed, and whether only its sessions' files changed, so that a page reads again only what it shows of them."
  - key: 01a16920-ad17-71b2-ad0b-ba327948808a
    statement:
      form: ubiquitous
      system: "The page server"
      shall: "look for changes at a cost that grows with the trees it serves and the files of their current branches' Yard Logs, not with every Yard Log those trees hold."
    criteria:
      - key: 01a16920-ad17-71b2-ad0b-ba33eaff36a2
        name: "Every half second, the page server looks only at each tree's `HEAD`, and at the folder and the files of the Yard Log of the tree's current branch."
      - key: 01a16920-ad17-71b2-ad0b-ba346fd0bb1b
        name: "Every 5 seconds, the page server looks for the Yard Logs each tree holds, and at the root file of each Yard Log other than the current branch's, and at no other file of it."
      - key: 01a16920-ad17-71b2-ad0b-ba35e925e0c4
        name: "In its search for Yard Logs, the page server goes no deeper into a folder that holds a Yard Log's root file."
      - key: 01a16920-ad17-71b2-ad0b-ba365356939e
        name: "A change to a Yard Log other than a tree's current branch's reaches open pages within 6 seconds."
