key: 01a1646f-546d-7042-befd-eb677bcc8418
slug: see-yard-log-as-a-gantt-chart
name: "See Yard Log as a Gantt chart"
body: "Beside the timeline, the page draws Yard Log as a Gantt chart along time, with a lane for each agent: each agent's stages with their tasks, the Loft runs and the waits on the person, and the agent's own work in the time between them, so that the person sees where the time of the work went and which agents worked side by side."
realizes:
  - 01a16469-559e-73c4-85f2-71a94f0aa021
requirements:
  - key: 01a1646f-546d-7042-befd-eb6807c3dd53
    statement:
      form: ubiquitous
      system: "The page"
      shall: "offer the timeline and the Gantt chart as two views of Yard Log, and remember in this browser the one chosen."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb69ef96a504
        name: "A switch beside the order of the stages chooses the timeline or the Gantt chart."
      - key: 01a1646f-546d-7042-befd-eb6a95402082
        name: "The view chosen is the one shown the next time the page opens in this browser."
      - key: 01a1646f-546d-7042-befd-eb6b4a34aab6
        name: "The Gantt chart follows Yard Log's changes as the timeline does."
      - key: 01a1646f-546d-7042-befd-eb6c59e28e31
        name: "While the Gantt chart is shown, the page takes the whole width of the window, and the chart is drawn again to the page's width as the window is resized."
  - key: 01a1646f-546d-7042-befd-eb6dd986a309
    statement:
      form: ubiquitous
      system: "The page"
      shall: "draw in the Gantt chart a lane for each agent that owned a stage, in the order the agents first started work."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb6eb970ce29
        name: "The main agent's lane comes first and names its session."
      - key: 01a1646f-546d-7042-befd-eb6f76ba9323
        name: "A subagent's lane names its type."
      - key: 01a1646f-546d-7042-befd-eb7012fbe6ee
        name: "Lanes that overlap in time are drawn one above the other, so that work done side by side shows as such."
  - key: 01a1646f-546d-7042-befd-eb71b01f691c
    statement:
      form: ubiquitous
      system: "The page"
      shall: "draw in each agent's lane its stages along time, with their tasks, their Loft runs, their waits on the person and their agent work."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb725ec431a5
        name: "Each stage is drawn from the time its work started to the time it ended, or to the start of its agent's next stage where no end was recorded."
      - key: 01a1646f-546d-7042-befd-eb7363cd4676
        name: "Each task is drawn under its stage, from the time it was listed to the time it ended, marked apart while it was listed and while it was active, and marked as done where it ended done."
      - key: 01a1646f-546d-7042-befd-eb74547e7a25
        name: "A task with no recorded times is drawn at the time its current version was written."
      - key: 01a1646f-546d-7042-befd-eb752ee05c31
        name: "Each shell command that ran Loft is drawn under the stage that its agent had active, named by its Loft subcommands, and each recorded Loft view is marked at the time it was recorded."
      - key: 01a1646f-546d-7042-befd-eb7684da415a
        name: "Each submission is drawn in its agent's lane from the time it was sent to its last answer or outcome."
      - key: 01a1646f-546d-7042-befd-eb7765e7bec9
        name: "Each stretch of a stage's time during a turn with no active task, no Loft run and no wait on the person is drawn as agent work."
      - key: 01a1646f-546d-7042-befd-eb78faca6f3a
        name: "Time outside the main agent's turns is idle, and an idle stretch longer than 45 seconds is folded to a fixed width that is labelled with its length."
      - key: 01a1646f-546d-7042-befd-eb79bfb93e3a
        name: "A bar above the chart divides the time not idle into active tasks, Loft runs, waits on the person and agent work, each with its length and its share."
      - key: 01a1646f-546d-7042-befd-eb7ae5af3ff4
        name: "Choosing a stage, a task or a submission in the Gantt chart opens the timeline at it."
  - key: 01a1646f-546d-7042-befd-eb7b30851fda
    statement:
      form: optional
      where: "the session's activity holds stretches of the main agent's plan mode"
      system: "the page"
      shall: "mark each stretch of plan mode across the Gantt chart."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb7c8d9f3725
        name: "Each stretch of plan mode is drawn as a band across every lane of the chart, from the time it started to the time it ended, or to now where it has not ended."
      - key: 01a1646f-546d-7042-befd-eb7d31ce0c2d
        name: "Each band is labelled as plan mode, with its length."
  - key: 01a1646f-546d-7042-befd-eb7e81779f4d
    statement:
      form: optional
      where: "the session's activity holds stretches of the main agent's spec mode"
      system: "the page"
      shall: "mark each stretch of spec mode across the Gantt chart, apart from plan mode by its colour and its hatching."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb7fd8a33165
        name: "Each stretch of spec mode is drawn as a hatched band across every lane of the chart, from the time it started to the time it ended, or to now where it has not ended."
      - key: 01a1646f-546d-7042-befd-eb80ccffb25f
        name: "Each band of spec mode is labelled as spec mode, with its length."
