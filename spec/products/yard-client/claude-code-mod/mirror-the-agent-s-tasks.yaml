key: 01a1646f-546c-7521-9643-bc52a38e2bbd
slug: mirror-the-agent-s-tasks
name: "Mirror the agent's tasks"
body: "An agent's own task list shows in Yard Log as `task` blocks, so that progress through a stage shows without extra writes. Each agent's tasks go to the stage active for that agent, so that parallel subagents each fill their own stage."
realizes:
  - 01a16469-559e-73c4-85f2-71afd78c6e3e
requirements:
  - key: 01a1646f-546c-7521-9643-bc53d8dcb801
    statement:
      form: event_driven
      when: "an agent creates a task with `TaskCreate`"
      system: "the Loft mod"
      shall: "write it as a `task` block of the stage active for that agent."
    criteria:
      - key: 01a1646f-546c-7521-9643-bc54b796807b
        name: "The block's id is made from the task's id and the agent, the session for the main agent, so that each later update finds it and a session started after `/clear` writes blocks of its own."
      - key: 01a165f5-4587-7632-89a7-b4db5092dc0c
        name: "The mod reads Yard Log to mirror a task with `loft yard read` without `--mark-read`, which leaves the revision the agent last read as it was."
      - key: 01a1646f-546c-7521-9643-bc550810c75a
        name: "The block's title is the task's subject."
      - key: 01a17f75-05db-72d1-b940-2d49f24fff4a
        name: "The task belongs to the stage selected before its native creation runs, even if another caller changes Yard Log while the native creation runs."
      - key: 01a1646f-546c-7521-9643-bc56c4873439
        name: "Where no stage is active for the agent, the task is not mirrored."
      - key: 01a16a04-3f8b-71a9-baa3-95dcb14f98d9
        name: "A task created with the type `fix` in its metadata is written as a task of the type `fix`."
      - key: 01a16a04-3f8b-71a9-baa3-95dd701e7321
        name: "A task created with no type in its metadata, or with a type the mod does not know, is written as a task of the type `regular`."
  - key: 01a1646f-546c-7521-9643-bc57992eec69
    statement:
      form: event_driven
      when: "an agent changes a task with `TaskUpdate`"
      system: "the Loft mod"
      shall: "set the `task` block's state and type to match the task's."
    criteria:
      - key: 01a1646f-546c-7521-9643-bc582c1c94a2
        name: "The states `pending`, `in_progress`, `completed` and `deleted` become `open`, `active`, `done` and `dropped`."
      - key: 01a1646f-546c-7521-9643-bc59de3d65ed
        name: "A changed subject becomes the block's new title."
      - key: 01a16a04-3f8b-71a9-baa3-95de591588b3
        name: "A type of `fix` or `regular` in the update's metadata becomes the block's type."
      - key: 01a16a04-3f8b-71a9-baa3-95dfe4529c42
        name: "A type set to `null` in the update's metadata makes the block's type `regular`."
      - key: 01a16a04-3f8b-71a9-baa3-95e0a38355ed
        name: "The block keeps its type and its detail where the update does not change them."
  - key: 01a17f75-05db-72d1-b940-2d4ade336dc2
    statement:
      form: event_driven
      when: "the Loft mod receives task, question, plan or Yard tool calls from one caller"
      system: "the Loft mod"
      shall: "capture their Yard operations in hook receipt order for that caller."
    criteria:
      - key: 01a17f75-05db-72d1-b940-2d4b9e8362e2
        name: "A task call returns its native result only after its mirror has been attempted."
      - key: 01a17f75-05db-72d1-b940-2d4cc0da493d
        name: "A later question, plan or Yard tool call cannot overtake an earlier task's capture."
      - key: 01a17f75-05db-72d1-b940-2d4dcee25ee7
        name: "Waiting for the person to answer a question or decide a plan leaves later capture operations free to run."
      - key: 01a17f75-05db-72d1-b940-2d4e46dd6aee
        name: "A failed capture preserves the native task's result."
      - key: 01a17f75-05db-72d1-b940-2d4f11bf8cd7
        name: "A failed capture leaves the next capture able to run."
      - key: 01a17f75-05db-72d1-b940-2d50f245d266
        name: "A caller whose capture is delayed leaves another caller's capture free to run."
