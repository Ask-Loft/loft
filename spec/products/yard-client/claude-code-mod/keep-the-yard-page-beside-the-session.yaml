key: 01a1d06f-b09f-73ae-a356-c4a2c667cf12
slug: keep-the-yard-page-beside-the-session
name: "Keep the Yard page beside the session"
body: |
  The Yard page shows Yard Log in full: its timeline, its Gantt chart, the tokens and what the agents consulted, each block as the page draws it. In Claude Code Desktop, `/yard-pane` opens that page itself in Desktop's browser pane, beside the chat, so the person sees every view of it as it is rather than a lesser copy.

  The pane does not draw the page again. It is the page's companion inside Claude Code, on every surface: where the work stands, what waits on the person, and their answers, taken there. On a surface with no browser pane the mod can reach, the pane links the page.

  No mod can tell whether a surface is drawn light or dark, and Claude Code Desktop may be light while the terminal is dark, so the pane's text, lines and grounds take Claude Code's own colours, which each surface resolves to its own appearance, and the page's hues mark status alone, in shades that read on either.
realizes:
  - 01a16469-559e-73c4-85f2-71a609a6b01d
  - 01a16469-559e-73c4-85f2-71afd78c6e3e
requirements:
  - key: 01a1d0cd-6916-731d-8a40-08488f9916da
    statement:
      form: event_driven
      when: "the person runs the command `/yard-pane` in Claude Code Desktop"
      system: "the Loft mod"
      shall: "open the Yard page at the session's working tree and branch in Desktop's browser pane."
    criteria:
      - key: 01a1d0cd-6916-731d-8a40-08498c802b8a
        name: "The page opens at the session's working tree and its branch."
      - key: 01a1d0cd-6916-731d-8a40-084a8c2d8ba2
        name: "Where Desktop's browser pane already shows the Yard page, the command shows that tab and opens no other."
  - key: 01a1d0cd-6916-731d-8a40-084bb373f72c
    statement:
      form: optional
      where: "the surface that draws the pane has no browser pane the Loft mod can reach"
      system: "the pane"
      shall: "link the Yard page at the session's working tree and branch."
    criteria:
      - key: 01a1d0cd-6916-731d-8a40-084c16280236
        name: "The terminal, VS Code and the mobile app show the link in the pane's head."
      - key: 01a1d0cd-6916-731d-8a40-084d1b67a9cf
        name: "In Claude Code Desktop, where the browser pane cannot be reached, the pane shows the link and says the browser pane could not be reached."
  - key: 01a1cfe2-478e-75d1-b104-04df60256262
    statement:
      form: ubiquitous
      system: "The pane"
      shall: "head Yard Log with its tree, its branch and a line that sums up its stages."
    criteria:
      - key: 01a1cfe2-478e-75d1-b104-04e08deef20b
        name: "The head shows the tree's name above the branch's name, which is set larger."
      - key: 01a1d06f-b09f-73ae-a356-c4a36c12e63f
        name: "The head's line counts the stages by status, as `3 stages: 2 done, 1 active, 0 planned`."
      - key: 01a1d06f-b09f-73ae-a356-c4a40bdf34c9
        name: "Where blocks wait on the person, the head counts them, as `3 wait on you`, in the waiting colour."
      - key: 01a1cfe2-478e-75d1-b104-04f4e90e6960
        name: "Where no block waits on the person, the head shows no such count."
  - key: 01a1d0cd-6916-731d-8a40-084e96e1d9e6
    statement:
      form: ubiquitous
      system: "The pane"
      shall: "show the stage in hand, with the tasks in hand in it."
    criteria:
      - key: 01a1d0cd-6916-731d-8a40-084f2599c3d8
        name: "The pane shows the first `active` stage's title, the agent that owns it and its goal."
      - key: 01a1d0cd-6916-731d-8a40-0850fe52458a
        name: "Each `active` task of that stage shows with its title, a task of the type `fix` marked `Fix`."
      - key: 01a1d0cd-6916-731d-8a40-08511dccb80f
        name: "Where no stage is `active`, the pane says so."
  - key: 01a1cfe2-478e-75d1-b104-04f05a5573bc
    statement:
      form: state_driven
      while: "blocks of an open submission wait on the person"
      system: "the pane"
      shall: "show each of them ready to answer or decide."
    criteria:
      - key: 01a1d0cd-6916-731d-8a40-085200c14980
        name: "The blocks show the oldest submission first, each submission's blocks in its own order."
      - key: 01a1d06f-b09f-73ae-a356-c4aecdbe19d5
        name: "The card of a block that waits on the person is outlined in the waiting colour, with a bar of it at its left."
      - key: 01a1cfe2-478e-75d1-b104-04f1651155ff
        name: "A question shows its prompt, its context drawn as Markdown, and each option as a card lettered A, B, C and on, with its label and its detail."
      - key: 01a1cfe2-478e-75d1-b104-04f2f2c33b76
        name: "The option a question recommends is marked `Recommended` on its card."
      - key: 01a1d06f-b09f-73ae-a356-c4b42fb55400
        name: "A question's lettered option cards choose its options, and a field beneath them takes the person's own words."
      - key: 01a1cfe2-478e-75d1-b104-04f3892200ab
        name: "An approval or a plan shows its title and its Markdown, drawn as Markdown, with `Approve` and `Reject`."
  - key: 01a1d06f-b09f-73ae-a356-c4c03b6582b0
    statement:
      form: ubiquitous
      system: "The pane"
      shall: "draw its text, its lines and its grounds in the colours of the surface that draws it, and mark status in the Yard page's hues."
    criteria:
      - key: 01a1d06f-b09f-73ae-a356-c4c150ee429d
        name: "Text, muted text and lines take Claude Code's own colours, which each surface draws in its own light or dark appearance."
      - key: 01a1d06f-b09f-73ae-a356-c4c236afe1c5
        name: "Each colour that marks status is a shade that reads on a light ground and on a dark one."
      - key: 01a1d06f-b09f-73ae-a356-c4c3dc81b156
        name: "Done is drawn teal, active blue, what waits on the person rust and a fix rose, as on the page."
