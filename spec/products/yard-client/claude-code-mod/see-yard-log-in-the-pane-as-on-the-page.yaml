key: 01a1d06f-b09f-73ae-a356-c4a2c667cf12
slug: see-yard-log-in-the-pane-as-on-the-page
name: "See Yard Log in the pane as on the Yard page"
body: |
  The pane draws Yard Log as the Yard page does, so that a person who knows the page knows the pane: the same head, the same tabs, the stages on a rail beside the stage chosen, each block a card of its kind, the options of a question as lettered cards, what waits on the person in the page's rust, and a Gantt chart of the stages along time, in the page's own colours.

  It draws with Claude Code's own elements, which each surface paints natively, so the page's typeface and its hatched bands are not carried over. Nor are what only the page server knows, which `loft yard read` does not give: the tokens, what the agents consulted, the stretches of plan and spec mode, the marks of what changed since the last visit and the lanes of each session's activity. The page's list of trees and branches, its order of the stages and the earlier versions of a block stay on the page.
realizes:
  - 01a16469-559e-73c4-85f2-71a609a6b01d
  - 01a16469-559e-73c4-85f2-71afd78c6e3e
requirements:
  - key: 01a1cfe2-478e-75d1-b104-04df60256262
    statement:
      form: ubiquitous
      system: "The pane"
      shall: "head Yard Log as the Yard page heads it, with the tabs of its views beneath."
    criteria:
      - key: 01a1cfe2-478e-75d1-b104-04e08deef20b
        name: "The head shows the tree's name above the branch's name, which is set larger, and links the Yard page at the branch."
      - key: 01a1d06f-b09f-73ae-a356-c4a36c12e63f
        name: "The head's line counts the stages by status, as `3 stages: 2 done, 1 active, 0 planned`."
      - key: 01a1d06f-b09f-73ae-a356-c4a40bdf34c9
        name: "Where blocks wait on the person, the head shows a button that counts them, as `3 wait on you`, in the waiting colour."
      - key: 01a1cfe2-478e-75d1-b104-04f4e90e6960
        name: "Where no block waits on the person, the head shows no such button."
      - key: 01a1d06f-b09f-73ae-a356-c4a55773bdf0
        name: "The tabs `Timeline` and `Gantt chart` choose the view shown, and the tab of the view shown is marked."
  - key: 01a1d06f-b09f-73ae-a356-c4a62ab3dd38
    statement:
      form: ubiquitous
      system: "The pane's timeline"
      shall: "list the stages on a rail, in their order, and show the stage chosen in full."
    criteria:
      - key: 01a1cfe2-478e-75d1-b104-04e15b4516b0
        name: "Each stage's row shows a square in its status's colour, its title, its status as a word in that colour, the agent that owns it and the count of its blocks that wait on the person."
      - key: 01a1d06f-b09f-73ae-a356-c4a7e16b453e
        name: "A line with the words `Planned from here on` marks where the planned stages begin."
      - key: 01a1cfe2-478e-75d1-b104-04e7839a3e69
        name: "A stage's row opens to a row for each of its blocks, with the block's kind and state, and folds again, as the person chooses."
      - key: 01a1cfe2-478e-75d1-b104-04e8ffb8d768
        name: "The row of the stage chosen is open and marked, and the others are folded until the person opens one."
      - key: 01a1d06f-b09f-73ae-a356-c4a8b44b6eec
        name: "The stage chosen is the one the person chose last, else the first `active` stage, else the first stage."
      - key: 01a1d06f-b09f-73ae-a356-c4a9e6f022c1
        name: "The stage chosen shows its status, the agent that owns it, its count of blocks, its title, its goal and when it started, then each of its blocks as a card."
      - key: 01a1d06f-b09f-73ae-a356-c4aa2a04584e
        name: "Where the pane's body is at least 100 columns wide, the rail and the stage chosen stand side by side."
      - key: 01a1d06f-b09f-73ae-a356-c4ab4bffa5d7
        name: "Where the pane's body is narrower than 100 columns, the stage chosen stands under the rail."
  - key: 01a1d06f-b09f-73ae-a356-c4ac0eafc588
    statement:
      form: ubiquitous
      system: "The pane"
      shall: "draw each block as a card of its kind, as the Yard page draws it."
    criteria:
      - key: 01a1d06f-b09f-73ae-a356-c4adb658297a
        name: "A card's head names the block's kind, a question's header as a chip, and the block's state at the right."
      - key: 01a1d06f-b09f-73ae-a356-c4aecdbe19d5
        name: "The card of a block that waits on the person stands on the waiting ground, with a bar of the waiting colour at its left, and ends with `This waits on you`."
      - key: 01a1cfe2-478e-75d1-b104-04f1651155ff
        name: "A question shows its prompt, its context drawn as Markdown, and each option as a card lettered A, B, C and on, with its label and its detail."
      - key: 01a1cfe2-478e-75d1-b104-04f2f2c33b76
        name: "The option a question recommends is marked `Recommended` on its card."
      - key: 01a1d06f-b09f-73ae-a356-c4afef09bc37
        name: "An answered question shows the options chosen and the person's own words."
      - key: 01a1cfe2-478e-75d1-b104-04f3892200ab
        name: "An approval or a plan shows its title and its Markdown, drawn as Markdown, and once decided, `Approved`, or `Rejected` with the reason."
      - key: 01a1cfe2-478e-75d1-b104-04e29d44498e
        name: "A task shows its title and its state."
      - key: 01a1cfe2-478e-75d1-b104-04e31b6ae5ad
        name: "A task of the type `fix` is marked `Fix`."
      - key: 01a1cfe2-478e-75d1-b104-04e4f43589f1
        name: "A note shows its title and its Markdown, drawn as Markdown."
      - key: 01a1cfe2-478e-75d1-b104-04e5b757bd92
        name: "A decision shows its title and its consequence."
      - key: 01a1cfe2-478e-75d1-b104-04e66ffb3c99
        name: "A `loft` block names its view in words, such as `Spec change`, and shows its note, and no report."
      - key: 01a1d06f-b09f-73ae-a356-c4b099278c41
        name: "A card's foot names the agent that wrote the block, its version, and when it was created and last updated."
  - key: 01a1cfe2-478e-75d1-b104-04f05a5573bc
    statement:
      form: event_driven
      when: "the person presses the button that counts what waits on them"
      system: "the pane"
      shall: "show what waits on the person, the oldest submission first, each block ready to answer or decide."
    criteria:
      - key: 01a1d06f-b09f-73ae-a356-c4b1a45edf1e
        name: "Pressing `Answer it` or `Decide it` on a waiting card shows what waits, at that block."
      - key: 01a1d06f-b09f-73ae-a356-c4b2a44a0b62
        name: "What waits shows by itself when a submission arrives that the pane has not shown."
      - key: 01a1d06f-b09f-73ae-a356-c4b36fdce731
        name: "Once nothing waits on the person, the pane shows again the view it showed before."
      - key: 01a1d06f-b09f-73ae-a356-c4b42fb55400
        name: "A question's lettered option cards choose its options, and a field beneath them takes the person's own words."
  - key: 01a1d06f-b09f-73ae-a356-c4b5e7700fea
    statement:
      form: ubiquitous
      system: "The pane's Gantt chart"
      shall: "draw the stages, their tasks and the waits on the person along time."
    criteria:
      - key: 01a1d06f-b09f-73ae-a356-c4b61dc50199
        name: "Each stage is a row whose bar runs from when the stage started to when it ended, or to now while it is not ended."
      - key: 01a1d06f-b09f-73ae-a356-c4b7742f2242
        name: "Each task is a row beneath its stage, whose bar runs from when its work started to when it ended, a fix in the fix colour."
      - key: 01a1d06f-b09f-73ae-a356-c4b895904f7d
        name: "Each wait on the person lies on its stage's bar, from when its submission was sent to when its last block was answered, or to now."
      - key: 01a1d06f-b09f-73ae-a356-c4b9c7dc861a
        name: "A time axis above the rows marks the times along the chart."
      - key: 01a1d06f-b09f-73ae-a356-c4ba008e06ce
        name: "Choosing a stage in the chart shows it, chosen, in the timeline."
  - key: 01a1d06f-b09f-73ae-a356-c4bb3c306100
    statement:
      form: optional
      where: "the surface that draws the pane draws SVG"
      system: "the pane's Gantt chart"
      shall: "be one SVG image, with a text alternative that names each stage and how long it ran."
    criteria:
      - key: 01a1d06f-b09f-73ae-a356-c4bc44c83836
        name: "Claude Code Desktop, VS Code and the mobile app draw the chart as an SVG image."
      - key: 01a1d06f-b09f-73ae-a356-c4bd3e13dbd8
        name: "The image's text alternative names each stage and how long it ran."
  - key: 01a1d06f-b09f-73ae-a356-c4be9f195514
    statement:
      form: optional
      where: "the surface that draws the pane draws no SVG, as the terminal"
      system: "the pane's Gantt chart"
      shall: "draw each row as a bar of block characters along the pane's width."
    criteria:
      - key: 01a1d06f-b09f-73ae-a356-c4bf8898cc5b
        name: "Each row's bar starts and ends at the columns of its times along the chart."
  - key: 01a1d06f-b09f-73ae-a356-c4c03b6582b0
    statement:
      form: ubiquitous
      system: "The pane"
      shall: "wear the Yard page's colours, light or dark as Claude Code's theme is."
    criteria:
      - key: 01a1d06f-b09f-73ae-a356-c4c150ee429d
        name: "Under a light theme, the pane's colours are the Yard page's light tokens."
      - key: 01a1d06f-b09f-73ae-a356-c4c236afe1c5
        name: "Under a dark theme, the pane's colours are the Yard page's dark tokens."
      - key: 01a1d06f-b09f-73ae-a356-c4c3dc81b156
        name: "Done is drawn teal, active blue, what waits on the person rust and a fix rose, as on the page."
