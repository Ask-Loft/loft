key: 01a1646f-546d-7042-befd-eaefec18d7c5
slug: keep-a-session-s-activity
name: "Keep a session's activity"
body: |
  Beside its token totals, each session keeps in Yard Log's folder when its agents' turns ran, when the main agent was in plan mode or writing the specification, and when the shell ran `loft`, so that the page can tell the time agents worked from the time nobody did, on any machine that reads the branch. The page server keeps the file's live copy in git's directory for the worktree as the session's events arrive, each write of Yard Log saves it into Yard Log's folder, and the agent commits it with its work.

  A subagent's run is kept with the stage it worked for: the stage active for its session's main agent as the run started. A shell command that runs `loft` is kept with the stage it counted toward, as a request is counted (the Feature "Count the tokens Yard Log took").

  Plan mode and spec mode are heard for the main agent only: a subagent's own permission mode and edits under `spec/` are not kept as stretches of either.

  ```text
  .yard/<branch>/activity/<session id>.yaml
  ```
realizes:
  - 01a16469-559e-73c4-85f2-71a8fdbbeaf7
  - 01a16469-559e-73c4-85f2-71b305365c69
requirements:
  - key: 01a1646f-546d-7042-befd-eaf0e5633e7e
    statement:
      form: event_driven
      when: "the page server records an event of a session whose agent's branch has its Yard Log open"
      system: "the page server"
      shall: "keep in the session's activity file each turn, each stretch of the main agent's plan mode and of its spec mode, and each shell command that runs `loft`, with when it started and when it ended."
    criteria:
      - key: 01a1646f-546d-7042-befd-eaf19ca8018b
        name: "A session's activity file is `activity/<session id>.yaml` in Yard Log's folder."
      - key: 01a1652c-8a87-75c3-a415-c00b3be4bc74
        name: "The activity file holds the session's id, its host and the time its last kept event ended."
      - key: 01a182b6-3c58-7235-ad04-392a7e9e9217
        name: "An activity file that names no host is read as a Claude Code session's, and the page is given its host."
      - key: 01a1646f-546d-7042-befd-eaf221179a3a
        name: "Each of the main agent's turns is kept with the time it started and the time it ended."
      - key: 01a1646f-546d-7042-befd-eaf39c9c8fa0
        name: "Each subagent's run is kept with its agent id, its type, the time it started and the time it ended."
      - key: 01a16995-313c-7343-8413-b55299748fdd
        name: "Each subagent's run is kept with its unambiguous delegated-task stage context as the run started, or with its session's main agent's active stage where no delegated-task context exists."
      - key: 01a1646f-546d-7042-befd-eaf4217a481b
        name: "A turn already under way when Yard Log opened is kept from the session's first recorded event."
      - key: 01a1646f-546d-7042-befd-eaf5bc56ffef
        name: "Each stretch of the main agent's plan mode is kept with the time it started and the time it ended."
      - key: 01a1646f-546d-7042-befd-eaf6e893accc
        name: "Each stretch of the main agent's spec mode is kept from its first edit of a file under `spec/` to its next edit of another file, the start of its plan mode, or the end of its turn."
      - key: 01a1646f-546d-7042-befd-eaf743bef7f9
        name: "Each shell command that runs `loft` is kept with the names of its `loft` subcommands, the agent that ran it, the time it started and ended, whether it failed, and the stage it counted toward."
      - key: 01a1646f-546d-7042-befd-eaf8581e4986
        name: "An event that starts or ends no turn, no subagent run, no stretch of plan or spec mode and no `loft` run leaves the file as it was."
      - key: 01a1646f-546d-7042-befd-eaf9e32fc612
        name: "Writing the activity file leaves Yard Log's revision as it was."
      - key: 01a1649f-62ef-71e6-98de-e10ba2181638
        name: "The activity file's live copy is written to a temporary file in git's directory for the worktree and renamed into place, outside Yard Log's lock."
      - key: 01a1649f-62ef-71e6-98de-e10c9467d774
        name: "No event is kept in the activity file once Yard Log is closed."
      - key: 01a1646f-546d-7042-befd-eafae23372c6
        name: "No other session's activity file is written for the session's events."
  - key: 01a21ab4-1b40-722d-a2f1-edda3118da28
    statement:
      form: event_driven
      when: "the person approves, on the page or in the terminal, a plan that a session's main agent presented in plan mode"
      system: "the page server"
      shall: "end that session's stretch of plan mode at the time of the approval, by an event of the session's main agent kept in its event log."
    criteria:
      - key: 01a21ab4-1b40-722d-a2f1-eddb67395023
        name: "A plan approved on the page ends its session's stretch of plan mode while the session's hooks still name the mode `plan`."
      - key: 01a21ab4-1b40-722d-a2f1-eddc5528b2e1
        name: "A plan approved in the terminal ends its session's stretch of plan mode."
      - key: 01a21ab4-1b40-722d-a2f1-eddd22f0b0ca
        name: "A rejected plan leaves its session's stretch of plan mode going on."
      - key: 01a21ab4-1b40-722d-a2f1-edde5c4d7cc6
        name: "A plan that a subagent presented ends no stretch of plan mode."
      - key: 01a21ab4-1b40-722d-a2f1-eddf0231230f
        name: "A plan presented outside plan mode ends no stretch of plan mode."
      - key: 01a21ab4-1b40-722d-a2f1-ede02e7314fe
        name: "A hook that still names the mode `plan` after the approval starts no new stretch of plan mode."
      - key: 01a21ab4-1b40-722d-a2f1-ede10a699b91
        name: "A page server that rebuilds the session's activity from its event log ends the stretch at the time of the approval."
      - key: 01a21ac6-1872-7517-9002-aaa10deb896a
        name: "A plan approved after its session was continued by `/clear` or a resume also ends the stretch of plan mode of the latest session that continues it."
      - key: 01a21ac6-1872-7517-9002-aaa2b2db3109
        name: "The approval's event names the person as who made it, with `by` set to `person`."
      - key: 01a21ac6-1872-7517-9002-aaa3061378a0
        name: "An event the person made is not taken as a sign that its session is live."
      - key: 01a21ac6-1872-7517-9002-aaa49731d775
        name: "An event the person made leaves the directory kept as where its session's main agent works as it was."
      - key: 01a21ac6-1872-7517-9002-aaa50d9abef4
        name: "An event the person made that is the first heard of its session in a Yard Log starts no turn."
