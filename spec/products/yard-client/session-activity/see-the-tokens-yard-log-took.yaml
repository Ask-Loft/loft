key: 01a1646f-546d-7042-befd-eb166bb457fe
slug: see-the-tokens-yard-log-took
name: "See the tokens Yard Log took"
body: "The page shows what Yard Log's sessions spent in tokens, summed over every totals file in Yard Log's folder, whichever machine wrote it, and broken down the ways a person asks of it: by stage, by session, by agent and model, and by the waits on the person."
realizes:
  - 01a16469-559e-73c4-85f2-71a94f0aa021
requirements:
  - key: 01a1646f-546d-7042-befd-eb17b49846d6
    statement:
      form: ubiquitous
      system: "The page"
      shall: "show Yard Log's input, cache read, cache write and output tokens, in all and broken down by stage, by session, by agent and model, and by submission."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb18be1fe4d9
        name: "The page shows the four counts in all, summed over every totals file of Yard Log."
      - key: 01a1646f-546d-7042-befd-eb19fd65c436
        name: "The page shows beside each stage the four counts of the requests counted toward it, and the counts of those under no stage apart."
      - key: 01a16995-313c-7343-8413-b553db01c09c
        name: "Beside a stage that subagents' requests counted toward, the page shows the four counts of each type of subagent within the stage's counts."
      - key: 01a1646f-546d-7042-befd-eb1a9003423c
        name: "The page lists each session that worked on Yard Log, with when its first and last counted requests ended and its four counts."
      - key: 01a1646f-546d-7042-befd-eb1b42b4a475
        name: "The page shows the four counts of the main agent and of each type of subagent, for each model they ran on."
      - key: 01a1646f-546d-7042-befd-eb1c9a6d4d36
        name: "The page shows with each submission the four counts of the requests that ended while it was open."
      - key: 01a1682e-2675-75b2-871c-e260967a6cf8
        name: "The breakdowns share one table, whose columns are the four counts."
      - key: 01a1682e-2675-75b2-871c-e2613eb8729b
        name: "Each measured breakdown count has a bar showing its share of Yard Log's recorded subtotal for that counter, including when token accounting is partial."
      - key: 01a17a6d-c247-738d-ac55-ded98716c59e
        name: "Each displayed token percentage describes a share of recorded usage."
      - key: 01a1a7cf-9eae-75c1-bbfd-bbd173b1e084
        name: "The four totals are drawn as figures in proportional digits, and each count of the table is right-aligned in digits of one width, so that the counts of a column line up."
      - key: 01a1a7cf-9eae-75c1-bbfd-bbd28581c045
        name: "Each share bar is drawn in one hue, thin, with a rounded end, on a track of a lighter step of that hue, and names its count and share when pointed at."
      - key: 01a1646f-546d-7042-befd-eb1d0e18125d
        name: "The page explains that requests an agent host makes inside its own tools may be outside the reported usage."
      - key: 01a1646f-546d-7042-befd-eb1e1e831c2e
        name: "Where Yard Log has no counted request, the page shows that no tokens have been counted yet."
  - key: 01a18002-11df-7502-aae7-e830cb39ad31
    statement:
      form: ubiquitous
      system: "The page"
      shall: "show the tokens' summary, the table of their breakdowns, the reporting coverage and the explanatory note together, with no fold."
    criteria:
      - key: 01a18002-11df-7502-aae7-e833332abdbc
        name: "The breakdown table, the reporting coverage and the explanatory note show beneath the summary without being opened."
      - key: 01a1a7cf-9eae-75c1-bbfd-bbd393684ee0
        name: "The tokens view offers no control that folds or opens its details."
      - key: 01a18002-11df-7502-aae7-e837eeed49fc
        name: "With no counted request, the summary says that no tokens have been counted yet, and no table is shown."
  - key: 01a1646f-546d-7042-befd-eb1fa3e702b8
    statement:
      form: event_driven
      when: "the page server counts a model request"
      system: "the page"
      shall: "show the new counts."
    criteria:
      - key: 01a1646f-546d-7042-befd-eb20639f67b6
        name: "An open page shows a counted request's tokens within 2 seconds of the request's end, without being reloaded."
  - key: 01a182b6-3c58-7235-ad04-392b2c2f7490
    statement:
      form: ubiquitous
      system: "The page server"
      shall: "give the page Yard Log's token sums, in all and by stage, by session, by agent and model and by submission, summed from every totals file of Yard Log."
    body: "The totals files and their sums are counted by one set of rules, in Yard Log's model, so that what the page shows never disagrees with what the totals files hold."
    criteria:
      - key: 01a182b6-3c58-7235-ad04-392c4702ab33
        name: "The page shows the sums the page server gives, and sums no counts itself."
      - key: 01a182b6-3c58-7235-ad04-392d1d37f8f9
        name: "A counter that a contributing totals file is missing makes the sum's accounting partial, as it makes a totals file's."
      - key: 01a182b6-3c58-7235-ad04-392e5cf3c77f
        name: "A counter missing from every contributing totals file is unavailable in the sum."
