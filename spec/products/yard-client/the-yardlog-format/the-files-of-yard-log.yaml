key: 01a1646f-546d-7042-befd-ebc727a05b50
slug: the-files-of-yard-log
name: "The files of Yard Log"
body: |
  Yard Log's folder is laid out as `spec/` is: a root, then one file for each stage, which holds its blocks as a Feature's file holds its Requirements. Beside them, one file for each session holds the tokens that session took, and one its activity, so that no two writers ever share a file.

  ```text
  .yard/<branch>/yardlog.yaml
  .yard/<branch>/<stage id>.yaml
  .yard/<branch>/tokens/<session id>.yaml
  .yard/<branch>/activity/<session id>.yaml
  ```

  What belongs to the machine and not to the branch stays out of the working tree: the trees the page server serves, each session's events, the revision each agent last read and the sessions that continue others are kept in `yard/` in `loft`'s settings directory, and the lock and save journal of each branch's Yard Log, and the lease of each wait, in git's own directory for the worktree.
tags:
  - git
realizes:
  - 01a12ff0-f5e5-7095-8fa8-24b80bc83d86
  - 01a16469-559e-73c4-85f2-71b305365c69
  - 01a16469-559e-73c4-85f2-71b98f3a0df7
requirements:
  - key: 01a1646f-546d-7042-befd-ebc81208c92b
    statement:
      form: ubiquitous
      system: "The yard store"
      shall: "keep each branch's Yard Log as YAML files under `.yard/<branch>/`: a root, one file for each stage, and one file of tokens and one of activity for each session that worked on it."
    criteria:
      - key: 01a1646f-546d-7042-befd-ebc9da3f340f
        name: "The root `yardlog.yaml` holds `format: yardlog/1`, Yard Log's key, its branch, its title, its revision, the Act that opened it, the stages' keys in order, the submissions, the keys of Yard Logs merged into it, and whether it is closed."
      - key: 01a1646f-546d-7042-befd-ebca09d739e6
        name: "Each stage's file is `<stage id>.yaml` beside `yardlog.yaml`, and holds the stage and its blocks in order."
      - key: 01a1646f-546d-7042-befd-ebcb46f81df5
        name: "Each block's versions, answers and outcomes are kept with the block in its stage's file."
  - key: 01a1646f-546d-7042-befd-ebcc6631d4d4
    statement:
      form: ubiquitous
      system: "The yard store"
      shall: "write the files in one canonical layout, so that Yard Log holding the same records always gives the same bytes."
    criteria:
      - key: 01a1646f-546d-7042-befd-ebcda23e7abb
        name: "Writing Yard Log that has not changed leaves its files' bytes unchanged."
      - key: 01a1646f-546d-7042-befd-ebce62c22acb
        name: "A change to one block rewrites only its stage's file and `yardlog.yaml`."
      - key: 01a1646f-546d-7042-befd-ebcf584141d9
        name: "The files hold no comments, anchors, aliases, tags or flow collections."
  - key: 01a1646f-546e-76cb-8b4f-f1e8b2166a6e
    statement:
      form: ubiquitous
      system: "Yard Client"
      shall: "keep what belongs to the machine, and not to the branch, in `yard/` in `loft`'s settings directory."
    criteria:
      - key: 01a1646f-546e-76cb-8b4f-f1e9d5f6fcfc
        name: "The trees the page server serves are kept in `yard/trees.json`."
      - key: 01a1646f-546e-76cb-8b4f-f1eac3fca16f
        name: "Each session's event log is kept in `yard/events/<session id>.jsonl`."
      - key: 01a1646f-546e-76cb-8b4f-f1ec3c4ff3b2
        name: "The page server's control token is kept in `yard/`, readable only by the person's own account."
      - key: 01a1647c-e680-7753-bf17-f18342ac8828
        name: "The sessions that continue others are kept in `yard/continuations.json`."
  - key: 01a1646f-546e-76cb-8b4f-f1ed1bb5b7d8
    statement:
      form: unwanted
      if: "Yard Log's files do not read, as after a bad edit by hand or an unresolved merge conflict"
      system: "the yard store"
      shall: "refuse every write to that Yard Log, naming the file and the line at fault."
    criteria:
      - key: 01a1646f-546e-76cb-8b4f-f1ee570d4cd2
        name: "No file is changed."
      - key: 01a1646f-546e-76cb-8b4f-f1ef3e16f013
        name: "`loft yard read` reports the error with its file and line in place of the stages."
      - key: 01a1646f-546e-76cb-8b4f-f1f0c8a50d30
        name: "The page shows the error in place of Yard Log's stages."
