key: 01a1646f-546d-7042-befd-ea405aeffb3b
slug: loft-yard-protocol
name: "Report the yard protocol"
body: "A host checks with `loft yard protocol` that the `loft` it runs speaks the yard commands it was written for, before it offers Yard Client's tools. It needs no repository, so a host can ask it anywhere. Run in a session's directory, it also tells the host whether Yard Client acts there, as \"Stay out of a repository that does not use Loft\" states."
tags:
  - yard-command
realizes:
  - 01a16469-559e-73c4-85f2-71a7729da1ec
requirements:
  - key: 01a1646f-546d-7042-befd-ea41ebe6abc0
    statement:
      form: event_driven
      when: "a host runs `loft yard protocol`"
      system: "`loft yard protocol`"
      shall: "report the version of the protocol that the `loft yard` commands speak, the yardlog formats it reads and writes, and the directory it keeps what belongs to the machine in."
    criteria:
      - key: 01a1646f-546d-7042-befd-ea4276b44344
        name: "The report gives the protocol's version as one integer."
      - key: 01a177f9-8295-7328-aa9b-0fa2869127b8
        name: "Protocol 2 and every later protocol serve host-aware callers and adapter descriptors."
      - key: 01a1c338-7d63-7408-bf96-f0973952951f
        name: "Protocol 3 and every later protocol let an adapter descriptor declare `consults` and a tool call carry the classes of what it consults."
      - key: 01a1f074-174c-750c-b689-edae6ba14580
        name: "The report gives protocol 4, under which `loft yard serve` takes `--listen` and `--join`."
      - key: 01a177f9-f61a-77e3-89ef-0d0bfe35cd61
        name: "The Claude adapter accepts protocols 1, 2, 3 and 4."
      - key: 01a1646f-546d-7042-befd-ea43c0bb2e34
        name: "The report gives `loft`'s own version."
      - key: 01a1646f-546d-7042-befd-ea440b264795
        name: "The report lists every yardlog format it reads, and names the one it writes."
      - key: 01a1cf7a-0eb7-770e-800d-7eb43bb22cf2
        name: "The report names, as `home`, the absolute directory that holds what belongs to the machine, the one `LOFT_YARD_HOME` names where it moves it."
      - key: 01a1cf7a-0eb7-770e-800d-7eb53956f7b6
        name: "Where no home directory is known, the report gives no `home`."
      - key: 01a1646f-546d-7042-befd-ea45ec21ca68
        name: "Apart from `workingTree`, the report is the same inside and outside a git repository."
      - key: 01a1646f-546d-7042-befd-ea4652516db4
        name: "No file is written."
  - key: 01a21c37-045e-701f-899b-4dd95126a97f
    statement:
      form: event_driven
      when: "a host runs `loft yard protocol` in a directory"
      system: "`loft yard protocol`"
      shall: "report whether the working tree of that directory uses Loft, and what shows that it does."
    criteria:
      - key: 01a21c37-045e-701f-899b-4ddaa1584f08
        name: "The report gives `workingTree.usesLoft` as true or false."
      - key: 01a21c37-045e-701f-899b-4ddb40084a89
        name: "Where the working tree uses Loft, `workingTree.by` names what shows it: `spec`, `lock`, `yard-log` or `config`."
      - key: 01a21c37-045e-701f-899b-4ddc64df0d70
        name: "Without `--format json`, the command says whether the working tree uses Loft, and how to turn Yard Client on where it does not."
  - key: 01a1646f-546d-7042-befd-ea476fd579cb
    statement:
      form: ubiquitous
      system: "`loft yard protocol`"
      shall: "raise the protocol's version with each release that changes the input or the output of a `loft yard` command in a way that an earlier host cannot read."
    criteria:
      - key: 01a1646f-546d-7042-befd-ea48725f8d5f
        name: "A change to a `loft yard` command's schema that removes or renames a field raises the protocol's version."
      - key: 01a1646f-546d-7042-befd-ea49f4d1102e
        name: "A change that only adds an optional field leaves the protocol's version as it was."
