key: 01a1646f-546d-7042-befd-ea74e4eb698c
slug: concurrent-writes
name: "Concurrent writes"
body: |
  Agents that write one Yard Log at once never lose each other's work, and agents that write different Yard Logs never wait on each other. A write takes its Yard Log's lock only for as long as the write lasts, and is refused only where it would overwrite a block that another agent changed since the writer last read it.

  Agents can own separate stages, or execute assigned tasks in another agent's stage. The limit of one active stage per agent leaves several agents free to execute different tasks in one stage at once. A submission belongs to the agent that sent it, so that each agent's wait returns its own answers.
