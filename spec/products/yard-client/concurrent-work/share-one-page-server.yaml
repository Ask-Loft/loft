key: 01a1646f-546d-7042-befd-ea8ce9a4adcc
slug: share-one-page-server
name: "Share one page server"
body: |
  One page server on the machine serves the page for every tree whose sessions use Yard Client, in every repository. The first mod that needs it starts it, every other mod registers its tree with it, and when the session that started it ends, a live mod starts another. A `loft yard` command that gives the page's address adds its tree to those served as well, so that a session that runs `loft` without the mod, such as one an agent host starts in a worktree of its own, is on the page too. The person keeps one address for every branch's Yard Log on the machine. A `loft` under development, run by the dogfood launcher with `LOFT_YARD_HOME`, keeps a page server of its own beside it, on the dogfood port.

  A mod starts the page server as a child that lives as long as the mod does, or until a newer `loft yard serve` replaces it, so the page is up while any session with the Loft plugin runs. Each mod tells the page server every 5 seconds that its session is live, and runs `loft yard serve`, which reads `~/.yard/server.json`, only where no page server answers.
realizes:
  - 01a16469-559e-73c4-85f2-71a8fdbbeaf7
  - 01a16469-559e-73c4-85f2-71afd78c6e3e
requirements:
  - key: 01a18025-1c03-72bb-b904-c23c34877a3d
    statement:
      form: event_driven
      when: "the repository's `scripts/yard-dogfood.sh` launcher finishes building `loft` for a Claude Code or Codex session"
      system: "the dogfood launcher"
      shall: "restart the page server kept in `~/.yard-dogfood/` with the binary it just built before starting the session."
    criteria:
      - key: 01a1cf7a-0eb7-770e-800d-7eb6b1f25771
        name: "The session's `loft` runs with `LOFT_YARD_HOME` naming `~/.yard-dogfood/`."
      - key: 01a1cf7a-0eb7-770e-800d-7eb7b63ace26
        name: "The page server kept in `~/.yard/` keeps running, and sessions of the installed Loft plugin keep reaching it."
      - key: 01a18025-1c03-72bb-b904-c23d0979cab4
        name: "A running page server is replaced even when its release version equals the newly built binary's version."
      - key: 01a18025-1c03-72bb-b904-c23e06b616f8
        name: "The server uses the dogfood port, 7412."
      - key: 01a18025-1c03-72bb-b904-c23ff7831364
        name: "The launcher verifies that the replacement serves before starting Claude Code or Codex."
      - key: 01a18025-1c03-72bb-b904-c240304554ce
        name: "Concurrent dogfood launches leave one page server holding the server lock of `~/.yard-dogfood/`."
      - key: 01a18025-1c03-72bb-b904-c241ca7ef9be
        name: "A session already using Yard connects to the replacement without restarting its agent."
      - key: 01a18025-1c03-72bb-b904-c24253398c1b
        name: "Previously registered trees and recorded Yard state are kept through the restart."
      - key: 01a18025-1c03-72bb-b904-c243a3da37e9
        name: "The caller's working directory is kept when Claude Code or Codex starts."
  - key: 01a18025-1c03-72bb-b904-c2440aac601a
    statement:
      form: unwanted
      if: "the dogfood launcher's build or page server restart fails"
      system: "the dogfood launcher"
      shall: "exit with a nonzero status and name the failure before starting an agent session."
    criteria:
      - key: 01a18025-1c03-72bb-b904-c245ed0737b2
        name: "A build failure leaves the existing page server running."
      - key: 01a18025-1c03-72bb-b904-c246b403e158
        name: "An unrelated process named by stale server metadata is left running."
      - key: 01a18025-1c03-72bb-b904-c24747d8b962
        name: "A restart that cannot be confirmed within a bounded wait fails instead of starting Claude Code or Codex."
  - key: 01a1cf7a-0eb7-770e-800d-7eb897cfbf3e
    statement:
      form: event_driven
      when: "the dogfood launcher is run with `desktop` and a project directory"
      system: "the dogfood launcher"
      shall: "have the Claude Code sessions of that project, Claude Desktop's among them, load this worktree's Loft plugin and `loft` in place of the installed ones."
    criteria:
      - key: 01a1cf7a-0eb7-770e-800d-7eb96f1b7c1e
        name: "The launcher keeps a local marketplace `yard-dogfood` whose `loft` plugin is read from this worktree's `plugins/claude/loft`, so that `/reload-plugins` takes up an edit."
      - key: 01a1cf7a-0eb7-770e-800d-7eba6cb45db1
        name: "In the project, `loft@yard-dogfood` is enabled and `loft@ask-loft` disabled, both at the local scope."
      - key: 01a1cf7a-0eb7-770e-800d-7ebb3cc110b1
        name: "Sessions in any other project load the installed Loft plugin."
      - key: 01a1cf7a-0eb7-770e-800d-7ebcd178f72e
        name: "The settings of `loft@yard-dogfood` run this worktree's `loft` with `LOFT_YARD_HOME` naming `~/.yard-dogfood/`, on the dogfood port, 7412."
      - key: 01a1cf7a-0eb7-770e-800d-7ebdfe1618e2
        name: "The launcher prints each change it makes to the person's Claude Code settings before it makes it."
      - key: 01a1cf7a-0eb7-770e-800d-7ebebaa4add8
        name: "A second run with the same project changes nothing."
  - key: 01a1cf7a-0eb7-770e-800d-7ebf6ac04278
    statement:
      form: event_driven
      when: "the dogfood launcher is run with `desktop --undo` and a project directory"
      system: "the dogfood launcher"
      shall: "return that project's Claude Code sessions to the installed Loft plugin."
    criteria:
      - key: 01a1cf7a-0eb7-770e-800d-7ec0ee199dea
        name: "In the project, `loft@yard-dogfood` is disabled and `loft@ask-loft` enabled, both at the local scope."
      - key: 01a1cf7a-0eb7-770e-800d-7ec1f2b2a7fe
        name: "The settings of every other project are left as they were."
  - key: 01a1646f-546d-7042-befd-ea8d95ec4aad
    statement:
      form: event_driven
      when: "a session starts in a worktree and the mod's protocol check passes"
      system: "the Loft mod"
      shall: "make sure that a page server of its own `loft`'s version or a newer one serves the port, starting `loft yard serve` where none does."
    criteria:
      - key: 01a16475-f84e-74f3-8ba1-d6d4265f7b74
        name: "The mod registers the session's tree with the page server that serves the port."
      - key: 01a1646f-546c-7521-9643-bc5f9317855f
        name: "A page server that the mod starts runs as long as the mod, or until a newer `loft yard serve` replaces it."
      - key: 01a1646f-546d-7042-befd-ea8e5a514259
        name: "A page server that the mod starts serves the plugin's `yardPort` setting, 7411 by default."
      - key: 01a1646f-546d-7042-befd-ea8fc7b5b732
        name: "A `loft yard serve` that finds in `~/.yard/server.json` a running page server of the same or a newer version exits 0 and starts none."
      - key: 01a1646f-546d-7042-befd-ea90b3a3d660
        name: "The session starts without waiting for the page server to answer."
      - key: 01a1646f-546d-7042-befd-ea91076e0f8d
        name: "A tree that the page server already serves is not added twice."
  - key: 01a18a3a-4833-7539-a772-a6431c57dc22
    statement:
      form: event_driven
      when: "`loft yard serve` reports that a page server already runs on a port other than the one the mod reaches"
      system: "the Loft mod"
      shall: "reach that page server on the port the command reports."
    criteria:
      - key: 01a18a3a-4833-7539-a772-a644d88830c8
        name: "The mod tells the page server on the reported port that its session is live."
      - key: 01a18a3a-4833-7539-a772-a6459a7809a7
        name: "The mod registers the session's tree with the page server on the reported port."
      - key: 01a18a3a-4833-7539-a772-a646e54a4320
        name: "The mod posts the session's events to the page server on the reported port, those it kept while no page server answered among them."
      - key: 01a18a3a-4833-7539-a772-a647df1c0223
        name: "While the page server on the reported port answers, the mod starts no `loft yard serve`."
      - key: 01a18a3a-4833-7539-a772-a648e5d3b582
        name: "Once no page server answers on the reported port, the mod's next `loft yard serve` asks for the plugin's `yardPort` setting again."
  - key: 01a1647b-208d-7169-85c8-9a52c192191e
    statement:
      form: event_driven
      when: "a tool call reaches a tree that the page server does not serve"
      system: "the Loft mod"
      shall: "register that tree with the page server."
    criteria:
      - key: 01a1647b-208d-7169-85c8-9a53c278bbaf
        name: "A subagent's first call in a worktree of its own registers that worktree's tree."
      - key: 01a1647b-208d-7169-85c8-9a5466ae261a
        name: "A session's first call after it moves into another worktree registers that worktree's tree."
  - key: 01a1646f-546d-7042-befd-ea927a2d6d6e
    statement:
      form: event_driven
      when: "a tree is registered with the page server"
      system: "the page server"
      shall: "add the tree's Yard Logs to the ones it serves."
    criteria:
      - key: 01a1646f-546d-7042-befd-ea935091c8a4
        name: "The trees served are kept in `~/.yard/trees.json`, so that a page server started later serves them again."
      - key: 01a1646f-546d-7042-befd-ea94569c5337
        name: "Trees of different repositories are served by one page server."
      - key: 01a1646f-546d-7042-befd-ea95ba02c56a
        name: "A tree that no longer exists is dropped from those served."
      - key: 01a165fb-8537-775f-9fca-0d5ebe05cb94
        name: "The page server checks whether a branch's Yard Log was closed by its merge against the base branch that Yard Log's root records."
  - key: 01a1646f-546d-7042-befd-ea9692532c28
    statement:
      form: state_driven
      while: "a session with the Loft plugin runs"
      system: "the Loft mod"
      shall: "tell the page server every 5 seconds that its session is live, and run `loft yard serve` with its session only where no page server answers."
    criteria:
      - key: 01a1649f-62ef-71e6-98de-e108efc946c7
        name: "Each time the page server hears a session, it records in `~/.yard/sessions.json` the time it heard it."
      - key: 01a16621-e7bc-7707-b123-2169fad97012
        name: "While a page server answers, the mod starts no `loft yard serve`."
      - key: 01a16621-e7bc-7707-b123-216ad4648974
        name: "The session whose mod's child is the page server is heard every 5 seconds too."
      - key: 01a16621-e7bc-7707-b123-216ba39acdc8
        name: "Each event a session's mod posts counts as hearing the session."
      - key: 01a16621-e7bc-7707-b123-216cba11e13a
        name: "No `loft yard` command but `serve` records a session as heard."
      - key: 01a1646f-546d-7042-befd-ea97136fbdab
        name: "When the session that started the page server ends while other sessions run, another session's mod starts a page server within 5 seconds."
      - key: 01a1646f-546d-7042-befd-ea98315d97ca
        name: "Two mods that find the port free at once leave one page server serving it."
      - key: 01a1646f-546d-7042-befd-ea99779c6332
        name: "Every tree registered with the page server that ended is served by the new one."
  - key: 01a1646f-546d-7042-befd-ea9a321697c5
    statement:
      form: unwanted
      if: "the page loses its connection to the page server"
      system: "the page"
      shall: "say that it is not up to date and connect again."
    criteria:
      - key: 01a1646f-546d-7042-befd-ea9b4a13a2b7
        name: "The page tries again every second until a page server answers."
      - key: 01a1646f-546d-7042-befd-ea9cc78a7bec
        name: "The page shows the changes it missed once it is connected again."
