key: 01a16469-55a3-716f-a42c-3a3548428b77
slug: yard-client
name: "Yard Client"
body: |
  Yard Client keeps Yard Log: the record that coding agents keep for a git branch while they plan and build a change, and that the person reads, answers and approves from, on a local page or in the agent host, for every branch being worked on across the machine.

  Agents write Yard Log only through Yard Client's tools, as typed blocks inside stages; the person writes nothing but answers and decisions. Each branch has its own Yard Log, kept in the repository in the `yardlog` format under `.yard/` and committed with the work by default, so that it travels with the branch and is read in review. Its records carry keys, as the nodes of a specification do, so that a server can later take Yard Log up as it is.

  Yard Client is built into `loft`, which reads and writes Yard Log and serves the page, and into adapters through which agent hosts reach it. The Claude adapter runs as the Loft plugin's TypeScript mod, preserving the host's native tools and dialogs.
tags:
  - git
