key: 01a1646f-546d-7042-befd-eab65088c9bf
slug: see-a-loft-decision
name: "See a Loft decision"
body: "A `decision` view shows a decision of the specification as `loft` holds it, so that the person reads why a choice was made: the options weighed, against what, and with what consequences."
realizes:
  - 01a16469-559e-73c4-85f2-71a94f0aa021
requirements:
  - key: 01a1646f-546d-7042-befd-eab70d4b9fa4
    statement:
      form: ubiquitous
      system: "The page"
      shall: "draw a `decision` view with the decision's title, label, state, context and outcome, its options, a table of its assessments, its consequences and its subjects."
    criteria:
      - key: 01a1646f-546d-7042-befd-eab87ad2fa8b
        name: "Each option shows its title and description, and the selected option is marked as selected."
      - key: 01a1646f-546d-7042-befd-eab9f27ee1c1
        name: "The table has a row for each option and a column for each driver, and each cell gives the rating as a symbol and a word as well as a colour."
      - key: 01a1a86c-65d5-76fe-b38b-1c58b8ab8657
        name: "A cell gives its rationale while the pointer rests on it or it has the focus."
      - key: 01a1a86c-65d5-76fe-b38b-1c59d4593b08
        name: "Each option's row opens to the rationale of each of its ratings."
      - key: 01a1a86c-65d5-76fe-b38b-1c5a6628183a
        name: "The selected option's row comes first, marked by a bar at its left."
      - key: 01a1646f-546d-7042-befd-eababcab5af2
        name: "Each driver shows its label and statement, or the node it stands for."
      - key: 01a1646f-546d-7042-befd-eabbb57e9401
        name: "Each consequence shows its kind and its statement."
      - key: 01a1a86c-65d5-76fe-b38b-1c5b7e887d44
        name: "The consequences are listed under a heading for each of their kinds: Benefits, Costs and Obligations."
      - key: 01a1646f-546d-7042-befd-eabc540b4e07
        name: "Each subject shows its role and its node, by its label and its name."
      - key: 01a1a86c-65d5-76fe-b38b-1c5c68102d44
        name: "The subjects of one role lie on one line headed by the role, such as `Affects:`, with no frame around the role."
      - key: 01a1646f-546d-7042-befd-eabdd040918b
        name: "A decision that is not accepted shows its state, and a rejected or retired one its rationale."
      - key: 01a1646f-546d-7042-befd-eabebf41cb3d
        name: "A decision with no label shows that it has not been published."
