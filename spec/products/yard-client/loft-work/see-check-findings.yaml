key: 01a1646f-546d-7042-befd-eacb5adebb91
slug: see-check-findings
name: "See check findings"
body: "A `findings` view shows what `loft check` reported when the view was recorded, which of its findings the branch introduced, and why the agent left each finding it left."
realizes:
  - 01a16469-559e-73c4-85f2-71a94f0aa021
requirements:
  - key: 01a1646f-546d-7042-befd-eacc62f9fa3a
    statement:
      form: ubiquitous
      system: "The page"
      shall: "draw a `findings` view as the count of errors and of findings at each severity, and a list of each."
    criteria:
      - key: 01a1646f-546d-7042-befd-eacd8a7f0685
        name: "Each error and each finding shows its rule, its severity, its message, and the file and line it names."
      - key: 01a1646f-546d-7042-befd-eace3bd53656
        name: "A finding that names a node gives the node's label and name."
      - key: 01a1646f-546d-7042-befd-eacf19310610
        name: "A finding the agent left in place shows the agent's reason beside it."
      - key: 01a1646f-546d-7042-befd-ead0ef8802b7
        name: "A check with no error and no finding says that the specification is clean."
      - key: 01a1646f-546d-7042-befd-ead10ce7a734
        name: "Each finding is marked as introduced by the branch or there before it, against the base revision."
      - key: 01a1646f-546d-7042-befd-ead279dd7751
        name: "The findings that the branch resolved are listed."
      - key: 01a1646f-546d-7042-befd-ead3b74268b1
        name: "The view names the base revision it marks the findings against."
      - key: 01a1a86c-65d5-76fe-b38b-1c5d653dc449
        name: "The findings are grouped by rule, in the order of their severity from errors down to hints, each group giving its rule, its severity and its message once."
      - key: 01a1a86c-65d5-76fe-b38b-1c5e49a0f5b7
        name: "Each rule's group counts its findings that the branch introduced and those there before it."
      - key: 01a1a888-798f-7356-874b-18d65dabc5b5
        name: "Each count of findings the branch introduced or of those there before it is a number beside an icon of its own, which names the count to a reader and while the pointer rests on it."
      - key: 01a1a86c-65d5-76fe-b38b-1c5f279f15ef
        name: "Above the groups, the view counts the findings that the branch introduced and those there before it."
      - key: 01a1a86c-65d5-76fe-b38b-1c6058d721e9
        name: "A rule's group starts open where the branch introduced one of its findings, and folded otherwise, and the person opens and folds each group."
      - key: 01a1a86c-65d5-76fe-b38b-1c618493bb5a
        name: "Within a rule's group, the findings the branch introduced come first under a heading of their own, then those there before it under theirs."
      - key: 01a1a86c-65d5-76fe-b38b-1c622a453ff5
        name: "Within a rule's group, each finding is one line giving its node's label and name and the file and line it names."
      - key: 01a1a888-7990-71fd-bb56-5c5aea494ec8
        name: "The lines of a rule's group align their labels, names and places in columns, each place giving its file's name and line, and its file's whole path while the pointer rests on it."
