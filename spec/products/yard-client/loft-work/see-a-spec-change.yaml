key: 01a1646f-546d-7042-befd-eabf848abd4c
slug: see-a-spec-change
name: "See a spec change"
body: |
  A `spec-change` view shows what a branch added to the specification, changed in it or removed from it, against the base revision. The diagram holds only the changed slice and what it belongs to, so that it grows with the change and not with the specification: a branch that touches two criteria of a specification of hundreds is drawn as small as those two criteria and the Feature above them.

  The diagram shows where each change lies and the diff beneath it what each change says: a changed criterion's box can hold only its new words, so its old words are read in the diff.
realizes:
  - 01a16469-559e-73c4-85f2-71a94f0aa021
requirements:
  - key: 01a1646f-546d-7042-befd-eac0614c263d
    statement:
      form: ubiquitous
      system: "The page"
      shall: "draw a `spec-change` view as a diagram of the changed Products, Feature Groups, Features, Requirements, criteria, Components and decisions, with a diff of every changed node beneath it."
    criteria:
      - key: 01a1646f-546d-7042-befd-eac1d09f5f92
        name: "The diagram shows each changed node with the Requirement, the Feature, the Feature Group and the Product above it."
      - key: 01a16475-7fbc-7732-a78c-bc4f592eb112
        name: "The diagram draws the `realizes` and decision subject edges between the nodes it shows."
      - key: 01a1646f-546d-7042-befd-eac271279597
        name: "Each added, changed or removed Requirement is drawn as a box inside its Feature's panel that holds its statement."
      - key: 01a16475-7fbc-7732-a78c-bc50ee43201f
        name: "Each added, changed or removed criterion is drawn as a box to the right of its Requirement, joined to it, that holds its name."
      - key: 01a1695a-dd72-7090-817b-abea7cf0c895
        name: "A Requirement or a criterion that did not change is drawn only where a changed criterion lies beneath it, and then only for context."
      - key: 01a1695a-dd72-7090-817b-abebaa96fd5a
        name: "A Feature's box gives no count of its Requirements or its criteria."
      - key: 01a1646f-546d-7042-befd-eac305fe0fe5
        name: "Each box says whether its node was added, changed or removed, in a word as well as a colour, and a box drawn only for context says neither."
      - key: 01a1646f-546d-7042-befd-eac47fbbbfb2
        name: "Each box of a Product, a Feature Group, a Feature, a Component or a decision names its node, and every box gives its node's label where the node has one."
      - key: 01a1646f-546d-7042-befd-eac6d7f3526d
        name: "The view names the base revision it compares with, and the commit it was recorded at."
      - key: 01a1646f-546d-7042-befd-eac7b48cb905
        name: "A view of no change says that the specification has not changed since the base revision."
  - key: 01a1a814-5ac4-7523-9962-5aca4077ab5e
    statement:
      form: ubiquitous
      system: "The page"
      shall: "draw a `spec-change` view's diagram with its own flowchart renderer, as nested panels and cards in Loft Web's marks, at its own size."
    criteria:
      - key: 01a1a814-5ac4-7523-9962-5acb7c0667ce
        name: "Each Product, Feature Group and Feature the diagram shows is a panel framed by a hairline that holds what belongs to it, headed by its kind's coloured square, its label and its name."
      - key: 01a1a814-5ac4-7523-9962-5acc70ed77b9
        name: "A Requirement's box and the boxes of its criteria stand in one row, the criteria stacked one beneath another to its right, each joined to it by a plain line without an arrowhead."
      - key: 01a1a814-5ac4-7523-9962-5acd501df9ef
        name: "Each box is a flat card headed by its kind's coloured square and its label in monospace, or its kind's name where the node has no label yet, with its name or statement beneath in the page's face, wrapped to the box's measured width so that nothing is cut."
      - key: 01a1a814-5ac4-7523-9962-5ace0ee365c5
        name: "An added, changed or removed box or panel carries a bar at its left in its change's colour and its change in a word at its right."
      - key: 01a1a823-bcd4-7465-a368-65401608d872
        name: "A removed box or panel is outlined dashed."
      - key: 01a1a814-5ac4-7523-9962-5acfa4c34f20
        name: "The bars of change are green `#199e70`, blue `#256abf` and red `#e34948` in a light scheme, and green `#199e70`, blue `#3987e5` and red `#e66767` in a dark one."
      - key: 01a1a814-5ac4-7523-9962-5ad00cc80371
        name: "A box or panel drawn only for context lies on the sidebar's ground, in muted ink, with no bar and no word."
      - key: 01a1a814-5ac4-7523-9962-5ad1ea6ba4e7
        name: "A `realizes` or decision subject edge is dashed and ends in an arrowhead, its kind named in a pill beside it."
      - key: 01a1a814-5ac4-7523-9962-5ad2905ffb74
        name: "A legend above the diagram keys each change the diagram holds by its bar, with the number of boxes and panels of each."
      - key: 01a1a814-5ac4-7523-9962-5ad3b612d689
        name: "Pointing at a box brings forward it, its edges and the boxes they join, and fades the rest of the diagram."
      - key: 01a1a814-5ac4-7523-9962-5ad4d5b14101
        name: "Choosing a box, by the pointer or by the keyboard, unfolds the diff beneath and brings that node's entry into view, marked."
      - key: 01a1a814-5ac4-7523-9962-5ad53fd5ae24
        name: "A Feature Group folded into one box counts its changed nodes, and choosing its box opens it."
      - key: 01a1a814-5ac4-7523-9962-5ad662373fdb
        name: "The diagram is drawn at its own size and scrolls sideways where it is wider than its block."
  - key: 01a1695a-dd72-7090-817b-abecf6ac6c9d
    statement:
      form: ubiquitous
      system: "The page"
      shall: "show in the diff beneath the diagram the words of each added, changed and removed node, with the words added and the words removed marked."
    criteria:
      - key: 01a1646f-546d-7042-befd-eac5a7afa6b1
        name: "The diff lists every added, changed and removed node by its kind, its label and its name."
      - key: 01a1695a-dd72-7090-817b-abed3355eb7d
        name: "A node's words are a Requirement's statement, a criterion's name, a decision's title and outcome, and the name and body of any other node."
      - key: 01a1695a-dd72-7090-817b-abee85f754da
        name: "An added node shows its words unmarked, as the word beside it says it was added."
      - key: 01a1695a-dd72-7090-817b-abefd279bcb5
        name: "A removed node shows its words as they were, marked as removed."
      - key: 01a1695a-dd72-7090-817b-abf0d6c9c185
        name: "A changed node shows its words once, with each word removed marked as removed and each word added marked as added."
      - key: 01a1695a-dd72-7090-817b-abf130c2dda7
        name: "A changed node whose words did not change says that only its other fields changed."
      - key: 01a16475-7fbc-7732-a78c-bc51485eea5d
        name: "The diff starts folded."
  - key: 01a1695a-dd72-7090-817b-abf280f1f0dd
    statement:
      form: unwanted
      if: "a `spec-change` report was recorded without the words of its nodes"
      system: "the page"
      shall: "draw it as it was drawn when it was recorded, with each Feature's box counting its Requirements and its criteria and those added, changed and removed."
    criteria:
      - key: 01a1695a-dd72-7090-817b-abf37e7d1fe9
        name: "Such a report's diagram draws no box for a Requirement or a criterion."
      - key: 01a1695a-dd72-7090-817b-abf4975045c0
        name: "Such a report's diff lists every changed node by its kind, its label and its name, without its words."
  - key: 01a1646f-546d-7042-befd-eac86409601b
    statement:
      form: unwanted
      if: "the diagram would hold more than 30 boxes"
      system: "the page"
      shall: "draw each Feature Group as one box that counts its changed nodes, and let the person open one Feature Group at a time."
    criteria:
      - key: 01a1646f-546d-7042-befd-eac9dc2edaf7
        name: "Opening a Feature Group draws its changed Features, Requirements and criteria in place of its box."
      - key: 01a1646f-546d-7042-befd-eacaa63dddfa
        name: "Opening another Feature Group closes the one that was open."
