key: 01a1787c-f803-70b1-b946-b70ceb2b1660
slug: codex-yard-watch
name: "Codex Yard watch"
body: |
  `loft yard codex watch` is a native background command hook started with a session and on later hooked activity. It reads the native input in the same way as the hook command. Codex owns its lifetime, with a 24-hour timeout; later hooked activity restarts a worker that has ended. Local Codex workflows are supported, while cloud orchestration is outside this integration.

  Adapter bookkeeping lives in the plugin's writable data directory, with a machine-local fallback under ~/.yard/codex. It holds normalized pending events, task identity, usage checkpoints and notification delivery progress, never a second Yard Log. All Yard reads and writes use the existing JSON command interfaces. The worker's bounded app-server observer supplies usage while a native turn is active and releases its subscription when the turn ends. A separate notification connection is available while the worker monitors a pending decision, including between native turns.
tags:
  - yard-command
realizes:
  - 01a1787c-f7fc-7749-a978-1a96e6c41c4a
requirements:
  - key: 01a1787c-f803-70b1-b946-b70d6db4c396
    statement:
      form: state_driven
      while: "a Codex Yard worker runs"
      system: "the Codex Yard adapter"
      shall: "keep its session live and deliver its queued activity to the page server."
    criteria:
      - key: 01a1787c-f803-70b1-b946-b70e2947594a
        name: "Only one worker holds a given session's worker lock."
      - key: 01a1787c-f803-70b1-b946-b70f92ba6a9c
        name: "A worker sends a heartbeat every five seconds."
      - key: 01a1787c-f803-70b1-b946-b71000ef7515
        name: "A worker starts or recovers the page server through loft yard serve."
      - key: 01a1787c-f803-70b1-b946-b7115de4d9c5
        name: "Ending a session asks its worker to stop."
      - key: 01a1787c-f803-70b1-b946-b712cbdf45bb
        name: "The worker stops after 24 hours even without a session-end hook."
      - key: 01a1787c-f803-70b1-b946-b7130eb95402
        name: "Events queued while the server is unavailable are delivered in queue order."
      - key: 01a1787c-f803-70b1-b946-b7145f5d3606
        name: "The queue retains at most 1,000 events with the oldest dropped on overflow."
      - key: 01a1787c-f803-70b1-b946-b715d9b070d4
        name: "The next delivered event reports the number of events dropped."
      - key: 01a1787c-f803-70b1-b946-b7162fa550ee
        name: "Concurrent hooks preserve events added during delivery."
      - key: 01a1787c-f803-70b1-b946-b7176faefe01
        name: "Two sessions retain separate worker locks, stop requests and pending activity."
      - key: 01a1787c-f803-70b1-b946-b7184a70c162
        name: "The hook command returns without waiting for event delivery."
      - key: 01a1787c-f803-70b1-b946-b719227d81e3
        name: "JSON diagnostic output uses the standard schema, outcome and errors envelope."
