key: 01a17989-a8b9-74b1-9049-07424c7b1496
slug: observe-codex-token-usage
name: "Observe Codex token usage"
body: |
  The existing Codex Yard worker observes live usage from an already running local Codex app server over its Unix-domain WebSocket. Native hooks remain the source of caller identifiers, turn identifiers and activity. This observation is available on platforms with Unix-domain sockets; ordinary hook activity continues without it on other platforms or when no reachable server serves the thread.

  The observer uses the daemon socket under CODEX_HOME, or ~/.codex when CODEX_HOME is absent. An explicit --app-server-socket path selects another local socket for the watch command. It initializes a client, checks loaded threads, reads the account type without requesting a token refresh, subscribes with thread/resume and excludeTurns, and unsubscribes when observation ends. It supplies no configuration or collaboration-mode overrides and sends no model input. Native mode, permissions and hook trust stay authoritative.

  A thread/tokenUsage/updated notification supplies the latest request's last counters and cumulative total counters. Only the latest request is charged. Cumulative counters identify repeated observations and resets; neither cumulative totals nor modelContextWindow are treated as new requests. A reconnect has no historical usage import. Observation gaps remain partial coverage rather than guessed token amounts or attribution.
realizes:
  - 01a1787c-f7fc-7749-a978-1a96e6c41c4a
mentions:
  - 01a17989-a8b4-7254-bee6-8c17685ca099
requirements:
  - key: 01a17989-a8b9-74b1-9049-07439ecff09a
    statement:
      form: state_driven
      while: "an identified native Codex turn is active"
      system: "the Codex Yard adapter"
      shall: "observe its already running local app server through a bounded session-scoped connection."
    criteria:
      - key: 01a17989-a8b9-74b1-9049-07443fdd010e
        name: "The default endpoint is the local daemon socket under CODEX_HOME or ~/.codex."
      - key: 01a17989-a8b9-74b1-9049-074536c1a727
        name: "The watch command accepts an absolute --app-server-socket path for another local Unix-domain socket."
      - key: 01a1798c-4745-74a2-b97e-27815e0eb5bf
        name: "An explicit relative socket path is refused before adapter state changes."
      - key: 01a17989-a8b9-74b1-9049-0746398757d2
        name: "The observer checks that its native thread is loaded before subscribing to that thread."
      - key: 01a17989-a8b9-74b1-9049-0747aded4d67
        name: "A subscription requests excludeTurns without configuration or collaboration-mode overrides."
      - key: 01a17989-a8b9-74b1-9049-07486f7ebda8
        name: "The observer sends only initialization, loaded-thread inspection, account-type inspection without token refresh, subscription and unsubscription requests."
      - key: 01a17989-a8b9-74b1-9049-0749dad857bc
        name: "The adapter never starts a Codex process to obtain usage."
      - key: 01a17989-a8b9-74b1-9049-074a9f9ae651
        name: "The native prompt hook waits at most 500 milliseconds for observer readiness before allowing the turn to proceed."
      - key: 01a17989-a8b9-74b1-9049-074b7f4ea0f3
        name: "An absent or unreachable endpoint leaves hook activity and worker heartbeats available."
      - key: 01a17989-a8b9-74b1-9049-074cce9cb5e4
        name: "Observation disconnects after its turn completes, is interrupted or ends, rather than retaining an idle thread subscription."
      - key: 01a17989-a8b9-74b1-9049-074d13614c42
        name: "Worker termination releases its app-server connection."
  - key: 01a17989-a8b9-74b1-9049-074e6787058b
    statement:
      form: event_driven
      when: "the observer receives valid usage for its identified caller and turn"
      system: "the Codex Yard adapter"
      shall: "normalize the latest request's reported counters into Yard token counters."
    criteria:
      - key: 01a17989-a8b9-74b1-9049-074f8dcefea6
        name: "Fresh input is inputTokens minus cachedInputTokens."
      - key: 01a17989-a8b9-74b1-9049-0750f37f147e
        name: "Cached input is recorded as cacheRead."
      - key: 01a17989-a8b9-74b1-9049-0751134c636a
        name: "A positive cacheWriteInputTokens value remains measured for every account type."
      - key: 01a17989-a8b9-74b1-9049-0752fefe6e1d
        name: "An absent cache-write counter remains unavailable."
      - key: 01a17989-a8b9-74b1-9049-07531c541885
        name: "Output is outputTokens without adding reasoningOutputTokens a second time."
      - key: 01a17989-a8b9-74b1-9049-07549bbcb939
        name: "Negative counters or cached input exceeding total input are refused before accounting state advances."
      - key: 01a17989-a8b9-74b1-9049-0755dbaf29d2
        name: "Cumulative total counters and context-window estimates are never added as requests."
      - key: 01a17989-a8b9-74b1-9049-0756dc09edd6
        name: "A synthetic context-fill notification with no latest-request usage adds no tokens."
      - key: 01a17989-a8b9-74b1-9049-075704e70fa8
        name: "Only an explicit native caller can receive usage attribution."
      - key: 01a17989-a8b9-74b1-9049-07583a0499b1
        name: "A notification for another thread or turn adds no tokens."
      - key: 01a17989-a8b9-74b1-9049-0759fed592c7
        name: "Normalized requests use the existing Yard stage, agent, model and submission accounting."
  - key: 01a17989-a8b9-74b1-9049-075ad31092c3
    statement:
      form: event_driven
      when: "a usage observation is queued or repeated"
      system: "the Codex Yard adapter"
      shall: "preserve an event identifier and checkpoint that prevent charging the same observation again."
    criteria:
      - key: 01a17989-a8b9-74b1-9049-075b1290558c
        name: "The native thread, turn, counter generation and cumulative snapshot determine a stable eventId."
      - key: 01a17989-a8b9-74b1-9049-075c0bd50b64
        name: "The normalized pending event and its checkpoint are saved together under the session's adapter lock."
      - key: 01a17989-a8b9-74b1-9049-075d9c0e4e02
        name: "A repeated cumulative snapshot adds no pending request."
      - key: 01a17989-a8b9-74b1-9049-075e79a3437c
        name: "A counter reset starts a new generation without subtracting previously counted tokens."
      - key: 01a17989-a8b9-74b1-9049-075f16e613aa
        name: "A reconnect resumes observation without charging historical cumulative usage."
      - key: 01a17989-a8b9-74b1-9049-07609d096d5e
        name: "A pending observation retains its eventId and payload through retries and worker restarts."
      - key: 01a17989-a8b9-74b1-9049-07610073dd01
        name: "An observed coverage gap is retained as unavailable request usage rather than invented counts."
  - key: 01a17989-a8b9-74b1-9049-0762634c2732
    statement:
      form: ubiquitous
      system: "The Codex usage observer"
      shall: "retain only accounting metadata from its app-server connection."
    criteria:
      - key: 01a17989-a8b9-74b1-9049-07630ffd0163
        name: "Accounting state and normalized usage events retain no app-server transcript, prompt, assistant message or tool payload."
      - key: 01a17989-a8b9-74b1-9049-0764aa9f9420
        name: "Malformed, oversized or unrelated messages do not become accounting events."
      - key: 01a17989-a8b9-74b1-9049-0765cae065cb
        name: "Usage connection failure does not stop queued native activity from being delivered."
      - key: 01a17989-a8b9-74b1-9049-0766236c5ab6
        name: "Session context and the Yard skill describe app-server usage availability separately from native-hook coverage."
  - key: 01a17d58-a534-746d-9e9d-03f9e8d5a838
    statement:
      form: ubiquitous
      system: "The Codex usage observer"
      shall: "classify cache-write availability from the source count and the account type reported by its app-server connection."
    criteria:
      - key: 01a17d58-a534-746d-9e9d-03faace608a9
        name: "A reported zero cache-write count from a ChatGPT account is unavailable for accounting."
      - key: 01a17d58-a534-746d-9e9d-03fbf1e25de3
        name: "A reported zero cache-write count with no verified account type is unavailable for accounting."
      - key: 01a17d58-a534-746d-9e9d-03fc5ea6ef90
        name: "A reported zero cache-write count from a verified API-key account remains measured."
      - key: 01a17d58-a534-746d-9e9d-03fd5b60ece0
        name: "An absent cache-write count remains unavailable even for a verified API-key account."
      - key: 01a17d58-a534-746d-9e9d-03fe586bb77d
        name: "The raw latest-request cache-write count is retained in the machine event log even when it is unavailable for accounting."
      - key: 01a17d58-a534-746d-9e9d-03ff056b0671
        name: "Each reported request retains only the account classification apiKey, chatgpt or unknown in usageSource.account beside its source counters."
      - key: 01a17d58-a534-746d-9e9d-0400724a00e6
        name: "The account lookup requests no token refresh or authentication change."
      - key: 01a17d58-a534-746d-9e9d-0401d88463b5
        name: "An unavailable, refused or unsupported account lookup leaves other token counters and native activity available."
      - key: 01a17d58-a534-746d-9e9d-040255f85d2c
        name: "An account update changes the classification of subsequent observations on the connection."
      - key: 01a17d58-a534-746d-9e9d-04035b06bc79
        name: "Loft never reads a credential file to classify usage."
      - key: 01a17d59-37d3-7407-b1b0-e8448b1be8ca
        name: "The accounting checkpoint retains the raw cumulative cache-write count."
      - key: 01a17d59-37d3-7407-b1b0-e84595ee6fd4
        name: "Account identifiers, email addresses, access tokens and refresh tokens are not retained in adapter state or events."
