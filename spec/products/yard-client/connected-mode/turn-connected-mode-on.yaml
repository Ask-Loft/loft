key: 01a20dc8-c593-7357-875c-81f0ef6e3543
slug: turn-connected-mode-on
name: "Turn connected mode on"
body: |
  Connected mode is off unless the person turns it on, and then Yard Client works as it always has, keeping Yard Log on the machine alone. Two variables of the environment turn it on: `LOFT_YARD_SERVER_ENDPOINT`, the base address of Yard Server, to which each request adds its own path, and of which a trailing `/` is no part, and `LOFT_YARD_SERVER_TOKEN`, the token Yard Server admits the person by. A request that the contract adds later adds its own path to the same address, with no new variable.

  In connected mode, Yard Log is still written on the machine first and committed with the work as before; the versions written are also copied into the outbox and sent to Yard Server from there, in the background. The answers of the person come in a later wave.
realizes:
  - 01a13a90-3554-7631-bb13-097e6805bffe
  - 01a16469-559e-73c4-85f2-71a7729da1ec
mentions:
  - 01a20dc8-c58a-758b-b099-8a0a2a0b43e3
requirements:
  - key: 01a20dc8-c593-7357-875c-81f1f9d4790e
    statement:
      form: optional
      where: "`LOFT_YARD_SERVER_ENDPOINT` and `LOFT_YARD_SERVER_TOKEN` are both set to non-empty values"
      system: "Yard Client"
      shall: "copy each version an agent writes into the outbox and send it to Yard Server at the address `LOFT_YARD_SERVER_ENDPOINT` names."
    criteria:
      - key: 01a20dc8-c593-7357-875c-81f22889dbb7
        name: "A version written with both variables set gets an entry in the outbox."
      - key: 01a20dc8-c593-7357-875c-81f36e63a71c
        name: "Each request for Yard Server goes to the address `LOFT_YARD_SERVER_ENDPOINT` names, followed by the request's path with one `/` between them."
      - key: 01a20dc8-c593-7357-875c-81f4c822ad5d
        name: "Each request for Yard Server carries the token `LOFT_YARD_SERVER_TOKEN` names as a bearer token in its `Authorization` header."
      - key: 01a21980-c4f6-7743-90bb-8eeb58974558
        name: "An address that differs from another only by a trailing `/` names the same Yard Server, so an entry written under either is sent under the other."
  - key: 01a20dc8-c593-7357-875c-81f5e3e9f4d1
    statement:
      form: event_driven
      when: "either of `LOFT_YARD_SERVER_ENDPOINT` and `LOFT_YARD_SERVER_TOKEN` is unset or empty"
      system: "Yard Client"
      shall: "keep Yard Log on the machine alone, as it does without connected mode."
    criteria:
      - key: 01a20dc8-c593-7357-875c-81f6099c291e
        name: "With neither variable set, no write puts an entry in the outbox."
      - key: 01a20dc8-c593-7357-875c-81f708389d14
        name: "With only one of the variables set to a non-empty value, no write puts an entry in the outbox."
      - key: 01a20dc8-c593-7357-875c-81f8e7dd5a80
        name: "With either variable empty, no write puts an entry in the outbox."
      - key: 01a20dc8-c593-7357-875c-81f9a2210c2f
        name: "No `loft yard` command makes a request to Yard Server."
      - key: 01a20dc8-c593-7357-875c-81fae3de4b67
        name: "Each `loft yard` command gives the same result as without connected mode."
  - key: 01a20dc8-c593-7357-875c-81fba7223abd
    statement:
      form: ubiquitous
      system: "Yard Client"
      shall: "send the token `LOFT_YARD_SERVER_TOKEN` names only to Yard Server, and write it to no file."
    criteria:
      - key: 01a20dc8-c593-7357-875c-81fc7f4c29ff
        name: "No file of the outbox holds the token."
      - key: 01a20dc8-c593-7357-875c-81fdda5e8ef8
        name: "No file of Yard Log holds the token."
      - key: 01a20dc8-c593-7357-875c-81fe7288a2dd
        name: "The token goes with no request but those for Yard Server."
  - key: 01a20dc8-c593-7357-875c-81ff56d61d80
    statement:
      form: unwanted
      if: "`LOFT_YARD_SERVER_ENDPOINT` names neither an `https` address nor an `http` address on the loopback interface"
      system: "Yard Client"
      shall: "make no request to it and leave every entry of the outbox in place."
    criteria:
      - key: 01a20dc8-c593-7357-875c-8200cbabf263
        name: "An `https` address is accepted."
      - key: 01a20dc8-c593-7357-875c-8201b06c53cf
        name: "An `http` address on the loopback interface is accepted."
      - key: 01a20dc8-c593-7357-875c-8202fa019217
        name: "An `http` address off the loopback interface is never contacted."
      - key: 01a20dc8-c593-7357-875c-8203782fac5a
        name: "`loft yard flush` ends `failed`, and its error names the refused address."
