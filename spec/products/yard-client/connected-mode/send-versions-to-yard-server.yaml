key: 01a20dc8-c593-7357-875c-81d1ad8af92a
slug: send-versions-to-yard-server
name: "Send versions to Yard Server"
body: |
  One sending serves every caller: `loft yard flush` runs it, whoever starts it. It takes the oldest entries of the outbox for its address, at most 16 and at most 1 MiB of them, sends them as one batch of versions and settles each entry by what Yard Server answers for its version, then takes the next batch, until no entry is left that it may send in this run. A batch that does not go stays where it is, and the run ends; the next run sends it again. While Yard Server cannot be reached, nothing goes and nothing is lost.

  No command an agent or a hook runs waits for Yard Server: `loft yard write`, `loft yard task` and `loft yard published` only put entries, and the session of the agent host runs the sending in the background, as "Flush in the background" states. Only one sending runs at a time for each home of Yard, under the lock `~/.yard/flush.lock`, so that two sessions never send one batch twice; a sending that finds the lock held ends at once, and the next beat of its session tries again. A run ends by itself after 5 minutes, so that a long backlog on a slow link does not hold the lock for longer.

  Yard Server answers each version of a batch with an outcome of its own: it stored it, it already held it, it held another version under the same key, it refused it, or it will take it later. A version it holds is gone from the outbox; a version it will never take is moved into `~/.yard/outbox/dead/` with the reason, so that it holds up no other; a version it will take later stays for a later run. A refusal of the whole batch that Yard Server may lift later names the time to come back, and the sending keeps away until then.

  The order of versions is the order of their keys, which grow with time, and Yard Server may count on it as a best effort only: it breaks around an entry passed over, between the branches of two locks, and between two versions written by two commands within one millisecond.
realizes:
  - 01a13a90-3554-7631-bb13-097e6805bffe
  - 01a16469-559e-73c4-85f2-71a7729da1ec
mentions:
  - 01a20dc8-c58a-758b-b099-8a0a2a0b43e3
requirements:
  - key: 01a20dc8-c593-7357-875c-81d9c0d5a964
    statement:
      form: ubiquitous
      system: "A `loft yard` command other than `flush`"
      shall: "make no request to Yard Server."
    criteria:
      - key: 01a213cb-9c28-769e-b7c8-43ffc3365854
        name: "`loft yard write`, `loft yard task` and `loft yard published` that add versions make no request to Yard Server."
      - key: 01a20dc8-c593-7357-875c-81d5f6da6742
        name: "A writing command gives the same outcome, exit status and JSON document whether or not Yard Server can be reached."
      - key: 01a20dc8-c593-7357-875c-81da6e94fefe
        name: "`loft yard codex hook` makes no request to Yard Server, with entries waiting in the outbox."
      - key: 01a20dc8-c593-7357-875c-81db76e880d5
        name: "`loft yard claude hook` makes no request to Yard Server, with entries waiting in the outbox."
      - key: 01a20dc8-c593-7357-875c-81dc17df3dc1
        name: "The page server makes no request to Yard Server, with entries waiting in the outbox."
  - key: 01a20dc8-c593-7357-875c-81de86c8a7e6
    statement:
      form: ubiquitous
      system: "The sending"
      shall: "take into one batch of versions the oldest entries of the outbox for its address, in the order of their version keys, at most 16 of them and at most 1 MiB of entry files in all, and at least one."
    criteria:
      - key: 01a20dc8-c593-7357-875c-81df3a9589ac
        name: "With 17 small entries for the address, the batch holds the 16 oldest and the newest goes in the next batch."
      - key: 01a20dc8-c593-7357-875c-81e08eb59c4c
        name: "The records of the batch are in the order of their version keys."
      - key: 01a213cb-9c28-769e-b7c8-4400055b787e
        name: "An entry that would bring the entry files of a batch over 1 MiB goes in the next batch."
      - key: 01a213cb-9c28-769e-b7c8-4401ef03aa57
        name: "An entry whose file alone is larger than 1 MiB goes in a batch of its own."
      - key: 01a21406-1007-7756-963c-231ecad404f9
        name: "The body of a batch is no larger than the entry files it carries together."
      - key: 01a20dc8-c593-7357-875c-81e1a071d50a
        name: "Until a batch goes, the next run takes the same oldest entries again, before any newer ones."
      - key: 01a20dc8-c593-7357-875c-81e26152c5c3
        name: "With no entry for the address, no request is made."
  - key: 01a213cb-9c28-769e-b7c8-440245e5d079
    statement:
      form: event_driven
      when: "Yard Server has answered a batch of versions with `200`, `400` or `413`"
      system: "the sending"
      shall: "take the next batch, until no entry for its address is left that it has not taken in this run."
    criteria:
      - key: 01a213cb-9c28-769e-b7c8-4403c4fe81e3
        name: "With 40 small entries for the address, one run sends three batches."
      - key: 01a213cb-9c28-769e-b7c8-44041d79bbe5
        name: "An entry put into the outbox while a batch was on its way goes in a later batch of the same run."
      - key: 01a21406-1007-7756-963c-231ff029b03e
        name: "An entry that a run has taken once is not taken again in the same run, whatever became of it."
      - key: 01a213cb-9c28-769e-b7c8-440585b9e102
        name: "The run ends once no entry for the address is left that it has not taken."
  - key: 01a21406-1007-7756-963c-2320393e8670
    statement:
      form: ubiquitous
      system: "A run of the sending"
      shall: "take no new batch once 5 minutes have passed since it began."
    criteria:
      - key: 01a21406-1007-7756-963c-232175bd18f4
        name: "A run that has sent for 5 minutes ends after the batch on its way is settled, and the entries left stay in the outbox."
      - key: 01a21406-1007-7756-963c-2322921b8225
        name: "A run that ends this way gives the outcome `sent` and counts the entries left as `remaining`."
      - key: 01a21406-1007-7756-963c-2323b1bcc7c2
        name: "The run reads the time from the clock port, so that a test passes 5 minutes without waiting them."
  - key: 01a20dc8-c593-7357-875c-81e4c864dfdc
    statement:
      form: ubiquitous
      system: "The sending"
      shall: "send a batch of versions as `POST <endpoint>/batches`, with the content type `application/json`."
    criteria:
      - key: 01a20dc8-c593-7357-875c-81e5c11e1ea8
        name: "The request's body is the batch of versions."
      - key: 01a20dc8-c593-7357-875c-81e6f263b0fb
        name: "The request carries the content type `application/json`."
  - key: 01a21406-1007-7756-963c-23244756938d
    statement:
      form: ubiquitous
      system: "The sending"
      shall: "wait at most 10 seconds for Yard Server to answer a batch, or the number of seconds `LOFT_YARD_SERVER_TIMEOUT` names."
    criteria:
      - key: 01a21406-1007-7756-963c-2325ca64a845
        name: "An answer that has not arrived in full 10 seconds after the batch was sent is treated as no answer."
      - key: 01a213cb-9c28-769e-b7c8-4413dbde71be
        name: "With `LOFT_YARD_SERVER_TIMEOUT` set to a positive whole number of seconds, that number replaces 10."
  - key: 01a21406-1007-7756-963c-23268e49416d
    statement:
      form: unwanted
      if: "`LOFT_YARD_SERVER_TIMEOUT` is set to a value that is not a positive whole number of seconds"
      system: "the sending"
      shall: "make no request and end the run as `failed`, naming the variable and its value."
    criteria:
      - key: 01a213cb-9c28-769e-b7c8-4414fcf3ed3a
        name: "The simulator records no request."
      - key: 01a21406-1007-7756-963c-2327f9848aed
        name: "The error names `LOFT_YARD_SERVER_TIMEOUT` and the value it holds."
  - key: 01a20dc8-c593-7357-875c-81e7d44446c5
    statement:
      form: event_driven
      when: "Yard Server answers a batch of versions with `200`"
      system: "the sending"
      shall: "settle each entry of the batch by the outcome Yard Server gives its version."
    criteria:
      - key: 01a20dc8-c593-7357-875c-81e88d3d0e76
        name: "An entry whose version is `stored` is gone from the outbox."
      - key: 01a213cb-9c28-769e-b7c8-4406365d8e66
        name: "An entry whose version is `held` is gone from the outbox."
      - key: 01a213cb-9c28-769e-b7c8-44076ef9e63f
        name: "An entry whose version is in `conflict` is moved into `~/.yard/outbox/dead/` with the reason `conflict`."
      - key: 01a213cb-9c28-769e-b7c8-44080d01e290
        name: "An entry whose version is `refused` is moved into `~/.yard/outbox/dead/` with the reason `refused` and the code Yard Server gave."
      - key: 01a21406-1007-7756-963c-232899501d87
        name: "An entry whose version Yard Server will take `later` stays in the outbox, and a later run sends it again."
      - key: 01a20dc8-c593-7357-875c-81e92b6a6873
        name: "An entry put into the outbox while the batch was on its way stays."
  - key: 01a21406-1007-7756-963c-23290da47544
    statement:
      form: unwanted
      if: "an answer of `200` does not read, or names no outcome this `loft` knows for a version of the batch"
      system: "the sending"
      shall: "leave each entry of the batch it cannot settle in the outbox and end the run as `failed`."
    criteria:
      - key: 01a21406-1007-7756-963c-232a3844f2a0
        name: "After an answer of `200` that is not JSON, every entry of the batch stays and the outcome is `failed`."
      - key: 01a21406-1007-7756-963c-232b090998a7
        name: "An entry whose version the answer leaves out stays, while the entries the answer settles are settled."
      - key: 01a21406-1007-7756-963c-232c0196f55b
        name: "An entry whose version has an outcome this `loft` does not know stays."
  - key: 01a21406-1007-7756-963c-232d9901509d
    statement:
      form: unwanted
      if: "an entry cannot be removed from the outbox or moved into `~/.yard/outbox/dead/` once Yard Server has answered for it"
      system: "the sending"
      shall: "leave it where it is and end the run as `failed`, with an error of the kind `outbox` that names it."
    criteria:
      - key: 01a21406-1007-7756-963c-232e9257a0ee
        name: "The entry is not sent again in the same run."
      - key: 01a21406-1007-7756-963c-232f2d15b124
        name: "The error is of the kind `outbox` and names the entry's file."
  - key: 01a213cb-9c28-769e-b7c8-44093a9d9371
    statement:
      form: unwanted
      if: "Yard Server answers a batch of versions with `400` or `413`"
      system: "the sending"
      shall: "move each entry of the batch into `~/.yard/outbox/dead/` with the status and the code of the answer as its reason."
    criteria:
      - key: 01a213cb-9c28-769e-b7c8-440a4c4d3e0e
        name: "After a `413`, the batch's one entry is in `~/.yard/outbox/dead/` with the reason `413` and its code."
      - key: 01a213cb-9c28-769e-b7c8-440bf3183da1
        name: "After a `400`, every entry of the batch is in `~/.yard/outbox/dead/` with the reason `400` and its code."
      - key: 01a213cb-9c28-769e-b7c8-440c30a4edac
        name: "The next batch is sent in the same run."
  - key: 01a213cb-9c28-769e-b7c8-440dfd7f92e4
    statement:
      form: unwanted
      if: "Yard Server answers a batch of versions with `429` or `503` and a `Retry-After`"
      system: "the sending"
      shall: "leave the batch's entries in the outbox, end the run as `paused`, and make no request to that address before the time `Retry-After` names."
    criteria:
      - key: 01a213cb-9c28-769e-b7c8-440e97f8fa6b
        name: "No entry of the batch leaves the outbox."
      - key: 01a21406-1007-7756-963c-2330343a3d6f
        name: "The run that received the answer ends with the outcome `paused`, even where earlier batches of it went."
      - key: 01a213cb-9c28-769e-b7c8-440fa06d3e2b
        name: "A run before the named time makes no request and gives the outcome `paused`."
      - key: 01a213cb-9c28-769e-b7c8-441051faadf9
        name: "A run after the named time sends the batch again."
      - key: 01a213cb-9c28-769e-b7c8-441144b1d80f
        name: "A `Retry-After` of a number of seconds and one of an HTTP date are both read."
      - key: 01a21406-1007-7756-963c-23316cb33313
        name: "A `Retry-After` of 0 seconds, or of a date already past, lets the next run send."
      - key: 01a213cb-9c28-769e-b7c8-441261bba139
        name: "A `429` or `503` without a `Retry-After`, or with one that does not read, is a failure as any other status is."
  - key: 01a20dc8-c593-7357-875c-81eac0f01173
    statement:
      form: unwanted
      if: "Yard Server answers a batch of versions with another status, or gives no answer in time"
      system: "the sending"
      shall: "leave the batch's entries in the outbox and end the run as `failed`."
    criteria:
      - key: 01a20dc8-c593-7357-875c-81eb86f2fa9a
        name: "After a refusal of the token, every entry of the batch stays in the outbox."
      - key: 01a20dc8-c593-7357-875c-81ece9cd459e
        name: "After a server error, every entry of the batch stays in the outbox."
      - key: 01a20dc8-c593-7357-875c-81eda327f1fc
        name: "Where Yard Server accepts the connection and never answers, the sending gives up when its wait has passed and every entry stays."
      - key: 01a20dc8-c593-7357-875c-81ee69667a91
        name: "Where no server listens at the address, every entry stays."
      - key: 01a20dc8-c593-7357-875c-81efcf58f20d
        name: "No request follows the failed one within the same run."
  - key: 01a213cb-9c28-769e-b7c8-4415893db333
    statement:
      form: unwanted
      if: "a sending starts while another sending holds `~/.yard/flush.lock`"
      system: "the sending that starts"
      shall: "make no request and end at once with the outcome `busy`."
    criteria:
      - key: 01a213cb-9c28-769e-b7c8-4416b162db84
        name: "The simulator records no request from the sending that starts, and its outcome is `busy`."
      - key: 01a213cb-9c28-769e-b7c8-441741c9bd05
        name: "The sending that holds the lock sends every batch it would have sent alone."
      - key: 01a213cb-9c28-769e-b7c8-4418e7788731
        name: "Once the sending that held the lock has ended, by itself or because its process was stopped, the next sending runs."
      - key: 01a21406-1007-7756-963c-23322346e3f2
        name: "A write that puts entries into the outbox while a sending runs is not held up by it."
      - key: 01a21406-1007-7756-963c-2333edd0e2a2
        name: "Two homes of Yard, as `LOFT_YARD_HOME` names them, have a lock each."
