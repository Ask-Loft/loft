slug: software-plant
name: "Software Plant"
body: "Simulators of the external systems that Loft depends on. Tests run Loft's own binaries, unchanged, against a simulator's scripted and repeatable behavior instead of the real system, and a contract suite shared with the real system keeps each simulator honest."
