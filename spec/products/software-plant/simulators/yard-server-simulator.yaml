key: 01a20de0-8348-72dc-8ab4-3dabeb7b7437
slug: yard-server-simulator
name: "Yard Server simulator"
body: |
  An HTTP endpoint on the test machine that stands in for Yard Server. A test points the binary under test at it with `LOFT_YARD_SERVER_ENDPOINT` and `LOFT_YARD_SERVER_TOKEN`, scripts how it answers, and reads the requests it received and the versions it stored. Its Requirements state Yard Server's wire contract for a batch of versions, which a real Yard Server is built to pass in the same contract suite, whose real half runs only on demand against `LOFT_YARD_SERVER_CONTRACT_ADDRESS` with `LOFT_YARD_SERVER_CONTRACT_TOKEN`.

  It keeps what it stores in memory, by each version's key, in the order it first received them, and forgets it when the test ends. Every refusal is an RFC 9457 problem document with a `code`, named as the remote's are: `unauthenticated`, `invalid_request`, `not_found`, `method_not_allowed`, `unsupported_media_type`, `payload_too_large`, `rate_limited` and `service_unavailable`.
tags:
  - plant-simulator
realizes:
  - 01a12ff0-f5e5-7095-8fa8-24b9ff6a761e
mentions:
  - 01a20dc8-c58a-758b-b099-8a0a2a0b43e3
requirements:
  - key: 01a20de0-8348-72dc-8ab4-3dac71c6177d
    statement:
      form: ubiquitous
      system: "The Yard Server simulator"
      shall: "record each request it receives, in the order received."
    criteria:
      - key: 01a20de0-8348-72dc-8ab4-3dad2112bdfa
        name: "A test reads the method, the path, the headers and the body of every request a run made."
      - key: 01a20de0-8348-72dc-8ab4-3daeb89cc1e0
        name: "A scenario in which no run makes a request records no request."
  - key: 01a20de0-8348-72dc-8ab4-3daf1614e45b
    statement:
      form: ubiquitous
      system: "The Yard Server simulator"
      shall: "behave toward each request as its scenario names: as Yard Server's contract states, by refusing the connection, with one error status, by asking to come back later, by refusing named versions, by putting named versions off until later, by answering with the status and the body it names, by refusing bodies larger than a size it names, or with silence."
    criteria:
      - key: 01a20de0-8348-72dc-8ab4-3db061a809f1
        name: "An accepting scenario answers each request as Yard Server's contract states."
      - key: 01a20de0-8348-72dc-8ab4-3db1aae54829
        name: "A refusing scenario refuses each connection."
      - key: 01a20de0-8348-72dc-8ab4-3db23389e261
        name: "An error scenario answers each request with the status it names, as a problem document."
      - key: 01a20de0-8348-72dc-8ab4-3db3d08522be
        name: "A silent scenario accepts each connection and sends no answer."
      - key: 01a20de0-8348-72dc-8ab4-3db45e1d0135
        name: "A hanging-up scenario stores the batch as an accepting one does and closes the connection before a byte of its answer is sent."
      - key: 01a20de0-8348-72dc-8ab4-3db52876f4e5
        name: "A late scenario stores the batch as an accepting one does and sends its answer only after the delay it names."
      - key: 01a213ce-418d-753d-a2da-ac738a0a774b
        name: "A scenario that asks to come back later answers each request `429` with the code `rate_limited`, or `503` with the code `service_unavailable`, and the `Retry-After` it names."
      - key: 01a213ce-418d-753d-a2da-ac74599ef1e3
        name: "A scenario that refuses named versions answers each of them `refused` with the code it names, and stores and answers the others as an accepting one does."
      - key: 01a21406-1006-7412-b332-118ab687b777
        name: "A scenario that puts named versions off answers each of them `later` with the code it names, stores none of them, and stores and answers the others as an accepting one does."
      - key: 01a21406-1006-7412-b332-118b5ca18aa2
        name: "A scenario that answers with a body it names answers with the status it names, `200` where it names none, and exactly that body, so that a test can give an answer that does not read, leaves a version out, names an unknown outcome or comes from a proxy on the way."
      - key: 01a21dc4-1382-7665-bfa6-7061e894832b
        name: "A scenario that refuses bodies larger than a size it names answers such a body `413` with the code `payload_too_large`, and stores and answers a smaller one as an accepting scenario does."
  - key: 01a20de0-8348-72dc-8ab4-3db6eca90288
    statement:
      form: ubiquitous
      system: "The Yard Server simulator"
      shall: "admit a request only with the bearer token its scenario names."
    criteria:
      - key: 01a20de0-8348-72dc-8ab4-3db7fa378c36
        name: "A request without `Authorization: Bearer <token>` is answered `401 Unauthorized` with the code `unauthenticated`."
      - key: 01a20de0-8348-72dc-8ab4-3db882baff76
        name: "A request with another token is answered `401 Unauthorized` with the code `unauthenticated`."
      - key: 01a20de0-8348-72dc-8ab4-3db97410ad9c
        name: "A refused request stores nothing."
  - key: 01a20de0-8348-72dc-8ab4-3dba859a3cb6
    statement:
      form: event_driven
      when: "the Yard Server simulator receives a batch of versions as `POST <address>/batches`"
      system: "the simulator"
      shall: "store each version it does not yet hold and answer `200` with each version's key and outcome."
    criteria:
      - key: 01a20de0-8348-72dc-8ab4-3dbb2d996fa4
        name: "The answer is a JSON object of `format: yardlog-answer/1` and `outcomes`, one for each record sent, in the order sent."
      - key: 01a20de0-8348-72dc-8ab4-3dbc5cd64e8e
        name: "Each outcome holds the version's key as `version` and `outcome`, with `code` beside an outcome of `refused` or `later`."
      - key: 01a213ce-418d-753d-a2da-ac753d3ff088
        name: "A version the simulator did not hold before is answered `stored`."
      - key: 01a21406-1006-7412-b332-118c4411a2ca
        name: "A record that holds a version's key but is not a record of a batch of versions is answered `refused` with the code `invalid_record`, and the other records of the batch are stored."
      - key: 01a20de0-8348-72dc-8ab4-3dbd9fac17e4
        name: "A test reads the records the simulator holds, in the order it first received them."
  - key: 01a20de0-8348-72dc-8ab4-3dbea9cf2c72
    statement:
      form: ubiquitous
      system: "The Yard Server simulator"
      shall: "hold a version once by its key, whichever Yard Log a batch names it under."
    criteria:
      - key: 01a20de0-8348-72dc-8ab4-3dbf426be513
        name: "A batch sent twice is answered `200` both times, its versions `held` the second time, and leaves one record for each version."
      - key: 01a20de0-8348-72dc-8ab4-3dc0f07af9eb
        name: "A version sent under another Yard Log's key is answered `held` and leaves one record, under the first Yard Log's key."
      - key: 01a20de0-8348-72dc-8ab4-3dc1874b3e23
        name: "A version sent again with other contents is answered `conflict` and leaves the first record as it was."
  - key: 01a20de0-8348-72dc-8ab4-3dc26cc4fa9d
    statement:
      form: unwanted
      if: "a request to the Yard Server simulator is not a batch of versions it can take"
      system: "the simulator"
      shall: "refuse it with a problem document and store nothing."
    criteria:
      - key: 01a20de0-8348-72dc-8ab4-3dc3c351d49c
        name: "A body that is not a JSON object of `format: yardlog-batch/1` and `records` is answered `400` with the code `invalid_request`."
      - key: 01a20de0-8348-72dc-8ab4-3dc4c72e0cf4
        name: "A batch of no record is answered `400` with the code `invalid_request`."
      - key: 01a20de0-8348-72dc-8ab4-3dc58f57b905
        name: "A batch of more than 16 records is answered `400` with the code `invalid_request`."
      - key: 01a213ce-418d-753d-a2da-ac76b7258e48
        name: "A body larger than 1 MiB is answered `413` with the code `payload_too_large`."
      - key: 01a20de0-8348-72dc-8ab4-3dc6e26db7d9
        name: "A record without a version's key is answered `400` with the code `invalid_request`."
      - key: 01a20de0-8348-72dc-8ab4-3dc71d16d06a
        name: "Another method at `/batches` is answered `405` with the code `method_not_allowed`."
      - key: 01a20de0-8348-72dc-8ab4-3dc85bffd0f6
        name: "A content type other than `application/json` is answered `415` with the code `unsupported_media_type`."
      - key: 01a20de0-8348-72dc-8ab4-3dc903794565
        name: "Another path is answered `404` with the code `not_found`."
