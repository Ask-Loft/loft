key: 01a12ff0-f5e5-7095-8fa8-24dae20a57b3
slug: git-simulator
name: "Git simulator"
body: "A `git` executable that answers the git calls Loft makes from a scenario that a test writes, in place of a real repository. A test puts it first on the search path of the binary under test. Its scenarios cover the happy path and each failure that Loft anticipates from git."
tags:
  - git
  - plant-simulator
realizes:
  - 01a12ff0-f5e5-7095-8fa8-24b9ff6a761e
mentions:
  - 01a12ff0-f5e5-7095-8fa8-24b80bc83d86
requirements:
  - key: 01a12ff0-f5e5-7095-8fa8-24e099990c21
    statement:
      form: ubiquitous
      system: "The git simulator"
      shall: "answer each git call that Loft makes as its scenario scripts it."
    criteria:
      - key: 01a12ff0-f5e5-7095-8fa8-24e11c8c2d76
        name: "The path from the repository's top level is answered as `git rev-parse --show-prefix` prints it."
      - key: 01a12ff0-f5e5-7095-8fa8-24e2b391e9c1
        name: "The current branch is answered as `git symbolic-ref --quiet --short HEAD` prints it."
      - key: 01a12ff0-f5e5-7095-8fa8-24e322a6cdd6
        name: "The status of a path is answered as `git status --porcelain=v1 -z --untracked-files=all` prints it."
      - key: 01a12ff0-f5e5-7095-8fa8-24e476591aad
        name: "The scenario is read from the file that the environment variable `SOFTWARE_PLANT_GIT_SCENARIO` names."
  - key: 01a12ff0-f5e5-7095-8fa8-24e5e160e2e5
    statement:
      form: unwanted
      if: "a git call is not one that the git simulator answers"
      system: "the git simulator"
      shall: "fail with a message that names the call."
    criteria:
      - key: 01a12ff0-f5e5-7095-8fa8-24e61cc6724b
        name: "The message names each argument of the call."
      - key: 01a12ff0-f5e5-7095-8fa8-24e768815ba2
        name: "The exit code is 2."
  - key: 01a12ff0-f5e5-7095-8fa8-24e80e9dc5e8
    statement:
      form: optional
      where: "the scenario scripts a failure"
      system: "the git simulator"
      shall: "fail as git fails."
    criteria:
      - key: 01a12ff0-f5e5-7095-8fa8-24e9a6ca24e0
        name: "Outside a repository, each call exits 128 with git's `not a git repository` message."
      - key: 01a12ff0-f5e5-7095-8fa8-24ea9ebe76a2
        name: "On a detached HEAD, `symbolic-ref` exits 1 and prints nothing."
      - key: 01a12ff0-f5e5-7095-8fa8-24ebb797ea45
        name: "A scripted git error exits with the scripted code and message."
  - key: 01a13050-9f92-73f0-b7a3-fb6f8f1ab15c
    statement:
      form: event_driven
      when: "a `git status` call arrives without `GIT_OPTIONAL_LOCKS` set to `0`"
      system: "the git simulator"
      shall: "record that the call took the index lock, as git takes it."
    criteria:
      - key: 01a13050-9f92-73f0-b7a3-fb706075669d
        name: "Such a call records `index.lock` in the directory that holds its scenario."
      - key: 01a13050-9f92-73f0-b7a3-fb71df8de3aa
        name: "A `git status` call with `GIT_OPTIONAL_LOCKS` set to `0` records no lock."
      - key: 01a13050-9f92-73f0-b7a3-fb727687b663
        name: "No other call records a lock."
  - key: 01a13070-3230-7079-8674-0f9119727740
    statement:
      form: ubiquitous
      system: "The git simulator"
      shall: "answer the git configuration calls that `loft merge-driver --install` makes as its scenario scripts them."
    criteria:
      - key: 01a13070-3230-7079-8674-0f92c25d79ec
        name: "`config --local --get <name>` prints the value of a name the scenario sets."
      - key: 01a13070-3230-7079-8674-0f9320080960
        name: "`config --local --get <name>` exits 1 and prints nothing for a name the scenario does not set."
      - key: 01a13070-3230-7079-8674-0f944ae80a03
        name: "`config --local <name> <value>` sets the name in the scenario."
  - key: 01a130de-573a-77b2-b40b-d43a68f8b582
    statement:
      form: ubiquitous
      system: "The git simulator"
      shall: "answer the calls with which `loft publish` reads a stopped merge or rebase as its scenario scripts them."
    criteria:
      - key: 01a130de-573a-77b2-b40b-d43b5f268e1a
        name: "`rev-parse -q --verify MERGE_HEAD` prints the commit being merged in a stopped merge."
      - key: 01a130de-573a-77b2-b40b-d43cf5af8c51
        name: "`rev-parse -q --verify MERGE_HEAD` exits 1 and prints nothing when no merge is stopped."
      - key: 01a130de-573a-77b2-b40b-d43d2d244ea9
        name: "`rev-parse -q --verify REBASE_HEAD` prints the commit being replayed in a stopped rebase."
      - key: 01a130de-573a-77b2-b40b-d43e335b01d7
        name: "`rev-parse -q --verify REBASE_HEAD` exits 1 and prints nothing when no rebase is stopped."
      - key: 01a130de-573a-77b2-b40b-d43fd731b46b
        name: "`rev-parse --git-path <path>` prints the path of the file that names the branch being rebased, for `rebase-merge/head-name` and `rebase-apply/head-name`."
      - key: 01a130de-573a-77b2-b40b-d4401ab22e67
        name: "`ls-files -u -z --full-name -- :/` prints the index entries of each unmerged path."
      - key: 01a130de-573a-77b2-b40b-d4416898c369
        name: "`rev-parse -q --verify <revision>:./loft.lock.json` prints the object id of the lock that the revision holds."
      - key: 01a130de-573a-77b2-b40b-d44240bd7d8a
        name: "`rev-parse -q --verify <revision>:./loft.lock.json` exits 1 and prints nothing for a revision that holds no lock."
      - key: 01a13183-078a-72f7-9a43-0aa67b0ea106
        name: "`cat-file blob <object>` prints the lock whose object id it names."
  - key: 01a1315a-f185-7564-b075-5947e608e195
    statement:
      form: ubiquitous
      system: "the git simulator"
      shall: "answer the shell alias with which `loft merge-driver --install` runs `<command> --version` as its scenario scripts it."
    criteria:
      - key: 01a1315a-f185-7564-b075-5948af47be87
        name: "`-c alias.loft-launcher=!<command> --version loft-launcher` prints the version the scenario gives the command."
      - key: 01a1315a-f185-7564-b075-5949a6ff12f3
        name: "`-c alias.loft-launcher=!<command> --version loft-launcher` exits 127 for a command the scenario does not give."
  - key: 01a144ee-c5a0-7459-bcd4-bd53e30dd595
    statement:
      form: ubiquitous
      system: "The git simulator"
      shall: "answer the calls with which `loft status --base` reads the tree at the base commit as its scenario scripts them."
    criteria:
      - key: 01a144ee-c5a0-7459-bcd4-bd545a594e0a
        name: "`merge-base HEAD <revision>` prints the base commit the scenario gives the revision."
      - key: 01a144ee-c5a0-7459-bcd4-bd5529685dd9
        name: "`merge-base HEAD <revision>` exits 1 and prints nothing for a revision the scenario gives no common ancestor."
      - key: 01a144ee-c5a0-7459-bcd4-bd56b2c62163
        name: "`merge-base HEAD <revision>` exits 128 with git's `Not a valid object name` message for a revision the scenario does not name."
      - key: 01a144ee-c5a0-7459-bcd4-bd570cd64c69
        name: "`ls-tree -r -z <commit> -- spec` prints a record for each file under `spec/` that the scenario gives the base commit."
      - key: 01a144ee-c5a0-7459-bcd4-bd58ca3ef26e
        name: "`cat-file --batch` prints each blob whose object id it reads on standard input, after a header with its object id, type and size."
  - key: 01a164cf-8fd5-7533-a02e-c04d04f5c5a9
    statement:
      form: ubiquitous
      system: "The git simulator"
      shall: "answer the calls with which `yardlog-store` finds a worktree's Yard Log as its scenario scripts them."
    criteria:
      - key: 01a164cf-8fd5-7533-a02e-c04e713e8be1
        name: "`rev-parse --show-toplevel` prints the top of the worktree that holds the directory the call runs in, resolved on disk."
      - key: 01a164cf-8fd5-7533-a02e-c04f57f25aa8
        name: "`rev-parse --git-common-dir` prints the repository's common directory as git prints it from the directory the call runs in, or the path the scenario gives it for a linked worktree."
      - key: 01a164cf-8fd5-7533-a02e-c0500b520607
        name: "`rev-parse --git-path yard` prints `yard` under the worktree's own git directory."
      - key: 01a164cf-8fd5-7533-a02e-c051c6c67714
        name: "`check-ignore -q <path>` exits 0 for a path the scenario ignores and 1 for any other."
      - key: 01a164cf-8fd5-7533-a02e-c0521d4db6c6
        name: "`config --get <name>` prints the value of a name the scenario sets, and exits 1 and prints nothing for one it does not set."
      - key: 01a164cf-8fd5-7533-a02e-c053f8d7d124
        name: "`rev-parse -q --verify <revision>:<path>` prints the object id the scenario gives the path at the revision, and exits 1 and prints nothing where it gives none."
      - key: 01a164cf-8fd5-7533-a02e-c054dfca0a97
        name: "Each of these calls run outside a repository exits 128 with git's message, except `config --get`, which exits 1."
