key: 01a13654-bf86-77e9-8fd5-8dc0ba996254
slug: loft-skill-install
name: "`loft skill install`"
body: "Writes the `loft-spec` skill into a project, or brings it to the version of the installed `loft`, and ends with the setup report, so that a rerun after an upgrade says what the machine still needs for that version. With `--server <origin>`, it installs instead the skill package that a server publishes, such as a connected document's remote, into a skill directory of its own beside `loft-spec`, after checking the package against the server's manifest."
tags:
  - checks-for-updates
  - sends-telemetry
  - writes-skill
realizes:
  - 01a13653-3ec0-76e7-bf76-fc7478b3d9fd
  - 01a13a90-3554-7631-bb13-097e6805bffe
  - bcd4525c-3adf-45dd-beed-527d654d517c
mentions:
  - 01a156aa-d52e-75b0-9a73-cb9538029bb3
requirements:
  - key: 01a13654-bf86-77e9-8fd5-8dc1dbb50264
    statement:
      form: optional
      where: "`--server` is not given"
      system: "`loft skill install`"
      shall: "write the `loft-spec` skill into the current directory."
    criteria:
      - key: 01a13654-bf86-77e9-8fd5-8dc2abcad562
        name: "A selected Claude Code package is written to `.claude/skills/loft-spec/`."
      - key: 01a13654-bf86-77e9-8fd5-8dc38e0eec9a
        name: "A selected materialized Codex package is written to `.agents/skills/loft-spec/`."
      - key: 01a13654-bf86-77e9-8fd5-8dc45d64494e
        name: "Each materialized package is the composition of the skill that `loft` embeds."
      - key: 01a13654-bf86-77e9-8fd5-8dc58145c4bd
        name: "A file that a replaced materialized directory held and its package does not is removed."
      - key: 01a13654-bf86-77e9-8fd5-8dc69b2cc428
        name: "No file outside the two skill directories and `.claude/settings.json` is written."
      - key: 01a1549d-6653-72d3-930f-ce5d71b3edcf
        name: "With `--no-plugin`, no file outside the two skill directories is written."
      - key: 01a13654-bf86-77e9-8fd5-8dc705e61e20
        name: "The command writes the skill where there is no `spec/`."
  - key: 01a13654-bf86-77e9-8fd5-8dc8af39c9d9
    statement:
      form: optional
      where: "a selected skill destination is a materialized directory"
      system: "`loft skill install`"
      shall: "replace that directory whole, through a directory written beside it and a rename."
    criteria:
      - key: 01a13654-bf86-77e9-8fd5-8dc99bc8eceb
        name: "The package is written to a temporary directory beside the skill directory."
      - key: 01a13654-bf86-77e9-8fd5-8dca5c8fb5b6
        name: "The temporary directory is renamed into place."
      - key: 01a13654-bf86-77e9-8fd5-8dcb3b697eba
        name: "No temporary directory remains after the command."
  - key: 01a13654-bf86-77e9-8fd5-8dcc0ed7b5b9
    statement:
      form: unwanted
      if: "a skill directory cannot be written"
      system: "`loft skill install`"
      shall: "report an error and exit 1."
    criteria:
      - key: 01a13654-bf86-77e9-8fd5-8dcdad40c3a6
        name: "The error names the directory."
      - key: 01a13654-bf86-77e9-8fd5-8dce7f16041a
        name: "A skill directory the command has not replaced is left as it was."
  - key: 01a13654-bf86-77e9-8fd5-8dcf2edee532
    statement:
      form: optional
      where: "`--format json` is given"
      system: "`loft skill install`"
      shall: "name the skill directories it wrote in its JSON document."
    criteria:
      - key: 01a13654-bf86-77e9-8fd5-8dd023338c07
        name: "The document lists each skill directory written."
      - key: 01a13654-bf86-77e9-8fd5-8dd1585f57e4
        name: "The outcome is `installed` when the selected hosts have their skills available."
      - key: 01a13654-bf86-77e9-8fd5-8dd2a7db3828
        name: "An error is listed among the document's errors."
  - key: 01a18504-d7d1-7279-8543-2527a587216e
    statement:
      form: optional
      where: "`--server` is not given"
      system: "`loft skill install`"
      shall: "end with the setup report."
    criteria:
      - key: 01a18504-d7d1-7279-8543-2528430afba3
        name: "The text output ends with the report's steps."
      - key: 01a18504-d7d1-7279-8543-25294bdf7824
        name: "The JSON document carries the report as `setup`."
      - key: 01a18504-d7d1-7279-8543-252ae874f867
        name: "Where the Claude Code skill is not selected, the report is given without `plugin`."
      - key: 01a18504-d7d1-7279-8543-252bdbfb26b2
        name: "With `--server`, no report is given."
      - key: 01a18504-d7d1-7279-8543-252c81e11295
        name: "A refusal gives no report."
  - key: 01a156af-5306-73ab-a0e4-ce9ba1b99a5f
    statement:
      form: optional
      where: "`--server <origin>` is given"
      system: "`loft skill install`"
      shall: "install the skill package that the server publishes into a skill directory of its own."
    criteria:
      - key: 01a156af-5306-73ab-a0e4-ce9c87899113
        name: "The command reads the server's skill manifest from `<origin>/.well-known/loft-skill.json`."
      - key: 01a156af-5306-73ab-a0e4-ce9d02c3b2c6
        name: "The manifest is a JSON object holding `name`, `version`, `package`, `sha256` and `length`."
      - key: 01a156af-5306-73ab-a0e4-ce9e81baa675
        name: "`package` is the path, on the same origin, of the package, a gzip-compressed tar archive."
      - key: 01a156af-5306-73ab-a0e4-ce9f412d731b
        name: "The package is written to `.claude/skills/<name>/` and to `.agents/skills/<name>/`, where `<name>` is the manifest's."
      - key: 01a156af-5306-73ab-a0e4-cea066dfb2d7
        name: "The `loft-spec` skill directories are left as they were."
      - key: 01a156af-5306-73ab-a0e4-cea1d0f3b1d2
        name: "`.claude/settings.json` is not written."
      - key: 01a156af-5306-73ab-a0e4-cea241df3b60
        name: "No plugin is enabled."
      - key: 01a156af-5306-73ab-a0e4-cea362fca286
        name: "The server is reached whatever the telemetry and update-check switches say."
  - key: 01a156af-5306-73ab-a0e4-cea4ef635765
    statement:
      form: unwanted
      if: "the package's SHA-256 digest or its length is not the one the manifest gives"
      system: "`loft skill install`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a156af-5306-73ab-a0e4-cea59735e3ab
        name: "The digest and the length are checked before any file is written."
      - key: 01a156af-5306-73ab-a0e4-cea61f7d1693
        name: "The error names the digest the manifest gives and the digest of the package received."
      - key: 01a156af-5306-73ab-a0e4-cea73d01177d
        name: "Nothing is written."
  - key: 01a156af-5306-73ab-a0e4-cea86c99db76
    statement:
      form: unwanted
      if: "an entry of the package lies outside its skill directory"
      system: "`loft skill install`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a156af-5306-73ab-a0e4-cea9c25c537a
        name: "An entry with an absolute path is refused."
      - key: 01a156af-5306-73ab-a0e4-ceaa4a2541d9
        name: "An entry whose path holds a `..` segment is refused."
      - key: 01a156af-5306-73ab-a0e4-ceab7ab49d82
        name: "A symbolic link or a hard link entry is refused."
      - key: 01a156af-5306-73ab-a0e4-ceacf8fcbc3d
        name: "The error names the entry."
      - key: 01a156af-5306-73ab-a0e4-cead8bd7d9ae
        name: "Nothing is written."
  - key: 01a156af-5306-73ab-a0e4-ceaeec66c69f
    statement:
      form: unwanted
      if: "the manifest's `name` is `loft-spec` or is not a slug"
      system: "`loft skill install`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a156af-5306-73ab-a0e4-ceaf3797e1ea
        name: "A name of lowercase letters, digits and hyphens other than `loft-spec` is accepted."
      - key: 01a156af-5306-73ab-a0e4-ceb0df1795a4
        name: "The error names the name."
      - key: 01a156af-5306-73ab-a0e4-ceb198d92b2a
        name: "Nothing is written."
  - key: 01a156af-5306-73ab-a0e4-ceb2d56151ff
    statement:
      form: unwanted
      if: "`<origin>` is neither an `https` origin nor an `http` origin on the loopback interface"
      system: "`loft skill install`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a156af-5306-73ab-a0e4-ceb37e080cce
        name: "An `http` origin off the loopback interface is never contacted."
      - key: 01a156af-5306-73ab-a0e4-ceb44e711618
        name: "The error names the origin."
      - key: 01a156af-5306-73ab-a0e4-ceb5ad22917a
        name: "Nothing is written."
  - key: 01a156af-5307-7725-b0b7-f7c193b23fb6
    statement:
      form: unwanted
      if: "`<origin>` holds a path, a query or a fragment"
      system: "`loft skill install`"
      shall: "refuse as a usage error and exit 2."
    criteria:
      - key: 01a156af-5307-7725-b0b7-f7c23066d56e
        name: "The error names the origin."
      - key: 01a156af-5307-7725-b0b7-f7c3e1c0bab7
        name: "No connection is opened."
  - key: 01a156af-5307-7725-b0b7-f7c4510ac446
    statement:
      form: unwanted
      if: "the server refuses the connection, does not answer, or gives a manifest that does not read"
      system: "`loft skill install`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a156af-5307-7725-b0b7-f7c581e6b6fa
        name: "The error names the origin."
      - key: 01a156af-5307-7725-b0b7-f7c6ccc9dcf4
        name: "Nothing is written."
  - key: 01a17844-cbcb-77bf-af93-ba95cf8a740a
    statement:
      form: ubiquitous
      system: "`loft skill install`"
      shall: "select the hosts with `--host codex|claude-code|all`, defaulting to `all`."
    criteria:
      - key: 01a17844-cbcb-77bf-af93-ba96b26094e4
        name: "An omitted host option and an explicit all option install both host packages."
      - key: 01a17844-cbcb-77bf-af93-ba97849d5605
        name: "Selecting Codex writes only its package and leaves Claude Code files and settings unchanged."
      - key: 01a17844-cbcb-77bf-af93-ba9899a0a2a8
        name: "Selecting Claude Code writes only its package and leaves Codex files unchanged."
      - key: 01a17844-cbcb-77bf-af93-ba99e75f4bed
        name: "An unknown host is a usage error before any file is written."
      - key: 01a17844-cbcb-77bf-af93-ba9af5ee5df5
        name: "The JSON document lists only the skill directories written."
  - key: 01a17844-cbcb-77bf-af93-ba9ba63a0b99
    statement:
      form: optional
      where: "the selected Codex destination is the repository discovery link"
      system: "the skill installer"
      shall: "preserve that link without writing the source it exposes."
    criteria:
      - key: 01a17844-cbcb-77bf-af93-ba9c3e6fb522
        name: "The known link is .agents/skills/loft-spec pointing relatively to ../../crates/loft-cli/skill/loft-spec, with the router and Codex metadata present in that source."
      - key: 01a17844-cbcb-77bf-af93-ba9d055e3558
        name: "Repeated installation preserves the link, its target and the source bytes."
      - key: 01a17844-cbcb-77bf-af93-ba9ef9131ceb
        name: "A preserved link is reported as unchanged in text and is omitted from the JSON list of directories written."
  - key: 01a17844-cbcb-77bf-af93-ba9f9baa7524
    statement:
      form: unwanted
      if: "a selected skill destination is a broken or unexpected symbolic link"
      system: "the skill installer"
      shall: "refuse before writing any selected skill or plugin settings."
    criteria:
      - key: 01a17844-cbcb-77bf-af93-baa026e0f72c
        name: "The error names the destination and leaves the link and its target unchanged."
      - key: 01a17844-cbcb-77bf-af93-baa10982a76c
        name: "An invalid unselected destination does not prevent installation for the selected host."
