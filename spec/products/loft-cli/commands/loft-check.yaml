key: 668e0630-0adc-4eca-bf61-b32dbaece7d0
slug: loft-check
name: "`loft check`"
body: "Runs the validator and then the linter over the tree, with an exit code a CI job can gate on. With `--baseline <revision>` it also lints the tree at the commit where HEAD left the revision and marks each finding as introduced by the branch or preexisting, so that a review of a change reads the findings the change brought in apart from those it inherited. A finding is the same at both sides when its rule, its subjects and its term are, wherever its node now lies and whatever count its message gives."
tags:
  - checks-for-updates
  - reads-tree
  - sends-telemetry
realizes:
  - bcd4525c-3adf-45dd-beed-527d654d517c
requirements:
  - key: e45fe93c-7771-4987-b8ab-e7ad4777e86e
    statement:
      form: ubiquitous
      system: "`loft check`"
      shall: "run the validator and then the linter over the tree."
    criteria:
      - key: fe67ba08-8af0-4f96-a32c-e8f9d72fbe1a
        name: "Validation errors are printed before lint findings."
      - key: 5eeebc60-25b0-4808-a30a-af3df11a5af3
        name: "Every validation error is reported, not only the first."
      - key: 79eddea6-1bb7-4bb2-acf9-54ab122d67d4
        name: "`loft check` exits 1 when the validator reports an error."
      - key: 3464df61-d8bb-4f31-a441-c33eeb13ff81
        name: "Without `--fail-on`, `loft check` exits 0 when only lint findings exist."
      - key: 7b7845cc-3beb-470d-b452-85facc95db4b
        name: "Without `--format json`, `loft check` prints nothing on a clean tree."
      - key: 624d55ce-9708-4494-a55b-4e7881dde35d
        name: "`loft check` exits 0 on a clean tree."
  - key: 964a39ee-cef5-413c-9bd7-5b3be4921422
    statement:
      form: unwanted
      if: "the reader reports an error"
      system: "`loft check`"
      shall: "not run the linter."
    criteria:
      - key: 2ad44810-acb8-4422-92b1-f3dea0613477
        name: "No lint finding is reported."
  - key: fc068f5f-e760-4a81-aa85-b859585e298f
    statement:
      form: unwanted
      if: "there is no `spec/` directory"
      system: "`loft check`"
      shall: "refuse and exit 1."
    criteria:
      - key: 452f3e59-140c-457a-87f4-3b65d68fc0d5
        name: "The error names the expected path."
  - key: cd618b55-2fa9-47b1-902b-40ea9b9bdc7e
    statement:
      form: optional
      where: "`--fail-on <severity>` is given without `--baseline`"
      system: "`loft check`"
      shall: "exit 1 on a finding at or above that severity."
    criteria:
      - key: 8f7510bb-b9d4-44da-9f25-3b1c9654843c
        name: "`--fail-on warning` exits 1 on a warning."
      - key: f79a6fd0-1c5b-40ec-bb41-13818808532e
        name: "`--fail-on info` exits 1 on an info finding."
      - key: aaaebd79-25c4-4f97-b9fc-306d1cfb7e20
        name: "`--fail-on hint` exits 1 on any finding."
      - key: c67a1b53-b728-4330-a985-e75ef3ad7756
        name: "A severity outside warning, info and hint is a usage error."
      - key: 990cad2c-dee4-4f13-8b94-ceb85cf8b041
        name: "`--fail-on info` exits 1 on a warning."
      - key: 8244e4b1-96ad-4b15-91fe-6a929e1dbbf6
        name: "`--fail-on warning` exits 0 when only info and hint findings exist."
  - key: 01a1354e-8c63-74ae-abcf-1d49b656d3b0
    statement:
      form: optional
      where: "`--format json` is given"
      system: "`loft check`"
      shall: "give the result of the check as its outcome."
    criteria:
      - key: 01a1354e-8c63-74ae-abcf-1d4a15afb02e
        name: "The outcome is `passed` when the tree holds no error and no finding at or above `--fail-on`."
      - key: 01a1354e-8c63-74ae-abcf-1d4b5f441b3a
        name: "The outcome is `failed` when the tree holds a read, validation or lint configuration error."
      - key: 01a1354e-8c63-74ae-abcf-1d4cec99548c
        name: "The outcome is `failed` when a finding is at or above `--fail-on`."
  - key: 01a154a3-4f92-72c0-97ef-634d180ce89b
    statement:
      form: optional
      where: "`--baseline <revision>` is given"
      system: "`loft check`"
      shall: "mark each finding introduced or preexisting against the commit where HEAD left the revision, and list the findings the tree resolved."
    criteria:
      - key: 01a154a3-4f92-72c0-97ef-634ef4f745dd
        name: "The base is the commit that `git merge-base HEAD <revision>` gives."
      - key: 01a154a3-4f92-72c0-97ef-634fd4f2e741
        name: "The base commit's tree is read from git, not from the working tree."
      - key: 01a154a3-4f92-72c0-97ef-6350ca1051b8
        name: "A finding is preexisting where the base has a finding of the same rule, the same subject keys and the same term."
      - key: 01a154a3-4f92-72c0-97ef-6351a295b879
        name: "A finding whose node lies at another file or line than at the base is preexisting."
      - key: 01a154a3-4f92-72c0-97ef-63524f50b744
        name: "A finding whose message differs from the base's only in a count it gives is preexisting."
      - key: 01a154a3-4f92-72c0-97ef-6353eeda5dec
        name: "Where the tree holds more findings of one rule, subject keys and term than the base, the excess are introduced."
      - key: 01a154a3-4f92-72c0-97ef-6354cc3bd3f1
        name: "Findings of one rule, subject keys and term pair with the base's at the same body line first."
      - key: 01a154a3-4f92-72c0-97ef-6355c0bbc50e
        name: "A finding the base holds and the tree does not is listed as resolved, at the base commit's site."
      - key: 01a154a3-4f92-72c0-97ef-63560b33d579
        name: "Both trees are linted under the working tree's `spec/lint.yaml`."
      - key: 01a154a3-4f92-72c0-97ef-6357cbd4ef3d
        name: "The base tree's validation errors are not reported."
      - key: 01a154a3-4f92-72c0-97ef-635820cd8e8b
        name: "The text output prints each introduced finding and no preexisting one."
      - key: 01a154a3-4f92-72c0-97ef-63590eac4367
        name: "The last line of the text output names the revision and the base commit."
      - key: 01a154a3-8688-7584-95b3-c4ba13f57292
        name: "The last line of the text output counts the introduced, preexisting and resolved findings."
  - key: 01a154a3-4f92-72c0-97ef-635a5e1fdeac
    statement:
      form: optional
      where: "both `--baseline` and `--fail-on <severity>` are given"
      system: "`loft check`"
      shall: "exit 1 on an introduced finding at or above that severity."
    criteria:
      - key: 01a154a3-4f92-72c0-97ef-635bf5400eea
        name: "An introduced finding at or above the severity exits 1."
      - key: 01a154a3-4f92-72c0-97ef-635c3dfd3b69
        name: "A preexisting finding at or above the severity does not exit 1."
      - key: 01a154a3-4f92-72c0-97ef-635d121d198e
        name: "A read, validation or lint configuration error of the working tree exits 1."
      - key: 01a154a3-4f92-72c0-97ef-635e099f6c1d
        name: "With `--format json`, the outcome is `failed` exactly when the command exits 1."
  - key: 01a154a3-4f92-72c0-97ef-635f594bda62
    statement:
      form: optional
      where: "both `--baseline` and `--format json` are given"
      system: "`loft check`"
      shall: "record in its JSON document the change of each finding and where the comparison came from."
    criteria:
      - key: 01a154a3-4f92-72c0-97ef-6360c4b22f43
        name: "Each finding carries `change`, `introduced` or `preexisting`."
      - key: 01a154a3-4f92-72c0-97ef-63611cdd4a16
        name: "`resolved` lists each resolved finding as the base reports it."
      - key: 01a154a3-4f92-72c0-97ef-63628a749cad
        name: "`baseline` names the revision given and the base commit."
      - key: 01a154a3-4f92-72c0-97ef-6363267d1724
        name: "`baseline` names the version of `loft` that compared the trees."
      - key: 01a154a3-4f92-72c0-97ef-63649ad1a9ac
        name: "`baseline.lintConfig` gives the SHA-256 digest of the working tree's and the base tree's `spec/lint.yaml`, `null` for one that is absent."
      - key: 01a154a3-4f92-72c0-97ef-6365ceb51b96
        name: "`baseline.lintConfig.same` is `true` exactly when both files give the same configuration."
      - key: 01a154a3-4f92-72c0-97ef-6366e8040d7d
        name: "Without `--baseline`, the document carries no `change`, `resolved` or `baseline`."
  - key: 01a154a3-4f92-72c0-97ef-6367280d6986
    statement:
      form: unwanted
      if: "`--baseline` is given outside a git repository"
      system: "`loft check`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a154a3-4f92-72c0-97ef-636801ca25c8
        name: "The error, of kind `base`, says that the base revision needs a git repository."
      - key: 01a154a3-4f92-72c0-97ef-6369f8f76d6b
        name: "No finding is reported."
  - key: 01a154a3-4f92-72c0-97ef-636a69a8fe32
    statement:
      form: unwanted
      if: "the revision `--baseline` gives names no commit"
      system: "`loft check`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a154a3-4f92-72c0-97ef-636b046be64e
        name: "The error, of kind `base`, names the revision."
  - key: 01a154a3-4f92-72c0-97ef-636c6a14984a
    statement:
      form: unwanted
      if: "HEAD and the revision `--baseline` gives have no common ancestor"
      system: "`loft check`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a154a3-4f92-72c0-97ef-636d15377987
        name: "The error, of kind `base`, names the revision and says that it shares no history with HEAD."
  - key: 01a154a3-4f92-72c0-97ef-636e44de4ab2
    statement:
      form: unwanted
      if: "the tree at the base commit does not read"
      system: "`loft check`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a154a3-4f92-72c0-97ef-636f699ec154
        name: "Each error, of kind `base`, names the base commit and the file and line of the reader's error."
qualityAttributes:
  - key: 1e930b51-5670-4035-b4d8-71d419e0f249
    name: "`loft check` shall complete within 2 seconds at the 95th percentile on a document of five thousand nodes."
    qaKind: latency
    qualityTarget:
      metric: "check.wall-time"
      band:
        kind: at_most
        upper: "2"
      unit: "s"
      aggregation: p95
      scenario: "`loft check` over a canonical tree of five thousand nodes with a warm page cache"
      environment: "the reference developer machine named in the repository"
    verificationFate: sampled
