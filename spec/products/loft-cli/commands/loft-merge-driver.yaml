key: 929999f2-93e0-468b-9e85-5d438ec6b1b7
slug: loft-merge-driver
name: "`loft merge-driver`"
body: "Runs the merge engine as the git merge driver for `spec/` files, and with `--install` registers that driver in the repository."
realizes:
  - bcd4525c-3adf-45dd-beed-527d654d517c
requirements:
  - key: 9b4fe97f-079b-4407-a4f5-04f53e943a86
    statement:
      form: ubiquitous
      system: "`loft merge-driver <base> <ours> <theirs> <path>`"
      shall: "run the merge engine as a git merge driver."
    criteria:
      - key: 2125d786-98e0-471e-9f01-cd73c71120fa
        name: "The merged content is written to `<ours>`."
      - key: 0ae5690d-b7ab-4920-805a-7f4998562d66
        name: "Messages name `<path>`, not the temporary files."
      - key: de19d23c-e5a5-4317-9129-1b3fc91b5a67
        name: "It exits 0 when no conflict record was written."
      - key: c06eb0fd-db49-424c-b2ae-b3f70b6ff445
        name: "It exits 1 when a conflict record was written."
  - key: 7317e4e8-72c5-4ba4-8d14-0e690c03b799
    statement:
      form: unwanted
      if: "any of `<base>`, `<ours>` or `<theirs>` cannot be read as a file of the Format"
      system: "`loft merge-driver`"
      shall: "write nothing and exit 1."
    criteria:
      - key: 32379a89-f1f6-4053-8e0e-b422b293cde3
        name: "The error names which input failed and where."
      - key: 3dc02cdb-0451-4827-a2e3-010c6b3a274e
        name: "`<ours>` is unchanged."
  - key: f053c085-ad10-4ff4-af2a-ed7e278358d2
    statement:
      form: ubiquitous
      system: "`loft merge-driver --install`"
      shall: "register the driver in the repository."
    criteria:
      - key: 22328d0c-1299-463f-8966-069b3229b7af
        name: "`.gitattributes` gains `spec/**/*.yaml merge=loft` when absent."
      - key: 8cc41ae4-2be0-4f31-a579-2a5ff8c2b2e7
        name: "`merge.loft.driver` is set in the repository's git configuration to a shell command that runs `<command> merge-driver %O %A %B %P`, where `<command>` is the one `--command` gives, or `loft`."
      - key: a08f5607-f5cc-46ca-9e69-b4bc0f2b7ffe
        name: "`merge.loft.name` is set to a description of the driver."
      - key: 38ba4917-e7a0-4e80-a88a-6d3ebed8f5f8
        name: "A second `--install` with the same `<command>` changes nothing."
      - key: 01a1315a-f184-73de-a72a-d1506a3e42c9
        name: "An `--install` with another `<command>` replaces `merge.loft.driver`."
  - key: 01a1315a-f184-73de-a72a-d151c3e309aa
    statement:
      form: unwanted
      if: "`<command> --version`, run as git runs a shell command, from the top of the working tree, fails"
      system: "`loft merge-driver --install`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a1315a-f184-73de-a72a-d1529f652d52
        name: "The error names `<command>` and says that git could not run it."
      - key: 01a1315a-f184-73de-a72a-d153c8099c16
        name: "Nothing is written."
  - key: 01a1315a-f184-73de-a72a-d154f5811d33
    statement:
      form: event_driven
      when: "the version that `<command> --version` prints differs from its own"
      system: "`loft merge-driver --install`"
      shall: "warn and register the driver."
    criteria:
      - key: 01a1315a-f184-73de-a72a-d1550f85c4e6
        name: "The warning names both versions."
  - key: 01a1315a-f184-73de-a72a-d15639c63921
    statement:
      form: unwanted
      if: "git runs the registered driver and `<command> --version` fails"
      system: "the registered driver"
      shall: "merge the file as text with conflict markers and exit 1."
    criteria:
      - key: 01a1315a-f184-73de-a72a-d1576e01191c
        name: "The file holds the conflict markers of `git merge-file`."
      - key: 01a1315a-f185-7564-b075-594575a618b0
        name: "It exits 1 even when the text merge has no conflict."
      - key: 01a1315a-f185-7564-b075-5946fb27f135
        name: "The message names the file and `git checkout -m`."
  - key: 3cc1c98e-eec3-471f-91cc-d10a3839ba41
    statement:
      form: unwanted
      if: "the working directory is not inside a git repository"
      system: "`loft merge-driver --install`"
      shall: "refuse and exit 1."
    criteria:
      - key: 6c33928e-bdb8-40e6-ac7d-1ab78fc010ca
        name: "The error states that a git repository is required."
      - key: d02ba042-0e3b-425e-bdb0-d1d50f8b87a1
        name: "Nothing is written."
  - key: 01a13070-322f-7493-9495-407d4cc6ccae
    statement:
      form: unwanted
      if: "both sides change `spec/lint.yaml` to different contents"
      system: "`loft merge-driver`"
      shall: "write nothing and exit 1."
    criteria:
      - key: 01a13070-322f-7493-9495-407e928860f5
        name: "The error names `<path>`."
      - key: 01a13070-322f-7493-9495-407f0cd0f04c
        name: "`<ours>` is unchanged."
  - key: 01a13070-322f-7493-9495-40801726df97
    statement:
      form: ubiquitous
      system: "`loft merge-driver`"
      shall: "find the file that `<path>` names from its `spec` directory, wherever that directory lies in the repository."
    criteria:
      - key: 01a13070-322f-7493-9495-40814154f6ca
        name: "A `<path>` of `sub/spec/tags.yaml` is merged as `spec/tags.yaml`."
      - key: 01a13070-322f-7493-9495-408256a94cb3
        name: "A `<path>` with no `spec` directory exits 1 naming `<path>`."
  - key: 01a130de-573a-77b2-b40b-d4376d658262
    statement:
      form: event_driven
      when: "it writes a conflict record over `bindings`"
      system: "`loft merge-driver`"
      shall: "name each disputed label and tell the user to run `loft publish` on the publish branch."
    criteria:
      - key: 01a130de-573a-77b2-b40b-d438ff0370b7
        name: "Each disputed label is named."
      - key: 01a130de-573a-77b2-b40b-d439212274cf
        name: "The message tells the user to run `loft publish` on the publish branch."
  - key: 01a134d2-2a86-76d0-a05e-222dfe6e5992
    statement:
      form: optional
      where: "`--format json` is given"
      system: "`loft merge-driver`"
      shall: "describe the merge or the installation in its JSON document."
    criteria:
      - key: 01a134d2-2a86-76d0-a05e-222e57b47c1f
        name: "A merge's document names the path merged, the number of conflicts written and each disputed label."
      - key: 01a134d2-2a86-76d0-a05e-222fbb4c6386
        name: "An installation's document lists each name written and the version of `loft` the launcher starts."
      - key: 01a134d2-2a86-76d0-a05e-2230c65cab7e
        name: "A refusal is listed among the document's errors."
      - key: 01a1354e-bca0-714b-8727-09b3ed69dc7f
        name: "A merge's outcome is `merged` when it wrote no conflict record."
      - key: 01a1354e-bca0-714b-8727-09b46caf5643
        name: "A merge's outcome is `conflicted` when it wrote a conflict record."
      - key: 01a1354e-bca0-714b-8727-09b591b36d45
        name: "An installation's outcome is `installed`."
