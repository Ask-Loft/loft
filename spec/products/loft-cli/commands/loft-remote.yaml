key: 01a156c0-0b79-7756-9d01-b059f21d61c7
slug: loft-remote
name: "`loft remote`"
body: "Sets and removes the address and the token of the current document's remote in `loft/remotes.json`, the file `loft` reads them from, so that a token passes through neither a command line nor a file of the repository. It takes the document key from the manifest, opens no network connection and writes nothing under `spec/`; like `loft telemetry`, it sends no command event and asks for no update. It reads the tree, and its Feature lists the tag `reads-tree` once the command exists, since the suite that the tag brings runs every tagged command."
realizes:
  - bcd4525c-3adf-45dd-beed-527d654d517c
mentions:
  - 01a156aa-d52e-75b0-9a73-cb9538029bb3
requirements:
  - key: 01a156c0-0b79-7756-9d01-b05aa4e3f82b
    statement:
      form: event_driven
      when: "a person runs `loft remote set <address>`"
      system: "`loft remote`"
      shall: "record the address and the token read from standard input under the manifest's document key in `loft/remotes.json`."
    criteria:
      - key: 01a156c0-0b79-7756-9d01-b05b5e8cb50f
        name: "The token is the first line of standard input, without its line ending."
      - key: 01a156c0-0b79-7756-9d01-b05c7b543cfe
        name: "No argument of the command takes a token."
      - key: 01a156c0-0b79-7756-9d01-b05dc452f7e6
        name: "The entry for the document key holds the address and the token."
      - key: 01a156c0-0b79-7756-9d01-b05e9aa3a9d7
        name: "An entry that the file already holds for the document key is replaced."
      - key: 01a156c0-0b79-7756-9d01-b05fa6da8bfe
        name: "Every entry for another document key is kept."
      - key: 01a156c0-0b79-7756-9d01-b060c46ee20a
        name: "A missing file is created, with the directory that holds it."
      - key: 01a156c0-0b7a-76b6-9a6a-6829d9039cda
        name: "The file is written with read and write permission for its owner alone."
      - key: 01a156c0-0b7a-76b6-9a6a-682a4dcb497d
        name: "The file is written through a file beside it and a rename."
      - key: 01a156c0-0b7a-76b6-9a6a-682bc8baea7d
        name: "The output names the document key and the address."
      - key: 01a156c0-0b7a-76b6-9a6a-682cca21e406
        name: "No output holds the token."
  - key: 01a156c0-0b7a-76b6-9a6a-682d65afb139
    statement:
      form: event_driven
      when: "a person runs `loft remote remove`"
      system: "`loft remote`"
      shall: "remove the manifest's document key from `loft/remotes.json`."
    criteria:
      - key: 01a156c0-0b7a-76b6-9a6a-682e4f4634b9
        name: "Every entry for another document key is kept."
      - key: 01a156c0-0b7a-76b6-9a6a-682f83ff48dd
        name: "The file keeps read and write permission for its owner alone."
      - key: 01a156c0-0b7a-76b6-9a6a-68309266d778
        name: "The file is written through a file beside it and a rename."
      - key: 01a156c0-0b7a-76b6-9a6a-6831248a8f73
        name: "A file that holds no entry for the document key is left unchanged."
      - key: 01a156c0-0b7a-76b6-9a6a-68321248b588
        name: "A missing file is not created."
  - key: 01a156c0-0b7a-76b6-9a6a-6833d5e9ea55
    statement:
      form: ubiquitous
      system: "`loft remote`"
      shall: "open no network connection and write no file of the Format."
    criteria:
      - key: 01a156c0-0b7a-76b6-9a6a-6834aa682276
        name: "No subcommand of `loft remote` opens a network connection."
      - key: 01a156c0-0b7a-76b6-9a6a-6835e981a488
        name: "No file under `spec/` or beside it is written."
  - key: 01a156c0-0b7a-76b6-9a6a-6836111cfa3a
    statement:
      form: unwanted
      if: "the address given to `loft remote set` is neither an `https` address nor an `http` address on the loopback interface"
      system: "`loft remote`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a156c0-0b7a-76b6-9a6a-683752e217e3
        name: "The error names the address."
      - key: 01a156c0-0b7a-76b6-9a6a-6838b170019a
        name: "Nothing is written."
  - key: 01a156c0-0b7a-76b6-9a6a-683918f8a7ec
    statement:
      form: unwanted
      if: "standard input gives `loft remote set` no token"
      system: "`loft remote`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a156c0-0b7a-76b6-9a6a-683ab26121cc
        name: "An empty first line of standard input gives no token."
      - key: 01a156c0-0b7a-76b6-9a6a-683b455b422e
        name: "The error says that the token is read from standard input."
      - key: 01a156c0-0b7a-76b6-9a6a-683ccce78607
        name: "Nothing is written."
  - key: 01a156c0-0b7a-76b6-9a6a-683d8bd9e329
    statement:
      form: unwanted
      if: "an existing `loft/remotes.json` is not private to the user who runs `loft`"
      system: "`loft remote`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a156c0-0b7a-76b6-9a6a-683e57dec0bc
        name: "The error names the file and says that only its owner may read or write it."
      - key: 01a156c0-0b7a-76b6-9a6a-683f82d16c8a
        name: "The file is left as it was."
  - key: 01a156c0-0b7a-76b6-9a6a-6840cd066e37
    statement:
      form: unwanted
      if: "there is no `spec/loftspec.yaml`"
      system: "`loft remote`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a156c0-0b7a-76b6-9a6a-6841b88ae3a8
        name: "The error names the expected path."
      - key: 01a156c0-0b7a-76b6-9a6a-68424473b56c
        name: "Nothing is written."
  - key: 01a156c0-0b7a-76b6-9a6a-6843069eec48
    statement:
      form: optional
      where: "`--format json` is given"
      system: "`loft remote`"
      shall: "give the result of the subcommand as its outcome."
    criteria:
      - key: 01a156c0-0b7a-76b6-9a6a-68445e67a1a5
        name: "The outcome of `loft remote set` is `set`."
      - key: 01a156c0-0b7a-76b6-9a6a-684562209106
        name: "The outcome of `loft remote remove` is `removed` when it removed an entry."
      - key: 01a156c0-0b7a-76b6-9a6a-684673407366
        name: "The outcome of `loft remote remove` is `unchanged` when there was no entry to remove."
      - key: 01a156c0-0b7a-76b6-9a6a-6847bf3c1c6e
        name: "The document names the document key, and the address after `loft remote set`."
      - key: 01a156c0-0b7a-76b6-9a6a-6848de1e913a
        name: "The document holds no token."
      - key: 01a156c0-0b7a-76b6-9a6a-68493a5b9580
        name: "A refusal has the outcome `error` and is listed among the document's errors."
