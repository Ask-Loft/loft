key: 568bbe91-b941-4eba-92a9-c134546ea5db
slug: loft-publish
name: "`loft publish`"
body: "Runs the publisher over the tree inside a git repository and prints what it allocated and the new state root, or why it refused."
tags:
  - checks-for-updates
  - needs-repository
  - reads-tree
  - sends-telemetry
  - writes-tree
realizes:
  - 19c140c9-52c5-44e1-a4c6-9c6a7bdd2b2d
  - bcd4525c-3adf-45dd-beed-527d654d517c
mentions:
  - 01a12ff0-f5e5-7095-8fa8-24b707fdee97
  - 01a12ff0-f5e5-7095-8fa8-24b80bc83d86
requirements:
  - key: 6f07a2ab-ce4b-4f91-9669-8980600cda7f
    statement:
      form: ubiquitous
      system: "`loft publish`"
      shall: "run the publisher and report its outcome."
    criteria:
      - key: f413650f-ee5c-43cd-8588-d54a8b53aa65
        name: "A refusal is printed with its reason and exits 1."
      - key: d57491ca-087e-423c-8d24-0ee1518e6ccd
        name: "A publish prints each allocated label with its key."
      - key: 09d37150-4027-48bf-aa15-91722c23e8b4
        name: "A publish prints the new publish sequence and the state root and exits 0."
      - key: 5b969efe-ea71-42e5-ab2d-acd69a70451d
        name: "A publish with nothing changed prints that nothing changed and exits 0."
      - key: 01a130de-573a-77b2-b40b-d430e3bfbde6
        name: "A publish prints each rewritten citation with the element's key, the withdrawn label and the new label."
  - key: 01a12ff0-f5e5-7095-8fa8-250359012c88
    statement:
      form: optional
      where: "`SOURCE_DATE_EPOCH` is set"
      system: "`loft publish`"
      shall: "take the publish time from it."
    criteria:
      - key: 01a12ff0-f5e5-7095-8fa8-250496f0d268
        name: "`publishedAt` is the time that `SOURCE_DATE_EPOCH` names, in UTC."
      - key: 01a12ff0-f5e5-7095-8fa8-25059fb5f71e
        name: "A value that is not a non-negative whole number of seconds refuses the publish with exit 1 and an error that names `SOURCE_DATE_EPOCH`."
  - key: 01a12ff0-f5e5-7095-8fa8-24d4fac13e94
    statement:
      form: unwanted
      if: "the `git` command cannot be run"
      system: "`loft publish`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a12ff0-f5e5-7095-8fa8-250683ee361f
        name: "The error names `git`."
      - key: 01a12ff0-f5e5-7095-8fa8-25074b3d8ead
        name: "Nothing is written."
  - key: 01a13050-9f92-73f0-b7a3-fb738a1eb895
    statement:
      form: ubiquitous
      system: "`loft publish`"
      shall: "read the repository without taking any of git's locks."
    criteria:
      - key: 01a13050-9f92-73f0-b7a3-fb74e360ede3
        name: "Every git call that `loft publish` makes runs with `GIT_OPTIONAL_LOCKS` set to `0`."
      - key: 01a13050-9f92-73f0-b7a3-fb750da1f63d
        name: "`git status` refreshes no index while `loft publish` reads the repository."
  - key: 01a130de-573a-77b2-b40b-d43134f122a6
    statement:
      form: event_driven
      when: "publishing during a stopped merge or rebase"
      system: "`loft publish`"
      shall: "print what it settled."
    criteria:
      - key: 01a130de-573a-77b2-b40b-d432f2cff1fb
        name: "Each withdrawn label is printed with its key and the label the key now holds."
      - key: 01a130de-573a-77b2-b40b-d436e37f19d1
        name: "With `--format json`, the document names the withdrawn labels and the rewritten citations."
  - key: 01a137b0-2dbd-767e-bea2-59054af9c9a5
    statement:
      form: event_driven
      when: "publishing during a stopped merge or rebase"
      system: "`loft publish`"
      shall: "print the git command that finishes the merge or rebase."
    criteria:
      - key: 01a130de-573a-77b2-b40b-d43343a78222
        name: "After a stopped merge it prints `git add -A && git commit --no-edit`."
      - key: 01a130de-573a-77b2-b40b-d43452caf3f6
        name: "After a stopped rebase it prints `git add -A && git rebase --continue`."
      - key: 01a130de-573a-77b2-b40b-d435cb8db5b7
        name: "It runs no git command that changes the repository."
      - key: 01a137b0-2dbd-767e-bea2-5906ff293d36
        name: "With `--format json`, the document names the finishing command."
  - key: 01a1354e-bca0-714b-8727-09b6dfe6f288
    statement:
      form: optional
      where: "`--format json` is given"
      system: "`loft publish`"
      shall: "give the result of the publish as its outcome."
    criteria:
      - key: 01a1354e-bca0-714b-8727-09b72e32d0aa
        name: "The outcome is `published` when the publish wrote a lock."
      - key: 01a1354e-bca0-714b-8727-09b84136ea73
        name: "The outcome is `unchanged` when nothing changed since the last publish."
      - key: 01a1354e-bca0-714b-8727-09b992ab7df5
        name: "A refusal has the outcome `error` and is listed among the document's errors."
