key: 568bbe91-b941-4eba-92a9-c134546ea5db
slug: loft-publish
name: "`loft publish`"
body: "Runs the publisher over the tree inside a git repository and prints what it allocated and the new state root, or why it refused. A connected document is published through its remote: `loft publish` sends the change from the remote's head as a delta and writes what the remote returns, once the roots it recomputes agree with the returned lock."
tags:
  - checks-for-updates
  - needs-repository
  - reads-tree
  - sends-telemetry
  - writes-tree
realizes:
  - 19c140c9-52c5-44e1-a4c6-9c6a7bdd2b2d
  - bcd4525c-3adf-45dd-beed-527d654d517c
mentions:
  - 01a12ff0-f5e5-7095-8fa8-24b707fdee97
  - 01a12ff0-f5e5-7095-8fa8-24b80bc83d86
  - 01a156aa-d52e-75b0-9a73-cb9538029bb3
requirements:
  - key: 6f07a2ab-ce4b-4f91-9669-8980600cda7f
    statement:
      form: ubiquitous
      system: "`loft publish`"
      shall: "run the publisher and report its outcome."
    criteria:
      - key: f413650f-ee5c-43cd-8588-d54a8b53aa65
        name: "A refusal is printed with its reason and exits 1."
      - key: d57491ca-087e-423c-8d24-0ee1518e6ccd
        name: "A publish prints each allocated label with its key."
      - key: 09d37150-4027-48bf-aa15-91722c23e8b4
        name: "A publish prints the new publish sequence and the state root and exits 0."
      - key: 5b969efe-ea71-42e5-ab2d-acd69a70451d
        name: "A publish with nothing changed prints that nothing changed and exits 0."
      - key: 01a130de-573a-77b2-b40b-d430e3bfbde6
        name: "A publish prints each rewritten citation with the element's key, the withdrawn label and the new label."
  - key: 01a12ff0-f5e5-7095-8fa8-250359012c88
    statement:
      form: optional
      where: "`SOURCE_DATE_EPOCH` is set"
      system: "`loft publish`"
      shall: "take the publish time from it."
    criteria:
      - key: 01a12ff0-f5e5-7095-8fa8-250496f0d268
        name: "`publishedAt` is the time that `SOURCE_DATE_EPOCH` names, in UTC."
      - key: 01a12ff0-f5e5-7095-8fa8-25059fb5f71e
        name: "A value that is not a non-negative whole number of seconds refuses the publish with exit 1 and an error that names `SOURCE_DATE_EPOCH`."
  - key: 01a12ff0-f5e5-7095-8fa8-24d4fac13e94
    statement:
      form: unwanted
      if: "the `git` command cannot be run"
      system: "`loft publish`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a12ff0-f5e5-7095-8fa8-250683ee361f
        name: "The error names `git`."
      - key: 01a12ff0-f5e5-7095-8fa8-25074b3d8ead
        name: "Nothing is written."
  - key: 01a13050-9f92-73f0-b7a3-fb738a1eb895
    statement:
      form: ubiquitous
      system: "`loft publish`"
      shall: "read the repository without taking any of git's locks."
    criteria:
      - key: 01a13050-9f92-73f0-b7a3-fb74e360ede3
        name: "Every git call that `loft publish` makes runs with `GIT_OPTIONAL_LOCKS` set to `0`."
      - key: 01a13050-9f92-73f0-b7a3-fb750da1f63d
        name: "`git status` refreshes no index while `loft publish` reads the repository."
  - key: 01a130de-573a-77b2-b40b-d43134f122a6
    statement:
      form: event_driven
      when: "publishing during a stopped merge or rebase"
      system: "`loft publish`"
      shall: "print what it settled."
    criteria:
      - key: 01a130de-573a-77b2-b40b-d432f2cff1fb
        name: "Each withdrawn label is printed with its key and the label the key now holds."
      - key: 01a130de-573a-77b2-b40b-d436e37f19d1
        name: "With `--format json`, the document names the withdrawn labels and the rewritten citations."
  - key: 01a137b0-2dbd-767e-bea2-59054af9c9a5
    statement:
      form: event_driven
      when: "publishing during a stopped merge or rebase"
      system: "`loft publish`"
      shall: "print the git command that finishes the merge or rebase."
    criteria:
      - key: 01a130de-573a-77b2-b40b-d43343a78222
        name: "After a stopped merge it prints `git add -A && git commit --no-edit`."
      - key: 01a130de-573a-77b2-b40b-d43452caf3f6
        name: "After a stopped rebase it prints `git add -A && git rebase --continue`."
      - key: 01a130de-573a-77b2-b40b-d435cb8db5b7
        name: "It runs no git command that changes the repository."
      - key: 01a137b0-2dbd-767e-bea2-5906ff293d36
        name: "With `--format json`, the document names the finishing command."
  - key: 01a1354e-bca0-714b-8727-09b6dfe6f288
    statement:
      form: optional
      where: "`--format json` is given"
      system: "`loft publish`"
      shall: "give the result of the publish as its outcome."
    criteria:
      - key: 01a1354e-bca0-714b-8727-09b72e32d0aa
        name: "The outcome is `published` when the publish wrote a lock."
      - key: 01a1354e-bca0-714b-8727-09b84136ea73
        name: "The outcome is `unchanged` when nothing changed since the last publish."
      - key: 01a1354e-bca0-714b-8727-09b992ab7df5
        name: "A refusal has the outcome `error` and is listed among the document's errors."
  - key: 01a156ac-9752-749b-be81-dee76686630d
    statement:
      form: optional
      where: "the document is connected"
      system: "`loft publish`"
      shall: "send its remote the change from the remote's head as a delta."
    criteria:
      - key: 01a156ac-9752-749b-be81-dee8fd3d7b65
        name: "`loft publish` asks the remote for its head before it builds the delta."
      - key: 01a156ac-9752-749b-be81-dee96f266f8b
        name: "The path and the SHA-256 digest of each file of the head come from the remote."
      - key: 01a156ac-9752-749b-be81-deea3ecbdfa5
        name: "Only files under `spec/` enter the delta."
      - key: 01a156ac-9752-749b-be81-deeb088727f6
        name: "The delta leaves out `spec/labels.yaml`, whose bindings the remote writes."
      - key: 01a156ac-9752-749b-be81-deec83e82871
        name: "Each file that the head does not hold is sent as added, with its text."
      - key: 01a156ac-9752-749b-be81-deedf1da0eca
        name: "Each file whose digest differs from the head's is sent as changed, with its text."
      - key: 01a156ac-9752-749b-be81-deeeadacb058
        name: "Each file that the head holds and the tree does not is sent as removed, by its path alone."
      - key: 01a156ac-9752-749b-be81-deefbed26d35
        name: "A file whose digest equals the head's is not sent."
      - key: 01a156ac-9752-749b-be81-def005a2c826
        name: "The request names the head's publish sequence and state root as its base."
      - key: 01a156ac-9752-749b-be81-def1c1aaf547
        name: "The request carries as its retry key the SHA-256 digest of the RFC 8785 canonical JSON of the array of the document key, the base's state root and the delta."
      - key: 01a156ac-9752-749b-be81-def20bba9b1f
        name: "Two attempts at one publish over the same tree send the same retry key."
      - key: 01a156ac-9752-749b-be81-def383e41453
        name: "A tree whose state root equals the head's sends nothing and reports that nothing changed."
  - key: 01a156ac-9752-749b-be81-def42467342e
    statement:
      form: event_driven
      when: "the remote accepts a connected publish"
      system: "`loft publish`"
      shall: "apply the labels, the rewritten files and the lock that the remote returns."
    criteria:
      - key: 01a156ac-9752-749b-be81-def5819471f0
        name: "Each file that the remote returns replaces the tree's file at its path."
      - key: 01a156ac-9752-749b-be81-def60d9a315b
        name: "The lock that the remote returns is written to `loft.lock.json`."
      - key: 01a156ac-9752-749b-be81-def76432f6f4
        name: "`loft publish` recomputes the roots of the tree with the returned files applied before it writes anything."
      - key: 01a156ac-9752-749b-be81-def876a3b42e
        name: "Nothing is written when a recomputed root differs from the returned lock's."
      - key: 01a156ac-9752-749b-be81-def97431b062
        name: "A recomputed root that differs from the returned lock's is an error that names the root and exits 1."
      - key: 01a156ac-9752-749b-be81-defa33caf241
        name: "The returned files and the lock are written in one journaled save."
      - key: 01a156ac-9752-749b-be81-defbc80815a0
        name: "Each label that the remote allocated is printed with its key."
  - key: 01a156ac-9752-749b-be81-defc01210c0a
    statement:
      form: event_driven
      when: "the remote answers a connected publish as the replay of one it accepted before"
      system: "`loft publish`"
      shall: "apply the publish the remote returns as it applies an accepted one."
    criteria:
      - key: 01a156ac-9752-749b-be81-defd52d8dd77
        name: "The files and the lock of the replay are applied as for an accepted publish."
      - key: 01a156ac-9752-749b-be81-defee2b75736
        name: "A replay of a publish whose lock `loft.lock.json` already holds writes nothing."
  - key: 01a15878-9876-7306-b015-b043b0f3a49c
    statement:
      form: event_driven
      when: "the remote answers a connected publish as unchanged"
      system: "`loft publish`"
      shall: "report that there is nothing to publish and write nothing."
    criteria:
      - key: 01a15878-9876-7306-b015-b044757c459d
        name: "The output says `nothing to publish`."
      - key: 01a15878-9876-7306-b015-b0451a324976
        name: "Nothing is written, `loft.lock.json` included."
      - key: 01a15878-9876-7306-b015-b0465e0efb28
        name: "No label is printed."
      - key: 01a15878-9876-7306-b015-b047340105f8
        name: "It exits 0."
      - key: 01a15878-9876-7306-b015-b048b09d4dfa
        name: "With `--format json`, the outcome is `unchanged`."
  - key: 01a156ac-9752-749b-be81-deff2eb5b17a
    statement:
      form: unwanted
      if: "the remote answers that its head is no longer the base the request names"
      system: "`loft publish`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a156ac-9752-749b-be81-df00cf74cda8
        name: "The error names the head's publish sequence and state root."
      - key: 01a156ac-9752-749b-be81-df01d461acc3
        name: "The error says that `loft pull` brings the tree to the head."
      - key: 01a156bd-30c8-76c9-86b7-8c5c9b6d9ee9
        name: "A problem document with the code `conflict` is such an answer."
      - key: 01a15877-f750-769a-9e28-ba6538d8ab62
        name: "A `409` refusal whose code is not `conflict`, such as `quota_exceeded`, is not such an answer."
      - key: 01a156ac-9752-749b-be81-df028febefa1
        name: "Nothing is written."
  - key: 01a156ac-9752-749b-be81-df03740c9619
    statement:
      form: unwanted
      if: "the remote answers that the request is invalid"
      system: "`loft publish`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a156ac-9752-749b-be81-df049b4aa818
        name: "The error names each path that the remote names."
      - key: 01a156bd-30c8-76c9-86b7-8c5d04414972
        name: "A problem document with the code `invalid_request` is such an answer."
      - key: 01a156ac-9752-749b-be81-df0513fadc87
        name: "Nothing is written."
  - key: 01a156ac-9752-749b-be81-df062d1433ce
    statement:
      form: unwanted
      if: "the document is connected and its remote cannot be reached"
      system: "`loft publish`"
      shall: "refuse to publish and exit 1."
    criteria:
      - key: 01a156ac-9752-749b-be81-df07b88105bf
        name: "The error says that a connected document is published only through its remote."
      - key: 01a156ac-9752-749b-be81-df08da741635
        name: "No label is allocated."
      - key: 01a156ac-9752-749b-be81-df09527d973e
        name: "Nothing is written."
