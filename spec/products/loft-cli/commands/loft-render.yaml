key: ba4f2ed9-5aff-44c3-8e99-57590052629f
slug: loft-render
name: "`loft render`"
body: "Writes the Markdown projection and the canonical JSON export of the tree, to the paths given or to their defaults under `docs/`."
tags:
  - checks-for-updates
  - reads-tree
  - sends-telemetry
realizes:
  - bcd4525c-3adf-45dd-beed-527d654d517c
requirements:
  - key: 4e083c11-417c-4985-be62-9649620367de
    statement:
      form: ubiquitous
      system: "`loft render`"
      shall: "write the Markdown and JSON projections."
    criteria:
      - key: 55a55802-3298-408a-b0d8-b6bb8cbb08e4
        name: "`--markdown <path>` writes the Markdown projection to that path."
      - key: 041d8194-d4cd-4fa1-a46e-d949ca792c56
        name: "`--json <path>` writes the canonical JSON export to that path."
      - key: 686e5cc5-8cef-420e-8acd-d6b505395ead
        name: "Without an output option, both are written to `docs/spec.md` and `docs/spec.json`."
      - key: 0bb060ce-7164-4a5e-ae12-b180e04f5c2d
        name: "A projection file whose bytes would not change is not rewritten."
      - key: 5466f168-ddef-4f1a-9c1a-8362b01268a1
        name: "Lint findings do not prevent a render."
      - key: 91621914-8f78-4626-bfbe-188717aeb46f
        name: "With only one of `--markdown` and `--json`, only that projection is written."
      - key: 5f196252-af91-44c7-b113-df7d5ea881bc
        name: "A validation error does not prevent a render, except a successor that leads back to its own decision."
  - key: 219d9233-7087-4e54-bd49-f15281043a90
    statement:
      form: unwanted
      if: "an output path lies under `spec/`"
      system: "`loft render`"
      shall: "refuse and exit 1."
    criteria:
      - key: 24e58016-7525-4ef3-8cd4-222a43d4c6fe
        name: "The error names the path."
      - key: 01a1402e-d25d-7745-8833-e3ff71372972
        name: "An `--openspec` directory under `spec/` is refused."
      - key: 4b141b53-d7ce-489b-b162-cbf9ad383bee
        name: "No projection is written."
  - key: 01a1354e-bca0-714b-8727-09ba81818211
    statement:
      form: optional
      where: "`--format json` is given"
      system: "`loft render`"
      shall: "give the result of the render as its outcome."
    criteria:
      - key: 01a1354e-bca0-714b-8727-09bb78f5ee4c
        name: "The outcome is `rendered` when every projection was written or was already current."
      - key: 01a1402e-d25d-7745-8833-e40024191bb5
        name: "The document lists each OpenSpec render finding."
  - key: 01a1402e-d25d-7745-8833-e401eb48ac86
    statement:
      form: optional
      where: "`--openspec <dir>` is given"
      system: "`loft render`"
      shall: "write the OpenSpec projection of the tree to `<dir>`."
    criteria:
      - key: 01a1402e-d25d-7745-8833-e402e68f4d82
        name: "With `--openspec` alone, neither the Markdown projection nor the JSON export is written."
      - key: 01a1402e-d25d-7745-8833-e40359e9497b
        name: "With `--openspec` and `--markdown` or `--json`, each projection named is written."
      - key: 01a1402e-d25d-7745-8833-e405fa497955
        name: "Each OpenSpec render finding is printed on its own line with its file, its code and its message."
      - key: 01a1402e-d25d-7745-8833-e40641c7657c
        name: "OpenSpec render findings do not prevent a render."
  - key: 01a1402e-d25d-7745-8833-e4076b45adf2
    statement:
      form: unwanted
      if: "a directory the OpenSpec projection writes its main specs to is not empty and `--force` is absent"
      system: "`loft render`"
      shall: "refuse and exit 1."
    criteria:
      - key: 01a1402e-d25d-7745-8833-e408443031a8
        name: "The error names the directory."
      - key: 01a1402e-d25d-7745-8833-e409557eebd0
        name: "No projection is written."
  - key: 01a1402e-d25d-7745-8833-e40a8c05dc58
    statement:
      form: optional
      where: "`--force` is given with `--openspec`"
      system: "`loft render`"
      shall: "replace the main specs under each directory the OpenSpec projection writes to."
    criteria:
      - key: 01a1402e-d25d-7745-8833-e40bd72d0de6
        name: "A `spec.md` the projection does not write is removed from that directory."
      - key: 01a1402e-d25d-7745-8833-e40c2d97a038
        name: "No file outside those directories and the render map is changed."
