key: 8cab7e5c-cd93-48e5-91c7-019412f1abb8
slug: loft-cli
name: "Loft CLI"
body: "The reference implementation's command line, `loft`: its commands, arguments, exit codes and JSON output. It fills every role the Format defines and adds only invocation."
tags:
  - git
featureGroups:
  - key: f9a85ce1-a26a-4b94-919c-f9e9e7f33441
    slug: commands
    name: "Commands"
    body: "The `loft` commands that act on a `spec/` tree. A command that reads the tree lists the tag `reads-tree`, which makes it follow the shared rules of \"Reading the tree\" and tests it against them; its own Feature states only what a reader error changes for that command. A command that writes the tree lists the tag `writes-tree` and follows the shared rules of \"Writing the tree\" in the same way."
    tags:
      - git
