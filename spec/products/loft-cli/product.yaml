  - key: 01a13a90-3556-7106-a68c-262d38cbe27b
    slug: telemetry
    name: "Telemetry"
    body: |
      What `loft` tells its maintainers about how it is used: one small event at the end of each command run, so that they can see which commands people run, how often they fail and on which release. Telemetry is on until it is switched off, and a notice says so the first time it sends.

      The event is pseudonymous, not anonymous: it carries random tokens that stay the same for one installation and one checkout, and the collector sees the address each event comes from. It never carries the specification, the code, a path, a repository address, a name or an error message.

      The collector that receives the events, and how long it keeps them, lie outside this product. Events about whole workflows, a sample project or an outcome a person confirms are left for a later version.
    features:
      - 01a13a90-3556-7106-a68c-262e889837b8
