key: 01a1380a-9f4b-741a-83a5-973429a1c475
slug: writing-the-skill
name: "Writing the skill"
body: "What a command that writes the `loft-spec` skill into a project does beside it and says once it has: when the command writes a Claude Code package, it enables the Claude Code plugin `loft@ask-loft` in the project's `.claude/settings.json`, from the marketplace pinned to the release of the running `loft`, so that the plugin and `loft` are of one version, so that Claude Code offers the plugin's `yard` skill and Yard Client to everyone who trusts the project, and it asks for the skill directories and that file to be committed, so that every clone's coding agents find them. With `--no-plugin`, it writes the skill alone and leaves `.claude/settings.json` as it is, for a project that runs a skill built from source rather than the released plugin. A command opts in by listing the tag `writes-skill` on its Feature, and each tagged command is tested against these rules."
realizes:
  - bcd4525c-3adf-45dd-beed-527d654d517c
requirements:
  - key: 01a1380a-9f4b-741a-83a5-9735117f77e5
    statement:
      form: event_driven
      when: "a command tagged `writes-skill` writes a skill directory"
      system: "the command"
      shall: "ask in its text output for the skill directories to be committed."
    criteria:
      - key: 01a1380a-9f4b-741a-83a5-97365938e9ed
        name: "The request names each skill directory written."
      - key: 01a1380a-9f4b-741a-83a5-973716060074
        name: "The request says that a committed skill reaches every clone's coding agents."
      - key: 01a1380a-9f4b-741a-83a5-9738d1f4ccef
        name: "The JSON document carries no request."
      - key: 01a1380a-9f4b-741a-83a5-9739770052a7
        name: "No request is printed where no skill directory is written."
      - key: 01a1380a-9f4b-741a-83a5-973a6a9dc106
        name: "The command commits nothing."
  - key: 01a1380a-9f4b-741a-83a5-973bef635dc3
    statement:
      form: ubiquitous
      system: "The Feature of each `loft` command that writes the `loft-spec` skill"
      shall: "list the tag `writes-skill`."
    criteria:
      - key: 01a1380a-9f4b-741a-83a5-973ce5482179
        name: "A command that writes a skill directory has a Feature that lists `writes-skill`."
      - key: 01a1380a-9f4b-741a-83a5-973db6faa3be
        name: "A command whose Feature lists `writes-skill` writes a skill directory."
  - key: 01a14545-579b-7242-998f-2f3a641f9d23
    statement:
      form: event_driven
      when: "a command tagged `writes-skill` writes the Claude Code skill without `--no-plugin`"
      system: "the command"
      shall: "enable the Claude Code plugin `loft@ask-loft` in the project's `.claude/settings.json`."
    criteria:
      - key: 01a14545-579b-7242-998f-2f3b46cfe99b
        name: "`extraKnownMarketplaces` names the marketplace `ask-loft` with the GitHub source `Ask-Loft/loft` and the `ref` `v<version>`, the running `loft`'s version."
      - key: 01a14545-579b-7242-998f-2f3cf4e8c25d
        name: "`enabledPlugins` sets `loft@ask-loft` to `true`."
      - key: 01a14545-579b-7242-998f-2f3d805266c4
        name: "Where the file does not exist, it is created with these two entries alone."
      - key: 01a14545-579b-7242-998f-2f3e0dc7c685
        name: "Every other entry of the file is kept, in the order the file gives it."
      - key: 01a14545-579b-7242-998f-2f3f4ddd7ec6
        name: "A marketplace `ask-loft` whose source is not the GitHub repository `Ask-Loft/loft` is kept as it is."
      - key: 01a18504-d7d1-7279-8543-254618d987b2
        name: "A marketplace `ask-loft` with the GitHub source `Ask-Loft/loft` is given the running version's `ref`, with its other fields kept."
      - key: 01a14545-579b-7242-998f-2f405a1edf81
        name: "A `loft@ask-loft` entry that the file already holds is kept as it is, `false` included."
      - key: 01a14545-579b-7242-998f-2f4124a177d4
        name: "A file that already holds both entries, its marketplace at the running version's `ref` or from another source, is not written."
      - key: 01a14545-579b-7242-998f-2f4249089083
        name: "The request to commit names `.claude/settings.json` where the command wrote it."
  - key: 01a14545-579b-7242-998f-2f430611cb07
    statement:
      form: unwanted
      if: "`.claude/settings.json` does not hold a JSON object where a command tagged `writes-skill` writes the skill without `--no-plugin`"
      system: "a command tagged `writes-skill`"
      shall: "leave the file as it is and say how to enable the plugin by hand."
    criteria:
      - key: 01a14545-579b-7242-998f-2f44e95f8ddb
        name: "The file's bytes are unchanged."
      - key: 01a14545-579b-7242-998f-2f45dbfa8231
        name: "The text output names the file and the two entries to add."
      - key: 01a14545-579b-7242-998f-2f467423ed95
        name: "The command's exit code is the one it would give without the file."
  - key: 01a1549d-6654-707a-b9b6-741fb1bb1beb
    statement:
      form: optional
      where: "`--no-plugin` is given"
      system: "a command tagged `writes-skill`"
      shall: "write the skill and leave `.claude/settings.json` as it is."
    criteria:
      - key: 01a1549d-6654-707a-b9b6-7420f871de8d
        name: "The bytes of an existing `.claude/settings.json` are unchanged, whether or not it holds a JSON object."
      - key: 01a1549d-6654-707a-b9b6-7421b2bf079a
        name: "Where `.claude/settings.json` does not exist, it is not created."
      - key: 01a1549d-6654-707a-b9b6-7422e3c3d3c0
        name: "The text output names no plugin and gives no entry to add by hand."
      - key: 01a1549d-6654-707a-b9b6-742379d9a25f
        name: "The request to commit names the skill directories alone."
      - key: 01a1549d-6654-707a-b9b6-74240a1efe6b
        name: "The skill directories are written as they are without the option."
