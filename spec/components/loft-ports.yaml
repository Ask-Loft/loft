slug: loft-ports
name: "loft-ports"
body: "The ports both stores share, and nothing that knows a document or Yard Log: the journaled save over plain relative paths, in a journal directory its caller names, that the next command finishes or undoes after a crash; the runner through which `loft` reaches git, which the Software Plant's simulator stands in for; and the clock port, which tells the time and waits."
