key: bcd4525c-3adf-45dd-beed-527d654d517c
slug: loft-cli
name: "loft-cli"
body: "The `loft` binary."
scopedTo:
  - 8cab7e5c-cd93-48e5-91c7-019412f1abb8
components:
  - key: 01a13a90-3554-7631-bb13-097e6805bffe
    name: "Network client"
    body: "The part of `loft` that talks to a service over the network: it sends the command event to the telemetry collector and asks GitHub for the latest release, both after a command's own work is done and under one time limit, and it makes the calls to a connected document's remote that the command exists to make."
    constraints:
      - key: 01a13a90-3554-7631-bb13-097fbc9045c0
        name: "The network client shall be the only part of `loft` that opens a network connection."
        verificationFate: proved
      - key: 01a13b18-98fc-71bc-8c93-e189c71c479d
        name: "The network client shall reach a service through the proxy that the first of `ALL_PROXY`, `HTTPS_PROXY` and `HTTP_PROXY` to be set names, unless `NO_PROXY` lists the service's host."
        verificationFate: proved
    qualityAttributes:
      - key: 01a13a90-3554-7631-bb13-09808cdac81a
        name: "The network client shall add at most 500 milliseconds to a command run for the command event and the update check, whether or not a service answers."
        qaKind: latency
        qualityTarget:
          metric: "network.added_latency"
          band:
            kind: at_most
            upper: "500"
          unit: "ms"
          aggregation: each
          scenario: "One command run that sends its event and fetches the latest release, against a collector and a release feed that accept the connection and never answer"
          environment: "A stand-in collector and release feed on the machine that runs the test"
        verificationFate: sampled
  - key: 01a145e8-28eb-7b67-9fe2-edb5e0af3358
    name: "Test locator"
    body: "The part of `loft` that parses a test file with tree-sitter and finds in it the test a link names, for the reconciler's port."
    constraints:
      - key: 01a145e8-28eb-7721-8fd0-99ea28e0c58a
        name: "The test locator shall be the only part of `loft` that parses a programming language."
        verificationFate: proved
  - key: 01a16469-559e-73c4-85f2-71a7729da1ec
    name: "Yard commands"
    body: "The `loft yard` commands, which read and write Yard Log through `yardlog-store`, compute the `loft` views from `loft`'s own library, and print one JSON document each."
    constraints:
      - key: 01a16475-7fb6-7322-99c9-9c0ee4654daa
        name: "The Yard commands shall read and write Yard Log only through `yardlog-store`."
        verificationFate: proved
      - key: 01a16539-ae68-7350-9547-bac08a0d0f5b
        name: "The Yard commands shall tell the time and wait only through the clock port of `loft-ports`."
        verificationFate: proved
  - key: 01a16469-559e-73c4-85f2-71a8fdbbeaf7
    name: "Page server"
    body: "The HTTP server that `loft yard serve` runs on the loopback interface, one on the machine: it serves the page for every tree registered with it, takes the person's answers and decisions and the mod's events, and tells open pages of each change."
    components:
      - key: 01a16469-559e-73c4-85f2-71a94f0aa021
        name: "Yard page"
        body: "The HTML, styles and browser-native script modules that draw Yard Log in the browser, embedded in `loft` and served by the page server, with mermaid kept beside them as a third-party file."
        constraints:
          - key: 01a16469-559e-73c4-85f2-71aa0f3bc581
            name: "The Yard page shall load every script, style and font from the page server."
            verificationFate: proved
          - key: 01a16469-559e-73c4-85f2-71ab037336a6
            name: "The Yard page shall run in the browser as its files are kept in the repository, with no build step."
            verificationFate: proved
    constraints:
      - key: 01a16469-559e-73c4-85f2-71ac8bfc2fae
        name: "The page server shall listen only on the loopback interface."
        verificationFate: proved
      - key: 01a16469-559e-73c4-85f2-71ad0ec2fdf4
        name: "The page server shall accept no connection it did not receive on the loopback interface, and open none."
        verificationFate: proved
constraints:
  - key: 58f9679b-7e68-44c5-a566-39c56384ffdd
    name: "`loft-cli` shall expose exactly one binary, named `loft`."
    verificationFate: proved
