key: 01a156aa-d52e-75b0-9a73-cb9538029bb3
slug: remote
name: "Remote"
body: "A server that a connected document publishes through. It holds the document's published states in the order of their publish sequences, creates a document on request and takes in the states its repository published before, allocates their labels, keeps drafts under branch names, and may publish a skill package of its own at its origin. `loft` reaches it over HTTPS, with a bearer token, at an address the user configures for the document's key, through the network client; it is not a remote of the repository that holds the tree. How it stores documents and whom it admits are specified outside this repository, and it is built against the contract suite that holds the Software Plant's stand-in for it."
boundary: external
