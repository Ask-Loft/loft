slug: telemetry-collector
name: "Telemetry collector"
body: "The service that receives command events over HTTPS. It sets aside events it has already received by their event id and keeps events for a limited time; how it stores and reports them is specified outside this repository. Its address is fixed in `loft`, and `LOFT_TELEMETRY_ENDPOINT` replaces it, for a collector of one's own."
