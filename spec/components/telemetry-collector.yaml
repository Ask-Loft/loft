slug: telemetry-collector
name: "Telemetry collector"
body: "The service that receives command events over HTTPS at `https://askloft.ai/api/telemetry`. It sets aside events it has already received by their event id and keeps events for a limited time; how it stores and reports them is specified outside this repository, and it is built against the same contract suite that holds the Software Plant's stand-in for it. `LOFT_TELEMETRY_ENDPOINT` replaces the address, for a collector of one's own."
