key: 01a20dc8-c58a-758b-b099-8a0a2a0b43e3
slug: yard-server
name: "Yard Server"
body: |
  A server that takes in the versions of Yard Log that agents write, so that Yard Log can be read beyond the machine it was written on. `loft` reaches it at the base address that `LOFT_YARD_SERVER_ENDPOINT` names, through the network client, with the token that `LOFT_YARD_SERVER_TOKEN` names as a bearer token.

  It takes a batch of versions as `POST <endpoint>/batches` and answers `200` with, for each version in the order sent, the version's key and its outcome: `stored` where it stored it, `held` where it already held the same version, `conflict` where it holds other contents under the same key, `refused` with a code where it will never take that version, such as `invalid_record` for a record that holds a version's key but does not read, and `later` with a code where it cannot take that version now but may once it is upgraded, such as `unknown_report_version` for a `loft` report of a version it does not know yet. It holds a version once, by the version's key, across every Yard Log it holds, and the first copy stays even where a later one differs.

  It refuses a whole request only where it cannot take it as a batch: without its token with `401`, a batch that does not read, or a record whose version's key does not read, or a batch of no version or more than 16, with `400`, a body larger than 1 MiB with `413`, another method with `405` and another content type with `415`, each as a problem document. Where it cannot take any batch now, as when it is overloaded, it answers `429` or `503` with a `Retry-After`. A version it may take once it is upgraded is answered `later`, never with `400`, `413` or `refused`, since those move the version aside for good. Its `400` carries the code `invalid_request` and its `413` the code `payload_too_large`: a `400` or `413` without them is taken for the answer of something on the way, such as a proxy, and moves nothing aside.

  How it stores versions and whom it admits are specified outside this repository, and it is built against the contract suite that holds the Software Plant's stand-in for it.
