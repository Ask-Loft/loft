key: 01a16469-559e-73c4-85f2-71b305365c69
slug: yardlog-store
name: "yardlog-store"
body: "The `yardlog-store` crate. It reads and writes a branch's Yard Log in the files under `.yard/<branch>/`, through the journaled save of `loft-ports`, one write at a time for each branch's Yard Log, under a lock kept in git's own directory for the worktree. It holds the leases of waits and the machine's state in `~/.yard/`, and settles Yard Log after a merge."
tags:
  - git
