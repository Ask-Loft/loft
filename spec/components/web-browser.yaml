name: "Web browser"
body: "The person's browser, in which the page server's page is opened and in which a person signs in to a remote. It calls the page server; for a sign-in, `loft` opens it at the authorization server's address, through the program that `BROWSER` names or the system's own opener, and it brings the person back to `loft`'s loopback port."
