key: 01a144ee-c59d-7512-b23e-0aacc4f16f8e
slug: loft-mod
name: "Loft mod"
body: "The Claude Code mod under `plugins/claude/loft/hooks/`: the Loft plugin's one hooks module, which Claude Code runs from its TypeScript source. It holds the Loft status pane and Yard Client's hooks, and its state contract is `types/index.d.ts`."
scopedTo:
  - 01a13653-2d9b-714a-a6f3-7183cacff8d8
  - 01a16469-55a3-716f-a42c-3a3548428b77
components:
  - key: 01a16469-559e-73c4-85f2-71ae94a5df07
    name: "Loft status pane"
    body: "The part of the mod that draws the Loft status pane: its hooks, which ask for a read and record what the agent works on; its model, pure functions from `loft`'s JSON documents to the pane's checks, lists and status line; and its tone table."
    constraints:
      - key: 01a144ee-c59d-7512-b23e-0aad7d296257
        name: "The pane shall learn of the specification only from documents that `loft` prints with `--format json`."
        verificationFate: proved
      - key: 01a144ef-6ca1-721a-b6f1-e990b4e77cf7
        name: "The pane shall read no file of `spec/`."
        verificationFate: proved
      - key: 01a144ee-c59d-7512-b23e-0aae339f7844
        name: "The pane shall write no file."
        verificationFate: proved
  - key: 01a16469-559e-73c4-85f2-71afd78c6e3e
    name: "Yard hooks"
    body: "The part of the mod that serves Yard Client in Claude Code: the tools it registers for the agent, its hooks on the agent's questions, plans and tasks, the context it gives at the start of a session, the session's events it sends, and the page server it starts."
    constraints:
      - key: 01a16469-559e-73c4-85f2-71b0728e8b20
        name: "The Yard hooks shall read and write no file of `.yard/`."
        verificationFate: proved
      - key: 01a16469-559e-73c4-85f2-71b1a05afaff
        name: "The Yard hooks shall reach Yard Log only through `loft yard` commands and the page server."
        verificationFate: proved
constraints:
  - key: 01a144ef-6ca1-721a-b6f1-e98f2c8b35ca
    name: "The Loft mod shall run no command but the one that its `loftCommand` setting names."
    verificationFate: proved
  - key: 01a16469-559e-73c4-85f2-71b2642c0076
    name: "The Loft mod shall need Claude Code 2.1.287 or later."
    verificationFate: proved
