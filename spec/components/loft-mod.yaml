key: 01a144ee-c59d-7512-b23e-0aacc4f16f8e
slug: loft-mod
name: "Claude adapter"
body: "The Claude adapter, a Claude Code mod under `plugins/claude/loft/hooks/adapter/`: the Loft plugin's one hooks module, which Claude Code runs from its TypeScript source. It holds Yard Client's hooks, and its state contract is `types/index.d.ts`."
scopedTo:
  - 01a13653-2d9b-714a-a6f3-7183cacff8d8
  - 01a16469-55a3-716f-a42c-3a3548428b77
components:
  - key: 01a16469-559e-73c4-85f2-71afd78c6e3e
    name: "Yard hooks"
    body: "The part of the mod that serves Yard Client in Claude Code: the tools it registers for the agent, its hooks on the agent's questions, plans and tasks, the context it gives at the start of a session, the session's events it sends, and the page server it starts."
    constraints:
      - key: 01a16469-559e-73c4-85f2-71b0728e8b20
        name: "The Yard hooks shall read and write no file of `.yard/`."
        verificationFate: proved
      - key: 01a16469-559e-73c4-85f2-71b1a05afaff
        name: "The Yard hooks shall reach Yard Log only through `loft yard` commands and the page server."
        verificationFate: proved
constraints:
  - key: 01a144ef-6ca1-721a-b6f1-e98f2c8b35ca
    name: "The Claude adapter shall run no command but the one that its `loftCommand` setting names."
    verificationFate: proved
  - key: 01a16469-559e-73c4-85f2-71b2642c0076
    name: "The Claude adapter shall need Claude Code 2.1.287 or later."
    verificationFate: proved
