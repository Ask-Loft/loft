  - key: 01a13a90-3554-7631-bb13-09997982770d
    title: "On, with the notice and the event on the first run"
    description: "The first run prints the notice and sends its event."
  - key: 01a13a90-3554-7631-bb13-099a7c2673ef
    title: "No telemetry"
    description: "`loft` sends nothing, ever."
