key: 01a13a90-3554-7631-bb13-0993631f10a1
slug: telemetry-is-on-until-switched-off
title: "Telemetry is on until switched off, with a notice on the first run that sends"
context: "The maintainers want to learn which commands people run, how often they fail and on which release, without asking for the specification, the code or who runs it. Telemetry that only a few switch on reports on those few. Telemetry that is on by default has to tell people so, and has to stop entirely when they say so."
state:
  kind: accepted
  selectedOption: 01a13a90-3554-7631-bb13-09997982770d
  outcome: "Telemetry is on by default. The first run that sends prints a notice to standard error and sends its event in the same run; `loft telemetry off` and `LOFT_TELEMETRY=off` stop all sending."
drivers:
  - key: 01a13a90-3554-7631-bb13-09943c9f8c6b
    kind: local
    label: "Usage signal"
    statement: "Events arrive from the people who use `loft`, not only from those who chose to send them."
  - key: 01a13a90-3554-7631-bb13-09955696d0a6
    kind: local
    label: "Told as it leaves"
    statement: "A person learns that telemetry is on no later than the run that sends their first event."
  - key: 01a13a90-3554-7631-bb13-09963a1fed2a
    kind: local
    label: "Fresh machines report"
    statement: "A run on a new machine or in a fresh CI container reports too."
