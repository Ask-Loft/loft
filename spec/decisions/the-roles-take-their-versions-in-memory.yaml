key: 01a156a9-d318-7608-a62c-2e1df9090458
slug: the-roles-take-their-versions-in-memory
title: "The roles take their versions in memory, and `loft` wraps them with git"
context: "A caller other than `loft`, such as a server, holds documents outside any repository and needs the same findings against a base, the same review pages and the same publish as `loft`. `loftspec` performs no input or output, and `loft` reads a base revision from git."
state:
  kind: accepted
  selectedOption: 01a156a9-d318-7608-a62c-2e2121954484
  outcome: "The linter against a base, the review packer and the publisher each decide from the versions they are given in memory, the publisher with the repository state optional; the review packer owns the paging; `loft check --baseline`, `loft review --base` and `loft publish` read git and give the roles what they read."
drivers:
  - key: 01a156a9-d318-7608-a62c-2e1e8e82d3e4
    kind: local
    label: "One behaviour for every caller"
    statement: "Two callers that give the same versions get the same findings, pages and lock."
  - key: 01a156a9-d318-7608-a62c-2e1f746c3efc
    kind: local
    label: "No input or output in the library"
    statement: "`loftspec` reads no file and runs no command."
  - key: 01a156a9-d318-7608-a62c-2e20e9a15a9a
    kind: local
    label: "Callers without a repository"
    statement: "A caller that holds its documents outside a repository can use every role."
options:
  - key: 01a156a9-d318-7608-a62c-2e2121954484
    title: "Roles over versions in memory"
    description: "Each role takes the versions it decides from as documents, and `loft` reads them from git."
  - key: 01a156a9-d318-7608-a62c-2e224ab24248
    title: "Roles that read git"
    description: "The roles take a repository and a revision and read the versions themselves."
  - key: 01a156a9-d318-7608-a62c-2e23815386b8
    title: "Each caller its own"
    description: "The roles stay inside `loft`, and another caller writes its own comparison, paging and publish."
