key: 01a18e1f-8da6-74da-a22a-315837cd91cd
slug: a-connected-document-names-its-remote-in-its-manifest
title: "A connected document names its remote in its manifest, and each person's sign-in stays with that person"
context: "A connected document publishes through one remote, which every person who works on the repository publishes to and pulls from. Each of them reaches it under a sign-in of their own. Where the address is kept per user, every clone has to be told the address again, and two clones can name different remotes for one document."
state:
  kind: accepted
  selectedOption: 01a18e1f-8da6-74da-a22a-315ca7517381
  outcome: "The manifest names the remote's address as `remote`, beside `connected: true`, so that the address is committed and shared by every clone; it enters no root, and `loft pull` keeps the working tree's. `loft/remotes.json`, private to each user, keeps only that user's sign-in, under the address. `LOFT_REMOTE_ENDPOINT` overrides the manifest's address for one run. `loft remote remove` disconnects the document: it removes `remote` and `connected` from the manifest and forgets the sign-in."
drivers:
  - key: 01a18e1f-8da6-74da-a22a-3159c7c665fe
    kind: local
    label: "Shared remote"
    statement: "Everyone who clones a connected repository publishes to the same remote without being told its address."
  - key: 01a18e1f-8da6-74da-a22a-315aca426bde
    kind: local
    label: "Personal sign-in"
    statement: "A person's sign-in reaches no file of the repository and no other person."
  - key: 01a18e1f-8da6-74da-a22a-315b18dd5214
    kind: local
    label: "One place"
    statement: "What makes a document connected is read from one file."
options:
