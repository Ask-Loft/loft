    title: "`remote` in the manifest"
    description: "`spec/loftspec.yaml` gains the field `remote`, which `loft remote set` writes in the save that marks the document connected."
  - key: 01a18e1f-8da6-74da-a22a-315d7dd65981
    title: "A file beside `spec/`"
    description: "A file at the root of the repository, beside `loft.lock.json`, holds the document key and the address."
  - key: 01a18e1f-8da6-74da-a22a-315ec91f9a2a
    title: "Each user's configuration"
    description: "`loft/remotes.json` keeps the address with the sign-in, under the document key."
