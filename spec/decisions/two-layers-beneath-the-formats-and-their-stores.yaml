consequences:
  - key: 01a1646f-5467-7025-8a88-4eb6e28bd834
    kind: benefit
    statement: "The git simulator of the Software Plant serves the tests of both stores, through the one runner in `loft-ports`."
  - key: 01a1646f-5467-7025-8a88-4eb7a2ef42d0
    kind: obligation
    statement: "The journaled save writes the files of each branch's Yard Log under the same rules as a tree's, with its journal under git's own directory for the worktree."
  - key: 01a1649f-62eb-71b5-bba6-c7389a8fa834
    kind: obligation
    statement: "Moving the save, the git runner and the clock into `loft-ports` changes no public item of `loftspec-store` and no test of it."
  - key: 01a164dc-6a5b-767a-b84d-e8aa1e85bc27
    kind: obligation
    statement: "Moving the YAML reader and writer, the key type and the time into `loft-common` changes no public item of `loftspec` and no test of it."
  - key: 01a164dc-6a5b-767a-b84d-e8abf4b226e4
    kind: benefit
    statement: "A change to the YAML subset reaches both formats at once, so their canonical byte forms cannot drift apart."
  - key: 01a1649f-62eb-71b5-bba6-c739f5302b7f
    kind: cost
    statement: "Two more crates to publish, `loft-common` before both models and `loft-ports` before both stores, in dependency order."
