key: 01a1646f-5467-7025-8a88-4eb06df63a10
slug: two-layers-beneath-the-formats-and-their-stores
title: "Two layers beneath the formats and their stores"
context: "`yardlog-store` needs what `loftspec-store` holds today besides documents: a journaled save that a crash cannot leave half done and the next command finishes or undoes, the runner through which `loft` reaches git, and the clock. None of these knows a document. The `yardlog` model needs what `loftspec` holds besides the Format: the reader and writer of the strict YAML subset, the key type and the UTC time. None of these knows the Format, and none performs I/O, as the journal, the git runner and the clock do."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4eb4f7513f20
  outcome: "Two crates, in two layers. `loft-common` takes the strict YAML reader and writer, the key type and the UTC time out of `loftspec`, performs no I/O and depends on no other crate of the workspace; `loftspec` and `yardlog` each depend on it and not on each other, and `loftspec` keeps its public interface by re-exporting them. `loft-ports` takes the journaled save, over plain paths and a journal directory its caller names, the git runner and the clock out of `loftspec-store`; `loftspec-store` and `yardlog-store` each depend on it and on their own model, and not on each other, and `loftspec-store` keeps its public interface as wrappers over it."
drivers:
  - key: 01a1646f-5467-7025-8a88-4eb1b9115e11
    kind: local
    label: "One save"
    statement: "Every write of a file `loft` owns goes through one journaled save."
  - key: 01a1646f-5467-7025-8a88-4eb2e3735c80
    kind: local
    label: "One port to git"
    statement: "`loft` reaches git through one port, which the Software Plant simulates."
  - key: 01a1646f-5467-7025-8a88-4eb3ee1f8bbe
    kind: local
    label: "Crate stays focused"
    statement: "Each store crate holds the store of one model and nothing of another's."
  - key: 01a1649f-62eb-71b5-bba6-c736d509aedf
    kind: local
    label: "Stores stay apart"
    statement: "A change to one store, or to its model, rebuilds and retests nothing that depends only on the other."
  - key: 01a164dc-6a5b-767a-b84d-e8a63342beb7
    kind: local
    label: "Models stay pure"
    statement: "A model crate that performs no I/O links no crate that does."
  - key: 01a164dc-6a5b-767a-b84d-e8a7ff52e5fd
    kind: local
    label: "One canonical form"
    statement: "Both formats are read and written through one YAML reader and writer, and carry one key type."
options:
  - key: 01a1646f-5467-7025-8a88-4eb4f7513f20
    title: "Two layers"
    description: "`loft-common` holds the YAML reader and writer, the key type and the UTC time beneath both models; `loft-ports` holds the journaled save, the git runner and the clock beneath both stores. No model depends on the other model, and no store on the other store."
  - key: 01a164dc-6a5b-767a-b84d-e8a89fff3fd4
    title: "One base crate"
    description: "One crate beneath both models and both stores holds the YAML reader and writer, the key type, the UTC time, the journaled save, the git runner and the clock."
  - key: 01a164dc-6a5b-767a-b84d-e8a9920e2295
    title: "yardlog over loftspec"
    description: "`loft-ports` beneath both stores, and `yardlog` taking the YAML reader and writer, the key type and the time from `loftspec`."
  - key: 01a1649f-62eb-71b5-bba6-c737ceeec1a9
    title: "In loftspec-store"
    description: "The yard store is a part of `loftspec-store`, beside the document store, sharing its journaled save and its git port."
  - key: 01a1646f-5467-7025-8a88-4eb5d0930556
    title: "yardlog-store over loftspec-store"
    description: "A `yardlog-store` crate that depends on `loftspec-store` for its save and its reach to git."
