key: 01a1646f-5466-77f8-9738-e0f58cb202aa
slug: a-loft-view-is-a-snapshot-that-yard-client-records
title: "A loft view is a snapshot that Yard Client records"
context: "When the work on a branch's specification reaches a point worth recording, the agent could retell what `loft` reported in a note, or Yard Client could record `loft`'s own report. Yard Log only adds to what it holds, and `loft` itself serves Yard Client, so the report can be computed from `loft`'s own library at the moment of the write."
state:
  kind: accepted
  selectedOption: 01a1646f-5466-77f8-9738-e0f86de5162d
  outcome: "An agent writes a `loft` block naming a view, and `loft yard write` computes the view's report from `loft`'s own library and records it in the block as it was then; the block is never rewritten, and a later state is a later block."
