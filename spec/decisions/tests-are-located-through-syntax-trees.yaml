consequences:
  - key: 01a145e8-28eb-74f4-864d-798bd9a9e3e7
    kind: benefit
    statement: "A test rewritten after its link was reviewed is reported until someone reviews it again."
  - key: 01a145e8-28eb-733b-b879-b30b38f3efbf
    kind: cost
    statement: "The `loft` binary compiles C code for tree-sitter and each grammar, and grows with each language added."
  - key: 01a145e8-28eb-7ecf-89db-960a28b92103
    kind: obligation
    statement: "Each grammar is pinned to one version, and a test fails when a change of version moves the digest of a known test."
  - key: 01a145e8-28eb-7b0a-b9a4-4c1c41a5ccd4
    kind: obligation
    statement: "A test that no grammar locates is still found as a whole word, so links in any language keep working, and the reconciler reports that its content is not tracked."
