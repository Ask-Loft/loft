key: 01a13ce8-2c8f-740b-b5aa-ba63624ee65f
slug: a-statement-s-form-is-read-by-its-words
title: "A statement's form is read by its words, and its slots keep its exact wording"
context: "Two readings of a sentence decide whether it is an EARS form. The language rule that reports a statement outside the five forms compares words without regard to letter case, as v1 does, so it takes \"The writer SHALL write keys.\" for the ubiquitous form. The statement reader keeps slots only when the form's fixed template renders them back to the sentence byte for byte, so it stores the same sentence as text. Nothing tells the author why such a sentence was not stored as slots."
state:
  kind: accepted
  selectedOption: 01a13ce8-2c8f-740b-b5aa-ba6711839464
  outcome: "The language rule keeps reading the form by its words, the reader keeps storing slots only for the template's exact wording, and the finding for a statement stored as text names the form when the sentence follows one."
