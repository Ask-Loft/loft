key: 3a9aac3d-d85a-4bef-a78d-aa5c1285d45c
slug: a-merge-conflict-is-a-typed-record-in-the-file
title: "A merge conflict is a typed record in the file"
context: "Two branches can change the same field of the same node. git's default is conflict markers, which make a YAML file unreadable to every tool until a person repairs it. The Format needs a conflict representation that keeps the tree readable, lets the validator find every conflict, and lets a tool present both sides."
state:
  kind: accepted
  selectedOption: 9e31a984-2c83-4b94-aaa2-c49e2502ea2e
  outcome: "The merge driver writes each conflicting field as a typed conflict record holding the base, ours and theirs values; the validator reports an error while any record exists; the merge driver exits 1 when it wrote one."
drivers:
