    kind: local
    label: "The validator finds every conflict"
    statement: "An unresolved conflict cannot be published by accident."
  - key: 932e705c-0834-4636-a85c-37c142133649
    kind: local
    label: "Tools can present both sides"
    statement: "A reviewer or an agent sees base, ours and theirs."
