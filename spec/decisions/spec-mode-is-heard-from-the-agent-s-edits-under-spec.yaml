title: "Spec mode is heard from the agent's edits under spec/"
context: "The page marks the stretches in which the main agent wrote the specification, as it marks plan mode. Claude Code has no spec mode of its own; the mod hears each file edit, and can tell whether its file lies under `spec/`."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4e7e2b13e153
  outcome: "A stretch of spec mode runs from the main agent's first edit of a file under `spec/` to its next edit of another file, the start of its plan mode, or the end of its turn."
drivers:
  - key: 01a1646f-5467-7025-8a88-4e7c8f4d1f06
    kind: local
