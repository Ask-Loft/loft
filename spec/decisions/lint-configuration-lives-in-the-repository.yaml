key: 575101b8-1ce6-4633-96c0-3ccddb685046
slug: lint-configuration-lives-in-the-repository
title: "Lint configuration lives in the repository"
context: "Lint findings gate a pull request. If configuration lives on each machine or only in command-line flags, two engineers, or an engineer and CI, see different findings for the same tree. The linter needs one place to read which rules run and at what severity, and that place should change only through review."
state:
  kind: accepted
  selectedOption: 6c32eb35-9021-4c70-97a5-e938bc94fe4c
  outcome: "The linter reads its configuration only from `spec/lint.yaml`; without that file it applies the default configuration; no flag or user file changes a finding."
drivers:
  - key: 45621c9b-a244-4e95-b13d-b791e4228086
    kind: local
    label: "Same findings everywhere"
    statement: "Two engineers and CI get the same findings for the same tree."
  - key: facfe4f8-5c40-4de1-a002-0218dc88dc33
    kind: local
    label: "Versioned with the spec"
    statement: "A change of configuration is reviewed and merged like a change of the specification."
  - key: 4dbe3003-e0a4-4b07-bd85-6160610ecb60
    kind: local
    label: "Reproducible gate"
    statement: "A CI run reproduces a local run without extra arguments."
