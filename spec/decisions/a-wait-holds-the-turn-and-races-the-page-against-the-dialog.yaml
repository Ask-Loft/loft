key: 01a1646f-5466-77f8-9738-e12a7b747141
slug: a-wait-holds-the-turn-and-races-the-page-against-the-dialog
title: "A wait holds the turn and races the page against Claude Code's dialog"
context: "After sending a submission the agent waits for the person. A tool that a mod registers holds the agent's turn until it answers, unlike a call to an MCP server, which Claude Code moves to the background after two minutes; time the mod spends awaiting a command it runs does not count against its hook's budget. One run of a host command lasts at most ten minutes. The person may answer on the page or in Claude Code's own dialog."
state:
  kind: accepted
  selectedOption: 01a1646f-5466-77f8-9738-e12de33ab54f
  outcome: "The mod's wait tool holds the turn: inside the one call it asks the submission in Claude Code's dialog and runs `loft yard wait` for the page, and the first answer counts."
drivers:
  - key: 01a1646f-5466-77f8-9738-e12bd5ca03f9
    kind: local
    label: "Answer anywhere"
    statement: "The person answers wherever they are, and the agent goes on with the first answer."
  - key: 01a1646f-5466-77f8-9738-e12c1b5efc7d
    kind: local
    label: "No lost turns"
    statement: "The agent does not spend turns polling for the answer."
