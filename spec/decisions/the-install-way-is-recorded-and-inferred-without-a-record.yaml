key: 01a13acd-2cab-755a-a4e6-31ff2677b30e
slug: the-install-way-is-recorded-and-inferred-without-a-record
title: "How `loft` was installed is recorded at install, and inferred where no record exists"
context: "The update notice names the command that installs the newer release, and the command event reports which channel people use, so `loft` needs to know whether npm, cargo or a release binary put it on the machine. Only npm can run a script at install, and pnpm, Bun and `npm install --ignore-scripts` often skip it. The npm packages ran no install script until now."
state:
  kind: accepted
  selectedOption: 01a13acd-2cab-755a-a4e6-32056f8d085c
  outcome: "`loft record-install` records the way for its own executable, the `postinstall` of `@ask-loft/loft` runs it, and where no record exists `loft` infers the way from where its executable lies."
drivers:
  - key: 01a13acd-2cab-755a-a4e6-320097095eb0
    kind: local
    label: "Exact where possible"
    statement: "Where an install can say how it was made, `loft` uses what it said."
  - key: 01a13acd-2cab-755a-a4e6-320150515096
    kind: local
    label: "Works without a script"
    statement: "Every command, the update notice included, works when no install script ever ran."
  - key: 01a13acd-2cab-755a-a4e6-3202b2953eb4
    kind: local
    label: "Few install scripts"
    statement: "Installing `loft` runs as little as possible, since install scripts are a common path for malicious packages and scanners flag them."
options:
  - key: 01a13acd-2cab-755a-a4e6-3203c1042903
    title: "Inference only"
    description: "`loft` infers the way from where its executable lies, and no script runs at install."
  - key: 01a13acd-2cab-755a-a4e6-32041d3cd6b0
    title: "A record only"
    description: "`loft record-install` runs from the `postinstall`, and `loft` knows nothing without its record."
  - key: 01a13acd-2cab-755a-a4e6-32056f8d085c
    title: "A record, with inference where none exists"
    description: "`loft record-install` runs from the `postinstall`, and `loft` infers the way where no record exists."
