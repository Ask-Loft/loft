key: 01a12e66-85dc-70ec-b5ed-93edeba3dfba
slug: a-save-is-journaled-and-finished-by-the-next-command
title: "A save is journaled and finished by the next command"
context: "A command such as `loft fmt` or `loft import v1` changes many files under `spec/` and sometimes a file beside it. Renaming each file into place makes each file whole but not the set: a crash part-way leaves some files new and some old, a tree no single command wrote. The publisher must also write the lock and the bindings together or not at all."
state:
  kind: accepted
  selectedOption: 01a12e66-85dc-70ec-b5ed-93f26cb09cd1
  outcome: "A save stages its changed files in a journal beside `spec/`, commits by renaming the journal's plan into place, and then renames each file into place; a command that opens the tree finishes a committed save and discards an uncommitted one."
drivers:
  - key: 01a12e66-85dc-70ec-b5ed-93eeb2868ce3
    kind: local
    label: "Old or new"
    statement: "After a crash, the files are either all as they were or all as the command wrote them."
  - key: 01a12e66-85dc-70ec-b5ed-93ef80079d6d
    kind: local
    label: "Unchanged files alone"
    statement: "A file whose bytes do not change is not rewritten."
  - key: 01a12e66-85dc-70ec-b5ed-93f0b4c39a95
    kind: local
    label: "Portable"
    statement: "The mechanism uses only operations every supported platform offers."
  - key: 01a12e66-85dc-70ec-b5ed-93f193ce9d11
    kind: local
    label: "Beside the tree"
    statement: "A file beside `spec/`, such as the sidecar or the lock, can join the same save as the tree."
options:
  - key: 01a12e66-85dc-70ec-b5ed-93f26cb09cd1
    title: "A journal the next command finishes"
    description: "Changed files are staged in a journal directory beside `spec/`; renaming the journal's plan into place commits the save; the files are then renamed into place, and a command that finds a committed plan finishes it, while one that finds an uncommitted journal discards it."
  - key: 01a12e66-85dc-70ec-b5ed-93f39db4ec82
    title: "A rename per file"
    description: "Each changed file is written to a temporary file and renamed into place on its own."
  - key: 01a12e66-85dc-70ec-b5ed-93f47fcb61a0
    title: "Swap the whole tree"
    description: "The new tree is written in full to a sibling directory, which then replaces `spec/`."
  - key: 01a12e66-85dc-70ec-b5ed-93f5b5067d16
    title: "Write in place"
    description: "Each changed file is overwritten where it lies."
