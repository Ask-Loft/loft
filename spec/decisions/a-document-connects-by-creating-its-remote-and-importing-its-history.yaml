key: 01a1587a-dee0-75cd-aa69-f4537c66b0dd
slug: a-document-connects-by-creating-its-remote-and-importing-its-history
title: "A document connects by creating its remote and importing its history"
context: "A document is often published for a while from its repository before it gets a remote. Its published states, their locks and their labels lie in the repository's history, and a connected document takes every later label from its remote, so the remote has to start at the head the repository already holds. The remote's publish takes a delta from its head, and a person sets the remote from the command line with `loft remote set`."
state:
  kind: accepted
  selectedOption: 01a1587a-dee0-75cd-aa69-f457948cc7a4
  outcome: "`loft remote set` connects a document that is not yet connected: it reads every published state from the repository's history, asks the remote to create the document under the manifest's key, imports the states from publish sequence 1 with their locks and files, and only then records the remote and marks the manifest `connected: true`. A remote that already holds the key at the lock's head connects without an import, one at another head is refused, and a document never published imports nothing."
drivers:
  - key: 01a1587a-dee0-75cd-aa69-f454b49d61f7
    kind: local
    label: "History kept"
    statement: "The remote holds every state the repository has published, in order, with the labels as they were published."
  - key: 01a1587a-dee0-75cd-aa69-f4554d95cca3
    kind: local
    label: "From the command line"
    statement: "A person connects a document without leaving the terminal that holds the repository."
  - key: 01a1587a-dee0-75cd-aa69-f456fd71aaa3
    kind: local
    label: "One meaning per call"
    statement: "Each call to the remote does one thing that the contract suite can check alone."
options:
  - key: 01a1587a-dee0-75cd-aa69-f457948cc7a4
    title: "Create and import"
    description: "`loft remote set` creates the document on the remote and imports the published states that the repository's history holds, in one request each."
  - key: 01a1587a-dee0-75cd-aa69-f4583b0f8d82
    title: "A first publish that sends the whole history"
    description: "The first `loft publish` of a document that its remote does not hold sends every published state with the delta."
  - key: 01a1587a-dee0-75cd-aa69-f4596ed52575
    title: "Connecting through a browser only"
    description: "A person creates the document and uploads its history in the remote's own pages, and `loft remote set` only records the address and the token."
