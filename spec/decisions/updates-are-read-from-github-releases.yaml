key: 01a13a90-3554-7631-bb13-09ab05304f45
slug: updates-are-read-from-github-releases
title: "Updates are read from GitHub releases"
context: "`loft` is installed from crates.io, from npm, or as a binary from a GitHub release, and every release reaches all three. The update check needs one place to learn the latest version from."
state:
  kind: accepted
  selectedOption: 01a13a90-3554-7631-bb13-09ae48967568
  outcome: "The update check reads the latest release of `Ask-Loft/loft` from GitHub's REST API without a token, ignoring drafts and prereleases."
drivers:
  - key: 01a13a90-3554-7631-bb13-09ac26f7d401
    kind: local
    label: "One source for every install"
    statement: "One answer serves `loft` however it was installed."
  - key: 01a13a90-3554-7631-bb13-09ad8fe4bb0b
    kind: local
    label: "Release notes at hand"
    statement: "The notice can point to the notes of the newer release."
options:
