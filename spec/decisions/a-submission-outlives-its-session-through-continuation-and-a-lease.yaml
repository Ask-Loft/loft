consequences:
  - key: 01a1647c-e67a-75da-a3d7-448695d5dd4a
    kind: obligation
    statement: "The mod keeps the id of a session that `/clear` or a resume ended until its next `loft yard` command, which records the continuation."
  - key: 01a1647c-e67a-75da-a3d7-4487226ee0c8
    kind: obligation
    statement: "`loft yard wait` holds a lock in git's own directory for the worktree for as long as it runs."
  - key: 01a1647c-e67a-75da-a3d7-4488242e0840
    kind: cost
    statement: "A submission whose sending session crashed is waited on by whichever main agent of the branch next asks, which may be another person's session on a shared machine."
