key: 01a1647c-e67a-75da-a3d7-447f71f7e7a6
slug: a-submission-outlives-its-session-through-continuation-and-a-lease
title: "A submission outlives its session through continuation and a lease"
context: "A submission belongs to the agent that sent it, and only that agent's wait returns its answers. Claude Code gives a session a new id after `/clear` and after a resume, in the same process, and a crash or an ended process leaves a session that nothing continues. Keyed by the sending session alone, a submission sent before any of these could never be waited on again; open to any session on the branch, two live sessions could wait on it at once and both act on its answers."
state:
  kind: accepted
  selectedOption: 01a1647c-e67a-75da-a3d7-448550273ad9
  outcome: "The mod records that the session after `/clear` or a resume continues the one that ended, which keeps its submissions and its last-read revision; a running wait holds a lease on its submission, and a main agent of the tree and branch may take up an open submission that no session continues once its lease is free."
drivers:
  - key: 01a1647c-e67a-75da-a3d7-4480c6a95cac
    kind: local
    label: "Nothing stranded"
    statement: "An open submission can be waited on after `/clear`, a resume, a crash or a restart."
  - key: 01a1647c-e67a-75da-a3d7-4481edb7b52e
    kind: local
    label: "One waiter"
    statement: "At most one agent waits on a submission at a time, so that its answers are acted on once."
  - key: 01a1647c-e67a-75da-a3d7-448206052eb4
    kind: local
    label: "Exact where known"
    statement: "Where the host says which session continues which, Yard Client follows it rather than guessing."
options:
  - key: 01a1647c-e67a-75da-a3d7-4483e4b9052c
    title: "The sending session alone"
    description: "Only the agent that sent a submission may wait on it."
  - key: 01a1647c-e67a-75da-a3d7-448459b8f751
    title: "Any main agent of the branch"
    description: "The main agent of any session on the tree and branch may wait on any open submission."
  - key: 01a1647c-e67a-75da-a3d7-448550273ad9
    title: "Continuation and a lease"
    description: "A session continues the one that `/clear` or a resume ended, a running wait holds a lease, and a main agent takes up an open submission that no session continues once its lease is free."
