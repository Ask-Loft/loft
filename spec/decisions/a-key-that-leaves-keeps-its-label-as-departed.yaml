key: 01a156a4-172e-7493-b8f3-3c5a7687e20f
slug: a-key-that-leaves-keeps-its-label-as-departed
title: "A key that leaves its document keeps its label, marked departed"
context: "The formatter dropped the binding of a key the tree no longer held, and counters never rewind, so a node that came back, restored by a revert or moved out of the tree and back, was given a new label at the next publish, and every citation of its old label went stale. A label once published may be cited outside the repository."
state:
  kind: accepted
  selectedOption: 01a156a4-172e-7493-b8f3-3c5e4ddc8333
  outcome: "The formatter and the publisher mark the binding of a key that left the document departed instead of removing it; the label stays with that key and no other; a key that comes back takes back its departed label at the next publish, and the formatter writes former-label references to it as its key again."
