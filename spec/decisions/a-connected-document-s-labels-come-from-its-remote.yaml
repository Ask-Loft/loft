key: 01a156ac-44be-7182-93e2-1568ed5ca531
slug: a-connected-document-s-labels-come-from-its-remote
title: "A connected document's labels come from its remote"
context: "Labels are given at publish from counters that never rewind. Two clones that publish apart give one label to two nodes, and the next publish settles that by withdrawing the colliding labels of the side that pulled, so a label that side published changes. A document that publishes through a remote has one place that orders its publishes."
state:
  kind: accepted
  selectedOption: 01a156ac-44be-7182-93e2-156ce268ff87
  outcome: "The remote of a connected document allocates every label, at publish, and returns the bindings with the lock; the publisher allocates none for such a document and refuses a publish that would, and a document that is not connected keeps the settling of two publishes. Each publish is built against the state its lock names and carries a retry key; the remote takes one whose base is its head, replays one whose key it has accepted, whatever its base, and refuses any other as a conflict, so a publish whose answer was lost is applied by the next run."
drivers:
  - key: 01a156ac-44be-7182-93e2-15698b6a970a
    kind: local
    label: "Published labels stay"
    statement: "A label once published keeps its node."
  - key: 01a156ac-44be-7182-93e2-156a646382b3
    kind: local
    label: "No label twice"
    statement: "No label is held by two nodes or given out again."
  - key: 01a156ac-44be-7182-93e2-156b2ed7dee1
    kind: local
    label: "Publishing offline"
    statement: "A publish needs no network."
options:
  - key: 01a156ac-44be-7182-93e2-156ce268ff87
    title: "Labels from the remote"
    description: "The remote allocates the labels of each publish, in the order it accepts publishes."
  - key: 01a156ac-44be-7182-93e2-156dc7ec1356
    title: "Local labels, settled later"
    description: "Each clone allocates labels as a document that is not connected does, and a later publish settles the collisions."
  - key: 01a156ac-44be-7182-93e2-156e2d2bcbc3
    title: "Reserved ranges"
    description: "Each clone reserves a range of each counter from the remote and allocates from it locally."
