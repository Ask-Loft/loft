key: 01a1841d-e026-7794-a4d0-b53ef95e66bd
slug: a-continuing-session-holds-what-the-session-it-continues-held
title: "A continuing session holds what the session it continues held"
context: "After `/clear` or a resume, Claude Code goes on in the same process under a new session id, and Yard Client records that the new session continues the one that ended. That continuation kept the ended session's submissions and its last-read revision, but each stage and task stayed with the session id that wrote it, so the continuing session was briefed with no working stage, could not reassign the tasks of the stage it had opened, and had its mirrored tasks, tokens and activity counted elsewhere."
state:
  kind: accepted
  selectedOption: 01a1841d-e027-75bc-9ff6-67f5c0716bec
  outcome: "Wherever Yard Client compares agents, a session counts as the first of its chain of continuations: the continuing session owns the stages and holds the tasks the ended session had, and each block and Act still keeps the session id that wrote it."
drivers:
  - key: 01a1841d-e027-75bc-9ff6-67f2529c515a
    kind: local
    label: "One agent across /clear"
    statement: "The agent that goes on after `/clear` or a resume goes on with the stage and tasks it had."
  - key: 01a1841d-e027-75bc-9ff6-67f3451db108
    kind: local
    label: "Rules that agree"
    statement: "The briefing, the counting of tokens and activity, and the rules of who may change a stage or a task agree on which agent holds it."
  - key: 01a1841d-e027-75bc-9ff6-67f4e509277f
    kind: local
    label: "History as written"
    statement: "Yard Log keeps the session id that wrote each block and Act."
options:
  - key: 01a1841d-e027-75bc-9ff6-67f5c0716bec
    title: "The chain holds them"
    description: "Every comparison of agents counts a session as the first of its chain, so the continuing session holds the ended session's stages and tasks."
  - key: 01a1841d-e027-75bc-9ff6-67f6f3fca81f
    title: "The working stage alone"
    description: "The briefing and the stage that tokens, activity and mirrored tasks count toward follow the chain, while ownership stays with the session id that wrote it."
  - key: 01a1841d-e027-75bc-9ff6-67f73147567b
    title: "Handed over by a write"
    description: "As the continuing session starts, its stages and tasks are written again in its own name."
