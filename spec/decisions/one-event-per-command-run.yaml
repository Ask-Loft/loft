key: 01a13a90-3554-7631-bb13-098b0f4014f8
slug: one-event-per-command-run
title: "Telemetry sends one event per command run"
context: "Usage could be measured as whole workflows, such as starting a specification and reaching a clean check, or as single command runs. `loft` sees only the command it is running; a workflow spans runs and often an agent's session, which `loft` does not see."
state:
  kind: accepted
  selectedOption: 01a13a90-3554-7631-bb13-0990edc3041e
  outcome: "Each run of a command tagged `sends-telemetry` sends one command event. Events about workflows, a sample project or an outcome a person confirms are left for a later version."
drivers:
  - key: 01a13a90-3554-7631-bb13-098cc5419508
    kind: local
    label: "Nothing extra to run"
    statement: "Neither a person nor an agent runs anything beyond the commands they already run."
  - key: 01a13a90-3554-7631-bb13-098d50777520
    kind: local
    label: "Observed, not guessed"
    statement: "An event states only what `loft` itself observed in that run."
options:
  - key: 01a13a90-3554-7631-bb13-098e94457e76
    title: "Workflow markers from the skill"
    description: "The agent skill tells the agent to run a command that marks where a workflow starts and finishes."
  - key: 01a13a90-3554-7631-bb13-098fa49f35e8
    title: "Workflows inferred from runs"
    description: "`loft` treats a run of `loft init` or `loft import v1` as a workflow's start and a clean check or a publish as its end."
  - key: 01a13a90-3554-7631-bb13-0990edc3041e
    title: "One event per command run"
    description: "Each run sends one event about itself, and workflows are left to a later version."
