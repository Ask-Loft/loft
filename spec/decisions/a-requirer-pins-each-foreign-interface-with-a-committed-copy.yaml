key: 01a1f981-4db0-72b8-8a39-a69464c9a062
slug: a-requirer-pins-each-foreign-interface-with-a-committed-copy
title: "A requirer pins each foreign Interface with a committed copy"
context: "The content root hashes an edge by the content hashes of its two endpoints and never by keys, so an edge to another document's Interface needs that Interface's content at hand. A connected document's remote serves every published state by its publish sequence, with labels that never change once published, and each other document has a remote of its own, on whatever server holds it. The pin also decides whether `loft check` needs a network, and how a change to the promise reaches the document that relies on it."
state:
  kind: accepted
  selectedOption: 01a1f981-4db0-72b8-8a39-a69898ae4288
  outcome: "A connected document lists each other document it links to in its manifest's `documents`, under a handle, with that document's key and its remote's address, and commits a copy of each foreign Interface it links to under `spec/documents/<handle>/`, as published at one publish sequence, with that sequence, the state root, the Interface's hash and the labels of its nodes. Only `loft interface` writes a copy, from the other document's remote, reached with the person's sign-in for its address. The pins enter the state root, and the copied nodes' content enters the edges root through the edges that name them. An owner's change to an Interface reaches each requirer when the requirer moves its pin; `loft publish` confirms every copy against its remote before it publishes."
