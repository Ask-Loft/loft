key: 01a21ab4-1b38-7737-8b7b-28d2d1189b94
slug: a-plan-s-approval-ends-its-session-s-plan-mode
title: "A plan's approval ends its session's plan mode"
context: "The page marks the stretches in which the main agent planned. Yard Client heard them only from the permission mode each hook names, and ended a stretch when the mode left `plan`. An Agent SDK host may answer `ExitPlanMode` itself: the person then approves the plan on the page, the agent goes on to build, and the host still reports `plan` until its next run, so the build was counted as planning. Yard Log holds the person's decision of every plan presented in plan mode, on every host."
state:
  kind: accepted
  selectedOption: 01a21ab4-1b38-7737-8b7b-28d593613ed2
  outcome: "A stretch of plan mode ends when the person approves a plan its session's main agent presented in plan mode, or when the host reports another mode, whichever comes first, and `EnterPlanMode` always starts one."
drivers:
  - key: 01a21ab4-1b38-7737-8b7b-28d39e966910
    kind: local
    label: "Any host"
    statement: "A stretch of plan mode ends where it ends on every host, whether or not the host changes its mode after the approval."
  - key: 01a21ab4-1b38-7737-8b7b-28d41cb4dc8f
    kind: local
    label: "The person's decision"
    statement: "Planning ends when the person decides the plan, not at an act of the agent that may come before or after it."
options:
