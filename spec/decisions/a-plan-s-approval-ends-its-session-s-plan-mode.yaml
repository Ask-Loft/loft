    title: "The approval"
    description: "Yard Client ends the stretch when the person approves a plan presented in plan mode, on the page or in the terminal."
  - key: 01a21ab4-1b38-7737-8b7b-28d61965433d
    title: "The host's mode alone"
    description: "The stretch ends only when a hook names a mode other than `plan`."
  - key: 01a21ab4-1b38-7737-8b7b-28d732b7f2bd
    title: "The first edit"
    description: "The main agent's first edit of a file in the tree, other than its plan file, ends the stretch."
