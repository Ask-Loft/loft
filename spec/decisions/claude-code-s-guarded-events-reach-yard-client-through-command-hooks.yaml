consequences:
  - key: 01a183e9-dfcb-7796-a0a4-3caab2b3e9da
    kind: cost
    statement: "A compaction's event holds no sizes and no usage on any machine, so a compaction's tokens no longer reach the totals."
  - key: 01a183e9-dfcb-7796-a0a4-3cabd1a3b813
    kind: cost
    statement: "Plan mode is heard only from the permission mode a command hook is given, not from the `EnterPlanMode` and `ExitPlanMode` calls."
  - key: 01a183e9-dfcb-7796-a0a4-3caca1aa843f
    kind: risk
    statement: "The continuation after `/clear` or a resume is handed on by the id of the Claude Code process that the shell gives the hook, and is lost where the shell gives none."
  - key: 01a183e9-dfcb-7796-a0a4-3cadfecb940f
    kind: obligation
    statement: "The mod's hooks are held to register none on an event the guard keeps from a user's mod."
