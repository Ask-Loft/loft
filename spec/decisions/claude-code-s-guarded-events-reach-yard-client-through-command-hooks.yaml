key: 01a183e9-dfcb-7796-a0a4-3ca302fffd8b
slug: claude-code-s-guarded-events-reach-yard-client-through-command-hooks
title: "Claude Code's guarded events reach Yard Client through command hooks"
context: "Where Claude Code's built-in guard loads, on a machine with managed settings or under a Team or Enterprise login, it runs no hook of a user's mod on a settings hook event, on `session.compact` or on the prompt's events, and tells the person so for each one. The Loft plugin, installed from a marketplace, is always a user's. The context at a session's start, the continuation after `/clear`, the main agent's permission mode, compactions and the page's decision of a plan reached the mod only through those events. A plugin's command hooks in `hooks/hooks.json` run under the guard, and a `PermissionRequest` command hook on `ExitPlanMode` runs beside Claude Code's dialog and closes it with its answer."
state:
  kind: accepted
  selectedOption: 01a183e9-dfcb-7796-a0a4-3ca735be9816
  outcome: "The plugin's `hooks/hooks.json` runs `loft yard claude hook` for the events the guard keeps from a user's mod, and the mod registers a hook on none of them, on any machine. Subagents' starts and ends come from the mod's own unguarded events."
drivers:
  - key: 01a183e9-dfcb-7796-a0a4-3ca41a23c0a0
    kind: local
    label: "Works under the guard"
    statement: "A person whose organization manages Claude Code gets Yard context and Yard's records."
  - key: 01a183e9-dfcb-7796-a0a4-3ca57c90f3f7
    kind: local
    label: "One path"
    statement: "Each function has one path on every machine, so nothing is given or recorded twice."
  - key: 01a183e9-dfcb-7796-a0a4-3ca693a9d1a0
    kind: local
    label: "Nothing new to install"
    statement: "A person who has the Loft plugin and `loft` needs nothing else."
