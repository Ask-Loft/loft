    title: "Command hooks that run loft"
    description: "The plugin's `hooks/hooks.json` runs `loft yard claude hook` for these events, and the mod registers no hook on them."
  - key: 01a183e9-dfcb-7796-a0a4-3ca857c2e565
    title: "The mod's hooks alone"
    description: "The mod keeps its hooks on these events, which run only where the guard does not load."
  - key: 01a183e9-dfcb-7796-a0a4-3ca9e2c2c69a
    title: "Both, side by side"
    description: "The mod keeps its hooks and the command hooks are added beside them, with a record of which one ran."
