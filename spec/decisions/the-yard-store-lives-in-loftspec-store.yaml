key: 01a1646f-5467-7025-8a88-4eb06df63a10
slug: the-yard-store-lives-in-loftspec-store
title: "The yard store lives in loftspec-store"
context: "The yard store needs what `loftspec-store` already owns: a journaled save that a crash cannot leave half done and the next command finishes or undoes, and the port through which `loft` reaches git. The yardlog model is a crate of its own with no I/O."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4eb4f7513f20
  outcome: "The yard store is a part of `loftspec-store`, writing through its journaled save and reaching git through its repository port; the `yardlog` crate holds the model and stays free of I/O."
drivers:
  - key: 01a1646f-5467-7025-8a88-4eb1b9115e11
    kind: local
    label: "One save"
    statement: "Every write of a file `loft` owns goes through one journaled save."
  - key: 01a1646f-5467-7025-8a88-4eb2e3735c80
    kind: local
    label: "One port to git"
    statement: "`loft` reaches git through one port, which the Software Plant simulates."
  - key: 01a1646f-5467-7025-8a88-4eb3ee1f8bbe
    kind: local
    label: "Crate stays focused"
    statement: "`loftspec-store` stays a store of `loft`'s files, not of anything else."
