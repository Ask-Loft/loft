consequences:
  - key: 01a1eeea-3b9f-72c9-8a32-a5ae6d9a5018
    kind: risk
    statement: "On an address the person names, anyone who reaches it can answer for the person and approve a plan that the agent then builds, register any directory of the machine and read its Yard Log, and record a session's events; a tailnet address keeps that within the person's tailnet, and `0.0.0.0` opens it on every network, a coffee shop's among them."
  - key: 01a1eeea-3b9f-72c9-8a32-a5afe5ebae08
    kind: benefit
    statement: "With nothing set, only programs on the machine reach the page server, as before the change, and an upgrade opens no network."
  - key: 01a1eeea-3b9f-72c9-8a32-a5b090c161b3
    kind: cost
    statement: "The page opens on a phone only once the person names an address in `yardListen`, such as the machine's tailnet address; in Codex, which gives the plugin no setting, the page server listens on the loopback interface alone unless one started with `--listen` already runs."
  - key: 01a1eeea-3b9f-72c9-8a32-a5b11d9febc7
    kind: obligation
    statement: "Each session of the Claude Code mod runs `loft yard serve` once when it starts, even where a page server answers, so that a page server listening on other addresses than the setting names is replaced; where two projects name different addresses, the page server is replaced each time a session starts in the other one, and never between."
