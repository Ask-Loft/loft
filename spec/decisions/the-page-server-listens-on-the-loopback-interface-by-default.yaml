key: 01a1eeea-3b9f-72c9-8a32-a5a7ca21f98a
slug: the-page-server-listens-on-the-loopback-interface-by-default
title: "The page server listens on the loopback interface by default, and on the addresses the person names as well"
context: "The person opens the page from other devices as well, such as a phone in their tailnet. A machine's local addresses change with the network it joins, a VPN's address exists only while the VPN is up, and the Claude Code mod starts the page server where the person does not see it. `Host` and `Origin` keep another web page in the person's browser away, but a program on the network sets both itself: on an address the page server listens on, it can answer an open question or approve a plan, which the agent takes as the person's word, register any directory of the machine and read its Yard Log, and record a session's events."
state:
  kind: accepted
  selectedOption: 01a1eeea-3b9f-72c9-8a32-a5ac56d6215c
  outcome: "`loft yard serve` listens on `127.0.0.1` alone unless `--listen` names addresses, and then on each of them as well, `0.0.0.0` naming every address of the machine, trying again an address that is missing until it appears. The Claude Code plugin's `yardListen` setting supplies `--listen`; Codex gives the plugin no setting. `~/.yard/server.json` names the addresses, and a `loft yard serve` of the same version that would listen on other addresses replaces the running page server, so a changed setting takes effect when the next session starts; every other `loft yard serve` that the mod or the Codex worker runs is given `--join`, which joins a running page server of its version whatever its addresses, so that a page server is replaced for its addresses only when a session starts or the person runs `loft yard serve`. A request from another machine needs no key: the page server checks `Host` and `Origin` against the address the request reached."
