    kind: local
    label: "Closed unless the person opens it"
    statement: "With nothing set, nothing beyond the machine reaches the page server, and an upgrade opens no network; the person chooses each network the page opens on."
  - key: 01a1eeea-3b9f-72c9-8a32-a5aab775b4b8
    kind: local
    label: "Small change"
    statement: "Reaching the page from another device changes the page server, the plugin and the page as little as it can."
