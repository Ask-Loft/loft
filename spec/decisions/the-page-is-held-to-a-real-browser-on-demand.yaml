key: 01a16488-d2a3-7188-9662-db71eb9a9aeb
slug: the-page-is-held-to-a-real-browser-on-demand
title: "The page is held to a real browser on demand"
context: "The web browser calls the page server, so the page is held by tests that run it in a browser rather than by a simulator. A real browser in every CI run is slow and heavy; a DOM emulator runs fast but proves only what it emulates."
state:
  kind: accepted
  selectedOption: 01a16488-d2a3-7188-9662-db744eb61ee1
  outcome: "A suite drives the real page in a headless browser against `loft yard serve`, marked `#[ignore]` and run with `--run-ignored only`, as the suites of remote services are; the page's own logic is unit-tested in a DOM emulator in CI."
drivers:
  - key: 01a16488-d2a3-7188-9662-db723a1def6e
    kind: local
    label: "Proved in a browser"
    statement: "Something shows that the page works in a real browser."
  - key: 01a16488-d2a3-7188-9662-db739ba4f579
    kind: local
    label: "Fast CI"
    statement: "Ordinary CI runs stay as fast as they are."
