slug: waits-beyond-ten-minutes-are-a-loop-of-bounded-waits
title: "Waits beyond ten minutes are a loop of bounded waits"
context: "A mod runs a host command for at most ten minutes, and a person may take an hour to answer. `loft yard wait` can either wait as long as it is asked or return after a bound."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4ec1a16c54c0
  outcome: "`loft yard wait` returns within 2 seconds of its submission ceasing to be open, or with the outcome `pending` after its timeout of at most 540 seconds; the mod runs it again until the submission is answered or withdrawn, or Yard Log is closed."
