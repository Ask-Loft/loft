  - key: 01a1646f-5467-7025-8a88-4ec000e8051f
    kind: local
    label: "Prompt"
    statement: "The answer reaches the agent within seconds."
options:
  - key: 01a1646f-5467-7025-8a88-4ec1a16c54c0
    title: "A loop of bounded waits"
    description: "Each `loft yard wait` ends by its timeout, and the mod starts the next."
  - key: 01a1646f-5467-7025-8a88-4ec216a5486f
    title: "One unbounded wait"
    description: "One `loft yard wait` runs until the submission is no longer open."
