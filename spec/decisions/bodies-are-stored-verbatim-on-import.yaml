key: dc918909-2892-40ce-be29-805437e63cd5
slug: bodies-are-stored-verbatim-on-import
title: "Bodies are stored verbatim on import"
context: "A Loft v1 export carries bodies with headings and other prose that the v2 model would express as Section nodes. The converter can transform such bodies during import or store them byte for byte and report them."
state:
  kind: accepted
  selectedOption: ce9f44de-6c21-4674-9f1c-9a75f7395b79
  outcome: "The converter stores every body byte for byte and reports a body with headings as a finding; restructuring into Sections is an authored change after import."
drivers:
  - key: 08f7dd13-8e55-4aa2-a7b6-acb910f54f51
    kind: local
    label: "Exact round trip"
    statement: "The source state's four addresses must be reproducible, so body bytes must be preserved."
  - key: c07376ba-f9db-4ca5-a232-b1755494d28d
    kind: local
    label: "No silent change of meaning"
    statement: "Import alters nothing the document says without an author's decision."
  - key: fc4d0d7a-66ac-412e-8d79-73520920832e
    kind: local
    label: "A clean v2 outline"
    statement: "Bodies should eventually carry no headings."
options:
  - key: ce9f44de-6c21-4674-9f1c-9a75f7395b79
    title: "Verbatim, with findings"
    description: "Bodies are stored unchanged; a heading in a body is reported; authors restructure after import."
  - key: e6abd68a-1cd4-4fa5-9067-226a13109e2b
    title: "Split headings into Sections automatically"
    description: "The converter turns each heading and the text beneath it into a Section node during import."
