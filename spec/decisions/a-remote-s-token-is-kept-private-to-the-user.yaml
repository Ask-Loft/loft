key: 01a156c0-e478-7517-a896-162069fcc2ac
slug: a-remote-s-token-is-kept-private-to-the-user
title: "A remote's token is kept in the user's configuration, private to the user"
context: "A connected document's remote admits a request by a bearer token, which grants whatever the remote lets its holder do. A token on a command line lands in the shell's history and in the list of running processes, and a token in the repository is shared with everyone who clones it."
state:
  kind: accepted
  selectedOption: 01a156c0-e478-7517-a896-162499954686
  outcome: "`loft remote set` reads the token from standard input and writes it, under the document key, to `loft/remotes.json` in the user's configuration directory with permission for its owner alone; `loft` refuses to read that file when it is not private to the user, as SSH refuses a key, and environment variables override it for one run."
drivers:
  - key: 01a156c0-e478-7517-a896-1621e4c9388a
    kind: local
    label: "Kept between runs"
    statement: "A person sets the token once for a document, not in every shell."
  - key: 01a156c0-e478-7517-a896-162257515a85
    kind: local
    label: "Out of sight"
    statement: "The token reaches no shell history, process list, repository or output."
  - key: 01a156c0-e478-7517-a896-162354601e13
    kind: local
    label: "No extra service"
    statement: "Every platform `loft` runs on keeps the token without a service beside it."
options:
  - key: 01a156c0-e478-7517-a896-162499954686
    title: "A private file that `loft remote` writes"
    description: "The token is read from standard input and kept in the user's configuration directory, in a file that only its owner may read."
  - key: 01a156c0-e478-7517-a896-1625a82fd9a8
    title: "Environment variables only"
    description: "The address and the token come from the environment of each run."
  - key: 01a156c0-e478-7517-a896-1626574542a9
    title: "The system's keychain"
    description: "The token is kept in the platform's credential store."
