key: 01a1a7ee-1768-724b-91f4-35e78d4a199a
slug: flowcharts-are-drawn-by-the-page-over-elk
title: "Flowcharts are drawn by the page over ELK"
context: "Agents write their diagrams as Mermaid in a block's Markdown, nearly all of them flowcharts, and the page drew each with Mermaid, which lays a flowchart out with dagre and draws it in its own shapes: curved edges that cross their labels, uneven spacing, and boxes whose look a theme and a stylesheet change only so far. Beside the rest of the page, drawn in Loft Web's design, the diagrams looked like another product. Mermaid's parser stays the reference for what its source means."
state:
  kind: accepted
  selectedOption: 01a1a7ee-1768-724b-91f4-35ec5bb14463
  outcome: "The page draws a Mermaid flowchart of a block's Markdown itself: Mermaid parses it, ELK's layered layout places its nodes and routes its edges orthogonally, and the page draws the result as SVG in Loft Web's design. Other diagram kinds, and the diagrams the page builds itself, stay with Mermaid on the page's theme. `elkjs` is vendored beside Mermaid, under its own licence."
