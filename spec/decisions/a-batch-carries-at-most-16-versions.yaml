key: 01a20dc9-eaae-7491-b6c6-e7f355226276
slug: a-batch-carries-at-most-16-versions
title: "A batch carries at most 16 versions"
context: "A writing command waits at most 2 seconds for its batch to cross. An ordinary version is about 0.6 kilobytes, and a `loft` block's snapshot up to about 232 kilobytes, so a batch of 16 runs from about 10 kilobytes to about 3.7 megabytes."
state:
  kind: accepted
  selectedOption: 01a20dc9-eaae-7491-b6c6-e7f7326794af
  outcome: "A batch carries from one to 16 versions, a constant of `loft` with no variable to change it, and Yard Server refuses an empty batch and one of more than 16."
drivers:
  - key: 01a20dc9-eaae-7491-b6c6-e7f4ed89c9e3
    kind: local
    label: "Fits the wait"
    statement: "An ordinary batch crosses well within 2 seconds."
  - key: 01a20dc9-eaae-7491-b6c6-e7f5d72e5a2e
    kind: local
    label: "Drains a backlog"
    statement: "A backlog empties in few runs."
  - key: 01a20dc9-eaae-7491-b6c6-e7f66397bc94
    kind: local
    label: "Simple to hold to"
    statement: "Both sides check the limit without measuring bytes."
