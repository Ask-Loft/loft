key: e2774ca8-7217-4d48-bba4-49fdb87372bc
slug: lint-configuration-lives-in-the-repository-2
title: "Lint configuration lives in the repository"
context: "Lint findings gate a pull request. If configuration lives on each machine or only in command-line flags, two engineers, or an engineer and CI, see different findings for the same tree. The linter needs one place to read which rules run and at what severity, and that place should change only through review."
state:
  kind: superseded
  selectedOption: fbeb9660-615a-4764-a7f5-e519053fc455
  outcome: "The linter reads its configuration only from `spec/lint.yaml`; without that file it runs every rule at its default severity; no flag or user file changes a finding."
  successor: 575101b8-1ce6-4633-96c0-3ccddb685046
drivers:
