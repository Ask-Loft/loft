slug: yard-log-is-closed-by-the-agent-or-by-the-merge
title: "Yard Log is closed by the agent or by the merge"
context: "Once a branch's work is finished, its Yard Log becomes a record and takes no more writes or answers. The agent may forget to close it, and a merge is what brings its files into the base branch."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4ed66156dddc
  outcome: "The agent closes Yard Log before the merge; Yard Log that the base branch holds and that is not closed reads as closed by the merge."
