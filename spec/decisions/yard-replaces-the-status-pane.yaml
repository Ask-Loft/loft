key: 01a16a2f-7067-72f9-b4c8-7354192c727b
slug: yard-replaces-the-status-pane
title: "Yard replaces the status pane"
context: "The Loft plugin's mod drew a status pane in Claude Code: the checks of the loop, the nodes the branch added, changed and removed, the criteria to verify and the file being written, read live by four `loft` commands after each edit of the specification, each `loft` or `git` command, each turn and every 10 seconds. Yard Log now records the work's stages, tasks, questions and decisions and the reports of `loft` at each point of the specification's work, and the Yard page draws them for the person, while the agent runs the checks of the loop itself. The pane's rule that it learns of the specification only from `loft`'s JSON lives on for Yard Client in the accepted decision \"Yard Client is a mod over loft\"."
state:
  kind: accepted
  selectedOption: 01a16a2f-7068-74bc-9949-6d82f8550f27
  outcome: "The Loft plugin draws no status pane, keeps no status-line entry and offers no `/loft-status`; its mod is Yard Client alone, and the person follows the work of a specification on the Yard page."
drivers:
