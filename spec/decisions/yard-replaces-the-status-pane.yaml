  - key: 01a16a2f-7068-74bc-9949-6d8371779708
    title: "Keep the status-line entry"
    description: "The pane and `/loft-status` go, and a one-line summary of the branch stays in the status line, read as the pane read it."
  - key: 01a16a2f-7068-74bc-9949-6d84345324c9
    title: "Keep the pane, off by default"
    description: "The pane stays, behind a setting that leaves it off unless the person turns it on."
  - key: 01a16a2f-7068-74bc-9949-6d85e865fb9a
    title: "Keep the pane beside Yard"
    description: "The mod holds both the pane and Yard Client, as before."
