key: 01a20dc9-eaae-7491-b6c6-e7f355226276
slug: a-batch-carries-at-most-16-versions-and-1-mib
title: "A batch carries at most 16 versions and at most 1 MiB"
context: "A sending waits at most 10 seconds for Yard Server to answer a batch. An ordinary version is about 0.6 kilobytes, and a `loft` block's snapshot up to about 232 kilobytes, so a batch of 16 runs from about 10 kilobytes to about 3.7 megabytes, which a link slower than about 3 Mbit/s does not carry in 10 seconds; the same batch would then be sent again and again, holding up every entry after it."
state:
  kind: accepted
  selectedOption: 01a213ce-4185-764b-8225-ec2bae751881
  outcome: "A batch carries from one to 16 versions whose entry files hold at most 1 MiB together, and an entry larger than 1 MiB goes alone; both are constants of `loft` with no variable to change them, and Yard Server refuses an empty batch and one of more than 16 versions with `400`, and a body larger than 1 MiB with `413`."
