key: 01a21c37-0456-7725-b4e6-ee569adc9e40
slug: yard-client-acts-only-in-a-working-tree-that-uses-loft
title: "Yard Client acts only in a working tree that uses Loft, which its files or a git setting show"
context: "A person may enable the Loft plugin for themselves rather than for a project, and Claude Code and Codex then run its hooks, its mod and its `yard` skill in every repository. In a repository that has nothing to do with Loft they briefed the agent toward Yard, opened Yard Log in the working tree on its first question or plan, added the repository to the page and left files under git's directory and in `~/.yard/`. A project could keep the plugin out only through a setting of its own, which, kept out of the history, a new worktree does not carry. A mod that stays off starts no page server, as with a protocol mismatch, so ADR-79 holds for the mods that are on."
state:
  kind: accepted
  selectedOption: 01a21c37-0456-7725-b4e6-ee5b147e1c67
  outcome: "Yard Client acts only for an agent whose working tree, or a directory above it within its worktree, holds `spec/loftspec.yaml`, `loft.lock.json` or Yard Log of any branch, or where git's configuration sets `loft.yard` to true. Everywhere else the command hooks answer nothing and write nothing, and the mod, which learns the answer from `loft yard protocol`, stays off for the session without a notice."
drivers:
  - key: 01a21c37-0456-7725-b4e6-ee57ed996db6
    kind: local
    label: "Quiet elsewhere"
    statement: "With the plugin enabled for the person, a repository that does not use Loft runs as it would without the plugin."
  - key: 01a21c37-0456-7725-b4e6-ee58c386583f
    kind: local
    label: "Yard without a specification"
    statement: "A repository that keeps Yard Log and no specification still gets Yard Client."
  - key: 01a21c37-0456-7725-b4e6-ee59af12554b
    kind: local
    label: "Every worktree"
    statement: "A new worktree or clone of a repository that uses Loft gets Yard Client with no setup of its own."
  - key: 01a21c37-0456-7725-b4e6-ee5aa5a39834
    kind: local
    label: "A cheap check"
    statement: "In a repository that uses Loft, the check adds no process to a hook."
