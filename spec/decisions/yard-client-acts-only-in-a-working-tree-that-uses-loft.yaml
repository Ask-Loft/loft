    statement: "A repository that ignores `.yard/` and holds no specification, and a monorepo whose `spec/` lies in a package entered from above it, need `loft.yard` set before Yard Client acts there."
  - key: 01a21c37-0456-7725-b4e6-ee61b01c0ce8
    kind: cost
    statement: "In a repository that does not use Loft, each hook still starts `loft`, which asks git for `loft.yard` before it answers nothing."
