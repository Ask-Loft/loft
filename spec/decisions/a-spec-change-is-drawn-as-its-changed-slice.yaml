key: 01a1646f-5466-77f8-9738-e123c8da67b0
slug: a-spec-change-is-drawn-as-its-changed-slice
title: "A spec change is drawn as its changed slice"
context: "A branch usually changes a few nodes of a specification that may hold hundreds. A diagram of the whole specification would hide the change; a list alone would lose how the changed nodes hang together; and a count of the changed Requirements and criteria says how much changed but not what."
state:
  kind: accepted
  selectedOption: 01a1646f-5466-77f8-9738-e1263c2091ae
  outcome: "A `spec-change` view is drawn as a diagram of the changed nodes and what they belong to, the changed Requirements and criteria drawn beneath their Feature with their words, and a diff of the words of every changed node beneath it."
drivers:
  - key: 01a1646f-5466-77f8-9738-e124b194c01d
    kind: local
    label: "Grows with the change"
    statement: "The drawing's size follows the change, not the specification."
  - key: 01a1646f-5466-77f8-9738-e12532b08f5e
    kind: local
    label: "Shows structure"
    statement: "The reader sees where each changed node sits."
  - key: 01a1695a-dd6c-719e-8863-4101ae729985
    kind: local
    label: "Shows what changed"
    statement: "The reader reads the words that changed, not a count of them."
options:
  - key: 01a1646f-5466-77f8-9738-e1263c2091ae
    title: "The changed slice"
    description: "Only changed nodes and their ancestors, with edges between them, and a diff of each changed node's words beneath."
  - key: 01a1646f-5466-77f8-9738-e1272cfba5b3
    title: "The whole specification, changes marked"
    description: "Every node drawn, the changed ones marked."
  - key: 01a1646f-5466-77f8-9738-e1288f7eac81
    title: "A list of changes"
    description: "Each changed node in a list, without a diagram."
