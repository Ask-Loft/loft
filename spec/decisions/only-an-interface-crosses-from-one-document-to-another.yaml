  - key: 01a1f981-4db0-72b8-8a39-a6a4644482ed
    title: "Only `provides` and `requires`"
    description: "Only a Component's link to a foreign Interface crosses, and finer citations stay in prose."
  - key: 01a1f981-4db0-72b8-8a39-a6a5b6412d21
