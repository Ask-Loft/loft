key: 01a1f981-4db0-72b8-8a39-a69f90664d67
slug: only-an-interface-crosses-from-one-document-to-another
title: "Only an Interface crosses from one document to another"
context: "Once Interfaces exist, a reference from one connected document into another still has to be bounded: which fields may hold one, and which nodes of the other document it may name. A stand-in `external` Component already carries the local edges to the system another document describes, and a Requirement often rests on one criterion of a promise rather than the whole of it."
state:
  kind: accepted
  selectedOption: 01a1f981-4db0-72b8-8a39-a6a3ab9aa6fd
  outcome: "A reference into another document names a node of a copy of one of its Interfaces, as a record of the other document's handle and the node's key. A Component `provides` or `requires` a foreign Interface; any element may `mentions` a foreign Interface or a node beneath it; a decision may name one as an `affected` subject. A foreign node is never realized, scoped to, or a decision's `outcome`. An `external` stand-in Component stays as the local face of the other system and carries its `provides` or `requires` link."
drivers:
  - key: 01a1f981-4db0-72b8-8a39-a6a019b1b223
    kind: local
    label: "Owner's freedom"
    statement: "Nothing outside a promise can be named from another document."
  - key: 01a1f981-4db0-72b8-8a39-a6a15470ed1c
    kind: local
    label: "Precise citations"
    statement: "A Requirement can cite the exact criterion of a promise it rests on."
  - key: 01a1f981-4db0-72b8-8a39-a6a25125b522
    kind: local
    label: "Ownership stays local"
    statement: "Only a document says what it is made of and what its decisions bring about."
options:
