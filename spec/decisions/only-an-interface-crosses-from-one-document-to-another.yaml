consequences:
  - key: 01a1f981-4db0-72b8-8a39-a6a65ef278f7
    kind: obligation
    statement: "The reader, the validator, the formatter, the hasher, the renderer and the linter each handle a reference written as a handle and a key, in the fields that may hold one and in no other."
  - key: 01a1f981-4db0-72b8-8a39-a6a7456924d6
    kind: benefit
    statement: "Each dependency on another document is visible on one stand-in Component, and every other edge stays inside the document."
  - key: 01a1f981-4db0-72b8-8a39-a6a847a29a93
    kind: risk
    statement: "A Requirement that cites a criterion of a promise breaks when that criterion leaves the promise, which `loft interface update` reports as a dangling reference."
