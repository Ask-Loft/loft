key: 01a21838-6272-74ef-9f37-1de47fc6bdce
slug: the-sessionstart-hook-tells-the-agent-that-yard-client-is-off
title: "The SessionStart command hook tells the agent that Yard Client is off where no loft can be run"
context: "Where no `loft` can be run, the mod registers no Yard tool and says so in a toast, as the accepted decision \"The mod checks the loft yard protocol and offers no tools across a mismatch\" has it. A host that draws no toast, such as one built on the Agent SDK, shows nobody why, and the agent, reading the `yard` skill, keeps looking for tools that were never registered. The mod cannot add to the agent's context as a session starts: its `session.start` result changes nothing, and the prompt's events are ones Claude Code's built-in guard passes over for a user's mod."
state:
  kind: accepted
  selectedOption: 01a21838-6272-74ef-9f37-1de8944cde2b
  outcome: "The plugin's command hooks run through a launcher in the plugin, which, finding no `loft` for the SessionStart hook, adds to the agent's context that Yard Client is off and how to turn it on. No Yard tool is registered while Yard Client is off, as before; a protocol mismatch keeps the mod's toast alone."
