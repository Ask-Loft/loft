  - key: 01a21838-6272-74ef-9f37-1de61378ddf6
    kind: local
    label: "No half-working tools"
    statement: "No Yard tool is offered that cannot work."
  - key: 01a21838-6272-74ef-9f37-1de78bc7e501
    kind: local
    label: "Before the first call"
    statement: "The agent knows as the session starts, not after a failed call."
