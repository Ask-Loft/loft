key: 01a144ee-c59d-7512-b23e-0aafe92132a1
slug: the-status-pane-reads-loft-only-through-its-json
title: "The status pane reads Loft only through the command line's JSON"
context: "The Loft status pane needs the state of a specification: its findings, its layout, its trace and what a branch changed in it. The Format, its reader and its rules belong to `loftspec` and `loft`, and each `loft` command prints one JSON document whose shape its schema fixes. A pane in an agent host is written in that host's language and released with the plugin, not with `loft`."
state:
  kind: superseded
  selectedOption: 01a144ee-c59e-7325-802c-d718444afde2
  outcome: "The pane runs `loft` commands with `--format json` and draws from their documents alone; what it needs that no command reports becomes a command of `loft` first, as `loft status` did."
  successor: 01a16a2f-7067-72f9-b4c8-7354192c727b
drivers:
  - key: 01a144ee-c59e-7325-802c-d7153f4c3289
    kind: local
    label: "One reader"
    statement: "The tree is read, validated and compared by one implementation."
  - key: 01a144ee-c59e-7325-802c-d716ab6daa27
    kind: local
    label: "A stable seam"
    statement: "A change to the Format's files does not break the pane."
  - key: 01a144ee-c59e-7325-802c-d717557fc068
    kind: local
    label: "Useful beyond one host"
    statement: "What the pane learns is available to any agent host and to a person at a terminal."
options:
  - key: 01a144ee-c59e-7325-802c-d718444afde2
    title: "The commands' JSON documents"
    description: "The pane runs `loft` commands with `--format json` and parses their documents, each held to its schema."
  - key: 01a144ee-c59e-7325-802c-d719398a0832
    title: "The pane reads the files"
    description: "The pane parses `spec/`, `spec/labels.yaml`, `loft.lock.json` and `loft.trace.yaml` itself, and asks git for the base commit's files."
