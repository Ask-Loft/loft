key: 01a13070-7f35-7224-8ec2-c5aae3e42c5f
slug: a-system-that-calls-loft-is-held-by-a-contract-suite
title: "A system that calls Loft is held by a contract suite without a simulator"
context: "git runs `loft merge-driver` during a merge. The Software Plant simulates each external system that Loft calls, and a contract suite holds each simulator to the real system. git's merge machinery is not a system that Loft calls: git calls Loft, so there is no call of Loft's for a simulator to answer."
state:
  kind: accepted
  selectedOption: 01a13070-7f35-7224-8ec2-c5a4d847f2c7
  outcome: "The parallel-work scenarios run under a real `git merge` with `loft merge-driver` installed, as a contract suite with no simulator, because git calls Loft and Loft does not call git's merge."
drivers:
  - key: 01a13070-7f35-7224-8ec2-c5a16bcce134
    kind: local
    label: "Loft does not call it"
    statement: "Loft never makes the calls with which git merges a file; git calls Loft."
  - key: 01a13070-7f35-7224-8ec2-c5a2d1095bdc
    kind: local
    label: "The caller's contract"
    statement: "How git runs a merge driver, its arguments, its files and its exit codes, is git's to define."
  - key: 01a13070-7f35-7224-8ec2-c5a3f8888751
    kind: local
    label: "Honest"
    statement: "A test of the merge shows what a person's `git merge` does."
options:
  - key: 01a13070-7f35-7224-8ec2-c5a4d847f2c7
    title: "A contract suite against real git"
    description: "The parallel-work scenarios run as `git merge` in temporary repositories with the driver installed, and no simulator stands in for git's merge."
  - key: 01a13070-7f35-7224-8ec2-c5a51d8175e3
    title: "A merge simulator and a contract suite"
    description: "The git simulator also runs a merge driver the way git does, and a contract suite holds it to real git."
  - key: 01a13070-7f35-7224-8ec2-c5a698cb17fb
    title: "No git in the tests"
    description: "The tests call `loft merge-driver` directly with three files, and nothing runs `git merge`."
