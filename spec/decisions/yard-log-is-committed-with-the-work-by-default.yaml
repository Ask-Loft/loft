key: 01a1646f-5467-7025-8a88-4ed9956dda92
slug: yard-log-is-committed-with-the-work-by-default
title: "Yard Log is committed with the work by default"
context: "Yard Log records how a change was planned and decided: the questions asked, the answers given, the plans approved. Kept in the repository, it travels with the branch and is read in review. Some repositories keep plans out of their history, such as a public one whose rules say so, and such a repository ignores the directory."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4edc9471939f
  outcome: "Yard Log is kept under `.yard/` in the working tree; `loft yard read` reports whether git ignores `.yard/`, and the `yard` skill tells the agent to commit `.yard/` with its work unless it is ignored."
drivers:
  - key: 01a1646f-5467-7025-8a88-4eda92f8615b
    kind: local
    label: "Travels with the branch"
    statement: "Yard Log reaches every clone of the branch and its review."
  - key: 01a1646f-5467-7025-8a88-4edb73e8ea9b
    kind: local
    label: "The repository decides"
    statement: "A repository that keeps plans out of its history can do so without changing Yard Client."
options:
  - key: 01a1646f-5467-7025-8a88-4edc9471939f
    title: "Committed unless ignored"
    description: "Kept in the working tree and committed with the work, unless the repository ignores `.yard/`."
  - key: 01a1646f-5467-7025-8a88-4edd71a25a90
    title: "Local unless chosen"
    description: "Kept outside the working tree, on the machine, and committed only where a project opts in."
assessments:
