    rationale: "it is in the branch's commits"
  - option: 01a1646f-5467-7025-8a88-4edc9471939f
    driver: 01a1646f-5467-7025-8a88-4edb73e8ea9b
    rating: supports
    rationale: "`.gitignore` keeps it out"
  - option: 01a1646f-5467-7025-8a88-4edd71a25a90
    driver: 01a1646f-5467-7025-8a88-4eda92f8615b
    rating: conflicts
    rationale: "it stays on one machine"
  - option: 01a1646f-5467-7025-8a88-4edd71a25a90
    driver: 01a1646f-5467-7025-8a88-4edb73e8ea9b
    rating: supports
    rationale: "a project opts in"
consequences:
  - key: 01a1646f-5467-7025-8a88-4eded412308c
    kind: obligation
    statement: "Every file Yard Client writes under `.yard/` is fit to be committed: it holds names, ids, times, counts and what the agent and the person wrote, and never the session's raw events."
  - key: 01a1646f-5467-7025-8a88-4edf066e6016
    kind: risk
    statement: "A repository that should not hold plans has to ignore `.yard/` before the first commit of any branch's Yard Log."
