  - option: 01a1646f-5466-77f8-9738-e135d6e68068
    driver: 01a1646f-5466-77f8-9738-e134acab2a6e
    rating: supports
    rationale: "each branch's Yard Log has its own lock"
  - option: 01a1646f-5466-77f8-9738-e1361194a1d8
    driver: 01a1646f-5466-77f8-9738-e132bf6d5767
