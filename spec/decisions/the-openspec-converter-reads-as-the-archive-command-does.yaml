key: 01a13d04-2b9d-7320-aa86-8a879dec4c21
slug: the-openspec-converter-reads-as-the-archive-command-does
title: "The OpenSpec converter reads a main spec as OpenSpec's archive command does"
context: "OpenSpec reads a main spec in two ways. `openspec show --json` takes every child heading of `Requirements` as a requirement; the archive command, which writes the main specs, takes only `### Requirement:` headings and keeps any other heading in the block before it. The JSON also drops the title, the other sections, fenced code and metadata lines."
state:
  kind: accepted
  selectedOption: 01a13d04-2b9d-7320-aa86-8a859537e4aa
  outcome: "The converter reads the Markdown itself, recognises requirements as the archive command does, and turns the other headings into Sections."
