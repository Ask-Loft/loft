key: 01a21838-6272-74ef-9f37-1ddbbcbc7910
slug: the-plugin-looks-for-loft-in-cargo-s-bin-beyond-the-search-path
title: "Beyond the search path, the plugin looks for loft in cargo's bin directory alone"
context: "`cargo install` puts `loft` in the `bin` directory of cargo's home, `CARGO_HOME` where it is set and `~/.cargo` otherwise, as `loft` itself reckons a cargo install. A shell's startup files add that directory to the search path. A host that starts Claude Code without reading them, such as an app opened from the desktop or a host built on the Agent SDK, starts sessions in which the bare `loft` cannot be run, so Yard Client is off there although `loft` is installed. The command hooks run on every tool call, so whatever they try costs every call."
state:
  kind: accepted
  selectedOption: 01a21838-6272-74ef-9f37-1ddffe5c3853
  outcome: "While `loftCommand` is `loft`, the mod and the command hooks run the `loft` on the search path, else the `loft` in `$CARGO_HOME/bin`, or `~/.cargo/bin` where `CARGO_HOME` is not set; a `loftCommand` the person set is run as written. A `loft` installed anywhere else, such as under a version manager for Node, is reached by putting it on the search path or naming it in `loftCommand`."
