title: "Agents write typed blocks and the person only answers"
context: "Yard Log is written by agents and read and answered by a person. Its page draws questions as forms, decisions beside the questions they settle and tasks along time; a free document would leave each of these to be guessed from prose, and a document both sides edit would let an agent write a person's answer."
