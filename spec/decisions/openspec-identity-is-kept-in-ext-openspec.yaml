key: 01a1403a-512d-76c8-b11e-f0f714414b63
slug: openspec-identity-is-kept-in-ext-openspec
title: "OpenSpec identity is kept in `ext.openspec`"
context: "An OpenSpec project names each requirement, places each capability at a path, carries metadata lines such as `**ID**:` and may hold the Purpose its archive command writes as a placeholder. Rendering a converted and edited tree back to OpenSpec needs all four, and the provenance sidecar records them only as they were at import."
state:
  kind: accepted
  selectedOption: 01a1403a-512d-76c8-b11e-f0fadae749fb
  outcome: "The converter writes a Requirement's name and metadata lines and a Feature's capability id and placeholder Purpose into `ext.openspec`, and the OpenSpec renderer reads them from there and from nothing beside `spec/`."
drivers:
  - key: 01a1403a-512d-76c8-b11e-f0f872e201e9
    kind: local
    label: "Render back after edits"
    statement: "An edited tree renders back to the OpenSpec names and paths it came from."
  - key: 01a1403a-512d-76c8-b11e-f0f9fabe6999
    kind: local
    label: "Clean bodies"
    statement: "A body holds the text an author wrote and no tool data."
options:
  - key: 01a1403a-512d-76c8-b11e-f0fadae749fb
    title: "Keep them in `ext.openspec`"
    description: "The names, paths, metadata lines and placeholder live on the nodes, in the `openspec` namespace."
  - key: 01a1403a-512d-76c8-b11e-f0fb7d811bd8
    title: "Keep them in the sidecar"
    description: "The provenance sidecar records them, and the renderer reads the sidecar."
