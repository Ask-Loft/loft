key: 01a1646f-5467-7025-8a88-4ef1a2266994
slug: yardlog-records-carry-keys
title: "yardlog records carry keys, so that a server can take Yard Log up"
context: "Yard Log will later be connected with a server, which must hold the same records as the files. The agent names its blocks by ids it chooses, which it may reuse or rename; branches are renamed; counters such as a submission's number collide across clones. A specification already gives each node a key that `loft` mints and the author never writes."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4ef569ed9643
  outcome: "Every record of Yard Log carries a UUIDv7 key that `loft` mints on its first write and keeps for life: Yard Log itself, each stage, block, version, submission and response; every reference between records is by key, and the agent's ids are handles that the store maps to keys."
drivers:
  - key: 01a1646f-5467-7025-8a88-4ef24dfd1306
    kind: local
    label: "A server takes it up as it is"
    statement: "A server holds the same records, by the same identities, as the files."
  - key: 01a1646f-5467-7025-8a88-4ef389f67f24
    kind: local
    label: "Simple for the agent"
    statement: "The agent names its blocks by short ids of its choosing."
  - key: 01a1646f-5467-7025-8a88-4ef4c66939a1
    kind: local
    label: "Stable across renames"
    statement: "Renaming a branch or a block's id leaves its records' identity unchanged."
options:
  - key: 01a1646f-5467-7025-8a88-4ef569ed9643
    title: "Keys minted by loft, ids as handles"
    description: "Keys for identity, minted by `loft`; ids for the agent, mapped to keys by the store."
  - key: 01a1646f-5467-7025-8a88-4ef62266e5c1
    title: "Ids and counters only"
    description: "Records are known by the agent's ids, the branch and counters such as `s1`."
