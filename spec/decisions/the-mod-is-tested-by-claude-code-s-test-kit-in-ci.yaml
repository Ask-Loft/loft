slug: the-mod-is-tested-by-claude-code-s-test-kit-in-ci
title: "The mod is tested by Claude Code's test kit in CI"
context: "Claude Code calls the Loft mod, so the mod is held by tests that run it under Claude Code rather than by a simulator. Claude Code's test kit, run by `claude plugin test`, loads the mod, fires events through its hooks and lets each test stub what Claude Code would answer, with no session, no sign-in and no network, and exits 1 when a test fails. Until now CI ran none of the mod's tests."
state:
  kind: accepted
  selectedOption: 01a16488-d2a3-7188-9662-db6bc69250dd
  outcome: "The mod's tests are written with Claude Code's test kit and run in CI by `claude plugin test`, under a version of Claude Code that CI installs at a pinned version, no older than the mod needs."
