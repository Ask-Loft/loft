key: 01a13655-2b85-70a3-a3c2-6b5cfac8e1a6
slug: one-host-neutral-skill-composed-for-each-host
title: "One host-neutral source of the skill, composed for each agent host"
context: "The `loft-spec` skill reaches coding agents through more than one host, and each host reads skills from its own directory and takes its own metadata: one host takes extra frontmatter fields and a reference about its tools, another takes a sidecar file of interface and policy. The skill's teaching is the same for every host."
state:
  kind: accepted
  selectedOption: 01a13655-2b85-70a3-a3c2-6b60ef899dd5
  outcome: "The skill has one host-neutral source under `crates/loft-cli/skill/loft-spec/`, with each host's adaptation under its `agents/` directory, and the composer in `loft` builds one package for each host from it."
