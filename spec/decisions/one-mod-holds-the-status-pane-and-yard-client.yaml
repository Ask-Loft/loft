slug: one-mod-holds-the-status-pane-and-yard-client
title: "One mod holds the status pane and Yard Client"
context: "The Loft plugin already holds a mod, the Loft status pane, which runs `loft` through its `loftCommand` setting and hears the agent's edits. Yard Client needs a mod too, to register its tools and to hook the agent's questions, plans and tasks. A plugin's `hooks/hooks.json` may name more than one module."
