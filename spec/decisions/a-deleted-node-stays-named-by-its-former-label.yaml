key: 63ac0564-e251-48db-93a1-130a3dc198a0
slug: a-deleted-node-stays-named-by-its-former-label
title: "A deleted node stays named by its former label"
context: "A retired or superseded decision keeps its history: the nodes it chose, affected and weighed. When such a node later leaves the document, the decision still names it, and Loft v1 exports keep those references. The Format names a node by key in files and by content hash in views, and neither exists for a node the document no longer holds."
state:
  kind: accepted
  selectedOption: 027e6dbc-df7b-45fb-8cd7-29d19d4e8e24
  outcome: "A retired or superseded decision names a node the document no longer holds by that node's former label; the validator refuses a former label anywhere else and any former label an element carries, and the publisher allocates no former label again."
drivers:
  - key: bfb252d4-71a9-4dea-b6ae-2836b0ea7743
    kind: local
    label: "Readable history"
    statement: "A reader of a retired decision can tell which node it named."
  - key: b7f47a83-f531-403b-ba49-8ee5432451e2
    kind: local
    label: "Keyless content"
    statement: "The content root stays free of keys, as every other view is."
  - key: 659d6760-1e5a-485a-93fc-0761befd4332
    kind: local
    label: "Labels stay unique"
    statement: "A label names one node for the life of the document."
