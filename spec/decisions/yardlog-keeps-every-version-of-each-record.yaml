key: 01a1646f-5467-7025-8a88-4ee8d32047c0
slug: yardlog-keeps-every-version-of-each-record
title: "yardlog keeps every version of each record"
context: "An agent rewrites a block as the work goes on: a plan revised after a rejection, a question asked again, a stage's goal sharpened. A server that takes Yard Log up later can hold only what the files kept, and two copies of one Yard Log meet when git merges them."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4eec01d82096
  outcome: "Each stage and block keeps all its versions, each with its own key and the act that wrote it; the current version is the latest by its act's time, and a version's number is its position. A submission keeps each change of its state as an act, and an answer or outcome is never rewritten."
