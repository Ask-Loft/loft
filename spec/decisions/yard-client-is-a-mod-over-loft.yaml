key: 01a1646f-5467-7025-8a88-4ec441646df9
slug: yard-client-is-a-mod-over-loft
title: "Yard Client is a mod over loft"
context: "Yard Client has four parts with a fixed home or language: the part Claude Code runs, which is a mod and so TypeScript run from source; the page, which a browser runs as JavaScript; a server for the page, which a mod cannot be, since a mod listens on no port; and the store of Yard Log. The Loft plugin is installed from this repository with no build step, so nothing built can reach the person through it, and the plugin already needs `loft`, which every way of installing Loft delivers."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4ec8d87c5ef0
  outcome: "The Loft mod registers Yard Client's tools and hooks, and reaches Yard Log only through `loft yard` commands and the page server; `loft` owns the yardlog format, the yard store, the `loft` views and the page server. There is no MCP server and no Node program."
drivers:
  - key: 01a1646f-5467-7025-8a88-4ec5e4f432fb
    kind: local
    label: "Nothing new to install"
    statement: "A person who has the Loft plugin and `loft` needs nothing else for Yard Client."
  - key: 01a1646f-5467-7025-8a88-4ec6b4fa0139
    kind: local
    label: "Nothing built committed"
    statement: "The repository holds sources only; no built program is committed for the plugin to carry."
  - key: 01a1646f-5467-7025-8a88-4ec7a7b352e5
    kind: local
    label: "One gate for the core"
    statement: "The format, the store and the server are built, tested and released as `loft` is."
options:
  - key: 01a1646f-5467-7025-8a88-4ec8d87c5ef0
    title: "A mod over loft"
    description: "The mod, in TypeScript, holds what Claude Code runs; `loft`, in Rust, holds the format, the store, the views and the page server, reached through `loft yard` commands."
  - key: 01a1646f-5467-7025-8a88-4ec9bd0feac8
    title: "A Node program over MCP"
    description: "A TypeScript program, built and carried by the plugin or published to npm, serves the agent's tools over MCP and hosts the page; the mod only wraps Claude Code's dialogs."
