key: 01a203d2-f2c4-75fe-9412-755fe8138de2
slug: bare-addresses-are-linked-through-comrak
title: "Bare addresses are linked through comrak"
context: "Agents write bare addresses in a block's Markdown, and the page drew them as text where GitHub draws the same Markdown with links. pulldown-cmark, which the page rendered with, has no autolink extension and no hook into its inline parse, and an address linked after the parse has already lost an `_`, `*` or `~` within it to emphasis. GitHub renders with cmark-gfm, whose autolink extension decides where an address begins and ends."
state:
  kind: accepted
  selectedOption: 01a203d2-f2c4-75fe-9412-7564158bdf6c
  outcome: "The page renders a block's Markdown and a node's name with comrak, with its autolink extension on for a block's Markdown alone. A walk over comrak's tree draws an image as a link, and draws as their text a link whose address is neither `http`, `https`, `mailto` nor a place within the page, a `www.` address and a bare email address; comrak shows any HTML as text. `loftspec` and `yardlog` keep pulldown-cmark."
drivers:
