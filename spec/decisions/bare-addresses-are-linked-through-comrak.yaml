    kind: local
    label: "As on GitHub"
    statement: "A bare address is drawn as a link where GitHub draws it as one, and as text where GitHub draws it as text."
  - key: 01a203d2-f2c4-75fe-9412-7561633e0968
    kind: local
    label: "Little parsing of its own"
    statement: "The page keeps little Markdown parsing code of its own to review and test."
  - key: 01a203d2-f2c4-75fe-9412-75628a68ba49
    kind: local
    label: "Safe links"
    statement: "Every link the page draws goes to an `http`, `https` or `mailto` address or to a place within the page, and no HTML of the Markdown becomes an element."
  - key: 01a203d2-f2c4-75fe-9412-75631a659859
    kind: local
    label: "Few dependencies"
    statement: "The page server adds few crates to the workspace."
