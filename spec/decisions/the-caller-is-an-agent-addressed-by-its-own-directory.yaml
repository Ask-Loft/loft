key: 01a1646f-5467-7025-8a88-4e81290adc3b
slug: the-caller-is-an-agent-addressed-by-its-own-directory
title: "The caller is an agent, addressed by its own directory, with one active stage per agent"
context: "Several sessions may work at once on one machine, each perhaps running several subagents, and a subagent may work in a worktree of its own. A mod's hook can read the directory of the agent that made the call it handles. Git never checks out one branch in two worktrees, so a tree and a branch name one Yard Log."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4e858cc1209a
  outcome: "Every `loft yard` command is called for an agent, a session and for a subagent its agent id, and addresses Yard Log of the tree and branch of that agent's own current directory; each block records the agent that wrote it, and each agent has at most one active stage."
drivers:
  - key: 01a1646f-5467-7025-8a88-4e8219e9091c
    kind: local
    label: "Right Yard Log"
    statement: "A subagent in its own worktree writes to that worktree's Yard Log, not its parent's."
  - key: 01a1646f-5467-7025-8a88-4e83872fe8f0
    kind: local
    label: "Parallel agents"
    statement: "Agents working one branch in parallel each show their own progress."
  - key: 01a1646f-5467-7025-8a88-4e84f7f39447
    kind: local
    label: "Who wrote it"
    statement: "Every record names the agent behind it."
