key: 298c16e7-bc08-4ed4-b350-1a40a6350939
slug: a-publish-writes-the-lock-only-projections-are
title: "A publish writes the lock only; projections are rendered on demand"
context: "v1 habitually committed a rendered Markdown and a JSON export beside the lock, and treated the Markdown as normative. In v2 the `spec/` tree is the specification. A second copy committed beside it can drift from it, and a reader that takes input from a projection would make the projection a source."
state:
  kind: superseded
  selectedOption: f702fb64-2d83-4ad3-927a-12e236690554
  outcome: "A publish writes the lock and the bindings in `spec/labels.yaml` and nothing else; the Markdown and JSON projections are rendered on demand, each stamped with the state root it renders, and no role takes input from a projection."
  successor: 7475da2b-ed59-4063-ad77-d1728a511847
drivers:
