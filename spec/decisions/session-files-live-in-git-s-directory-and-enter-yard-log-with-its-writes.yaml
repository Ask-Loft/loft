key: 01a1eb56-fd98-755b-b6a2-690c6679e5ef
slug: session-files-live-in-git-s-directory-and-enter-yard-log-with-its-writes
title: "Session files live in git's directory and enter Yard Log with its writes"
context: "Each session's tokens, activity and consultation files change with nearly every event of the session. The page server wrote them in Yard Log's folder in the working tree, through a temporary file beside each one, so the tree changed underneath the agent's own git commands: a commit caught a temporary file renamed away a moment later, and a branch switch refused over files modified since the last commit. Session events still stay on the machine and their totals still go in the repository; this decides where the totals are kept between commits and when they enter the tree."
state:
  kind: accepted
  selectedOption: 01a1eb56-fd98-755b-b6a2-690f9a983a1e
  outcome: "The page server keeps each session file's live copy in git's directory for the worktree, and each write of Yard Log, its close included, saves the live copies that differ into Yard Log's folder through the journal."
drivers:
  - key: 01a1eb56-fd98-755b-b6a2-690d6be949f6
    kind: local
    label: "Quiet tree"
    statement: "Nothing of Yard's changes the working tree while an agent's git command runs in it."
  - key: 01a1eb56-fd98-755b-b6a2-690e93e7f379
    kind: local
    label: "Current record"
    statement: "A commit of `.yard/` carries the session files as of the last write of Yard Log."
