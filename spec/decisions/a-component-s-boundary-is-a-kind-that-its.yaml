key: 1fef62d6-31a4-44b2-adc2-43eb537f0342
slug: a-component-s-boundary-is-a-kind-that-its
title: "A Component's boundary is a kind that its subtree takes on"
context: "A Loft v1 Component carried one scope kind: a Product, the whole document, or external. The v2 text form keeps a Product scope as a `scoped_to` edge and nothing else. A document authored in v2 therefore cannot say that a Component is a service outside Loft's governance, and the obligation rules report every such Component."
state:
  kind: accepted
  selectedOption: ab1230f0-bca0-49d0-99a0-14f56e3c6f64
  outcome: "A Component carries a `boundary` of `private` or `external`, a Component without one takes its parent's, and the obligation rules skip an `external` subtree."
drivers:
  - key: 6c944a8b-cec8-4da8-a877-88623f6cac35
    kind: local
    label: "Obligations follow governance"
    statement: "A Component outside Loft's governance carries no structural obligation."
  - key: d47d1225-af88-4c21-ba8a-b8af8cc37e6f
    kind: local
    label: "Room for sharing"
    statement: "The same field can later say that a Component is shared between documents."
  - key: 813ea421-2dbe-4f5b-8c57-d01ada45a7d2
    kind: local
    label: "One typed field"
    statement: "The property is one field with named values, not a flag."
  - key: 6f2ad37c-769a-476a-b161-6db6240f42aa
    kind: local
    label: "v1 parity"
    statement: "A converted document yields the structural findings that v1 yields."
