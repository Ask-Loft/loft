    title: "Boundary kind, inherited"
    description: "A `boundary` field of `private` or `external` on any Component, which a Component without it takes from its parent."
  - key: 8ec710ff-d034-4e13-9f3a-26514d3394ef
    title: "External flag"
    description: "A boolean `external` field on any Component."
  - key: 7bffb532-3c86-4197-9a51-8b47847c5420
    title: "Reserved tag"
    description: "A reserved tag name marks an external Component."
  - key: 4e8650ac-fcf3-432a-97af-5423e81aa7f1
