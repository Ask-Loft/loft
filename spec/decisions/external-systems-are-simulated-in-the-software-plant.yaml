key: 01a12ff0-f5e5-7095-8fa8-24bca541edef
slug: external-systems-are-simulated-in-the-software-plant
title: "External systems are simulated by executables in the Software Plant"
context: "Loft's commands depend on systems outside Loft, first git and the clock. A test that uses the real system cannot produce that system's failures on demand, and a test hook in the shipped binary is code that the user runs but that no test of the user's path exercises."
state:
  kind: proposed
drivers:
  - key: 01a12ff0-f5e5-7095-8fa8-24bdaf257241
    kind: local
    label: "The shipped binary"
    statement: "Tests run the binary that ships, unchanged."
  - key: 01a12ff0-f5e5-7095-8fa8-24bed30b66dc
    kind: local
    label: "Failures on demand"
    statement: "Each failure that Loft anticipates from an external system can be produced in a test."
  - key: 01a12ff0-f5e5-7095-8fa8-24bfa561badb
    kind: local
    label: "Honest"
    statement: "A stand-in answers as the real system answers."
  - key: 01a12ff0-f5e5-7095-8fa8-24c0deaa44f5
    kind: local
    label: "One stand-in"
    statement: "Each external system has one stand-in to maintain."
options:
  - key: 01a12ff0-f5e5-7095-8fa8-24c1381b5d36
    title: "Simulators with a contract suite"
    description: "Each external system has a simulator in the Software Plant, an executable or an environment value put in front of the binary under test, and a contract suite runs the same scenarios against the simulator and the real system."
  - key: 01a12ff0-f5e5-7095-8fa8-24c29f72aa5b
    title: "In-process fakes"
    description: "Each port has a fake implementation that tests pass to the library."
  - key: 01a12ff0-f5e5-7095-8fa8-24c3a4764fa7
    title: "Real systems only"
    description: "Tests use a real repository and the real clock."
  - key: 01a12ff0-f5e5-7095-8fa8-24c40d76904e
    title: "Both kinds of stand-in"
    description: "In-process fakes for tests of the libraries and executable simulators for tests of the binary."
