    title: "Inside the command"
    description: "The writing command sends one batch before it exits, waiting at most 2 seconds."
  - key: 01a213ce-4186-77e8-a1fb-b49fb8c555b4
    title: "A detached sender"
    description: "The writing command starts a detached `loft yard flush` that runs until the outbox is empty."
  - key: 01a213ce-4186-77e8-a1fb-b4a04ddf7294
