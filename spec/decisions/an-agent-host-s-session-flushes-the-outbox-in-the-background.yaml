    description: "The page server sends the outbox whenever a writing command tells it there is something to send."
  - key: 01a213ce-4186-77e8-a1fb-b4a190976ec7
    title: "The session's long-lived part"
    description: "The Loft mod and the Codex Yard worker run `loft yard flush` in the background."
