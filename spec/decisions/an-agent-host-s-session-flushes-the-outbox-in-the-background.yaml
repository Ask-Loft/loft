key: 01a20dc9-eaae-7491-b6c6-e805d0caa1b1
slug: an-agent-host-s-session-flushes-the-outbox-in-the-background
title: "An agent host's session flushes the outbox in the background"
context: "In connected mode a version waits in the outbox until something sends it. An agent waits on each `loft yard` command it runs, the Codex hook runs under a short time limit of its host, and the lock of Yard Log holds every other writer of the branch while it is held. Every version is written by an agent of a session of Claude Code or Codex, and each such session has a part that lives as long as it does and acts every 5 seconds, the Loft mod or the Codex Yard worker, which already delivers the session's events to the page server and tries again what did not go. Command-line tools that plugins of other hosts call keep a queue on disk that the hosts' frequent events drain."
state:
  kind: accepted
  selectedOption: 01a213ce-4186-77e8-a1fb-b4a190976ec7
  outcome: "`loft yard write`, `loft yard task` and `loft yard published` make no request to Yard Server; `loft yard flush` drains the outbox, and the Loft mod and the Codex Yard worker run it in the background, after the session's writes and at their beat while entries wait, so that no agent waits for Yard Server and a batch that did not go is tried again without the agent's activity."
drivers:
  - key: 01a213ce-4186-77e8-a1fb-b49a1a47b5f9
    kind: local
    label: "No command waits"
    statement: "No command an agent or a hook runs waits for Yard Server."
  - key: 01a213ce-4186-77e8-a1fb-b49bae6a96e4
    kind: local
    label: "Tried again without activity"
    statement: "A batch that did not go is tried again while the agent waits for the person."
  - key: 01a213ce-4186-77e8-a1fb-b49cf7e7bcee
    kind: local
    label: "Nothing new to run"
    statement: "Sending needs no process the session does not already run."
  - key: 01a213ce-4186-77e8-a1fb-b49d5ba43aa7
    kind: local
    label: "The session's own address"
    statement: "A version goes with the address and the token of the session that wrote it."
options:
