key: 01a156a4-172f-7126-a641-8efe5986ad88
slug: decision-history-is-judged-from-what-publish-records
title: "Decision history is judged from what each publish records in the tree"
context: "An accepted decision is changed by a new decision that supersedes it, never by an edit, but nothing reported an edit: the linter saw only the tree as it stands. Findings depend only on the tree and `spec/lint.yaml`, a publish is refused only by a validation error, and a tree may be published where no repository is given."
state:
  kind: accepted
  selectedOption: 01a156a4-172f-7126-a641-8f034aee7c85
  outcome: "Each publish records in a decision's binding the kind of its state and, for a resolved decision, its decision view hash; two lint rules compare the tree's decisions with those records and report an edit to a resolved decision's meaning and a change of state the record does not allow; neither refuses a publish."
drivers:
  - key: 01a156a4-172f-7126-a641-8eff3f835218
    kind: local
    label: "Judged from the tree"
    statement: "The findings depend only on the tree and its lint configuration."
  - key: 01a156a4-172f-7126-a641-8f000556ba24
    kind: local
    label: "A publish is not blocked"
    statement: "Only a validation error refuses a publish."
  - key: 01a156a4-172f-7126-a641-8f0143ae13f2
    kind: local
    label: "Without git"
    statement: "The rule works where the tree is given without a repository."
  - key: 01a156a4-172f-7126-a641-8f02323d070e
    kind: local
    label: "Caught without a reviewer"
    statement: "An edit to a resolved decision is reported whether or not a reviewer notices it."
options:
  - key: 01a156a4-172f-7126-a641-8f034aee7c85
    title: "Records in the bindings file"
    description: "Each publish records each decision's state kind and view hash in its binding, and lint rules compare the tree with them."
  - key: 01a156a4-172f-7126-a641-8f046ce8653b
    title: "Git history"
    description: "A lint rule compares each decision with its file at the last publish commit, read from git."
  - key: 01a156a4-172f-7126-a641-8f05780a35ff
    title: "A validation error"
    description: "The validator compares each decision with a record and refuses a publish over an edited resolved decision."
  - key: 01a156a4-172f-7126-a641-8f064f62b12a
    title: "Review alone"
    description: "Nothing records the published state, and a reviewer reads each decision's diff."
