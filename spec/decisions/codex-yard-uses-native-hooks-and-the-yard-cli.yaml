key: 01a1787c-f7fd-71c5-bbdd-a8ba14bf1a10
slug: codex-yard-uses-native-hooks-and-the-yard-cli
title: "Codex Yard uses native hooks and the Yard CLI"
context: "Codex offers native command hooks and a plugin skill but no equivalent of Claude Code's in-process mod API. Its local app-server API also permits session-scoped usage observation and delivery of Yard decision notifications while the person's existing client remains in control. Agent-owned wait loops can time out or be abandoned even after the person answers."
state:
  kind: accepted
  selectedOption: 01a1787c-f7fd-71c5-bbdd-a8bc5e532fe4
  outcome: "The existing Codex plugin carries native hooks that call the adapter built into loft and a composition of the shared Yard skill. A bounded observer of an existing local app server supplies live request usage where available. Questions and plans use the Yard page, and the existing worker notifies the matching loaded native thread when a decision point resolves. Native Codex controls stay authoritative. The adapter reports partial or unavailable coverage without transcript parsing or native dialog synchronization."
drivers:
  - key: 01a1787c-f7fd-71c5-bbdd-a8bb8f6f2b78
    kind: local
    label: "Ordinary sessions"
    statement: "A person keeps using Codex through its existing local clients."
options:
  - key: 01a1787c-f7fd-71c5-bbdd-a8bc5e532fe4
    title: "Native plugin"
    description: "Use command hooks and the Yard CLI, with a local usage observer and a bounded decision notifier that can wake or steer the existing native thread."
  - key: 01a1787c-f7fd-71c5-bbdd-a8bd871519bb
    title: "Loft-managed client"
    description: "Own an app-server client to receive richer events and control interactive requests."
