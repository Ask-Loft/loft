slug: codex-yard-uses-native-hooks-and-the-yard-cli
title: "Codex Yard uses native hooks and the Yard CLI"
context: "Codex offers native command hooks and a plugin skill but no equivalent of Claude Code's in-process mod API. Its local app-server API also permits a session-scoped usage observer while the person's existing client remains in control, without making Loft an interactive Codex client."
state:
  kind: accepted
  selectedOption: 01a1787c-f7fd-71c5-bbdd-a8bc5e532fe4
  outcome: "The existing Codex plugin carries native hooks that call the adapter built into loft and a composition of the shared Yard skill. A bounded observer of an existing local app server supplies live request usage where available. Questions and plans use the Yard page; native Codex controls stay authoritative. The adapter reports partial or unavailable coverage without transcript parsing or native dialog synchronization."
