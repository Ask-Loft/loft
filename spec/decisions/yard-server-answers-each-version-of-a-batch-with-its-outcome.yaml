    kind: benefit
    statement: "The sending settles each entry in one pass over the answer, with no search for the version at fault."
  - key: 01a213ce-4186-77e8-a1fb-b4ae2ad7ac19
    kind: cost
    statement: "The answer no longer shows what Yard Server holds, so a person reads it on Yard Server itself."
  - key: 01a213ce-4186-77e8-a1fb-b4af83e136e5
    kind: obligation
    statement: "A version that Yard Server may take once it is upgraded, such as one with a report of a version it does not know yet, is answered `later`, never `refused`, `400` or `413`, which move the version aside for good."
