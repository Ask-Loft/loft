key: 01a213ce-4186-77e8-a1fb-b4a6a4c26ecf
slug: yard-server-answers-each-version-of-a-batch-with-its-outcome
title: "Yard Server answers each version of a batch with its outcome"
context: "Yard Server takes a batch of up to 16 versions. One of them may be one it will never take, while the others are fine, and a version may arrive under a key it already holds with other contents. The sending must know which entries are done, which to move aside and which to send again, without one version holding up the others. Yard Server keeps what it takes in typed columns, not as the text it received, and an answer is read by a sending that waits for it."
state:
  kind: accepted
  selectedOption: 01a213ce-4186-77e8-a1fb-b4accd04b86e
  outcome: "Yard Server answers a batch it can read with `200` and, for each version in the order sent, its key and one outcome: `stored`, `held`, `conflict`, `refused` with a code, or `later` with a code where it may take the version once it is upgraded; it refuses the whole batch only where it cannot read it (`400`), where it is too large (`413`) and where it cannot take any batch now (`429` or `503` with `Retry-After`)."
drivers:
  - key: 01a213ce-4186-77e8-a1fb-b4a78f43e507
    kind: local
    label: "One bad version holds up none"
    statement: "A version Yard Server will never take does not keep the others of its batch from going."
  - key: 01a213ce-4186-77e8-a1fb-b4a87c790a4c
    kind: local
    label: "A light answer"
    statement: "The answer is small next to the batch and needs nothing rebuilt from the store."
  - key: 01a213ce-4186-77e8-a1fb-b4a9f9b5b9ab
    kind: local
    label: "A conflict is seen"
    statement: "A version Yard Server holds in another form under the same key is told apart from one it holds as sent."
