key: 01a156a6-de46-77ad-82ba-5bf6af2c9b0d
slug: a-conflict-is-named-by-a-digest-of-its-record
title: "A conflict is named by a digest of its record"
context: "A merge leaves typed conflict records in the tree, and a person, an agent or a server that resolves them needs to point at one of them: to show it, to say which side was chosen, or to tell that it is still open. The record holds only `field`, `base`, `ours` and `theirs`, and two merges of the same versions write the same record."
state:
  kind: accepted
  selectedOption: 01a156a6-de46-77ad-82ba-5bfaba97b758
  outcome: "Each conflict record is named by SHA-256 under `loftspec/conflict/1` over the canonical JSON of its holder, field, base, ours and theirs, derived from the record and never stored, and the validator lists the records in document order with that identifier."
drivers:
  - key: 01a156a6-de46-77ad-82ba-5bf7900a79f6
    kind: local
    label: "Two merges agree"
    statement: "Two merges, or two implementations, that write the same conflict give it the same name."
  - key: 01a156a6-de46-77ad-82ba-5bf8c720032c
    kind: local
    label: "Nothing more in the file"
    statement: "A conflict record holds only what a person reads to resolve it."
  - key: 01a156a6-de46-77ad-82ba-5bf9db888da8
    kind: local
    label: "Stable while others resolve"
    statement: "Resolving one conflict leaves the names of the others unchanged."
options:
  - key: 01a156a6-de46-77ad-82ba-5bfaba97b758
    title: "A digest of the record"
    description: "The identifier is a digest of the holder and the record, computed by whoever reads it."
  - key: 01a156a6-de46-77ad-82ba-5bfb1bf847d2
    title: "A stored random identifier"
    description: "The merge driver writes a random identifier into each conflict record."
  - key: 01a156a6-de46-77ad-82ba-5bfcdd381a63
    title: "Its position"
    description: "A conflict is named by its file and its place among the file's conflict records."
