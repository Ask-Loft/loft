key: 01a1646f-5467-7025-8a88-4e55172cb1dc
slug: loft-merge-driver-merges-yardlog
title: "loft merge-driver merges yardlog"
context: "Two people may work one branch on two machines, each writing its Yard Log, and git then meets two copies of the same files. `loft merge-driver` already merges `spec/` for git. yardlog's records carry keys and keep every version, submissions only move forward, and the first answer counts."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4e59c08e92b0
  outcome: "`loft merge-driver` merges files under `.yard/` by key, and `--install` registers it for `.yard/**/*.yaml`: records and versions join as unions, a submission's state only moves forward, the earliest answer counts, and two Yard Logs opened apart on one branch join under the key of the earlier opened."
