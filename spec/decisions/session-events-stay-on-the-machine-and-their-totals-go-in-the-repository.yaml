slug: session-events-stay-on-the-machine-and-their-totals-go-in-the-repository
title: "Session events stay on the machine, and their totals go in the repository"
context: "The mod hears every turn, request and tool call of a session. Raw events are many, change with every tool call, and say more about a session than a review needs; their totals and the stretches of work are what the page and a reviewer read, on any machine."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4e77ff5f2656
  outcome: "Each session's events are kept in its event log in `~/.yard/events/` and never in the working tree; the page server writes each session's token totals and activity under the branch's directory in `.yard/`, to be committed with the work."
