key: 01a1646f-5467-7025-8a88-4e648446890f
slug: one-page-server-per-machine
title: "One page server per machine, started by whichever mod needs it first and replaced by the newest loft"
context: "The person reads every branch being worked on at one address. A mod listens on no port and its child processes end with it, so the page server is a `loft yard serve` that some session's mod starts; sessions end at any time, and different repositories may run different versions of `loft`."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4e68f97d272a
  outcome: "At the start of a session the mod starts `loft yard serve` unless a page server of the same or a newer version answers on the port, then registers its tree; each mod checks the port every 5 seconds and starts a new server when the serving session has ended; a `loft yard serve` that finds an older page server asks it to stop and takes the port."
drivers:
  - key: 01a1646f-5467-7025-8a88-4e6576a5059b
    kind: local
    label: "One address"
    statement: "The person opens every branch's Yard Log on the machine at one address."
  - key: 01a1646f-5467-7025-8a88-4e66aeaeaed3
    kind: local
    label: "Outlives a session"
    statement: "The page stays up while any session with the plugin runs."
  - key: 01a1646f-5467-7025-8a88-4e679f4e7732
    kind: local
    label: "Newest wins"
    statement: "The page reads Yard Log in any format that a running `loft` can write."
options:
  - key: 01a1646f-5467-7025-8a88-4e68f97d272a
    title: "Whichever mod needs it first"
    description: "Sessions start and hand over one page server between them, the newest version taking over."
  - key: 01a1646f-5467-7025-8a88-4e69f6fef317
    title: "A page server for each session"
    description: "Each session's mod runs its own page server on a port of its own."
