consequences:
  - key: 01a156bd-7aba-76c8-93f1-8b3df7c21f0c
    kind: benefit
    statement: "A remote written elsewhere refuses in a shape its own tools produce, and `loft` tells each refusal apart by one member."
  - key: 01a156bd-7aba-76c8-93f1-8b3e3c39f5ce
    kind: obligation
    statement: "A new refusal that the client acts on is a new code in the contract and in the simulator."
  - key: 01a15877-f74e-70f9-95f4-2e3f2c11aba4
    kind: benefit
    statement: "A remote built on a framework that writes its own problem documents meets the contract without rewriting them."
  - key: 01a15877-f74e-70f9-95f4-2e404c9a0134
    kind: cost
    statement: "The client cannot tell a remote that sends members the contract does not name from one that keeps to it."
  - key: 01a15877-f74e-70f9-95f4-2e41155e99c4
    kind: obligation
    statement: "The simulator answers with a `type` other than `about:blank` and with members the contract does not name, so that the client is tested against them."
