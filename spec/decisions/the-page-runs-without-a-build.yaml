slug: the-page-runs-without-a-build
title: "The page runs without a build"
context: "The page is served by `loft`, which embeds its files when it is built from this repository. Cargo builds `loft` with no other toolchain, and nothing built is committed. Browsers run JavaScript modules as they are, and TypeScript checks JavaScript annotated with JSDoc types."
