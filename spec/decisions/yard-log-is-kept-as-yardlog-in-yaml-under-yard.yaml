key: 01a1646f-5467-7025-8a88-4ee064996973
slug: yard-log-is-kept-as-yardlog-in-yaml-under-yard
title: "Yard Log is kept as yardlog, in YAML, under .yard/"
context: "Yard Log travels with its branch and is read in review, so it lives in the working tree. A specification is kept as YAML under `spec/`, with a root file that names its format, and `loft` already reads and writes that strict YAML. A branch's name may hold `/`, and two branches never share a name."
state:
  kind: accepted
  selectedOption: 01a1646f-5467-7025-8a88-4ee45e384b21
  outcome: "Each branch's Yard Log is the directory `.yard/<branch>/`, rooted at `yardlog.yaml`, which names the format `yardlog/1`, with one YAML file for each stage beside it, named by the stage's key, in the strict YAML that `loft` writes for `spec/`."
