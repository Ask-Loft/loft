    statement: "Yard Log does not crowd the top of the working tree."
  - key: 01a1646f-5467-7025-8a88-4ee3e6e28d16
    kind: local
    label: "Named format"
    statement: "A reader can tell which version of the format each branch's Yard Log is written in."
