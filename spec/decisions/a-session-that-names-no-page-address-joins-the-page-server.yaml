  - key: 01a21a88-3dbf-7771-85c2-1c2a293e4a63
    kind: cost
    statement: "A person who empties `yardListen` closes the page to other devices only by running `loft yard serve` without `--listen`; a new session no longer does it."
  - key: 01a21a88-3dbf-7771-85c2-1c2bc5cf3c6a
    kind: risk
    statement: "The addresses of a page server started with `--listen` are those every later recovery listens on, across restarts of the machine and changes of network, until a session whose setting names addresses starts or the person runs `loft yard serve` with other addresses."
  - key: 01a21a88-3dbf-7771-85c2-1c2cd16d8ec3
    kind: obligation
    statement: "Each session of the Claude Code mod whose `yardListen` setting names addresses runs `loft yard serve` once when it starts, even where a page server answers; where two projects name different addresses, the page server is replaced each time a session starts in the other one, and never between."
