key: 01a21a88-3dbf-7771-85c2-1c20e0fb9401
slug: a-session-that-names-no-page-address-joins-the-page-server
title: "The page server listens on the loopback interface by default, on the addresses the person names as well, and a session that names none joins it"
context: "The page server listened on the loopback interface by default and on the addresses `--listen` named as well, and each session of the Claude Code mod replaced, when it started, a page server of its version that listened on other addresses than its `yardListen` setting named, so that a changed setting took effect at the next session. A session that loaded none of the person's settings, such as a print-mode reviewer started with `--setting-sources project`, read an empty setting and replaced a page server that listened on the person's tailnet address with one on the loopback interface alone; once that session ended, every later `loft yard serve --join` started its page server where that one had listened, and the page stayed closed to the person's phone. The mod cannot tell a setting the person emptied from one the session never loaded."
state:
  kind: accepted
  selectedOption: 01a21a88-3dbf-7771-85c2-1c250f3b7884
  outcome: "`loft yard serve` listens on `127.0.0.1` alone unless `--listen` names addresses, and then on each of them as well, `0.0.0.0` naming every address of the machine, trying again an address that is missing until it appears. The Claude Code plugin's `yardListen` setting supplies `--listen`; Codex gives the plugin no setting. `~/.yard/server.json` names the addresses, and a `loft yard serve` of the same version that would listen on other addresses replaces the running page server. A session of the mod whose `yardListen` setting names addresses runs `loft yard serve` once when it starts without `--join`, so that a changed setting that names addresses takes effect when the next session starts; every other `loft yard serve` that the mod or the Codex worker runs, each one of a session whose setting names no address among them, is given `--join`, which joins a running page server of its version whatever its addresses. A `loft yard serve --join` that starts a page server listens on the addresses of the last page server that served, as `~/.yard/server.json` records them, so that recovery never opens the page wider than the last session start or `loft yard serve` left it. The person narrows the page server to the loopback interface by running `loft yard serve` without `--listen`. An IPv6 address that names every address, such as `::` or `::ffff:0.0.0.0`, is refused, since an IPv6 socket on Windows takes no IPv4 connection. A request from another machine needs no key: the page server checks `Host` and `Origin` against the address the request reached."
drivers:
  - key: 01a21a88-3dbf-7771-85c2-1c217b55e852
    kind: local
    label: "Kept through other sessions"
    statement: "A session that loaded none of the person's settings, such as a print-mode reviewer, leaves the page server listening where it listened."
  - key: 01a21a88-3dbf-7771-85c2-1c225f1acfaa
    kind: local
    label: "Never wider on recovery"
    statement: "No recovery, and no session started before the person narrowed the setting, opens the page wider than the person last left it."
  - key: 01a21a88-3dbf-7771-85c2-1c238504083d
    kind: local
    label: "Emptying closes the page"
    statement: "A person who empties the setting closes the page to other devices at the next session, with no command."
  - key: 01a21a88-3dbf-7771-85c2-1c247f225b7b
    kind: local
    label: "Small fix"
    statement: "The fix changes the mod, `loft` and their contracts as little as it can."
options:
  - key: 01a21a88-3dbf-7771-85c2-1c250f3b7884
    title: "A session naming no address joins"
    description: "Where `yardListen` names no address, the mod gives every `loft yard serve` `--join`; a setting that names addresses still replaces a page server on other addresses when a session starts."
  - key: 01a21a88-3dbf-7771-85c2-1c267ec032b6
    title: "Addresses kept for the machine"
    description: "The person's addresses are recorded in `~/.yard/` by a command or by the mod, and every session listens on that record rather than on its plugin setting."
  - key: 01a21a88-3dbf-7771-85c2-1c279ec4e0dc
    title: "Unset told apart from empty"
    description: "The mod replaces a page server for an empty setting only where a settings file sets `yardListen` to empty, and joins where no loaded settings file names it."
  - key: 01a21a88-3dbf-7771-85c2-1c28b5fac97a
    title: "Join on the union of addresses"
    description: "A `loft yard serve --join` that starts a page server listens on the last page server's addresses and on its own `--listen` as well."
