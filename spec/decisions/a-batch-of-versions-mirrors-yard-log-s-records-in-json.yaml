key: 01a20dc9-eaae-7491-b6c6-e7fcf3935f9d
slug: a-batch-of-versions-mirrors-yard-log-s-records-in-json
title: "A batch of versions mirrors Yard Log's records in JSON"
context: "Connected mode sends the versions agents write to Yard Server. The request needs a shape that Yard Server can read field by field, that stays true to Yard Log's files as both change, and that can carry other records later without a new contract."
state:
  kind: accepted
  selectedOption: 01a20dc9-eaae-7491-b6c6-e8004ed128ce
  outcome: "Each version goes as the JSON form of its record in its stage's file, built from the same tree of fields as the YAML, in a format of its own, `yardlog-batch/1`, kept in `yardlog`; beside the version go its placing keys, the block's kind and id, and the kind of record."
drivers:
  - key: 01a20dc9-eaae-7491-b6c6-e7fddc47d223
    kind: local
    label: "One source"
    statement: "The file and the batch cannot drift apart."
  - key: 01a20dc9-eaae-7491-b6c6-e7fe8954fad6
    kind: local
    label: "Readable by field"
    statement: "Yard Server reads each field of a version without parsing YAML."
  - key: 01a20dc9-eaae-7491-b6c6-e7ff3b72f956
    kind: local
    label: "Room to grow"
    statement: "Answers and other records can join a batch later without a new contract."
options:
  - key: 01a20dc9-eaae-7491-b6c6-e8004ed128ce
    title: "JSON from the same tree"
    description: "The version's YAML record, field for field, as JSON, with a field naming the kind of record beside it."
  - key: 01a20dc9-eaae-7491-b6c6-e801b66d5a4a
    title: "A wire model of its own"
    description: "A separate set of types for the request, mapped from Yard Log's model."
  - key: 01a20dc9-eaae-7491-b6c6-e8027a365890
    title: "YAML text"
    description: "Each version's YAML, as text, inside a JSON envelope."
