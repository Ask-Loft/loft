key: 01a12ff0-f5e5-7095-8fa8-24ca1eb377f0
slug: git-is-reached-through-the-git-command
title: "Git is an external component reached through the `git` command"
context: "A publish refuses when `spec/` has uncommitted changes and when the current branch is not the publish branch, so the publisher needs the repository's state. `loftspec` performs no input or output, and the store that reads the repository is published as a library, so whatever reads git becomes a dependency of every user of the store."
state:
  kind: accepted
  selectedOption: 01a12ff0-f5e5-7095-8fa8-24cf7e9827c1
  outcome: "The store reads the repository's state through a port whose one adapter runs the `git` command, and the publisher sees only the port's answer; tests put the Software Plant's git simulator first on the search path."
drivers:
  - key: 01a12ff0-f5e5-7095-8fa8-24cb901006b8
    kind: local
    label: "Git's own answer"
    statement: "The state that the publisher acts on is the state that git itself reports, its ignore rules and its index included."
  - key: 01a12ff0-f5e5-7095-8fa8-24cc8c6aace1
    kind: local
    label: "Light dependencies"
    statement: "A published crate takes no large dependency to learn three facts about a repository."
  - key: 01a12ff0-f5e5-7095-8fa8-24cdc874387a
    kind: local
    label: "Testable unchanged"
    statement: "A test can stand in for the repository without a change to the binary under test."
  - key: 01a12ff0-f5e5-7095-8fa8-24ce5f514db0
    kind: local
    label: "Nothing extra"
    statement: "A publish needs nothing in the repository beyond `spec/` and the lock."
options:
  - key: 01a12ff0-f5e5-7095-8fa8-24cf7e9827c1
    title: "The `git` command behind a port"
    description: "The store's repository port runs `git rev-parse`, `git symbolic-ref` and `git status --porcelain=v1 -z`, and the publisher sees only the port's answer."
  - key: 01a12ff0-f5e5-7095-8fa8-24d0cef4e123
    title: "gix"
    description: "The store reads the repository with the `gix` library, written in Rust."
  - key: 01a12ff0-f5e5-7095-8fa8-24d1dd75d699
    title: "libgit2"
    description: "The store reads the repository through `git2`, the Rust bindings to libgit2."
  - key: 01a12ff0-f5e5-7095-8fa8-24d2aaa04b3e
    title: "A marker file"
    description: "The publisher reads no repository and trusts a file in which the user records the branch and a clean state."
