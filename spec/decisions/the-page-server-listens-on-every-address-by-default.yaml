consequences:
  - key: 01a1eeea-3b9f-72c9-8a32-a5ae6d9a5018
    kind: risk
    statement: "On a public network, such as a coffee shop's, anyone who reaches the machine reads every Yard Log its page server serves and can answer for the person, unless the person names the addresses it listens on."
  - key: 01a1eeea-3b9f-72c9-8a32-a5afe5ebae08
    kind: benefit
    statement: "The page opens on a phone in the person's tailnet, or on the same network, with nothing set."
  - key: 01a1eeea-3b9f-72c9-8a32-a5b090c161b3
    kind: cost
    statement: "In Codex, which gives the plugin no setting, the page server listens on every address of the machine."
  - key: 01a1eeea-3b9f-72c9-8a32-a5b11d9febc7
    kind: obligation
    statement: "Turning the default to the loopback interface later is a new decision that supersedes this one, and a person who relied on it names the addresses in `yardListen`."
