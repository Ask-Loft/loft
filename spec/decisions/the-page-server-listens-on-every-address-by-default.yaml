key: 01a1eeea-3b9f-72c9-8a32-a5a7ca21f98a
slug: the-page-server-listens-on-every-address-by-default
title: "The page server listens on every address of the machine by default, and on the addresses the person names instead"
context: "The person opens the page from other devices as well, such as a phone in their tailnet. A machine's local addresses change with the network it joins, a VPN's address exists only while the VPN is up, and the Claude Code mod starts the page server where the person does not see it. A page served on a network is served to everyone who reaches the machine there."
state:
  kind: accepted
  selectedOption: 01a1eeea-3b9f-72c9-8a32-a5ab95b61f4c
  outcome: "`loft yard serve` listens on `0.0.0.0` unless `--listen` names addresses, and then on each of them and on the loopback interface, trying again an address that is missing until it appears. The Claude Code plugin's `yardListen` setting supplies `--listen`; Codex gives the plugin no setting. A request from another machine needs no key: the page server checks `Host` and `Origin` against the address the request reached."
drivers:
  - key: 01a1eeea-3b9f-72c9-8a32-a5a8b1cc531b
    kind: local
    label: "Open with nothing set"
    statement: "The page opens from another device on the machine's networks with nothing set, however the machine's addresses change."
  - key: 01a1eeea-3b9f-72c9-8a32-a5a93294e333
    kind: local
    label: "Closed where the person chooses"
    statement: "The person can keep the page off a network, such as a public one."
  - key: 01a1eeea-3b9f-72c9-8a32-a5aab775b4b8
    kind: local
    label: "Small change"
    statement: "Reaching the page from another device changes the page server, the plugin and the page as little as it can."
options:
  - key: 01a1eeea-3b9f-72c9-8a32-a5ab95b61f4c
    title: "Every address by default"
    description: "`0.0.0.0` unless the person names addresses, the loopback interface always, and no key for a request from the network."
  - key: 01a1eeea-3b9f-72c9-8a32-a5ac56d6215c
    title: "Loopback by default"
    description: "`127.0.0.1` unless the person names addresses to listen on as well."
  - key: 01a1eeea-3b9f-72c9-8a32-a5ad4444ca4f
    title: "Every address, with a key"
    description: "`0.0.0.0` unless the person names addresses, and every request from the network carries an access key that `loft yard page` prints in the page's address."
