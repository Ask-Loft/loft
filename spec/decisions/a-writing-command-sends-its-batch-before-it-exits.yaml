consequences:
  - key: 01a20dc9-eaae-7491-b6c6-e80dda44870e
    kind: cost
    statement: "While Yard Server is silent, each writing command takes up to 2 seconds longer."
  - key: 01a20dc9-eaae-7491-b6c6-e80ef3190a45
    kind: risk
    statement: "A batch of large `loft` snapshots on a slow link does not cross in 2 seconds, and each writing command sends it again until a later wave changes the sending."
  - key: 01a20dc9-eaae-7491-b6c6-e80f9882689e
    kind: benefit
    statement: "A version that does not go stays in the outbox and goes with the next writing command or `loft yard flush`."
