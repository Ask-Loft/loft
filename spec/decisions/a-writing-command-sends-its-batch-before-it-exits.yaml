key: 01a20dc9-eaae-7491-b6c6-e805d0caa1b1
slug: a-writing-command-sends-its-batch-before-it-exits
title: "A writing command sends its batch before it exits, waiting at most 2 seconds"
context: "In connected mode a version waits in the outbox until something sends it. An agent waits on each `loft yard` command it runs, the Codex hook runs under a short time limit of its host, the page server opens no network connection, and the lock of Yard Log holds every other writer of the branch while it is held."
state:
  kind: accepted
  selectedOption: 01a20dc9-eaae-7491-b6c6-e80964de006f
  outcome: "`loft yard write`, `loft yard task` and `loft yard published` send one batch of versions before they exit, once the lock is released and their result is printed, waiting at most 2 seconds for Yard Server, and `loft yard flush` runs the same sending by hand; the hooks and the page server never send."
drivers:
  - key: 01a20dc9-eaae-7491-b6c6-e806019119c3
    kind: local
    label: "Nothing new to run"
    statement: "Sending needs no process, lock or schedule beyond the command that wrote."
  - key: 01a20dc9-eaae-7491-b6c6-e80776aab086
    kind: local
    label: "The agent is not held long"
    statement: "A silent Yard Server costs an agent a known, short wait."
  - key: 01a20dc9-eaae-7491-b6c6-e808146da7bf
    kind: local
    label: "The lock stays short"
    statement: "No writer of the branch waits on the network."
options:
  - key: 01a20dc9-eaae-7491-b6c6-e80964de006f
    title: "Inside the command"
    description: "The writing command sends before it exits, after the lock is released."
  - key: 01a20dc9-eaae-7491-b6c6-e80ab449dfa1
    title: "A process after the command"
    description: "The writing command starts a detached process that sends."
  - key: 01a20dc9-eaae-7491-b6c6-e80bfbe8859b
    title: "Under the lock"
    description: "The write sends while it still holds the lock of Yard Log."
  - key: 01a20dc9-eaae-7491-b6c6-e80ca711d264
    title: "A sender that keeps running"
    description: "A long-lived process sends whatever the outbox holds."
