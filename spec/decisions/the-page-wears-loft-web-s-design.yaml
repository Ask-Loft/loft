key: 01a1a7a4-51c7-714b-a7e4-6f3c65c5b714
slug: the-page-wears-loft-web-s-design
title: "The page wears Loft Web's design"
context: "The Yard page took the Loft website's design: Inter on a white ground, square boxes with an ink border and an offset shadow, a dotted rule from cyan to lilac under its header, and one long column of stages and their blocks. Loft Web, the application in which a person reads, compares and decides a Loft document, has since drawn the same palette and the same Inter in a quieter way: a sidebar on a ground of its own that folds to a rail, a head over each page with its controls at the right, hairlines rather than borders, a hard shadow only on what floats over the page, and a list beside a pane of the item chosen, each scrolling on its own. A person who moves between Loft Web and the Yard page meets two products. Loft Web's design system is a package of a private repository, built with React and Tailwind, while the Yard page is files of this public repository that the page server serves with no build step."
state:
  kind: accepted
  selectedOption: 01a1a7a4-51c7-714b-a7e4-6f4225ee1fad
  outcome: "The page takes Loft Web's frame and dress: its sidebar of Yard Logs with the views of the Yard Log shown beneath its branch, Loft's wordmark with Yard beside it, a head over the Yard Log shown, hairlines, a hard shadow only on what floats, its marks for a node's kind and its fields for answers; and it draws the timeline as a list of stages beside a pane of the stage chosen. It draws them in its own styles and modules, and shares no code with Loft Web."
