key: 8f334e16-a744-4561-9639-0118403d88d2
slug: the-format-s-own-reader-and-writer-implement-its
title: "The Format's own reader and writer implement its YAML subset"
context: "The Format admits a small YAML subset, rejects every construct outside it, a comment included, at a file, line and column, and fixes one canonical byte sequence for each document. The maintained YAML libraries for Rust discard comments while scanning and report nothing about them, none rejects the other excluded constructs on its own, and none writes the Format's canonical layout."
state:
  kind: accepted
  selectedOption: 0f2d964b-d7cc-4e37-bc2a-e592907fabd5
  outcome: "The Format's own reader parses the YAML subset and refuses each excluded construct at its position, its own writer emits the canonical layout, and a differential test holds both to a conforming YAML parser."
drivers:
  - key: 13a7712c-2a7f-4877-98a8-987cf117ecfb
    kind: local
    label: "Exact rejection"
    statement: "Every construct outside the subset, a comment included, is refused where it occurs."
  - key: 5365085b-2c7e-4de0-8a37-2b6190f24900
    kind: local
    label: "Positioned errors"
    statement: "Every read error names a file, line and column."
  - key: 771158ef-09b4-4551-9b89-decbd437ecc4
    kind: local
    label: "Canonical bytes"
    statement: "The writer produces one byte sequence for each document, which a second implementation can reproduce."
  - key: 0c871ae6-9ea3-42fe-9578-155fdcfc6b65
    kind: local
    label: "Few dependencies"
    statement: "Reading and writing add no runtime dependency."
