slug: an-openspec-import-reads-the-main-specs-only
title: "An OpenSpec import reads the main specs only"
context: "An OpenSpec project keeps its current truth in main specs and its intent in flight in active changes, each a set of delta specs with a proposal, a design and tasks. Active changes have no order or dependency between them, and archived changes are history already applied to the main specs."
state:
