key: 01a156bd-fa3e-75fa-aef5-dc09f6eb5482
slug: a-connected-publish-needs-a-committed-tree-on-any-branch
title: "A connected publish needs a committed tree, on any branch"
context: "A publish of a document that is not connected is refused off the publish branch, because labels are allocated on that branch and two clones settle them there. A connected document's remote allocates its labels and orders its publishes, and `loft publish` runs inside a repository whose committed tree is what a person reviewed."
state:
  kind: accepted
  selectedOption: 01a156bd-fa3e-75fa-aef5-dc0dd0fa7a3c
  outcome: "A publish of a connected document is refused neither off the publish branch nor on a detached HEAD; uncommitted changes under `spec/` still refuse it, and `loft publish` still needs a git repository."
drivers:
  - key: 01a156bd-fa3e-75fa-aef5-dc0a94a0a267
    kind: local
    label: "The remote orders publishes"
    statement: "A connected document's publishes are ordered where its labels are allocated."
  - key: 01a156bd-fa3e-75fa-aef5-dc0be96bfd13
    kind: local
    label: "What is published is committed"
    statement: "The tree a publish pins is one that git holds."
  - key: 01a156bd-fa3e-75fa-aef5-dc0c8571102b
    kind: local
    label: "One command for both kinds"
    statement: "`loft publish` keeps one set of rules about where it runs."
options:
  - key: 01a156bd-fa3e-75fa-aef5-dc0dd0fa7a3c
    title: "Drop the branch check only"
    description: "A connected publish runs on any branch, from a committed tree, inside a repository."
  - key: 01a156bd-fa3e-75fa-aef5-dc0ea5d17107
    title: "Keep every repository precondition"
    description: "A connected publish runs only on the publish branch, as any other publish does."
  - key: 01a156bd-fa3e-75fa-aef5-dc0fbe00bc35
    title: "Drop both checks"
    description: "A connected publish runs on any branch and from uncommitted changes."
