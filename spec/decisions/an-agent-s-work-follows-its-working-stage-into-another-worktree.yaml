consequences:
  - key: 01a18a50-2ff6-715f-af9c-707312b95ecd
    kind: obligation
    statement: "`~/.yard/` records the worktrees each session wrote Yard Log in, so that `loft` and the page server can find an agent's working stage in them."
  - key: 01a18a50-2ff6-715f-af9c-7074676be863
    kind: benefit
    statement: "The turns, requests and tokens of work in another worktree count against the branch that work is on."
  - key: 01a18a50-2ff6-715f-af9c-707572d19874
    kind: risk
    statement: "An agent that leaves a stage active in another worktree goes on recording there until it ends that stage."
  - key: 01a18a50-2ff6-715f-af9c-7076630838a7
    kind: cost
    statement: "`close` and `published` stay with the directory they run in, so the agent names the tree to close another worktree's Yard Log."
