key: 01a18a50-2ff6-715f-af9c-706b9aa45d5a
slug: an-agent-s-work-follows-its-working-stage-into-another-worktree
title: "An agent's work follows its working stage into another worktree"
context: "An agent is often asked to work in a worktree other than its own directory, in another repository even, and its host cannot always move it there: a host may move a session only within its own repository. Addressed by its own directory alone, the agent's questions, plans, tasks and token totals are recorded in Yard Log of the branch it started on, and the branch its work is on gets none of them."
state:
  kind: accepted
  selectedOption: 01a18a50-2ff6-715f-af9c-706f1b952127
  outcome: "Each agent has one working tree, the worktree whose Yard Log holds its working stage, else its own directory; `loft yard` resolves it for every command that acts for the agent, the page server files each event by it, and every command and tool can name another tree explicitly."
drivers:
  - key: 01a18a50-2ff6-715f-af9c-706c6b1d9606
    kind: local
    label: "Right Yard Log"
    statement: "The branch the work is on records its plan, questions, tasks and cost, and the branch the agent started on records none of them."
  - key: 01a18a50-2ff6-715f-af9c-706dd5659d3b
    kind: local
    label: "Nothing to remember"
    statement: "The agent takes no extra step that, forgotten, records the work in the wrong Yard Log without a word."
  - key: 01a18a50-2ff6-715f-af9c-706e8c1f5242
    kind: local
    label: "Every host alike"
    statement: "Claude Code and Codex follow the work in the same way."
options:
  - key: 01a18a50-2ff6-715f-af9c-706f1b952127
    title: "Follow the working stage"
    description: "The working tree is the worktree holding the agent's working stage, found by `loft` across the worktrees its session wrote in; an optional tree on each tool and command opens the first stage there."
  - key: 01a18a50-2ff6-715f-af9c-70704818093d
    title: "An explicit focus"
    description: "A tool sets the agent's working tree, which holds until the agent sets another."
  - key: 01a18a50-2ff6-715f-af9c-7071faf6c691
    title: "Only a tree argument"
    description: "Each tool and command can name another tree; the host's captures and events stay with the agent's directory."
  - key: 01a18a50-2ff6-715f-af9c-70729292560f
    title: "A session per worktree"
    description: "Work in another worktree is done in a session started there; nothing changes in Yard Client."
