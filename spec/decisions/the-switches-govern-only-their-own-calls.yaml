key: 01a156ab-1b30-71e9-abf9-d5a631e02b7e
slug: the-switches-govern-only-their-own-calls
title: "The telemetry and update-check switches govern only their own calls"
context: "The decision that gave the update check its own switch accepted that a person who sets both switches has no network use from `loft`. A connected document publishes and pulls through its remote, a call the command exists to make; that decision stays as it was taken, for a document that is not connected."
state:
  kind: accepted
  selectedOption: 01a156ab-1b30-71e9-abf9-d5aa6d3b12a8
  outcome: "Switching telemetry or the update check off stops only the command event or the update check; a connected command reaches its remote whatever the switches say, and a document that is not connected still has no network use with both switches off."
drivers:
  - key: 01a156ab-1b30-71e9-abf9-d5a7c8caa69a
    kind: local
    label: "A command does what it is run for"
    statement: "A command whose purpose is to reach a remote reaches it when it is run."
  - key: 01a156ab-1b30-71e9-abf9-d5a8e3fb0b08
    kind: local
    label: "One place to stop the network"
    statement: "A person can stop every network call of `loft` without reading each command's Feature."
  - key: 01a156ab-1b30-71e9-abf9-d5a9d51808b6
    kind: local
    label: "Few switches"
    statement: "A person sets as few switches as possible."
options:
  - key: 01a156ab-1b30-71e9-abf9-d5aa6d3b12a8
    title: "Each switch governs its own call"
    description: "The telemetry switches stop the command event, the update-check switches stop the update check, and neither touches a call to a remote."
  - key: 01a156ab-1b30-71e9-abf9-d5ab37dc3833
    title: "Both switches stop every call"
    description: "With both switches off, a connected command refuses rather than reach its remote."
  - key: 01a156ab-1b30-71e9-abf9-d5ac1b9fe517
    title: "A third switch for every call"
    description: "A new switch stops every network call, a connected command's included, and the two switches keep their own calls."
