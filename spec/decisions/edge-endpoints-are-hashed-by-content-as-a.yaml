key: 1e3fb5da-0e5a-4dbe-b285-9e8cdfd88f1e
slug: edge-endpoints-are-hashed-by-content-as-a
title: "Edge endpoints are hashed by content, as a multiset"
context: "Two documents that say the same thing must have the same content root, on any implementation, so the content root cannot depend on keys. Edges join nodes. The question is how an edge names its endpoints inside the digest, and how two equal edges are counted."
state:
  kind: accepted
  selectedOption: ffe1fed6-b8d7-4dfb-8a6b-9621bc1b7418
  outcome: "An edge enters the edges root as the tuple of its endpoints' content hashes, its type and its role; the edges root is the digest of the sorted multiset of such tuples."
drivers:
  - key: 83b7c7fb-f770-4d66-a1f2-ca5d61dfda30
    kind: local
    label: "Key-free content root"
    statement: "The content root does not change when keys change."
  - key: a69dc4aa-46a8-4467-bafd-d8e0f2fb625e
    kind: local
    label: "Duplicates stay honest"
    statement: "Two nodes with identical content and identical edges both count, so a copied subtree is visible in the root."
  - key: cefd5c32-8751-43ec-abd3-25eafac09731
    kind: local
    label: "Stable under relabelling"
    statement: "A publish that only assigns labels does not move the content root."
options:
  - key: ffe1fed6-b8d7-4dfb-8a6b-9621bc1b7418
    title: "Content hashes, multiset"
    description: "Each edge enters the digest as the tuple of its source's content hash, its type, its target's content hash and its role; the edges root is the digest of the sorted multiset of tuples."
  - key: df7f38c2-bfd7-4512-aca0-c6da972094c0
    title: "Keys"
    description: "Each edge names its endpoints by key; the edges root depends on keys."
  - key: 0f306edf-223a-4c44-9cc3-e9f3604755ff
    title: "Labels"
    description: "Each edge names its endpoints by label; the edges root depends on publication."
