key: 01a1f4f1-4303-70b9-a1c6-7441ee60f812
slug: a-remote-s-resource-and-its-metadata-lie-on-the-origin-of-its-address
title: "A remote's protected resource, and the metadata its challenge names, lie on the origin of its address"
context: "A sign-in learns the remote's protected resource, and the authorization server that issues tokens for it, from the challenge with which the remote's address answers a request without a token: its `resource_metadata` names the protected resource metadata, whose `resource` names the protected resource. The address is what the person chose, in the manifest that every clone shares or as the argument of `loft remote set`; the challenge and the metadata are whatever the server at that address sends. Followed to another origin, they can name another remote's genuine metadata or resource: the person then consents at that remote's authorization server, and `loft` sends the access token issued for that remote's resource to the address that asked for it, which can present it there itself (RFC 9728, sections 7.3 and 7.4). A sign-in that `loft` keeps is refreshed and sent under the address it was made for, so one made that way goes on serving that address. RFC 9728, section 3.3, has a client use such metadata only when its `resource` is identical to the URL the client requested, which no remote meets while that request is `<address>/head`."
state:
  kind: accepted
  selectedOption: 01a1f4f1-4303-70b9-a1c6-74464238a45f
  outcome: "`loft remote set` and `loft remote login` refuse a challenge whose `resource_metadata` lies on another origin than the remote's address before they request that metadata, register a client or open a browser, and refuse protected resource metadata whose `resource` lies on another origin; a sign-in kept under an address counts only where its `resource` lies on that address's origin. Two `https` or `http` addresses lie on one origin when scheme, host and port agree, as RFC 6454 compares them."
drivers:
  - key: 01a1f4f1-4303-70b9-a1c6-7442ded59067
    kind: local
    label: "No token for a resource on another origin"
    statement: "`loft` never sends an address an access token that it asked for, or kept, for a protected resource on another origin."
  - key: 01a1f4f1-4303-70b9-a1c6-7443e58b8f04
    kind: local
    label: "No metadata requested before its origin is compared"
    statement: "A sign-in requests protected resource metadata only after comparing the metadata's origin with the origin of the remote's address."
  - key: 01a1f4f1-4303-70b9-a1c6-74448f101206
    kind: local
    label: "A remote on one origin signs in"
    statement: "A remote whose documents, protected resource and protected resource metadata lie on one origin is signed in to as before."
options:
  - key: 01a1f4f1-4303-70b9-a1c6-744563a7ccb2
    title: "Wherever the challenge points"
    description: "The sign-in follows the challenge's `resource_metadata` to any address it may contact, `https` or `http` on the loopback interface, and takes the `resource` that metadata names."
  - key: 01a1f4f1-4303-70b9-a1c6-74464238a45f
    title: "On the origin of the address"
    description: "The challenge's `resource_metadata`, and the `resource` that metadata names, lie on the origin of the remote's address: the same scheme, host and port."
  - key: 01a1f4f1-4303-70b9-a1c6-744788d8b38c
    title: "The requested URL as the resource"
    description: "The metadata's `resource` is identical to the URL that the sign-in requested, as RFC 9728, section 3.3, words it."
  - key: 01a1f4f1-4303-70b9-a1c6-7448b467ddaa
    title: "A resource the address lies under"
    description: "The metadata's `resource` lies on the address's origin and the address's path begins with the resource's path, as an Internet-Draft that would update RFC 9728 proposes."
