key: 01a202c3-d1fd-723f-91a5-61b3feb6fad0
slug: a-remote-lists-the-companion-resources-that-one-sign-in-covers
title: "A remote lists the companion resources that one sign-in covers"
context: "A remote's origin may serve protected resources beside the one a connected document's address lies under, under the same authorization server, and a person reaches each of them with the same sign-in. OAuth 2.0 lets one authorization request name each protected resource it asks for (RFC 8707), and the protected resource metadata that the remote's challenge names (RFC 9728) names one resource and its authorization server: neither says which other resources go with the remote. `loft` learns a sign-in from the remote's address alone, and holds the remote's protected resource, and the metadata its challenge names, to the origin of that address."
state:
  kind: accepted
  selectedOption: 01a202c3-d1fd-723f-91a5-61b8ee8cf04a
  outcome: "A remote's protected resource metadata may list, in `companion_resources`, each other protected resource that a sign-in to the remote covers, as an object of its identifier, `resource`, and its kind, `kind`. `loft` keeps a listed resource only where it lies on the origin of the remote's address, asking nothing of a listed resource on another origin, and where its own protected resource metadata names it, names the remote's authorization server and lists a scope; it leaves out each other one and says so. It asks for the remote's own resource and each kept one in one authorization request, with the scopes of each, and holds an access token for each resource alone: the remote's first from the code exchange, and every later one from a refresh that names its resource with the sign-in's one refresh token. A remote that lists none is signed in to as before."
drivers:
  - key: 01a202c3-d1fd-723f-91a5-61b46e957a26
    kind: local
    label: "One consent"
    statement: "A person consents once for every resource that a sign-in to a remote covers."
  - key: 01a202c3-d1fd-723f-91a5-61b5ebf4f569
    kind: local
    label: "Nothing to configure"
    statement: "A person names only the remote's address."
  - key: 01a202c3-d1fd-723f-91a5-61b6ba6be76c
    kind: local
    label: "Only the remote's resources"
    statement: "A sign-in asks only for resources that go with the remote it is made for."
  - key: 01a202c3-d1fd-723f-91a5-61b7defae7ec
    kind: local
    label: "Remotes that list nothing"
    statement: "A remote that lists no companion resource, and a `loft` that reads no list, sign in as before."
options:
  - key: 01a202c3-d1fd-723f-91a5-61b8ee8cf04a
    title: "Listed in the remote's protected resource metadata"
    description: "The protected resource metadata of the remote's own resource lists the identifier and the kind of each companion resource, and each companion resource's own metadata names it and the remote's authorization server."
  - key: 01a202c3-d1fd-723f-91a5-61b95a571dcc
    title: "Listed in the authorization server's metadata"
    description: "The authorization server's metadata lists each protected resource it issues tokens for, in `protected_resources` (RFC 9728)."
  - key: 01a202c3-d1fd-723f-91a5-61baa18d3c7b
    title: "A sign-in for each resource"
    description: "`loft` signs in to the remote's own resource, and to each other resource on its own when a command first calls it, from that resource's challenge."
