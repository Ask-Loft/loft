consequences:
  - key: 01a202c3-d1fd-723f-91a5-61bb0d16b845
    kind: benefit
    statement: "An access token that leaks from one resource is refused by every other."
  - key: 01a202c3-d1fd-723f-91a5-61bc393ae12d
    kind: cost
    statement: "A resource that a remote begins to list after a sign-in is reached only once the person signs in again."
  - key: 01a202c3-d1fd-723f-91a5-61bd139b7df0
    kind: cost
    statement: "Each refresh of a sign-in over companion resources writes `loft/remotes.json` once more, to record its resource before the refresh is sent."
  - key: 01a202c3-d1fd-723f-91a5-61be963c115d
    kind: obligation
    statement: "A remote lists a companion resource only on its own origin and under its own authorization server, and accepts it beside its own resource in one authorization request."
    subject: 01a1f09b-189b-76b3-863f-c7b48d1e9893
  - key: 01a202c3-d1fd-723f-91a5-61bf5d31523c
    kind: obligation
    statement: "A remote admits at each of its protected resources only an access token issued for that resource."
    subject: 01a1f09b-189b-76b3-863f-c7ad82ed5c58
  - key: 01a202c3-d1fd-723f-91a5-61c05b34e243
    kind: risk
    statement: "`companion_resources` is an extension member of RFC 9728 that no registry holds, so a later standard could give the name another meaning."
  - key: 01a202c3-d1fd-723f-91a5-61c17ae42148
    kind: risk
    statement: "An earlier `loft` keeps a sign-in over companion resources for the remote's own resource alone once it refreshes it, and one that runs within 120 seconds of a lost answer for a companion resource presents the rotated refresh token for another resource, which ends the whole sign-in."
  - key: 01a202c3-d1fd-723f-91a5-61c25bb1f658
    kind: risk
    statement: "Remotes that share one origin and one authorization server are not told apart: one of them can list another's protected resource as a companion resource, and only the authorization server's refusal of an authorization request that names resources of two remotes keeps one sign-in from covering both."
