key: 01a130de-573a-77b2-b40b-d44300846d1a
slug: labels-that-two-publishes-give-apart-are-settled
title: "Labels that two publishes give apart are settled by the next publish"
context: "Labels come from counters in `spec/labels.yaml`, and a publish allocates them on the publish branch. Two clones of that branch can each publish before either pulls the other; the two publishes then give one label to two nodes, or one node two labels. A label that was pushed may already be cited outside the repository, and Loft never writes to git."
state:
  kind: accepted
  selectedOption: 01a130de-573a-77b2-b40b-d4483c9c9a3e
  outcome: "When two publishes meet, the next publish, run in the stopped merge or rebase, keeps the pulled side's bindings, records the other side's colliding labels as withdrawn, allocates new labels for the keys that lost theirs, and rewrites citations of withdrawn labels through `mentions` edges; the person commits."
drivers:
  - key: 01a130de-573a-77b2-b40b-d4447f30ca60
    kind: local
    label: "Pushed labels stay"
    statement: "A label that was pushed keeps its node, since it may be cited outside the repository."
  - key: 01a130de-573a-77b2-b40b-d445ec3fc9e0
    kind: local
    label: "No label twice"
    statement: "No label is held by two nodes or given out again."
  - key: 01a130de-573a-77b2-b40b-d4466bfe6239
    kind: local
    label: "Loft does not write to git"
    statement: "Settling the labels runs no git command that changes the repository; the person commits."
  - key: 01a130de-573a-77b2-b40b-d44706030df1
    kind: local
    label: "Git alone"
    statement: "A small team settles the labels with git and Loft, without a service beside them."
options:
  - key: 01a130de-573a-77b2-b40b-d4483c9c9a3e
    title: "The pulled side keeps its labels"
    description: "The next publish in the stopped merge or rebase keeps the pulled side's bindings, withdraws the other side's colliding labels, allocates new labels for the keys that lost theirs, and rewrites citations of withdrawn labels through `mentions` edges."
  - key: 01a130de-573a-77b2-b40b-d449c46888ec
    title: "Renumber both sides"
    description: "Both sides' colliding labels are withdrawn, and every node that held one gets a new label."
  - key: 01a130de-573a-77b2-b40b-d44a0b25cfe2
    title: "A central reservation"
    description: "A publish refuses unless it can reserve its labels in a shared place, such as a ref on the remote."
  - key: 01a130de-573a-77b2-b40b-d44b36c1f315
    title: "Keep both"
    description: "Both bindings stay, and the colliding label names both nodes."
