- key: 01a13a90-3557-734a-9b7f-e57a4599b6aa
  name: checks-for-updates
  definition: "A `loft` command that may look for a newer release at the end of its run and tell of one, and so follows the shared rules for the update check."
- key: e40d5174-e83d-482f-ac42-0ad3dcd308eb
  name: conversion
  definition: "Behaviour that exists only for a document derived from a Loft v1 export."
- key: 7ee44c39-2e22-4b90-a992-7fdd1c5322b9
  name: git
  definition: "Behaviour that exists because a git repository holds the history."
- key: a1770725-0a7d-4c8d-8b5d-d4197e320c78
  name: identity
  definition: "Keys, labels, aliases and the bindings between them."
- key: 01a137be-5962-73e4-9623-511a498de96d
  name: needs-repository
  definition: "A `loft` command that works only inside a git repository, and so follows the shared rule for one run outside it."
- key: 01a12ff0-f5e5-7095-8fa8-24f767f5e728
  name: plant-simulator
  definition: "A Feature of the Software Plant that stands in for an external system, and so follows the shared rules for a simulator and is held to the real system by a contract suite."
- key: 40e7db4a-02a5-41d6-b18e-dc3f67211bdf
  name: portable
  definition: "Behaviour every implementation must reproduce exactly, so that two implementations compute the same content root for the same document."
- key: 01a12de5-62d0-763d-b71a-d8f7a13bc360
  name: reads-tree
  definition: "A `loft` command that reads the `spec/` tree, and so follows the shared rules for a reader error."
- key: 01a13a90-3557-734a-9b7f-e57bb9bdb2c1
  name: sends-telemetry
  definition: "A `loft` command that sends one command event at the end of its run, and so follows the shared rules for telemetry."
- key: 01a1380a-9f4c-7295-b189-97224d55101f
  name: writes-skill
  definition: "A `loft` command that writes the `loft-spec` skill into a project, and so follows the shared rule for asking that it be committed."
- key: 01a12e66-85dc-70ec-b5ed-93deb1149a0f
  name: writes-tree
  definition: "A `loft` command that writes the `spec/` tree or a file the Format places beside it, and so follows the shared rules for a save."
